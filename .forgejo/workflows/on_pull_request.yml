name: '[Workflow] On Pull Request'

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: docker
    timeout-minutes: 40
    outputs:
      warnings: ${{ steps.verify.outputs.warnings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: verify
        uses: ./.forgejo/actions/verify

  warnings:
    needs: [checks]
    if: always() && needs.checks.result != 'skipped' && needs.checks.result != 'cancelled'
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Fail when setup or verification printed a warning
        env:
          REPORT: ${{ needs.checks.outputs.warnings }}
        run: |
          if [ -z "$REPORT" ]; then
            echo "No warnings in setup and verification output."
            exit 0
          fi
          echo "Setup or verification printed warnings. Fix them, or accept one with a reason in scripts/ci-warnings-allow.json:"
          printf '%s\n' "$REPORT"
          exit 1

  agent-trace:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: https://github.com/jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.22
          install_args: node
          cache: false
          github_token: ''
      - name: Read the Agent Trace notes from origin, read-only
        run: git fetch --no-tags origin 'refs/notes/agent-trace:refs/notes/agent-trace' || echo "origin holds no Agent Trace notes."
      - name: Summarise which lines agents wrote, without blocking the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mise exec -- node apps/unfold/extensions/claude-code/scripts/agent-trace-report.mjs --base "${BASE:-origin/development}" --head "${HEAD_SHA:-HEAD}" > agent-trace.md || echo "The Agent Trace report did not run." > agent-trace.md
          cat agent-trace.md
          cat agent-trace.md >> "$GITHUB_STEP_SUMMARY" || true

  agents-check:
    runs-on: docker
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: https://github.com/jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.22
          install_args: uv
          cache: false
          github_token: ''
      - name: Check the agent files against the agent standard, without blocking until 2026-11-07
        continue-on-error: true
        run: mise run agents-check

  opencode-contract:
    runs-on: docker
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: https://github.com/jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.22
          cache: false
          github_token: ''
      - run: mise trust apps/unfold/mise.toml
      - run: mise -C apps/unfold exec -- npm ci
      - run: mise -C apps/unfold run opencode-contract
        env:
          UNFOLD_TEST_TIMEOUT_SCALE: '2'

  ploeg-pin:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: https://github.com/jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.22
          install_args: uv
          cache: false
          github_token: ''
      - name: Unpack the pinned Ploeg contract bundle, verifying its digest
        run: mise exec -- uv run --no-project python scripts/ploeg-contract.py fetch
      - name: Require the pin to be a published Ploeg release whose bundle and Go module agree
        run: mise exec -- uv run --no-project python scripts/ploeg-contract.py check --published

  ploeg-docs:
    runs-on: docker
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: https://github.com/jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.22
          install_args: uv
          cache: false
          github_token: ''
      - name: Unpack the pinned Ploeg contract bundle, verifying its digest
        run: mise exec -- uv run --no-project python scripts/ploeg-contract.py fetch
      - name: Require the glossary and decision register to match the pinned Ploeg's domain model and ADRs
        run: mise exec -- uv run --frozen python scripts/docs.py --domain-check
      - name: Require every documentation link into the pinned Ploeg to resolve
        run: mise exec -- uv run --frozen python scripts/docs.py --stage-only

  release-policy:
    runs-on: docker
    container:
      image: harbor.webgrip.dev/webgrip/semantic-release:2.3.0@sha256:c9a328024c0070438b0ec08bbd3419896c728ce2c5b1f323fc9dae8bc46a2e71
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.forgejo/actions/release-policy

  gate:
    needs: [checks, agents-check, opencode-contract, ploeg-pin, ploeg-docs, release-policy]
    if: always()
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Require every job this gate waits for to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          results=$(printf '%s' "$NEEDS" | grep -oE '"result": ?"[a-z]+"' | sed -E 's/.*"([a-z]+)"$/\1/' || true)
          printf '%s\n' "$NEEDS"
          if grep -vqx success <<< "$results"; then
            echo "A job the gate waits for did not succeed, or the gate read no results."
            exit 1
          fi
          echo "Every job the gate waits for succeeded."
