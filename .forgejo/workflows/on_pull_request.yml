name: On Pull Request

on:
  pull_request:

jobs:
  checks:
    runs-on: docker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Absolute URL: data.forgejo.org (the default action resolver) has an incomplete mirror set.
      - uses: https://github.com/actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - uses: https://github.com/azure/setup-helm@v4
        with:
          # Explicit version: 'latest' resolution hits api.github.com
          # unauthenticated from the runner and rate-limits.
          version: v4.2.3
      - run: helm lint ops/helm/ploeg
      - run: helm template ploeg ops/helm/ploeg > /dev/null
      - run: helm template ploeg ops/helm/ploeg -f ops/helm/ploeg/ci/executor-values.yaml > /dev/null
      - run: helm template ploeg ops/helm/ploeg -f ops/helm/ploeg/ci/executor-cronjob-values.yaml > /dev/null
      - run: helm template ploeg ops/helm/ploeg -f ops/helm/ploeg/ci/executor-gitlab-values.yaml > /dev/null
      # Golden renders. A chart edit that changes a rendered manifest has to
      # say so in the diff — the pod is the security boundary, and the
      # PolicyException in webgrip/homelab-cluster is keyed on a label this
      # chart emits. A waiver silently widening (or a privileged sidecar
      # silently appearing on a workload that had none) is exactly the change
      # that must never pass review unseen.
      - name: chart renders match the committed goldens
        run: ./scripts/helm-golden.sh check
      # ADR-0022: the mark's terms live in a policy file, not in a second
      # copyright licence. A missing or unreachable policy means the mark
      # ships with no stated terms at all.
      - name: name and mark carry their policy
        run: ./scripts/brand-marks.sh
