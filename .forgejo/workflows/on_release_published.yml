name: '[Workflow] On Release Published'

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Application release tag, e.g. vloer-v0.3.0-rc.17 or ploeg-v0.3.0-rc.8'
        required: true
        type: string

concurrency:
  group: release-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  vloer-parse-release-tag:
    if: vars.GLIDE_RELEASES_ENABLED == 'true' && startsWith(github.event.release.tag_name || inputs.tag, 'vloer-v')
    runs-on: docker
    outputs:
      version: ${{ steps.parse.outputs.version }}
      latest: ${{ steps.parse.outputs.latest }}
      created: ${{ steps.parse.outputs.created }}
    steps:
      - id: parse
        shell: bash
        env:
          WORKFLOW_EVENT: ${{ github.event_name }}
          SELECTED_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
          RELEASE_CREATED_AT: ${{ github.event.release.created_at }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ "${WORKFLOW_EVENT:-}" == workflow_dispatch ]]; then
            [[ "${SELECTED_REF:-}" == "refs/tags/$tag" ]] || { echo "Select the same tag as the workflow ref before publishing." >&2; exit 1; }
          fi
          [[ "$tag" =~ ^vloer-v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?)$ ]] || { echo "Unsupported tag: $tag (expected vloer-v<semver>)" >&2; exit 1; }
          version="${BASH_REMATCH[1]}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          latest=true
          [[ "$version" == *-* ]] && latest=false
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          plausible() { local v="${1:-}"; [[ -n "$v" ]] || return 1; [[ "$v" =~ ^([0-9]{4})-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2} ]] || return 1; (( BASH_REMATCH[1] >= 2020 )); }
          created=""
          for cand in "${RELEASE_PUBLISHED_AT:-}" "${RELEASE_CREATED_AT:-}"; do
            [[ -n "$cand" ]] || continue
            if plausible "$cand"; then created="$cand"; break; fi
            echo "NOTE: release timestamp '$cand' is a zero time or implausible; ignoring it."
          done
          [[ -n "$created" ]] || created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          plausible "$created" || { echo "ERROR: IMAGE_CREATED is not a plausible instant: '$created'" >&2; exit 1; }
          echo "created=$created" >> "$GITHUB_OUTPUT"

  vloer-release-publish-chart:
    name: Vloer - Publish Helm chart (Harbor)
    needs: [vloer-parse-release-tag]
    uses: webgrip/workflows/.forgejo/workflows/helm-chart-push.yml@v1.10.0
    with:
      enabled: ${{ needs.vloer-parse-release-tag.outputs.version != '' }}
      registry: harbor.webgrip.dev
      path: apps/vloer/ops/helm/de-vloer
      name: de-vloer
      version: ${{ needs.vloer-parse-release-tag.outputs.version }}
      ref: vloer-v${{ needs.vloer-parse-release-tag.outputs.version }}
      oci-path: webgrip/charts
    secrets:
      REGISTRY_USERNAME: ${{ secrets.HARBOR_ROBOT_USER }}
      REGISTRY_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}

  vloer-release-distribute-harbor:
    name: Vloer - Build, gate and sign images (Harbor)
    needs: [vloer-parse-release-tag]
    runs-on: docker
    enable-openid-connect: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: de-vloer
            context: "apps/vloer"
            dockerfile: Dockerfile
            target: app
          - name: de-vloer-agent
            context: apps/vloer/ops/agent
            dockerfile: Dockerfile
            target: ""
    env:
      REGISTRY_USERNAME: ${{ secrets.HARBOR_ROBOT_USER }}
      REGISTRY_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: vloer-v${{ needs.vloer-parse-release-tag.outputs.version }}

      - name: Probe Harbor for an existing image
        id: probe
        shell: bash
        env:
          IMAGE: ${{ matrix.name }}
          VERSION: ${{ needs.vloer-parse-release-tag.outputs.version }}
        run: |
          set -uo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -u "${REGISTRY_USERNAME}:${REGISTRY_TOKEN}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://harbor.webgrip.dev/v2/webgrip/${IMAGE}/manifests/${VERSION}")" || true
          [ -n "$code" ] || code=000
          if [ "$code" = 200 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "harbor.webgrip.dev/webgrip/${IMAGE}:${VERSION} is already published; skipping the build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Harbor answered HTTP ${code} for ${IMAGE}:${VERSION}; building."
          fi

      - name: Build and push (Harbor)
        id: build
        if: steps.probe.outputs.exists != 'true'
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/docker-build-push-registry-fast@v1.11.0
        with:
          registry: harbor.webgrip.dev
          docker-context: ${{ matrix.context }}
          docker-file: ${{ matrix.dockerfile }}
          docker-target: ${{ matrix.target }}
          platforms: "linux/amd64,linux/arm64"
          annotations: |
            index:org.opencontainers.image.source=https://github.com/webgrip/de-vloer
            index:org.opencontainers.image.url=https://forgejo.webgrip.dev/webgrip/de-vloer
          docker-build-args: |
            IMAGE_CREATED=${{ needs.vloer-parse-release-tag.outputs.created }}
            IMAGE_VERSION=${{ needs.vloer-parse-release-tag.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
            REGISTRY_DHI=harbor.webgrip.dev/dhi
          docker-tags: |
            webgrip/${{ matrix.name }}:${{ needs.vloer-parse-release-tag.outputs.version }}
            ${{ needs.vloer-parse-release-tag.outputs.latest == 'true' && format('webgrip/{0}:latest', matrix.name) || '' }}

      - name: Resolve the published digest
        id: digest
        shell: bash
        env:
          IMAGE: harbor.webgrip.dev/webgrip/${{ matrix.name }}:${{ needs.vloer-parse-release-tag.outputs.version }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | docker login harbor.webgrip.dev -u "$REGISTRY_USERNAME" --password-stdin >/dev/null
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{ .Manifest.Digest }}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "no digest resolved for $IMAGE" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=harbor.webgrip.dev/webgrip/${{ matrix.name }}@${digest}" >> "$GITHUB_OUTPUT"

      - name: CVE budget gate (grype + OpenVEX)
        uses: ./apps/vloer/.forgejo/actions/cve-gate
        with:
          image-ref: ${{ steps.digest.outputs.ref }}
          image-name: ${{ matrix.name }}
          budgets-file: apps/vloer/ops/security/cve-budgets.yaml
          vex-dir: apps/vloer/ops/vex/statements

      - name: Sign, attest and SBOM (Harbor)
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/cosign-sign-attest@v1.11.2
        with:
          registry: harbor.webgrip.dev
          image-name: harbor.webgrip.dev/webgrip/${{ matrix.name }}
          image-version: ${{ needs.vloer-parse-release-tag.outputs.version }}

  vloer-release-publish-extension:
    name: Vloer - Publish VS Code extension
    needs: [vloer-parse-release-tag]
    runs-on: docker
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: vloer-v${{ needs.vloer-parse-release-tag.outputs.version }}
      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: apps/vloer/package.json
      - name: Package the VSIX from the tagged tree
        shell: bash
        env:
          VERSION: ${{ needs.vloer-parse-release-tag.outputs.version }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./apps/vloer/extensions/vscode/package.json').version")" = "$VERSION"
          npm ci --no-audit --no-fund --prefix apps/vloer/extensions/vscode
          npm --prefix apps/vloer run extension:build
          npm --prefix apps/vloer/extensions/vscode run package -- --out "de-vloer-${VERSION}.vsix"
          test -s "apps/vloer/extensions/vscode/de-vloer-${VERSION}.vsix"
      - name: Verify the listing and the packaged contents
        shell: bash
        env:
          VERSION: ${{ needs.vloer-parse-release-tag.outputs.version }}
          VSIX_PATH: extensions/vscode/de-vloer-${{ needs.vloer-parse-release-tag.outputs.version }}.vsix
        run: npm --prefix apps/vloer run extension:verify
      - name: Attach the VSIX and its checksum to the Forgejo release
        shell: bash
        env:
          VERSION: ${{ needs.vloer-parse-release-tag.outputs.version }}
          TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          cd apps/vloer/extensions/vscode
          vsix="de-vloer-${VERSION}.vsix"
          sha256sum "$vsix" > "${vsix}.sha256"
          release="$(curl -sS --fail --max-time 30 -H "Authorization: token ${TOKEN}" "${API}/releases/tags/vloer-v${VERSION}")"
          release_id="$(printf '%s' "$release" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          for asset in "$vsix" "${vsix}.sha256"; do
            if printf '%s' "$release" | python3 -c 'import json,sys; a=sys.argv[1]; sys.exit(0 if any(x.get("name")==a for x in json.load(sys.stdin).get("assets",[])) else 1)' "$asset"; then
              echo "${asset} is already attached to release ${release_id}; skipping the upload."
            else
              curl -sS --fail --max-time 120 -H "Authorization: token ${TOKEN}" -F "attachment=@${asset}" "${API}/releases/${release_id}/assets?name=${asset}" >/dev/null
              echo "attached ${asset} to release ${release_id}"
            fi
          done
      - name: Publish to Open VSX
        shell: bash
        env:
          VERSION: ${{ needs.vloer-parse-release-tag.outputs.version }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          cd apps/vloer/extensions/vscode
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::warning::OVSX_PAT is not configured; ${VERSION} reaches VS Code forks only as a sideloaded release asset."
            exit 0
          fi
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--pre-release"
          npx --no-install ovsx publish --packagePath "de-vloer-${VERSION}.vsix" --skip-duplicate $prerelease
      - name: Publish to the Visual Studio Marketplace
        shell: bash
        env:
          VERSION: ${{ needs.vloer-parse-release-tag.outputs.version }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          AZURE_CLIENT_ID: ${{ secrets.MARKETPLACE_AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.MARKETPLACE_AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          cd apps/vloer/extensions/vscode
          if [[ "$VERSION" == *-* ]]; then
            echo "::notice::${VERSION} is a pre-release version. The Visual Studio Marketplace accepts only major.minor.patch; Open VSX carries this build."
            exit 0
          fi
          if [ -n "${AZURE_CLIENT_ID:-}" ] && [ -n "${AZURE_TENANT_ID:-}" ]; then
            npx --no-install vsce publish --packagePath "de-vloer-${VERSION}.vsix" --skip-duplicate --azure-credential
          elif [ -n "${VSCE_PAT:-}" ]; then
            npx --no-install vsce publish --packagePath "de-vloer-${VERSION}.vsix" --skip-duplicate
          else
            echo "::notice::No Marketplace credential is configured. ${VERSION} ships to Open VSX only, by decision; see docs/adrs/0021-the-extension-ships-through-open-vsx-first.md."
          fi

  vloer-release-distribute-forgejo:
    name: Vloer - Distribute (Forgejo)
    needs: [vloer-parse-release-tag, vloer-release-distribute-harbor]
    uses: webgrip/workflows/.forgejo/workflows/forgejo-distribute.yml@v2.6.2
    with:
      enabled: ${{ needs.vloer-parse-release-tag.outputs.version != '' }}
      version: ${{ needs.vloer-parse-release-tag.outputs.version }}
      ref: vloer-v${{ needs.vloer-parse-release-tag.outputs.version }}
      link-repo: de-vloer
      image-name: de-vloer
      mirror-from-registry: harbor.webgrip.dev
      push-latest: ${{ needs.vloer-parse-release-tag.outputs.latest == 'true' }}
      copy-accessories: true
      chart-path: apps/vloer/ops/helm/de-vloer
      chart-name: de-vloer
    secrets:
      REGISTRY_TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
      SOURCE_REGISTRY_USER: ${{ secrets.HARBOR_ROBOT_USER }}
      SOURCE_REGISTRY_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}

  vloer-release-distribute-github:
    name: Vloer - Distribute (GitHub)
    needs: [vloer-parse-release-tag, vloer-release-distribute-harbor]
    uses: webgrip/workflows/.forgejo/workflows/github-distribute.yml@v2.6.2
    with:
      enabled: ${{ needs.vloer-parse-release-tag.outputs.version != '' }}
      version: ${{ needs.vloer-parse-release-tag.outputs.version }}
      repo: webgrip/de-vloer
      branches: main development
      image-name: de-vloer
      mirror-from-registry: harbor.webgrip.dev
      push-latest: ${{ needs.vloer-parse-release-tag.outputs.latest == 'true' }}
      copy-accessories: true
      ref: vloer-v${{ needs.vloer-parse-release-tag.outputs.version }}
      chart-path: apps/vloer/ops/helm/de-vloer
      chart-name: de-vloer
    secrets:
      GH_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
      SOURCE_REGISTRY_USER: ${{ secrets.HARBOR_ROBOT_USER }}
      SOURCE_REGISTRY_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}

  vloer-release-mirror-agent-github:
    name: Vloer - Mirror the agent image (GHCR)
    needs: [vloer-parse-release-tag, vloer-release-distribute-harbor]
    if: needs.vloer-parse-release-tag.outputs.version != ''
    runs-on: docker
    steps:
      - name: Copy de-vloer-agent from Harbor to GHCR
        shell: bash
        env:
          VERSION: ${{ needs.vloer-parse-release-tag.outputs.version }}
          HARBOR_USER: ${{ secrets.HARBOR_ROBOT_USER }}
          HARBOR_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          source="harbor.webgrip.dev/webgrip/de-vloer-agent:${VERSION}"
          target="ghcr.io/webgrip/de-vloer-agent:${VERSION}"
          echo "$HARBOR_TOKEN" | docker login harbor.webgrip.dev -u "$HARBOR_USER" --password-stdin >/dev/null
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          digest="$(docker buildx imagetools inspect "$source" --format '{{ .Manifest.Digest }}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "no digest resolved for $source" >&2; exit 1; }
          docker buildx imagetools create --tag "$target" "harbor.webgrip.dev/webgrip/de-vloer-agent@${digest}"
          mirrored="$(docker buildx imagetools inspect "$target" --format '{{ .Manifest.Digest }}')"
          test "$mirrored" = "$digest"
          echo "mirrored de-vloer-agent ${VERSION} at ${digest}"

  ploeg-parse-release-tag:
    if: vars.GLIDE_RELEASES_ENABLED == 'true' && startsWith(github.event.release.tag_name || inputs.tag, 'ploeg-v')
    runs-on: docker
    outputs:
      version: ${{ steps.parse.outputs.version }}
      latest_tag: ${{ steps.parse.outputs.latest_tag }}
    steps:
      - id: parse
        shell: bash
        env:
          WORKFLOW_EVENT: ${{ github.event_name }}
          SELECTED_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ "${WORKFLOW_EVENT:-}" == workflow_dispatch ]]; then
            [[ "${SELECTED_REF:-}" == "refs/tags/$tag" ]] || { echo "Select the same tag as the workflow ref before publishing." >&2; exit 1; }
          fi
          [[ "$tag" =~ ^ploeg-v0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[1-9][0-9]*$ ]] || { echo "Ploeg publishes only ploeg-v0.x.y-rc.N tags; stable and 1.x releases require an explicit policy change." >&2; exit 1; }
          version="${tag#ploeg-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest_tag=" >> "$GITHUB_OUTPUT"

  ploeg-release-publish-chart:
    name: Ploeg - Publish Helm chart (Harbor)
    needs: [ploeg-parse-release-tag]
    uses: webgrip/workflows/.forgejo/workflows/helm-chart-push.yml@v1.10.0
    with:
      enabled: ${{ needs.ploeg-parse-release-tag.outputs.version != '' }}
      registry: harbor.webgrip.dev
      path: apps/ploeg/ops/helm/ploeg
      name: ploeg
      version: ${{ needs.ploeg-parse-release-tag.outputs.version }}
      ref: ploeg-v${{ needs.ploeg-parse-release-tag.outputs.version }}
      oci-path: webgrip/charts
    secrets:
      REGISTRY_USERNAME: ${{ secrets.HARBOR_ROBOT_USER }}
      REGISTRY_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}

  ploeg-release-distribute-harbor:
    name: Ploeg - Distribute (Harbor)
    needs: [ploeg-parse-release-tag]
    runs-on: docker
    env:
      REGISTRY_USERNAME: ${{ secrets.HARBOR_ROBOT_USER }}
      REGISTRY_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
    steps:
      - name: Stamp image creation timestamp
        id: stamp
        shell: bash
        env:
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
          RELEASE_CREATED_AT: ${{ github.event.release.created_at }}
        run: |
          set -euo pipefail
          plausible() {
            local v="${1:-}"
            [[ -n "$v" ]] || return 1
            [[ "$v" =~ ^([0-9]{4})-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2} ]] || return 1
            (( BASH_REMATCH[1] >= 2020 ))
          }

          created=""
          for cand in "${RELEASE_PUBLISHED_AT:-}" "${RELEASE_CREATED_AT:-}"; do
            [[ -n "$cand" ]] || continue
            if plausible "$cand"; then created="$cand"; break; fi
            echo "NOTE:  release timestamp '$cand' is a zero time or implausible — ignoring it."
          done
          [[ -n "$created" ]] || created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          plausible "$created" || {
            echo "ERROR: refusing to build — IMAGE_CREATED is not a plausible instant: '$created'"
            echo "       A bad timestamp here bakes a wrong org.opencontainers.image.created"
            echo "       into the release image silently, so fail the build instead."
            exit 1
          }
          echo "created=$created" >> "$GITHUB_OUTPUT"

      - name: Probe Harbor for an existing image
        id: probe
        shell: bash
        env:
          VERSION: ${{ needs.ploeg-parse-release-tag.outputs.version }}
        run: |
          set -uo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -u "${REGISTRY_USERNAME}:${REGISTRY_TOKEN}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://harbor.webgrip.dev/v2/webgrip/ploegd/manifests/${VERSION}")" || true
          [ -n "$code" ] || code=000
          if [ "$code" = 200 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "harbor.webgrip.dev/webgrip/ploegd:${VERSION} is already published — skipping the build."
            echo "Harbor tags are immutable; a re-push would fail, and the digest the mirrors"
            echo "copy is already in place."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Harbor answered HTTP ${code} for ${VERSION} — building."
          fi

      - name: Build and push (Harbor)
        if: steps.probe.outputs.exists != 'true'
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/docker-build-push-registry-fast@v1.11.0
        with:
          registry: harbor.webgrip.dev
          docker-context: "apps/ploeg"
          docker-file: "ops/docker/ploegd/Dockerfile"
          platforms: "linux/amd64,linux/arm64"
          binfmt-image: "docker.io/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0"
          sbom-generator: "docker.io/docker/buildkit-syft-scanner:stable-1@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68"
          buildkit-image: "docker.io/moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec"
          annotations: |
            index:org.opencontainers.image.source=https://github.com/webgrip/ploeg
            index:org.opencontainers.image.url=https://forgejo.webgrip.dev/webgrip/ploeg
          docker-build-args: |
            IMAGE_CREATED=${{ steps.stamp.outputs.created }}
            IMAGE_VERSION=${{ needs.ploeg-parse-release-tag.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
            REGISTRY_DOCKERHUB=docker.io
          docker-tags: |
            webgrip/ploegd:${{ needs.ploeg-parse-release-tag.outputs.version }}
            ${{ needs.ploeg-parse-release-tag.outputs.latest_tag }}

      - name: Verify image metadata labels
        if: steps.probe.outputs.exists != 'true'
        shell: bash
        env:
          IMAGE: harbor.webgrip.dev/webgrip/ploegd:${{ needs.ploeg-parse-release-tag.outputs.version }}
          EXPECTED_CREATED: ${{ steps.stamp.outputs.created }}
          EXPECTED_VERSION: ${{ needs.ploeg-parse-release-tag.outputs.version }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_SOURCE: https://github.com/webgrip/ploeg
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | docker login harbor.webgrip.dev \
            -u "$REGISTRY_USERNAME" --password-stdin >/dev/null
          docker buildx imagetools inspect "$IMAGE" --format '{{ json .Image }}' > /tmp/img.json
          jq -e --arg created "$EXPECTED_CREATED" \
                --arg version "$EXPECTED_VERSION" \
                --arg revision "$EXPECTED_REVISION" \
                --arg source "$EXPECTED_SOURCE" '
            (if has("config") then [.] else [.[]] end)
            | map(.config.Labels // {})
            | (length > 0) and all(
                .["org.opencontainers.image.created"]  == $created and
                .["org.opencontainers.image.version"]  == $version and
                .["org.opencontainers.image.revision"] == $revision and
                .["org.opencontainers.image.source"]   == $source
              )
          ' /tmp/img.json >/dev/null || {
            echo "ERROR: image label check failed for $IMAGE"
            echo "       expected created=$EXPECTED_CREATED version=$EXPECTED_VERSION revision=$EXPECTED_REVISION"
            echo "                source=$EXPECTED_SOURCE"
            echo "       actual:"
            jq -r '(if has("config") then {".": .} else . end)
                   | to_entries[]
                   | "         \(.key): created=\(.value.config.Labels["org.opencontainers.image.created"] // "<none>") version=\(.value.config.Labels["org.opencontainers.image.version"] // "<none>") revision=\(.value.config.Labels["org.opencontainers.image.revision"] // "<none>") source=\(.value.config.Labels["org.opencontainers.image.source"] // "<none>")"' /tmp/img.json
            exit 1
          }
          echo "labels verified on every platform: created=$EXPECTED_CREATED version=$EXPECTED_VERSION"

          docker buildx imagetools inspect --raw "$IMAGE" > /tmp/idx.json
          jq -e --arg source "$EXPECTED_SOURCE" \
            '.annotations["org.opencontainers.image.source"] == $source' /tmp/idx.json >/dev/null || {
            echo "ERROR: index annotation check failed for $IMAGE"
            echo "       expected org.opencontainers.image.source=$EXPECTED_SOURCE on the index"
            echo "       actual: $(jq -c '.annotations // "<no annotations on the index>"' /tmp/idx.json)"
            echo "       A LABEL alone does not satisfy this: GHCR links a package from the"
            echo "       manifest, so the build needs the composite's `annotations:` input."
            exit 1
          }
          echo "index annotation verified: source=$EXPECTED_SOURCE"

  ploeg-release-sign-harbor:
    outputs:
      signed: ${{ steps.signed.outputs.ready }}
    name: Ploeg - Sign & Attest (Harbor)
    needs: [ploeg-parse-release-tag, ploeg-release-distribute-harbor]
    runs-on: docker
    enable-openid-connect: true
    steps:
      - name: Sign, attest and SBOM (Harbor)
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/cosign-sign-attest@v1.11.2
        with:
          registry: harbor.webgrip.dev
          image-name: harbor.webgrip.dev/webgrip/ploegd
          image-version: ${{ needs.ploeg-parse-release-tag.outputs.version }}
        env:
          REGISTRY_USERNAME: ${{ secrets.HARBOR_ROBOT_USER }}
          REGISTRY_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
      - name: Confirm signing completed
        id: signed
        shell: bash
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

  ploeg-release-distribute-forgejo:
    name: Ploeg - Distribute (Forgejo)
    needs: [ploeg-parse-release-tag, ploeg-release-distribute-harbor, ploeg-release-sign-harbor]
    uses: webgrip/workflows/.forgejo/workflows/forgejo-distribute.yml@v1.11.3
    with:
      enabled: ${{ needs.ploeg-parse-release-tag.outputs.version != '' && needs.ploeg-release-sign-harbor.outputs.signed == 'true' }}
      version: ${{ needs.ploeg-parse-release-tag.outputs.version }}
      ref: ploeg-v${{ needs.ploeg-parse-release-tag.outputs.version }}
      link-repo: ploeg
      image-name: ploegd
      mirror-from-registry: harbor.webgrip.dev
      push-latest: ${{ needs.ploeg-parse-release-tag.outputs.latest_tag != '' }}
      copy-accessories: true
      chart-path: apps/ploeg/ops/helm/ploeg
      chart-name: ploeg
    secrets:
      REGISTRY_TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
      SOURCE_REGISTRY_USER: ${{ secrets.HARBOR_ROBOT_USER }}
      SOURCE_REGISTRY_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}

  ploeg-release-distribute-github:
    name: Ploeg - Distribute (GitHub)
    needs: [ploeg-parse-release-tag, ploeg-release-distribute-harbor, ploeg-release-sign-harbor]
    uses: webgrip/workflows/.forgejo/workflows/github-distribute.yml@v1.11.1
    with:
      enabled: ${{ needs.ploeg-parse-release-tag.outputs.version != '' && needs.ploeg-release-sign-harbor.outputs.signed == 'true' }}
      version: ${{ needs.ploeg-parse-release-tag.outputs.version }}
      repo: webgrip/ploeg
      branches: main development
      image-name: ploegd
      mirror-from-registry: harbor.webgrip.dev
      push-latest: ${{ needs.ploeg-parse-release-tag.outputs.latest_tag != '' }}
      copy-accessories: true
      ref: ploeg-v${{ needs.ploeg-parse-release-tag.outputs.version }}
      chart-path: apps/ploeg/ops/helm/ploeg
      chart-name: ploeg
    secrets:
      GH_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
      SOURCE_REGISTRY_USER: ${{ secrets.HARBOR_ROBOT_USER }}
      SOURCE_REGISTRY_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
