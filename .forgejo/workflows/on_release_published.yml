name: '[Workflow] On Release Published'

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Unfold release tag, e.g. unfold-v0.4.0-rc.1'
        required: true
        type: string

concurrency:
  group: release-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  parse-release-tag:
    if: vars.UNFOLD_RELEASES_ENABLED == 'true' && startsWith(github.event.release.tag_name || inputs.tag, 'unfold-v')
    runs-on: docker
    outputs:
      version: ${{ steps.parse.outputs.version }}
      created: ${{ steps.parse.outputs.created }}
    steps:
      - id: parse
        shell: bash
        env:
          WORKFLOW_EVENT: ${{ github.event_name }}
          SELECTED_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
          RELEASE_CREATED_AT: ${{ github.event.release.created_at }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ "${WORKFLOW_EVENT:-}" == workflow_dispatch ]]; then
            [[ "${SELECTED_REF:-}" == "refs/tags/$tag" ]] || { echo "Select the same tag as the workflow ref before publishing." >&2; exit 1; }
          fi
          [[ "$tag" =~ ^unfold-v0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[1-9][0-9]*$ ]] || { echo "Unfold publishes only unfold-v0.x.y-rc.N tags; stable and 1.x releases require an explicit policy change." >&2; exit 1; }
          plausible() { local v="${1:-}"; [[ -n "$v" ]] || return 1; [[ "$v" =~ ^([0-9]{4})-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2} ]] || return 1; (( BASH_REMATCH[1] >= 2020 )); }
          created=""
          for cand in "${RELEASE_PUBLISHED_AT:-}" "${RELEASE_CREATED_AT:-}"; do
            [[ -n "$cand" ]] || continue
            if plausible "$cand"; then created="$cand"; break; fi
            echo "NOTE: release timestamp '$cand' is a zero time or implausible; ignoring it."
          done
          [[ -n "$created" ]] || created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          plausible "$created" || { echo "ERROR: IMAGE_CREATED is not a plausible instant: '$created'" >&2; exit 1; }
          echo "version=${tag#unfold-v}" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"

  unfold-release-publish-chart:
    name: Unfold - Publish Helm chart (Harbor)
    needs: [parse-release-tag]
    if: needs.parse-release-tag.outputs.version != ''
    runs-on: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: unfold-v${{ needs.parse-release-tag.outputs.version }}
      - name: Publish the canonical chart
        shell: bash
        env:
          VERSION: ${{ needs.parse-release-tag.outputs.version }}
          HARBOR_ROBOT_USER: ${{ secrets.HARBOR_ROBOT_USER }}
          HARBOR_ROBOT_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$(mktemp -d)" PATH="$PWD/scripts:$PATH"
          export HELM_REGISTRY_CONFIG="$DOCKER_CONFIG/config.json"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' '{"credHelpers":{"harbor.webgrip.dev":"unfold"}}' > "$DOCKER_CONFIG/config.json"
          python3 scripts/publish_chart.py unfold "$VERSION"

  unfold-release-distribute-harbor:
    if: needs.parse-release-tag.outputs.version != ''
    name: Unfold - Build, gate and sign images (Harbor)
    needs: [parse-release-tag]
    runs-on: docker
    enable-openid-connect: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: unfold
            context: "apps/unfold"
            dockerfile: Dockerfile
            target: app
          - name: unfold-agent
            context: apps/unfold/ops/agent
            dockerfile: Dockerfile
            target: ""
    env:
      REGISTRY_USERNAME: ${{ secrets.HARBOR_ROBOT_USER }}
      REGISTRY_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: unfold-v${{ needs.parse-release-tag.outputs.version }}

      - name: Probe Harbor for an existing image
        id: probe
        shell: bash
        env:
          IMAGE: ${{ matrix.name }}
          VERSION: ${{ needs.parse-release-tag.outputs.version }}
        run: |
          set -uo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -u "${REGISTRY_USERNAME}:${REGISTRY_TOKEN}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://harbor.webgrip.dev/v2/webgrip/${IMAGE}/manifests/${VERSION}")" || true
          [ -n "$code" ] || code=000
          if [ "$code" = 200 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "harbor.webgrip.dev/webgrip/${IMAGE}:${VERSION} is already published; skipping the build."
          elif [ "$code" = 404 ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Harbor answered HTTP ${code} for ${IMAGE}:${VERSION}; building."
          else
            echo "Harbor probe failed with HTTP $code; refusing to rebuild an unknown version." >&2
            exit 1
          fi

      - name: Build and push (Harbor)
        id: build
        if: steps.probe.outputs.exists != 'true'
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/docker-build-push-registry-fast@v2.7.7
        with:
          registry: harbor.webgrip.dev
          docker-context: ${{ matrix.context }}
          docker-file: ${{ matrix.dockerfile }}
          docker-target: ${{ matrix.target }}
          platforms: "linux/amd64,linux/arm64"
          annotations: |
            index:org.opencontainers.image.source=https://github.com/webgrip/unfold
            index:org.opencontainers.image.url=https://forgejo.webgrip.dev/webgrip/unfold
          docker-build-args: |
            IMAGE_CREATED=${{ needs.parse-release-tag.outputs.created }}
            IMAGE_VERSION=${{ needs.parse-release-tag.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
            REGISTRY_DHI=harbor.webgrip.dev/dhi
          docker-tags: |
            webgrip/${{ matrix.name }}:${{ needs.parse-release-tag.outputs.version }}

      - name: Resolve the published digest
        id: digest
        shell: bash
        env:
          IMAGE: harbor.webgrip.dev/webgrip/${{ matrix.name }}:${{ needs.parse-release-tag.outputs.version }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | docker login harbor.webgrip.dev -u "$REGISTRY_USERNAME" --password-stdin >/dev/null
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{ .Manifest.Digest }}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "no digest resolved for $IMAGE" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=harbor.webgrip.dev/webgrip/${{ matrix.name }}@${digest}" >> "$GITHUB_OUTPUT"

      - name: CVE budget gate (grype + OpenVEX)
        uses: ./.forgejo/actions/cve-gate
        with:
          image-ref: ${{ steps.digest.outputs.ref }}
          image-name: ${{ matrix.name }}
          budgets-file: apps/unfold/ops/security/cve-budgets.yaml
          vex-dir: apps/unfold/ops/vex/statements

      - name: Sign, attest and SBOM (Harbor)
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/cosign-sign-attest@v2.7.7
        with:
          registry: harbor.webgrip.dev
          image-name: harbor.webgrip.dev/webgrip/${{ matrix.name }}
          image-version: ${{ needs.parse-release-tag.outputs.version }}

  unfold-release-publish-extension:
    if: needs.parse-release-tag.outputs.version != ''
    name: Unfold - Publish VS Code extension
    needs: [parse-release-tag]
    runs-on: docker
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: unfold-v${{ needs.parse-release-tag.outputs.version }}
      - uses: https://github.com/jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.0
          install_args: node
          cache: false
          github_token: ''
      - name: Package the VSIX from the tagged tree
        shell: bash
        env:
          VERSION: ${{ needs.parse-release-tag.outputs.version }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./apps/unfold/extensions/vscode/package.json').version")" = "$VERSION"
          npm ci --no-audit --no-fund --prefix apps/unfold/extensions/vscode
          npm --prefix apps/unfold run extension:build
          npm --prefix apps/unfold/extensions/vscode run package -- --out "unfold-${VERSION}.vsix"
          test -s "apps/unfold/extensions/vscode/unfold-${VERSION}.vsix"
      - name: Verify the listing and the packaged contents
        shell: bash
        env:
          VERSION: ${{ needs.parse-release-tag.outputs.version }}
          VSIX_PATH: extensions/vscode/unfold-${{ needs.parse-release-tag.outputs.version }}.vsix
        run: npm --prefix apps/unfold run extension:verify
      - name: Attach the VSIX and its checksum to the Forgejo release
        shell: bash
        env:
          VERSION: ${{ needs.parse-release-tag.outputs.version }}
          TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          cd apps/unfold/extensions/vscode
          vsix="unfold-${VERSION}.vsix"
          sha256sum "$vsix" > "${vsix}.sha256"
          release="$(curl -sS --fail --max-time 30 -H "Authorization: token ${TOKEN}" "${API}/releases/tags/unfold-v${VERSION}")"
          release_id="$(printf '%s' "$release" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          for asset in "$vsix" "${vsix}.sha256"; do
            if printf '%s' "$release" | python3 -c 'import json,sys; a=sys.argv[1]; sys.exit(0 if any(x.get("name")==a for x in json.load(sys.stdin).get("assets",[])) else 1)' "$asset"; then
              echo "${asset} is already attached to release ${release_id}; skipping the upload."
            else
              curl -sS --fail --max-time 120 -H "Authorization: token ${TOKEN}" -F "attachment=@${asset}" "${API}/releases/${release_id}/assets?name=${asset}" >/dev/null
              echo "attached ${asset} to release ${release_id}"
            fi
          done
      - name: Reuse and verify the canonical release asset
        shell: bash
        env:
          VERSION: ${{ needs.parse-release-tag.outputs.version }}
          WEBGRIP_CI_TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
          VSIX_PATH: extensions/vscode/unfold-${{ needs.parse-release-tag.outputs.version }}.vsix
        run: |
          python3 scripts/restore_extension_asset.py "$VERSION"
          npm --prefix apps/unfold run extension:verify
      - name: Publish to Open VSX
        shell: bash
        env:
          VERSION: ${{ needs.parse-release-tag.outputs.version }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          cd apps/unfold/extensions/vscode
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "OVSX_PAT is required for the public extension release." >&2
            exit 1
          fi
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--pre-release"
          npx --no-install ovsx publish --packagePath "unfold-${VERSION}.vsix" --skip-duplicate $prerelease
      - name: Publish to the Visual Studio Marketplace
        shell: bash
        env:
          VERSION: ${{ needs.parse-release-tag.outputs.version }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          AZURE_CLIENT_ID: ${{ secrets.MARKETPLACE_AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.MARKETPLACE_AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          cd apps/unfold/extensions/vscode
          if [[ "$VERSION" == *-* ]]; then
            echo "::notice::${VERSION} is a pre-release version. The Visual Studio Marketplace accepts only major.minor.patch; Open VSX carries this build."
            exit 0
          fi
          if [ -n "${AZURE_CLIENT_ID:-}" ] && [ -n "${AZURE_TENANT_ID:-}" ]; then
            npx --no-install vsce publish --packagePath "unfold-${VERSION}.vsix" --skip-duplicate --azure-credential
          elif [ -n "${VSCE_PAT:-}" ]; then
            npx --no-install vsce publish --packagePath "unfold-${VERSION}.vsix" --skip-duplicate
          else
            echo "::notice::No Marketplace credential is configured. ${VERSION} ships to Open VSX only, by decision; see docs/adrs/0021-the-extension-ships-through-open-vsx-first.md."
          fi

  unfold-release-distribute:
    name: Unfold - Verify and publish all destinations
    needs: [parse-release-tag, unfold-release-distribute-harbor, unfold-release-publish-chart, unfold-release-publish-extension]
    if: needs.parse-release-tag.outputs.version != ''
    runs-on: docker
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: unfold-v${{ needs.parse-release-tag.outputs.version }}
      - uses: https://github.com/jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.0
          install_args: regctl
          cache: false
          github_token: ''
      - name: Copy and verify release artifacts
        shell: bash
        env:
          VERSION: ${{ needs.parse-release-tag.outputs.version }}
          HARBOR_ROBOT_USER: ${{ secrets.HARBOR_ROBOT_USER }}
          HARBOR_ROBOT_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
          WEBGRIP_CI_TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$(mktemp -d)" PATH="$PWD/scripts:$PATH"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' '{"credHelpers":{"harbor.webgrip.dev":"unfold","forgejo.webgrip.dev":"unfold","ghcr.io":"unfold"}}' > "$DOCKER_CONFIG/config.json"
          python3 scripts/publish_release.py unfold "$VERSION"

  site-release-tag:
    runs-on: docker
    outputs:
      channel: ${{ steps.site.outputs.channel }}
    steps:
      - id: site
        shell: bash
        env:
          WORKFLOW_EVENT: ${{ github.event_name }}
          SELECTED_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
          RELEASES_ENABLED: ${{ vars.UNFOLD_RELEASES_ENABLED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ "${RELEASES_ENABLED:-}" != true || ( "$tag" != unfold-site-v* && "$tag" != unfold-v* ) ]]; then
            echo "channel=none" >> "$GITHUB_OUTPUT"
            echo "${tag:-This release} is neither a site nor an Unfold release; the site is not deployed."
            exit 0
          fi
          if [[ "${WORKFLOW_EVENT:-}" == workflow_dispatch ]]; then
            [[ "${SELECTED_REF:-}" == "refs/tags/$tag" ]] || { echo "Select the same tag as the workflow ref before deploying." >&2; exit 1; }
          fi
          if [[ "$tag" == unfold-site-v* ]]; then
            [[ "$tag" =~ ^unfold-site-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]] || { echo "The site deploys only unfold-site-vX.Y.Z or unfold-site-vX.Y.Z-rc.N tags." >&2; exit 1; }
          else
            [[ "$tag" =~ ^unfold-v0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[1-9][0-9]*$ ]] || { echo "An Unfold release redeploys staging only from unfold-v0.x.y-rc.N tags." >&2; exit 1; }
          fi
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo "The Cloudflare deploy credential is missing; the forgejo-actions-secrets bridge publishes it from OpenBao cloudflare/deploy." >&2; exit 1; }
          if [[ "$tag" == *-rc.* ]]; then
            echo "channel=prerelease" >> "$GITHUB_OUTPUT"
            echo "Deploying ${tag} to staging."
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "Deploying ${tag} to production."
          fi

  site-deploy-staging:
    needs: [site-release-tag]
    uses: webgrip/workflows/.forgejo/workflows/cloudflare-deploy.yml@v2.7.7
    with:
      enabled: ${{ needs.site-release-tag.outputs.channel == 'prerelease' }}
      environment: production
      release-channel: prerelease
      wrangler-env: staging
      working-directory: apps/site
      build-command: npm --prefix ../unfold ci --omit=dev --no-audit --no-fund && UNFOLD_SITE_URL=https://staging.unfoldhq.dev pnpm run build:release
      apex-url: https://staging.unfoldhq.dev
      smoke-paths: |
        /
        /nl
        /robots.txt
        /sitemap-index.xml
        /favicon.svg
        /demo/
        /demo/replay/replay.json
        /privacy
        /nl/privacy
      not-found-path: /this-page-does-not-exist
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  site-deploy-production:
    needs: [site-release-tag]
    uses: webgrip/workflows/.forgejo/workflows/cloudflare-deploy.yml@v2.7.7
    with:
      enabled: ${{ needs.site-release-tag.outputs.channel == 'stable' }}
      environment: production
      release-channel: stable
      working-directory: apps/site
      build-command: npm --prefix ../unfold ci --omit=dev --no-audit --no-fund && UNFOLD_SITE_URL=https://unfoldhq.dev pnpm run build:release
      apex-url: https://unfoldhq.dev
      smoke-paths: |
        /
        /nl
        /robots.txt
        /sitemap-index.xml
        /favicon.svg
        /demo/
        /demo/replay/replay.json
        /privacy
        /nl/privacy
      not-found-path: /this-page-does-not-exist
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
