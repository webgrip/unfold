name: On Release Published

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.3.0"
        required: true
        type: string

concurrency:
  group: release-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  parse-release-tag:
    runs-on: docker
    outputs:
      version: ${{ steps.parse.outputs.version }}
      latest: ${{ steps.parse.outputs.latest }}
      created: ${{ steps.parse.outputs.created }}
    steps:
      - id: parse
        shell: bash
        env:
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
          RELEASE_CREATED_AT: ${{ github.event.release.created_at }}
        run: |
          set -euo pipefail
          tag='${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}'
          [[ "$tag" =~ ^v(.+)$ ]] || { echo "Unsupported tag: $tag (expected v<semver>)" >&2; exit 1; }
          version="${BASH_REMATCH[1]}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          latest=true
          [[ "$version" == *-* ]] && latest=false
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          plausible() { local v="${1:-}"; [[ -n "$v" ]] || return 1; [[ "$v" =~ ^([0-9]{4})-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2} ]] || return 1; (( BASH_REMATCH[1] >= 2020 )); }
          created=""
          for cand in "${RELEASE_PUBLISHED_AT:-}" "${RELEASE_CREATED_AT:-}"; do
            [[ -n "$cand" ]] || continue
            if plausible "$cand"; then created="$cand"; break; fi
            echo "NOTE: release timestamp '$cand' is a zero time or implausible; ignoring it."
          done
          [[ -n "$created" ]] || created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          plausible "$created" || { echo "ERROR: IMAGE_CREATED is not a plausible instant: '$created'" >&2; exit 1; }
          echo "created=$created" >> "$GITHUB_OUTPUT"

  release-publish-chart:
    name: Publish Helm chart (Harbor)
    needs: [parse-release-tag]
    uses: webgrip/workflows/.forgejo/workflows/helm-chart-push.yml@v1.10.0
    with:
      enabled: true
      registry: harbor.webgrip.dev
      path: ops/helm/de-vloer
      name: de-vloer
      version: ${{ needs.parse-release-tag.outputs.version }}
      ref: v${{ needs.parse-release-tag.outputs.version }}
      oci-path: webgrip/charts
    secrets:
      REGISTRY_USERNAME: ${{ secrets.HARBOR_ROBOT_USER }}
      REGISTRY_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}

  release-distribute-harbor:
    name: Build, gate and sign images (Harbor)
    needs: [parse-release-tag]
    runs-on: docker
    enable-openid-connect: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: de-vloer
            context: "."
            dockerfile: Dockerfile
            target: app
          - name: de-vloer-agent
            context: ops/agent
            dockerfile: Dockerfile
            target: ""
    env:
      REGISTRY_USERNAME: ${{ secrets.HARBOR_ROBOT_USER }}
      REGISTRY_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: v${{ needs.parse-release-tag.outputs.version }}

      - name: Probe Harbor for an existing image
        id: probe
        shell: bash
        env:
          IMAGE: ${{ matrix.name }}
          VERSION: ${{ needs.parse-release-tag.outputs.version }}
        run: |
          set -uo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -u "${REGISTRY_USERNAME}:${REGISTRY_TOKEN}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://harbor.webgrip.dev/v2/webgrip/${IMAGE}/manifests/${VERSION}")" || true
          [ -n "$code" ] || code=000
          if [ "$code" = 200 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "harbor.webgrip.dev/webgrip/${IMAGE}:${VERSION} is already published; skipping the build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Harbor answered HTTP ${code} for ${IMAGE}:${VERSION}; building."
          fi

      - name: Build and push (Harbor)
        id: build
        if: steps.probe.outputs.exists != 'true'
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/docker-build-push-registry-fast@v1.11.0
        with:
          registry: harbor.webgrip.dev
          docker-context: ${{ matrix.context }}
          docker-file: ${{ matrix.dockerfile }}
          docker-target: ${{ matrix.target }}
          platforms: "linux/amd64,linux/arm64"
          annotations: |
            index:org.opencontainers.image.source=https://github.com/webgrip/de-vloer
            index:org.opencontainers.image.url=https://forgejo.webgrip.dev/webgrip/de-vloer
          docker-build-args: |
            IMAGE_CREATED=${{ needs.parse-release-tag.outputs.created }}
            IMAGE_VERSION=${{ needs.parse-release-tag.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
            REGISTRY_DHI=harbor.webgrip.dev/dhi
          docker-tags: |
            webgrip/${{ matrix.name }}:${{ needs.parse-release-tag.outputs.version }}
            ${{ needs.parse-release-tag.outputs.latest == 'true' && format('webgrip/{0}:latest', matrix.name) || '' }}

      - name: Resolve the published digest
        id: digest
        shell: bash
        env:
          IMAGE: harbor.webgrip.dev/webgrip/${{ matrix.name }}:${{ needs.parse-release-tag.outputs.version }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | docker login harbor.webgrip.dev -u "$REGISTRY_USERNAME" --password-stdin >/dev/null
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{ .Manifest.Digest }}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "no digest resolved for $IMAGE" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=harbor.webgrip.dev/webgrip/${{ matrix.name }}@${digest}" >> "$GITHUB_OUTPUT"

      - name: CVE budget gate (grype + OpenVEX)
        uses: ./.forgejo/actions/cve-gate
        with:
          image-ref: ${{ steps.digest.outputs.ref }}
          image-name: ${{ matrix.name }}

      - name: Sign, attest and SBOM (Harbor)
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/cosign-sign-attest@v1.11.2
        with:
          registry: harbor.webgrip.dev
          image-name: harbor.webgrip.dev/webgrip/${{ matrix.name }}
          image-version: ${{ needs.parse-release-tag.outputs.version }}

  release-publish-extension:
    name: Publish VS Code extension
    needs: [parse-release-tag]
    runs-on: docker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: v${{ needs.parse-release-tag.outputs.version }}
      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
      - name: Package the VSIX from the tagged tree
        shell: bash
        env:
          VERSION: ${{ needs.parse-release-tag.outputs.version }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./extensions/vscode/package.json').version")" = "$VERSION"
          npm ci --no-audit --no-fund --prefix extensions/vscode
          npm run extension:build
          npm --prefix extensions/vscode run package -- --out "de-vloer-${VERSION}.vsix"
          test -s "extensions/vscode/de-vloer-${VERSION}.vsix"
      - name: Attach the VSIX to the Forgejo release
        shell: bash
        env:
          VERSION: ${{ needs.parse-release-tag.outputs.version }}
          TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
          API: https://forgejo.webgrip.dev/api/v1/repos/webgrip/de-vloer
        run: |
          set -euo pipefail
          asset="de-vloer-${VERSION}.vsix"
          release="$(curl -sS --fail --max-time 30 -H "Authorization: token ${TOKEN}" "${API}/releases/tags/v${VERSION}")"
          release_id="$(printf '%s' "$release" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          if printf '%s' "$release" | python3 -c 'import json,sys; a=sys.argv[1]; sys.exit(0 if any(x.get("name")==a for x in json.load(sys.stdin).get("assets",[])) else 1)' "$asset"; then
            echo "${asset} is already attached to release ${release_id}; skipping the upload."
          else
            curl -sS --fail --max-time 120 -H "Authorization: token ${TOKEN}" -F "attachment=@extensions/vscode/${asset}" "${API}/releases/${release_id}/assets?name=${asset}" >/dev/null
            echo "attached ${asset} to release ${release_id}"
          fi
      - name: Publish to Open VSX and the Marketplace where a token is configured
        shell: bash
        env:
          VERSION: ${{ needs.parse-release-tag.outputs.version }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          cd extensions/vscode
          vsix="de-vloer-${VERSION}.vsix"
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--pre-release"
          if [ -n "${OVSX_PAT:-}" ]; then
            npx --yes ovsx@1.1.1 publish --packagePath "$vsix" --skip-duplicate $prerelease
          else
            echo "::notice::OVSX_PAT is not configured; the VSIX stays a Forgejo release asset only."
          fi
          if [ -n "${VSCE_PAT:-}" ]; then
            npx --yes @vscode/vsce@3.9.2 publish --packagePath "$vsix" --skip-duplicate $prerelease
          else
            echo "::notice::VSCE_PAT is not configured; skipping the Visual Studio Marketplace."
          fi

  release-distribute-forgejo:
    name: Distribute (Forgejo)
    needs: [parse-release-tag, release-distribute-harbor]
    uses: webgrip/workflows/.forgejo/workflows/forgejo-distribute.yml@v2.6.2
    with:
      enabled: true
      version: ${{ needs.parse-release-tag.outputs.version }}
      ref: v${{ needs.parse-release-tag.outputs.version }}
      link-repo: de-vloer
      image-name: de-vloer
      mirror-from-registry: harbor.webgrip.dev
      push-latest: ${{ needs.parse-release-tag.outputs.latest == 'true' }}
      copy-accessories: true
      chart-path: ops/helm/de-vloer
      chart-name: de-vloer
    secrets:
      REGISTRY_TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
      SOURCE_REGISTRY_USER: ${{ secrets.HARBOR_ROBOT_USER }}
      SOURCE_REGISTRY_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}

  # Mirrors tags, the GitHub Release, the de-vloer image and the chart to
  # github.com/webgrip/de-vloer and ghcr.io/webgrip. Enabled so a cluster with
  # no harbor.webgrip.dev credential can pull anonymously — the second estate's staging
  # cluster is the first of them, and its 401 against Harbor is the whole
  # reason de-vloer could not be deployed there.
  #
  # The agent image is NOT covered by this call: image-name is a single
  # string, and a second instance of the same reusable in one caller collides
  # under Forgejo v15 flattening. It gets the inline job below instead.
  #
  # NB: the first push creates each GHCR package PRIVATE. Both de-vloer and
  # de-vloer-agent have to be flipped public once in the GitHub package
  # settings, or anonymous pulls 401 exactly as Harbor does today.
  release-distribute-github:
    name: Distribute (GitHub)
    needs: [parse-release-tag, release-distribute-harbor]
    uses: webgrip/workflows/.forgejo/workflows/github-distribute.yml@v2.6.2
    with:
      enabled: ${{ needs.parse-release-tag.outputs.version != '' }}
      version: ${{ needs.parse-release-tag.outputs.version }}
      repo: webgrip/de-vloer
      branches: main development
      image-name: de-vloer
      mirror-from-registry: harbor.webgrip.dev
      push-latest: ${{ needs.parse-release-tag.outputs.latest == 'true' }}
      copy-accessories: true
      ref: v${{ needs.parse-release-tag.outputs.version }}
      chart-path: ops/helm/de-vloer
      chart-name: de-vloer
    secrets:
      GH_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
      SOURCE_REGISTRY_USER: ${{ secrets.HARBOR_ROBOT_USER }}
      SOURCE_REGISTRY_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}

  # The workspace image, which the chart names as workspaceImage and which every
  # agent workspace pod pulls. Mirroring de-vloer without it publishes a control
  # plane that cannot start a single session on any cluster that reached it
  # through GHCR — a failure that surfaces as ImagePullBackOff on the workspace
  # long after the release looks green.
  #
  # Inline rather than a second github-distribute call, for the flattening
  # collision noted above. imagetools copies the manifest list by digest, so
  # BuildKit's provenance and SBOM ride along inside the index; cosign's
  # .sig/.att accessories stay Harbor-only, which is where Kyverno verifies.
  release-mirror-agent-github:
    name: Mirror the agent image (GHCR)
    needs: [parse-release-tag, release-distribute-harbor]
    if: needs.parse-release-tag.outputs.version != ''
    runs-on: docker
    steps:
      - name: Copy de-vloer-agent from Harbor to GHCR
        shell: bash
        env:
          VERSION: ${{ needs.parse-release-tag.outputs.version }}
          HARBOR_USER: ${{ secrets.HARBOR_ROBOT_USER }}
          HARBOR_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          source="harbor.webgrip.dev/webgrip/de-vloer-agent:${VERSION}"
          target="ghcr.io/webgrip/de-vloer-agent:${VERSION}"
          echo "$HARBOR_TOKEN" | docker login harbor.webgrip.dev -u "$HARBOR_USER" --password-stdin >/dev/null
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          digest="$(docker buildx imagetools inspect "$source" --format '{{ .Manifest.Digest }}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "no digest resolved for $source" >&2; exit 1; }
          docker buildx imagetools create --tag "$target" "harbor.webgrip.dev/webgrip/de-vloer-agent@${digest}"
          mirrored="$(docker buildx imagetools inspect "$target" --format '{{ .Manifest.Digest }}')"
          test "$mirrored" = "$digest"
          echo "mirrored de-vloer-agent ${VERSION} at ${digest}"
