name: On Release Published

on:
  release:
    types: [published]
  # CI-cut releases emit no release event on Forgejo (loop prevention); on_source_change
  # dispatches this explicitly. The release trigger still serves manual UI releases.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true
        type: string

concurrency:
  group: release-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  parse-release-tag:
    runs-on: docker
    outputs:
      version: ${{ steps.parse.outputs.version }}
      created: ${{ steps.parse.outputs.created }}
      latest_tag: ${{ steps.parse.outputs.latest_tag }}
    steps:
      - id: parse
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}'
          [[ "$tag" =~ ^v(.+)$ ]] || { echo "Unsupported tag: $tag (expected v<semver>)" >&2; exit 1; }
          version="${BASH_REMATCH[1]}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          created='${{ github.event.release.published_at || github.event.release.created_at }}'
          [[ -n "$created" ]] || created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "created=$created" >> "$GITHUB_OUTPUT"
          # Prereleases (semver with a hyphen, e.g. 0.1.0-rc.1 from development) must not
          # move :latest; the build composite skips the resulting empty tag line.
          latest_tag="webgrip/ploegd:latest"
          [[ "$version" == *-* ]] && latest_tag=""
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

  # Distribute: normal job + step-level -fast composite (infra's production shape from
  # Forgejo) — no job-level reusable chains, so no flattened-job-id collisions. The
  # composite reads REGISTRY_USERNAME/REGISTRY_TOKEN from env. Explicit platforms re-enables
  # QEMU in -fast; arm64 is cheap because the Dockerfile cross-compiles via $BUILDPLATFORM.
  # A GHCR mirror job existed here but is parked while GitHub is out of scope — restore it
  # from git history (ci: park GHCR publish) when public pulls are wanted again.
  # Job-level reusable (the one reusable chain this caller allows — infra's
  # production shape). `enabled: true` is safe because this workflow never
  # runs without a parsed tag. `ref` decouples the v-prefixed git tag from
  # the bare chart version.
  release-publish-chart:
    name: Publish Helm chart (Harbor)
    needs: [parse-release-tag]
    uses: webgrip/workflows/.forgejo/workflows/helm-chart-push.yml@main
    with:
      enabled: true
      registry: harbor.webgrip.dev
      path: ops/helm/ploeg
      name: ploeg
      version: ${{ needs.parse-release-tag.outputs.version }}
      ref: v${{ needs.parse-release-tag.outputs.version }}
      oci-path: webgrip/charts
    secrets:
      REGISTRY_USERNAME: ${{ secrets.HARBOR_ROBOT_USER }}
      REGISTRY_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}

  release-distribute-harbor:
    name: Distribute (Harbor)
    needs: [parse-release-tag]
    runs-on: docker
    env:
      REGISTRY_USERNAME: ${{ secrets.HARBOR_ROBOT_USER }}
      REGISTRY_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
    steps:
      - name: Build and push (Harbor)
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/docker-build-push-registry-fast@main
        with:
          registry: harbor.webgrip.dev
          docker-context: "."
          docker-file: "ops/docker/ploegd/Dockerfile"
          platforms: "linux/amd64,linux/arm64"
          docker-build-args: |
            IMAGE_CREATED=${{ needs.parse-release-tag.outputs.created }}
            IMAGE_VERSION=${{ needs.parse-release-tag.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
            REGISTRY_DOCKERHUB=harbor.webgrip.dev/dockerhub
          # Owner hardcoded: github.repository_owner is EMPTY on Forgejo workflow_dispatch.
          docker-tags: |
            webgrip/ploegd:${{ needs.parse-release-tag.outputs.version }}
            ${{ needs.parse-release-tag.outputs.latest_tag }}

  # Forgejo registry mirror: keeps https://forgejo.webgrip.dev/webgrip/ploeg/packages
  # populated and linked to this repo. Harbor stays the registry the cluster pulls from;
  # these jobs are additive mirrors (same spirit as the parked GHCR mirror above).
  # Registry host hardcoded like harbor.webgrip.dev elsewhere in this file; FORGEJO_URL
  # only feeds API calls. Credentials are the webgrip-ci bot (org secret WEBGRIP_CI_TOKEN
  # + org var WEBGRIP_CI_BOT_NAME, published by homelab-cluster's forgejo-actions-secrets
  # CronJob) — NOT secrets.FORGEJO_TOKEN, which Forgejo resolves to the built-in per-job
  # token (FORGEJO_ is a reserved secret prefix) and which cannot write org packages
  # (run 43: login OK, push 401 at reqPackageAccess). Forgejo packages are owner-scoped
  # and land UNLINKED, so each job ends with an idempotent link call that pins the
  # package to webgrip/ploeg.
  release-distribute-forgejo:
    name: Distribute (Forgejo)
    needs: [parse-release-tag]
    runs-on: docker
    env:
      FORGEJO_URL: ${{ vars.FORGEJO_INSTANCE_URL || github.server_url }}
      REGISTRY_USERNAME: ${{ vars.WEBGRIP_CI_BOT_NAME || 'webgrip-ci' }}
      REGISTRY_TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
    steps:
      - name: Build and push (Forgejo)
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/docker-build-push-registry-fast@main
        with:
          registry: forgejo.webgrip.dev
          docker-context: "."
          docker-file: "ops/docker/ploegd/Dockerfile"
          platforms: "linux/amd64,linux/arm64"
          docker-build-args: |
            IMAGE_CREATED=${{ needs.parse-release-tag.outputs.created }}
            IMAGE_VERSION=${{ needs.parse-release-tag.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
            REGISTRY_DOCKERHUB=harbor.webgrip.dev/dockerhub
          docker-tags: |
            webgrip/ploegd:${{ needs.parse-release-tag.outputs.version }}
            ${{ needs.parse-release-tag.outputs.latest_tag }}
      - name: Link ploegd package to repo
        shell: bash
        env:
          VERSION: ${{ needs.parse-release-tag.outputs.version }}
        run: |
          set -euo pipefail
          api="${FORGEJO_URL%/}/api/v1"
          if curl -fsS -H "Authorization: token ${REGISTRY_TOKEN}" \
              "${api}/packages/webgrip/container/ploegd/${VERSION}" \
              | grep -q '"full_name":"webgrip/ploeg"'; then
            echo "Package ploegd already linked to webgrip/ploeg."
          else
            curl -fsS -X POST -H "Authorization: token ${REGISTRY_TOKEN}" \
              "${api}/packages/webgrip/container/ploegd/-/link/ploeg"
            echo "Linked package ploegd -> webgrip/ploeg."
          fi

  # Inline steps, NOT a second helm-chart-push reusable chain: two instances of the same
  # reusable in one caller collide on flattened job ids (Forgejo v15 — see the comment on
  # the release job in on_source_change.yml). An OCI-pushed chart lands in Forgejo's
  # CONTAINER registry (package type `container`, named after the chart), hence the
  # container/ploeg path in the link call.
  release-publish-chart-forgejo:
    name: Publish Helm chart (Forgejo)
    needs: [parse-release-tag]
    runs-on: docker
    env:
      FORGEJO_URL: ${{ vars.FORGEJO_INSTANCE_URL || github.server_url }}
      REGISTRY_USERNAME: ${{ vars.WEBGRIP_CI_BOT_NAME || 'webgrip-ci' }}
      REGISTRY_TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
      VERSION: ${{ needs.parse-release-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The tagged commit — Chart.yaml version is bumped in lockstep with the tag.
          ref: v${{ needs.parse-release-tag.outputs.version }}
      - name: Check for preinstalled helm
        id: helm-check
        shell: bash
        run: |
          if command -v helm >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # Absolute URL + pinned version: same resolver/rate-limit constraints as
      # on_source_change.yml.
      - uses: https://github.com/azure/setup-helm@v4
        if: steps.helm-check.outputs.present != 'true'
        with:
          version: v3.18.4
      - name: Push chart (OCI)
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | helm registry login forgejo.webgrip.dev --username "$REGISTRY_USERNAME" --password-stdin
          helm package ops/helm/ploeg
          helm push "./ploeg-${VERSION}.tgz" oci://forgejo.webgrip.dev/webgrip
      - name: Link chart package to repo
        shell: bash
        run: |
          set -euo pipefail
          api="${FORGEJO_URL%/}/api/v1"
          if curl -fsS -H "Authorization: token ${REGISTRY_TOKEN}" \
              "${api}/packages/webgrip/container/ploeg/${VERSION}" \
              | grep -q '"full_name":"webgrip/ploeg"'; then
            echo "Chart package ploeg already linked to webgrip/ploeg."
          else
            curl -fsS -X POST -H "Authorization: token ${REGISTRY_TOKEN}" \
              "${api}/packages/webgrip/container/ploeg/-/link/ploeg"
            echo "Linked chart package ploeg -> webgrip/ploeg."
          fi
