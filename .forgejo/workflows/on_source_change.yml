name: On Source Change

on:
  push:
    branches: [main, development]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: docker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Absolute URL: data.forgejo.org (the default action resolver) has an incomplete mirror set.
      - uses: https://github.com/actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - uses: https://github.com/azure/setup-helm@v4
        with:
          # Explicit version: 'latest' resolution hits api.github.com
          # unauthenticated from the runner and rate-limits.
          version: v4.2.3
      - run: helm lint ops/helm/ploeg
      - run: helm template ploeg ops/helm/ploeg > /dev/null
      - run: helm template ploeg ops/helm/ploeg -f ops/helm/ploeg/ci/executor-values.yaml > /dev/null

  # Normal job + step-level composite (absolute URL), NOT a job-level reusable: Forgejo v15
  # flattens reusable inner jobs (needs/if gating unreliable — see renovate-config/infra).
  # Releases are cut with the webgrip-ci bot PAT, so Forgejo emits a native `release`
  # event that triggers on_release_published — no manual dispatch step. (The old per-job
  # token suppressed that event as loop prevention, which is why a dispatch step used to
  # live here; it 403'd once the job switched tokens, run 48.)
  release:
    name: Semantic Release
    needs: [checks]
    runs-on: docker
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      # WEBGRIP_CI_TOKEN (org secret, webgrip-ci bot) — NOT secrets.FORGEJO_TOKEN, which is
      # the built-in per-job token (FORGEJO_ is a reserved prefix, so an org secret can never
      # shadow it). The per-job token works for releases/dispatch but attributes everything
      # to Ghost and cannot write org packages.
      - name: Semantic Release
        id: release
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/semantic-release@main
        with:
          token: ${{ secrets.WEBGRIP_CI_TOKEN }}

