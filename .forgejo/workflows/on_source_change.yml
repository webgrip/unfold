name: On Source Change

on:
  push:
    branches: [main, development]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: docker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Absolute URL: data.forgejo.org (the default action resolver) has an incomplete mirror set.
      - uses: https://github.com/actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - uses: https://github.com/azure/setup-helm@v4
        with:
          # Explicit version: 'latest' resolution hits api.github.com
          # unauthenticated from the runner and rate-limits.
          version: v4.2.3
      - run: helm lint ops/helm/ploeg
      - run: helm template ploeg ops/helm/ploeg > /dev/null
      - run: helm template ploeg ops/helm/ploeg -f ops/helm/ploeg/ci/executor-values.yaml > /dev/null
      - run: helm template ploeg ops/helm/ploeg -f ops/helm/ploeg/ci/executor-cronjob-values.yaml > /dev/null

  # Normal job + step-level composite (absolute URL), NOT a job-level reusable: Forgejo v15
  # flattens reusable inner jobs (needs/if gating unreliable — see renovate-config/infra).
  # Releases are cut with the webgrip-ci bot PAT, so Forgejo emits a native `release`
  # event that triggers on_release_published — no manual dispatch step. (The old per-job
  # token suppressed that event as loop prevention, which is why a dispatch step used to
  # live here; it 403'd once the job switched tokens, run 48.)
  release:
    name: Semantic Release
    needs: [checks]
    runs-on: docker
    # The release toolchain is this image, not an install (webgrip/workflows ADR-0005): node,
    # git, yq, semantic-release 25 and @webgrip/semantic-release-config are baked in from a
    # committed lockfile, so the job resolves nothing at release time. Run 122 spent 3m45s
    # installing ~430 packages — unlocked, so that release and the next one were not guaranteed
    # to use the same plugin versions.
    #
    # The composite finds the toolchain via SEMREL_PREBAKED, which the image exports. Without
    # this container it falls back to an unlocked install and says so with a ::warning::, which
    # is what every other repo on the step-level-composite pattern will do until it gets this
    # same two lines. Built in webgrip/infrastructure (ops/docker/semantic-release).
    #
    # NB: only THIS job. `checks` above needs go and helm, which this image does not carry.
    container:
      image: harbor.webgrip.dev/webgrip/semantic-release:0.3.1
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      # WEBGRIP_CI_TOKEN (org secret, webgrip-ci bot) — NOT secrets.FORGEJO_TOKEN, which is
      # the built-in per-job token (FORGEJO_ is a reserved prefix, so an org secret can never
      # shadow it). The per-job token works for releases/dispatch but attributes everything
      # to Ghost and cannot write org packages.
      - name: Semantic Release
        id: release
        # ploeg was the trial for the container path, and it is proven: run 144 cut v0.2.0-rc.15 on
        # this action — analyze, prepare, the Chart.yaml bump and the @semantic-release/git push-back
        # through the public-host extraheader all ran.
        #
        # No longer a temporary pin, and nothing here is waiting on #40 any more: it merged on
        # 2026-08-09 and webgrip/workflows self-released v1.2.0, the first release carrying it.
        # v1.2.0 moved the composite 135/126 lines against v1.1.0, but ploeg felt none of it — it
        # was already running ee06ca5, PR #40's tip, and this composite is byte-identical between
        # the two. The repin bought immutability, not behaviour.
        #
        # Which is the whole point. A SHA pin is only as immutable as the branch it hangs off. The
        # pin before this, 2c5c68c9, was amended off fix/semrel-parity-and-hardening; the commit
        # survived in local clones — so it looked fine from a workstation, and over SSH it still
        # fetched — but it stopped being reachable from any ref on the server, and the Forgejo runner
        # resolves an action by cloning branch refs over anonymous HTTPS. Every push to development
        # from 2026-07-31 to 2026-08-09 then died before its first step with "could not determine
        # the commit ID of 2c5c68c9^{commit}": seven runs, `checks` green on all of them, no rc cut.
        # A tag on main cannot fail that way. Renovate tracks it through the forgejo-tags datasource.
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/semantic-release@v1.2.0
        with:
          token: ${{ secrets.WEBGRIP_CI_TOKEN }}

