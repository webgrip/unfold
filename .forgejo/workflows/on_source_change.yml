name: '[Workflow] On Source Change'

on:
  push:
    branches: [development, main]
  workflow_dispatch:

concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: docker
    timeout-minutes: 40
    outputs:
      warnings: ${{ steps.verify.outputs.warnings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - id: verify
        uses: ./.forgejo/actions/verify

  warnings:
    needs: [checks]
    if: always() && needs.checks.result != 'skipped' && needs.checks.result != 'cancelled'
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Fail when setup or verification printed a warning
        env:
          REPORT: ${{ needs.checks.outputs.warnings }}
        run: |
          if [ -z "$REPORT" ]; then
            echo "No warnings in setup and verification output."
            exit 0
          fi
          echo "Setup or verification printed warnings. Fix them, or accept one with a reason in scripts/ci-warnings-allow.json:"
          printf '%s\n' "$REPORT"
          exit 1

  ploeg-pin:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: https://github.com/jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.6
          install_args: node
          cache: false
          github_token: ''
      - name: Require the pinned Ploeg commit to be the Ploeg release it names
        run: node scripts/ploeg-pin.mjs --published

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development' && vars.UNFOLD_RELEASES_ENABLED == 'true'
    needs: [checks, ploeg-pin]
    runs-on: docker
    container:
      image: harbor.webgrip.dev/webgrip/semantic-release-monorepo:0.3.4@sha256:0d6227231c9258c230360c51f9733fe3d60cc0b33860bb7b8769b8683d637c17
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.forgejo/actions/release-policy
      - name: Semantic Release
        id: release
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/semantic-release-monorepo@v2.8.1
        with:
          package-path: apps
          package-name: unfold
          token: ${{ secrets.WEBGRIP_CI_TOKEN }}
      - name: Create the release Forgejo lost to the tag race
        if: failure() && steps.release.outcome == 'failure'
        env:
          RELEASE_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          GITEA_TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
        run: node scripts/release-repair.mjs unfold-v

  site-release:
    if: >-
      always() && github.event_name == 'push' && vars.UNFOLD_RELEASES_ENABLED == 'true'
      && needs.checks.result == 'success'
      && ((github.ref == 'refs/heads/development' && needs.release.result == 'success')
      || (github.ref == 'refs/heads/main' && needs.release.result == 'skipped'))
    needs: [checks, release]
    runs-on: docker
    container:
      image: harbor.webgrip.dev/webgrip/semantic-release-monorepo:0.3.4@sha256:0d6227231c9258c230360c51f9733fe3d60cc0b33860bb7b8769b8683d637c17
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Semantic Release
        id: release
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/semantic-release-monorepo@v2.8.1
        with:
          package-path: apps/site
          package-name: unfold-site
          token: ${{ secrets.WEBGRIP_CI_TOKEN }}
      - name: Create the release Forgejo lost to the tag race
        if: failure() && steps.release.outcome == 'failure'
        env:
          RELEASE_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          GITEA_TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
        run: node scripts/release-repair.mjs unfold-site-v
