name: '[Workflow] On Source Change'

on:
  push:
    branches: [development, main]
  workflow_dispatch:

concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: unfold-ci
    timeout-minutes: 40
    outputs:
      warnings: ${{ steps.verify.outputs.warnings }}
    steps:
      - uses: https://forgejo.webgrip.dev/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: verify
        uses: ./.forgejo/actions/verify
        with:
          except: unfold

  checks-unfold:
    runs-on: unfold-ci
    timeout-minutes: 40
    outputs:
      warnings: ${{ steps.verify.outputs.warnings }}
    steps:
      - uses: https://forgejo.webgrip.dev/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: verify
        uses: ./.forgejo/actions/verify
        with:
          only: unfold
          setup: setup-unfold

  warnings:
    needs: [checks, checks-unfold]
    if: always() && needs.checks.result != 'skipped' && needs.checks.result != 'cancelled'
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Fail when setup or verification printed a warning
        env:
          CHECKS: ${{ needs.checks.outputs.warnings }}
          UNFOLD: ${{ needs.checks-unfold.outputs.warnings }}
        run: |
          REPORT=$(printf '%s\n%s\n' "$CHECKS" "$UNFOLD" | sed '/^$/d')
          if [ -z "$REPORT" ]; then
            echo "No warnings in setup and verification output."
            exit 0
          fi
          echo "Setup or verification printed warnings. Fix them, or accept one with a reason in scripts/ci-warnings-allow.json:"
          printf '%s\n' "$REPORT"
          exit 1

  build-contexts:
    runs-on: docker
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/build-contexts

  ploeg-pin:
    runs-on: unfold-ci
    timeout-minutes: 5
    steps:
      - uses: https://forgejo.webgrip.dev/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: https://github.com/jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install_args: uv
          cache: false
          github_token: ''
      - name: Unpack the pinned Ploeg contract bundle, verifying its digest
        run: mise exec uv -- uv run --no-project python scripts/ploeg-contract.py fetch
      - name: Require the pin to be a published Ploeg release whose bundle and Go module agree
        run: mise exec uv -- uv run --no-project python scripts/ploeg-contract.py check --published

  site-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.UNFOLD_RELEASES_ENABLED == 'true'
    needs: [checks]
    runs-on: docker
    container:
      image: harbor.webgrip.dev/webgrip/semantic-release:2.5.2@sha256:0ad30a4faf3c96d0a19a164b4519d07c28a8b4cb615f1ed1406637a00e837691
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Semantic Release
        id: release
        env:
          RELEASE_TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
        run: webgrip-release --no-align --layout trains --trains apps/site
