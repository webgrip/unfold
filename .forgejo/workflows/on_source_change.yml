name: '[Workflow] On Source Change'

on:
  push:
    branches: [development, main]
  workflow_dispatch:

concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: docker
    timeout-minutes: 40
    outputs:
      warnings: ${{ steps.verify.outputs.warnings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: verify
        uses: ./.forgejo/actions/verify

  warnings:
    needs: [checks]
    if: always() && needs.checks.result != 'skipped' && needs.checks.result != 'cancelled'
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Fail when setup or verification printed a warning
        env:
          REPORT: ${{ needs.checks.outputs.warnings }}
        run: |
          if [ -z "$REPORT" ]; then
            echo "No warnings in setup and verification output."
            exit 0
          fi
          echo "Setup or verification printed warnings. Fix them, or accept one with a reason in scripts/ci-warnings-allow.json:"
          printf '%s\n' "$REPORT"
          exit 1

  ploeg-pin:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: https://github.com/jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          install_args: uv
          cache: false
          github_token: ''
      - name: Unpack the pinned Ploeg contract bundle, verifying its digest
        run: mise exec -- uv run --no-project python scripts/ploeg-contract.py fetch
      - name: Require the pin to be a published Ploeg release whose bundle and Go module agree
        run: mise exec -- uv run --no-project python scripts/ploeg-contract.py check --published

  site-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.UNFOLD_RELEASES_ENABLED == 'true'
    needs: [checks]
    runs-on: docker
    container:
      image: harbor.webgrip.dev/webgrip/semantic-release:2.2.0@sha256:9dd1f016b42d841b3bbc00128833c7ca407dcce11d929422a21c973821879ab5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Semantic Release
        id: release
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/semantic-release-monorepo@v3.0.0
        with:
          package-path: apps/site
          package-name: unfold-site
          token: ${{ secrets.WEBGRIP_CI_TOKEN }}
