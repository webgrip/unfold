name: '[Workflow] On Source Change'

on:
  push:
    branches: [development, main]
  workflow_dispatch:

concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: docker
    timeout-minutes: 40
    outputs:
      warnings: ${{ steps.verify.outputs.warnings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: verify
        uses: ./.forgejo/actions/verify

  warnings:
    needs: [checks]
    if: always() && needs.checks.result != 'skipped' && needs.checks.result != 'cancelled'
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Fail when setup or verification printed a warning
        env:
          REPORT: ${{ needs.checks.outputs.warnings }}
        run: |
          if [ -z "$REPORT" ]; then
            echo "No warnings in setup and verification output."
            exit 0
          fi
          echo "Setup or verification printed warnings. Fix them, or accept one with a reason in scripts/ci-warnings-allow.json:"
          printf '%s\n' "$REPORT"
          exit 1

  ploeg-pin:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: https://github.com/jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.18
          install_args: uv
          cache: false
          github_token: ''
      - name: Unpack the pinned Ploeg contract bundle, verifying its digest
        run: mise exec -- uv run --no-project python scripts/ploeg-contract.py fetch
      - name: Require the pin to be a published Ploeg release whose bundle and Go module agree
        run: mise exec -- uv run --no-project python scripts/ploeg-contract.py check --published

  site-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.UNFOLD_RELEASES_ENABLED == 'true'
    needs: [checks]
    runs-on: docker
    container:
      image: harbor.webgrip.dev/webgrip/semantic-release-monorepo:0.3.6@sha256:58ce8639627ac522ceaee35b08803ec6846fd4fa138d4a3c3453a0afe75a0311
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Semantic Release
        id: release
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/semantic-release-monorepo@v2.8.2
        with:
          package-path: apps/site
          package-name: unfold-site
          token: ${{ secrets.WEBGRIP_CI_TOKEN }}
      - name: Create the release Forgejo lost to the tag race
        if: failure() && steps.release.outcome == 'failure'
        env:
          RELEASE_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          GITEA_TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
        run: node scripts/release-repair.mjs unfold-site-v
