name: '[Workflow] On DNS Change'

on:
  push:
    branches: [development]
    paths:
      - 'apps/site/ops/dns/**'
      - '.forgejo/workflows/on_dns_change.yml'
  schedule:
    - cron: '45 5 * * *'
  workflow_dispatch:

concurrency:
  group: dns-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dns-preview:
    uses: webgrip/workflows/.forgejo/workflows/dnscontrol.yml@v2.8.0
    enable-openid-connect: true
    with:
      enabled: ${{ github.event_name != 'schedule' }}
      mode: preview
      working-directory: apps/site/ops/dns
      openbao-role: ci-unfold
      openbao-kv-path: secret/data/cloudflare/dns/unfoldhq-dev-ro
  dns-drift:
    uses: webgrip/workflows/.forgejo/workflows/dnscontrol.yml@v2.8.0
    enable-openid-connect: true
    with:
      enabled: ${{ github.event_name == 'schedule' }}
      mode: drift
      working-directory: apps/site/ops/dns
      openbao-role: ci-unfold
      openbao-kv-path: secret/data/cloudflare/dns/unfoldhq-dev-ro
