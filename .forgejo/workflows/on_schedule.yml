name: '[Workflow] On Schedule'

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: schedule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-links:
    runs-on: docker
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: https://github.com/jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.6.14
          install: false
          cache: false
          github_token: ''
      - name: Report broken external links in current docs
        continue-on-error: true
        run: mise run docs-links-external

  release-notes:
    runs-on: docker
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Fetch imported release metadata
        run: git fetch origin '+refs/notes/*:refs/notes/*'
      - uses: https://github.com/jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.6.14
          install_args: uv
          cache: false
          github_token: ''
      - name: Fail when Forgejo no longer holds every imported release note
        env:
          GLIDE_REQUIRE_IMPORT_NOTES: 'true'
        run: mise exec -- uv run --frozen python scripts/verify-import.py
