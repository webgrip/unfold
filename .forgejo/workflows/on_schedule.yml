name: '[Workflow] On Schedule'

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: schedule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-links:
    runs-on: docker
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: https://github.com/jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.1
          install: false
          cache: false
          github_token: ''
      - name: Report broken external links in current docs
        continue-on-error: true
        run: mise run docs-links-external

  tutorial-smoke:
    runs-on: docker
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.forgejo/actions/tutorial-smoke

  release-notes:
    runs-on: docker
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch imported release metadata
        run: git fetch origin '+refs/notes/*:refs/notes/*'
      - uses: https://github.com/jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.1
          install_args: uv
          cache: false
          github_token: ''
      - name: Fail when Forgejo no longer holds every imported release note
        env:
          UNFOLD_REQUIRE_IMPORT_NOTES: 'true'
        run: mise exec -- uv run --frozen python scripts/verify-import.py
