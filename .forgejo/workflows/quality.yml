name: Quality

on:
  push:
    branches: [development]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
      - run: npm run design:check
      - run: npm run backlog -- check
      - run: npm ci --prefix extensions/vscode
      - run: npm run extension:build
      - run: npm run extension:test
      - run: npm run extension:package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm --prefix extensions/vscode run test:webview
      - name: Lint and render Helm chart
        shell: bash
        run: |
          set -euo pipefail
          helm_dir="${RUNNER_TEMP:-/tmp}/de-vloer-helm"
          mkdir -p "$helm_dir"
          curl --fail --silent --show-error --location --retry 3 https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz -o "$helm_dir/helm.tar.gz"
          curl --fail --silent --show-error --location --retry 3 https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz.sha256sum -o "$helm_dir/upstream.sha256"
          digest=$(cut -d ' ' -f 1 "$helm_dir/upstream.sha256")
          printf '%s  %s\n' "$digest" "$helm_dir/helm.tar.gz" | sha256sum --check
          tar -xzf "$helm_dir/helm.tar.gz" -C "$helm_dir"
          "$helm_dir/linux-amd64/helm" lint ops/helm/de-vloer
          "$helm_dir/linux-amd64/helm" template de-vloer ops/helm/de-vloer > "$helm_dir/rendered.yaml"
          "$helm_dir/linux-amd64/helm" lint ops/helm/de-vloer -f ops/helm/de-vloer/values.live.example.yaml
          "$helm_dir/linux-amd64/helm" template de-vloer ops/helm/de-vloer --namespace de-vloer -f ops/helm/de-vloer/values.live.example.yaml > "$helm_dir/rendered-live.yaml"
