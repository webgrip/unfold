name: '[Workflow] On Release Train'

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: release-train
  cancel-in-progress: false

jobs:
  merge-pin:
    if: github.ref_name == 'development' && vars.UNFOLD_RELEASES_ENABLED == 'true'
    runs-on: docker
    timeout-minutes: 5
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - name: Merge the newest green Ploeg pin pull request and close the ones it supersedes
        id: merge
        env:
          FORGEJO_REPOSITORY_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          REPOSITORY: ${{ github.repository }}
          PIN_BASE: development
          PIN_AUTHOR: ploeg-release
          WEBGRIP_CI_TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
        run: python3 scripts/release_train_pin.py

  pending:
    needs: [merge-pin]
    if: always() && needs.merge-pin.result != 'cancelled' && github.ref_name == 'development' && vars.UNFOLD_RELEASES_ENABLED == 'true'
    runs-on: docker
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pending.outputs.sha }}
      unreleased: ${{ steps.pending.outputs.unreleased }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Find the development head and whether it holds unreleased application commits
        id: pending
        run: sh scripts/release-train.sh pending

  checks:
    needs: [pending]
    if: needs.pending.outputs.unreleased == 'true'
    runs-on: docker
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pending.outputs.sha }}
          fetch-depth: 0
      - id: verify
        uses: ./.forgejo/actions/verify

  ploeg-pin:
    needs: [pending]
    if: needs.pending.outputs.unreleased == 'true'
    runs-on: docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pending.outputs.sha }}
      - uses: https://github.com/jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.18
          install_args: uv
          cache: false
          github_token: ''
      - name: Unpack the pinned Ploeg contract bundle, verifying its digest
        run: mise exec -- uv run --no-project python scripts/ploeg-contract.py fetch
      - name: Require the pin to be a published Ploeg release whose bundle and Go module agree
        run: mise exec -- uv run --no-project python scripts/ploeg-contract.py check --published

  release:
    if: github.ref_name == 'development' && vars.UNFOLD_RELEASES_ENABLED == 'true'
    needs: [pending, checks, ploeg-pin]
    runs-on: docker
    container:
      image: harbor.webgrip.dev/webgrip/semantic-release-monorepo:0.3.6@sha256:58ce8639627ac522ceaee35b08803ec6846fd4fa138d4a3c3453a0afe75a0311
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: ./.forgejo/actions/release-policy
      - name: Release only the commit the checks passed
        id: head
        env:
          CHECKED: ${{ needs.pending.outputs.sha }}
        run: sh scripts/release-train.sh current "$CHECKED"
      - name: Semantic Release
        id: release
        if: steps.head.outputs.current == 'true'
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/semantic-release-monorepo@v2.8.3
        with:
          package-path: apps
          package-name: unfold
          token: ${{ secrets.WEBGRIP_CI_TOKEN }}
      - name: Create the release Forgejo lost to the tag race
        if: failure() && steps.release.outcome == 'failure'
        env:
          RELEASE_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          GITEA_TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
        run: node scripts/release-repair.mjs unfold-v

  site-release:
    if: github.ref_name == 'development' && vars.UNFOLD_RELEASES_ENABLED == 'true'
    needs: [pending, release]
    runs-on: docker
    container:
      image: harbor.webgrip.dev/webgrip/semantic-release-monorepo:0.3.6@sha256:58ce8639627ac522ceaee35b08803ec6846fd4fa138d4a3c3453a0afe75a0311
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Release only the commit the checks passed
        id: head
        env:
          CHECKED: ${{ needs.pending.outputs.sha }}
        run: sh scripts/release-train.sh current "$CHECKED"
      - name: Semantic Release
        id: release
        if: steps.head.outputs.current == 'true'
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/semantic-release-monorepo@v2.8.3
        with:
          package-path: apps/site
          package-name: unfold-site
          token: ${{ secrets.WEBGRIP_CI_TOKEN }}
      - name: Create the release Forgejo lost to the tag race
        if: failure() && steps.release.outcome == 'failure'
        env:
          RELEASE_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          GITEA_TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
        run: node scripts/release-repair.mjs unfold-site-v
