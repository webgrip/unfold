name: '[Workflow] On Release Train'

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: release-train
  cancel-in-progress: false

jobs:
  merge-pin:
    if: github.ref_name == 'development' && vars.UNFOLD_RELEASES_ENABLED == 'true'
    runs-on: docker
    timeout-minutes: 5
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - name: Merge the newest green Ploeg pin pull request and close the ones it supersedes
        id: merge
        env:
          FORGEJO_REPOSITORY_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          REPOSITORY: ${{ github.repository }}
          PIN_BASE: development
          PIN_AUTHOR: ploeg-release
          PIN_MERGE_TOKEN: ${{ secrets.PLOEG_RELEASE_TOKEN }}
        run: python3 scripts/release_train_pin.py

  pending:
    needs: [merge-pin]
    if: always() && needs.merge-pin.result != 'cancelled' && github.ref_name == 'development' && vars.UNFOLD_RELEASES_ENABLED == 'true'
    runs-on: docker
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pending.outputs.sha }}
      unreleased: ${{ steps.pending.outputs.unreleased }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Find the development head and whether it holds unreleased application commits
        id: pending
        run: sh scripts/release-train.sh pending

  checks:
    needs: [pending]
    if: needs.pending.outputs.unreleased == 'true'
    runs-on: docker
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pending.outputs.sha }}
          fetch-depth: 0
      - id: verify
        uses: ./.forgejo/actions/verify

  ploeg-pin:
    needs: [pending]
    if: needs.pending.outputs.unreleased == 'true'
    runs-on: docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pending.outputs.sha }}
      - uses: https://github.com/jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.22
          install_args: uv
          cache: false
          github_token: ''
      - name: Unpack the pinned Ploeg contract bundle, verifying its digest
        run: mise exec uv -- uv run --no-project python scripts/ploeg-contract.py fetch
      - name: Require the pin to be a published Ploeg release whose bundle and Go module agree
        run: mise exec uv -- uv run --no-project python scripts/ploeg-contract.py check --published

  release:
    if: github.ref_name == 'development' && vars.UNFOLD_RELEASES_ENABLED == 'true'
    needs: [pending, checks, ploeg-pin]
    runs-on: docker
    container:
      image: harbor.webgrip.dev/webgrip/semantic-release:2.3.0@sha256:c9a328024c0070438b0ec08bbd3419896c728ce2c5b1f323fc9dae8bc46a2e71
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: ./.forgejo/actions/release-policy
      - name: Release only the commit the checks passed
        id: head
        env:
          CHECKED: ${{ needs.pending.outputs.sha }}
        run: sh scripts/release-train.sh current "$CHECKED"
      - name: Semantic Release
        id: release
        if: steps.head.outputs.current == 'true'
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/semantic-release-monorepo@v3.3.0
        with:
          package-path: apps
          package-name: unfold
          token: ${{ secrets.WEBGRIP_CI_TOKEN }}

  site-release:
    if: github.ref_name == 'development' && vars.UNFOLD_RELEASES_ENABLED == 'true'
    needs: [pending, release]
    runs-on: docker
    container:
      image: harbor.webgrip.dev/webgrip/semantic-release:2.3.0@sha256:c9a328024c0070438b0ec08bbd3419896c728ce2c5b1f323fc9dae8bc46a2e71
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Release only the commit the checks passed
        id: head
        env:
          CHECKED: ${{ needs.pending.outputs.sha }}
        run: sh scripts/release-train.sh current "$CHECKED"
      - name: Semantic Release
        id: release
        if: steps.head.outputs.current == 'true'
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/semantic-release-monorepo@v3.3.0
        with:
          package-path: apps/site
          package-name: unfold-site
          token: ${{ secrets.WEBGRIP_CI_TOKEN }}
