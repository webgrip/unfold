name: '[Workflow] On Docs Change'

on:
  push:
    branches: [development]
    paths:
      - 'docs/**'
      - 'apps/*/docs/**'
      - '**/README.md'
      - '**/AGENTS.md'
      - 'llms.txt'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'mise.toml'
      - 'scripts/docs.py'
      - 'scripts/generate-domain.py'
      - 'scripts/validate_adr_consistency.py'
      - '.forgejo/workflows/on_docs_change.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-documentation:
    runs-on: docker
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: https://github.com/jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.6.14
          cache: false
          github_token: ''
      - name: Validate generated pages, links and strict TechDocs output
        run: mise run docs-check
