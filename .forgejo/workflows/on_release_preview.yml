name: '[Workflow] On Release Preview'

on:
  workflow_dispatch:

concurrency:
  group: unfold-release-preview
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/development'
    runs-on: docker
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release authority and publishing identities
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          WEBGRIP_CI_TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
          HARBOR_ROBOT_USER: ${{ secrets.HARBOR_ROBOT_USER }}
          HARBOR_ROBOT_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: python3 scripts/release_preflight.py

  preview:
    if: github.ref == 'refs/heads/development'
    runs-on: docker
    timeout-minutes: 15
    container:
      image: harbor.webgrip.dev/webgrip/semantic-release-monorepo:0.3.3@sha256:2f3f20de1f155cf1d4297cf2daecf33e2ec6b212bb7c58c91f42104ffdea61cb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch release channels
        run: git fetch origin '+refs/notes/*:refs/notes/*'
      - name: Record candidate revision
        run: git rev-parse HEAD
      - name: Preview version and release notes
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/semantic-release-monorepo@v2.7.5
        with:
          package-path: apps
          package-name: unfold
          token: ${{ secrets.WEBGRIP_CI_TOKEN }}
          dry-run: 'true'
