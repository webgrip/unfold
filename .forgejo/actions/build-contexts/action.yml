name: Build the container contexts
description: Build both Unfold images to the build cache only
runs:
  using: composite
  steps:
    - name: Container build contexts
      shell: bash
      run: |
        set -euo pipefail
        build() {
          local output
          output=$(mktemp)
          for attempt in 1 2; do
            if docker build --progress=plain --build-arg REGISTRY_DHI=harbor.webgrip.dev/dhi --output=type=cacheonly "$@" 2>&1 | tee "$output"; then return 0; fi
            if [ "$attempt" = 2 ] || ! grep -q 'frontend grpc server closed unexpectedly' "$output"; then return 1; fi
            echo "The shared Docker daemon dropped the Dockerfile frontend; building $* once more."
          done
        }
        build --file apps/unfold/Dockerfile --target app apps/unfold &
        app=$!
        build --file apps/unfold/ops/agent/Dockerfile apps/unfold/ops/agent
        wait "$app"
