name: Verify both applications and their build contexts
description: Verify both applications and their build contexts
runs:
  using: composite
  steps:
    - name: Fetch imported release metadata
      shell: bash
      run: git fetch origin '+refs/notes/*:refs/notes/*'
    - uses: https://github.com/jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        version: 2026.6.14
        cache: false
        github_token: ''
    - run: mise trust apps/vloer/mise.toml && mise trust apps/ploeg/mise.toml
      shell: bash
    - run: mise -C apps/vloer install
      shell: bash
    - run: mise -C apps/ploeg install
      shell: bash
    - name: Locate dependency caches
      id: caches
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "gomod=$(mise -C apps/ploeg exec -- go env GOMODCACHE)"
          echo "gobuild=$(mise -C apps/ploeg exec -- go env GOCACHE)"
          echo "go=$(mise -C apps/ploeg exec -- go env GOVERSION)"
          echo "npm=$(mise -C apps/vloer exec -- npm config get cache)"
        } >> "$GITHUB_OUTPUT"
    - name: Restore Go module and build caches
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ${{ steps.caches.outputs.gomod }}
          ${{ steps.caches.outputs.gobuild }}
        key: glide-go-${{ runner.os }}-${{ steps.caches.outputs.go }}-${{ hashFiles('apps/ploeg/go.sum') }}
        restore-keys: glide-go-${{ runner.os }}-${{ steps.caches.outputs.go }}-
    - name: Restore npm download cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.caches.outputs.npm }}
        key: glide-npm-${{ runner.os }}-${{ hashFiles('apps/vloer/package-lock.json', 'apps/vloer/extensions/vscode/package-lock.json') }}
        restore-keys: glide-npm-${{ runner.os }}-
    - run: mise run setup
      shell: bash
    - run: mise run verify
      shell: bash
      env:
        GLIDE_REQUIRE_IMPORT_NOTES: 'true'
        GOFLAGS: -count=1
    - name: Container build contexts
      shell: bash
      run: |
        set -euo pipefail
        docker build --file apps/vloer/Dockerfile --target app --build-arg REGISTRY_DHI=harbor.webgrip.dev/dhi --output=type=cacheonly apps/vloer
        docker build --file apps/vloer/ops/agent/Dockerfile --build-arg REGISTRY_DHI=harbor.webgrip.dev/dhi --output=type=cacheonly apps/vloer/ops/agent
        docker build --file apps/ploeg/ops/docker/ploegd/Dockerfile --output=type=cacheonly apps/ploeg
