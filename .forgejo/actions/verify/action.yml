name: Verify both applications and their build contexts
description: Verify both applications and their build contexts
runs:
  using: composite
  steps:
    - name: Fetch imported release metadata
      shell: bash
      run: git fetch origin '+refs/notes/*:refs/notes/*'
    - name: Restore mise tool installs
      id: mise-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/mise/installs
        key: glide-mise-${{ runner.os }}-${{ hashFiles('mise.toml', 'mise.lock', 'apps/vloer/mise.toml', 'apps/vloer/mise.lock', 'apps/ploeg/mise.toml', 'apps/ploeg/mise.lock', 'apps/site/mise.toml') }}
        restore-keys: glide-mise-${{ runner.os }}-
    - uses: https://github.com/jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: 2026.9.15
        cache: false
        github_token: ''
    - run: mise trust apps/vloer/mise.toml && mise trust apps/ploeg/mise.toml && mise trust apps/site/mise.toml
      shell: bash
    - run: mise -C apps/vloer install
      shell: bash
    - run: mise -C apps/ploeg install
      shell: bash
    - run: mise -C apps/site install
      shell: bash
    - name: Save mise tool installs
      if: steps.mise-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/mise/installs
        key: ${{ steps.mise-cache.outputs.cache-primary-key }}
    - name: Locate dependency caches
      id: caches
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "gomod=$(mise -C apps/ploeg exec -- go env GOMODCACHE)"
          echo "gobuild=$(mise -C apps/ploeg exec -- go env GOCACHE)"
          echo "go=$(mise -C apps/ploeg exec -- go env GOVERSION)"
          echo "npm=$(mise -C apps/vloer exec -- npm config get cache)"
          echo "pnpm=$(mise -C apps/site exec -- corepack pnpm store path)"
        } >> "$GITHUB_OUTPUT"
    - name: Restore Go module and build caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.caches.outputs.gomod }}
          ${{ steps.caches.outputs.gobuild }}
        key: glide-go-${{ runner.os }}-${{ steps.caches.outputs.go }}-${{ hashFiles('apps/ploeg/go.sum') }}-${{ hashFiles('apps/ploeg/**/*.go') }}
        restore-keys: |
          glide-go-${{ runner.os }}-${{ steps.caches.outputs.go }}-${{ hashFiles('apps/ploeg/go.sum') }}-
          glide-go-${{ runner.os }}-${{ steps.caches.outputs.go }}-
          glide-go-${{ runner.os }}-
    - name: Restore npm download cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.caches.outputs.npm }}
        key: glide-npm-${{ runner.os }}-${{ hashFiles('apps/vloer/package-lock.json', 'apps/vloer/extensions/vscode/package-lock.json') }}
        restore-keys: glide-npm-${{ runner.os }}-
    - name: Restore pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.caches.outputs.pnpm }}
        key: glide-pnpm-${{ runner.os }}-${{ hashFiles('apps/site/pnpm-lock.yaml') }}
        restore-keys: glide-pnpm-${{ runner.os }}-
    - name: Restore verified gate results
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/glide-verify
        key: glide-verify-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: glide-verify-${{ runner.os }}-
    - run: mise run setup
      shell: bash
    - run: mise run verify
      shell: bash
      env:
        GLIDE_REQUIRE_IMPORT_NOTES: 'true'
        GOFLAGS: -count=1
        VLOER_TEST_TIMEOUT_SCALE: '2'
        GLIDE_VERIFY_RESULTS: ~/.cache/glide-verify
        GLIDE_VERIFY_REUSE: ${{ github.event_name == 'pull_request' }}
        GLIDE_VERIFY_CPUS: '4'
    - name: Container build contexts
      shell: bash
      run: |
        set -euo pipefail
        docker build --file apps/vloer/Dockerfile --target app --build-arg REGISTRY_DHI=harbor.webgrip.dev/dhi --output=type=cacheonly apps/vloer
        docker build --file apps/vloer/ops/agent/Dockerfile --build-arg REGISTRY_DHI=harbor.webgrip.dev/dhi --output=type=cacheonly apps/vloer/ops/agent
        docker build --file apps/ploeg/ops/docker/ploegd/Dockerfile --output=type=cacheonly apps/ploeg
