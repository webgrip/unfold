name: Verify both applications and their build contexts
description: Verify both applications and their build contexts
outputs:
  warnings:
    description: Tool warnings in the setup and verification output that scripts/ci-warnings-allow.json does not accept; empty when there are none
    value: ${{ steps.warnings.outputs.report }}
runs:
  using: composite
  steps:
    - name: Fetch imported release metadata
      shell: bash
      run: git fetch origin '+refs/notes/*:refs/notes/*'
    - name: Restore mise tool installs
      id: mise-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/mise/installs
        key: unfold-mise-${{ runner.os }}-${{ hashFiles('mise.toml', 'mise.lock', 'apps/unfold/mise.toml', 'apps/unfold/mise.lock', 'apps/ploeg/mise.toml', 'apps/ploeg/mise.lock', 'apps/site/mise.toml') }}
        restore-keys: unfold-mise-${{ runner.os }}-
    - uses: https://github.com/jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      with:
        version: 2026.9.18
        cache: false
        github_token: ''
    - run: mise trust apps/unfold/mise.toml && mise trust apps/ploeg/mise.toml && mise trust apps/site/mise.toml
      shell: bash
    - name: Prepare the output capture
      shell: bash
      run: mkdir -p "${RUNNER_TEMP:-/tmp}/unfold-output"
    - run: set -o pipefail; mise -C apps/unfold install 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/unfold-output/install.log"
      shell: bash
    - run: set -o pipefail; mise -C apps/ploeg install 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/unfold-output/install.log"
      shell: bash
    - run: set -o pipefail; mise -C apps/site install 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/unfold-output/install.log"
      shell: bash
    - name: Save mise tool installs
      if: steps.mise-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/mise/installs
        key: ${{ steps.mise-cache.outputs.cache-primary-key }}
    - name: Locate dependency caches
      id: caches
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "gomod=$(mise -C apps/ploeg exec -- go env GOMODCACHE)"
          echo "gobuild=$(mise -C apps/ploeg exec -- go env GOCACHE)"
          echo "go=$(mise -C apps/ploeg exec -- go env GOVERSION)"
          echo "npm=$(mise -C apps/unfold exec -- npm config get cache)"
          echo "pnpm=$(mise -C apps/site exec -- corepack pnpm store path)"
        } >> "$GITHUB_OUTPUT"
    - name: Restore Go module and build caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.caches.outputs.gomod }}
          ${{ steps.caches.outputs.gobuild }}
        key: unfold-go-${{ runner.os }}-${{ steps.caches.outputs.go }}-${{ hashFiles('apps/ploeg/go.sum') }}-${{ hashFiles('apps/ploeg/**/*.go') }}
        restore-keys: |
          unfold-go-${{ runner.os }}-${{ steps.caches.outputs.go }}-${{ hashFiles('apps/ploeg/go.sum') }}-
          unfold-go-${{ runner.os }}-${{ steps.caches.outputs.go }}-
          unfold-go-${{ runner.os }}-
    - name: Restore npm download cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.caches.outputs.npm }}
        key: unfold-npm-${{ runner.os }}-${{ hashFiles('apps/unfold/package-lock.json', 'apps/unfold/extensions/vscode/package-lock.json') }}
        restore-keys: unfold-npm-${{ runner.os }}-
    - name: Restore pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.caches.outputs.pnpm }}
        key: unfold-pnpm-${{ runner.os }}-${{ hashFiles('apps/site/pnpm-lock.yaml') }}
        restore-keys: unfold-pnpm-${{ runner.os }}-
    - name: Restore verified gate results
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/unfold-verify
        key: unfold-verify-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: unfold-verify-${{ runner.os }}-
    - run: set -o pipefail; mise run setup 2>&1 | tee "${RUNNER_TEMP:-/tmp}/unfold-output/setup.log"
      shell: bash
    - run: set -o pipefail; mise run verify 2>&1 | tee "${RUNNER_TEMP:-/tmp}/unfold-output/verify.log"
      shell: bash
      env:
        UNFOLD_REQUIRE_IMPORT_NOTES: 'true'
        GOFLAGS: -count=1
        UNFOLD_TEST_TIMEOUT_SCALE: '2'
        UNFOLD_VERIFY_RESULTS: ~/.cache/unfold-verify
        UNFOLD_VERIFY_REUSE: ${{ github.event_name == 'pull_request' }}
        UNFOLD_VERIFY_CPUS: '4'
    - name: Container build contexts
      shell: bash
      run: |
        set -euo pipefail
        docker build --file apps/unfold/Dockerfile --target app --build-arg REGISTRY_DHI=harbor.webgrip.dev/dhi --output=type=cacheonly apps/unfold
        docker build --file apps/unfold/ops/agent/Dockerfile --build-arg REGISTRY_DHI=harbor.webgrip.dev/dhi --output=type=cacheonly apps/unfold/ops/agent
    - name: Collect warnings
      id: warnings
      if: always()
      shell: bash
      run: node scripts/ci-warnings.mjs "${RUNNER_TEMP:-/tmp}/unfold-output"
