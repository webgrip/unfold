site_name: Glide
site_description: Units of work become review-ready pull requests written by AI agents
site_url: https://docs.webgrip.dev/glide/
repo_url: https://forgejo.webgrip.dev/webgrip/glide
edit_uri: ''
docs_dir: .build/docs
site_dir: .build/site
plugins:
  - techdocs-core:
      use_material_search: true
nav:
  - Start here: index.md
  - Try it:
      - Both applications (demo): workflows/local-demo.md
      - Vloer alone (demo): vloer/operations/demo.md
  - Understand:
      - How work flows: concepts/how-work-flows.md
      - Architecture: concepts/architecture.md
  - How-to:
      - Assign work to an agent: how-to/assign-work-to-an-agent.md
      - Review an agent pull request: how-to/review-an-agent-pr.md
      - Prepare a repository: how-to/prepare-a-repository.md
      - Operate Ploeg:
          - Overview: ploeg/index.md
          - Runbooks: ploeg/how-to/index.md
          - Recover a stuck Lease or Run: ploeg/how-to/recover-a-stuck-lease-or-run.md
          - Rotate credentials: ploeg/how-to/rotate-credentials.md
          - Drain workers: ploeg/how-to/drain-workers.md
          - Investigate a Run's spend: ploeg/how-to/investigate-a-runs-spend.md
          - Restore after a database outage: ploeg/how-to/restore-after-a-database-outage.md
      - Operate Vloer: vloer/index.md
      - Set up shared execution: workflows/managed-execution.md
      - Release and live test: operations/first-cutover.md
  - Reference:
      - Glossary: reference/glossary.md
      - Decisions: reference/decisions.md
      - Product language: domain/overview.md
      - Open questions: landscape/questions.md
  - Contribute:
      - Documentation policy: documentation.md
      - Documentation publishing: operations/docs-publishing.md
      - CI and releases: operations/ci.md
      - Source and artifacts: operations/artifacts.md
      - Migration: migration.md
      - System decisions: adr/index.md

validation:
  links:
    anchors: warn
    not_found: warn
    unrecognized_links: warn
