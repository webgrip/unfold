      - HTTP API: contracts/api.md
      - Ploeg execution: contracts/ploeg-execution.md
      - Tracker binding: contracts/ploeg-tracker-binding.md
      - Candidate delivery: contracts/candidate-delivery.md
      - Product language: domain/overview.md
  - Understand:
      - Architecture: architecture.md
      - System landscape: landscape/index.md
      - Diagrams: landscape/c4.md
      - Open choices: landscape/questions.md
      - Monorepo proposal: monorepo-transition.md
  - Evidence and maintenance:
      - Validation: validation.md
      - Decisions: adrs/README.md
      - Design baseline: PRODUCT-DESIGN.md
      - Documentation policy: documentation.md
      - Audit: research/2026-09-12-documentation-audit.md
exclude_docs: |
  /landscape/explorer.template.html
