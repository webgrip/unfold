mode: live
baseUrl: https://workbench.example
image:
  repository: harbor.webgrip.dev/webgrip/de-vloer
  tag: ""
credentialsSecret: de-vloer-credentials
workspaceNamespace: de-vloer-workspaces
workspaceImage: ""
workspaceGitSecretName: repository-readonly
workspaceEgress:
  - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ai
        podSelector:
          matchLabels:
            app.kubernetes.io/name: litellm
    ports:
      - protocol: TCP
        port: 4000
  - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: forge
        podSelector:
          matchLabels:
            app.kubernetes.io/name: forgejo
    ports:
      - protocol: TCP
        port: 3000
config:
  models:
    - id: coding
      name: Configured coding model
      providerId: gateway
      modelId: replace-with-your-litellm-model-alias
  repositories:
    - id: application
      name: Application
      description: Operator-approved repository
      url: https://forge.example/organization/application.git
      baseBranch: main
      verify: [node, --test]
