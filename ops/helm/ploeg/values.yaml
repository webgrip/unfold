image:
  repository: harbor.webgrip.dev/webgrip/ploegd
  tag: "" # empty = .Chart.AppVersion (kept in lockstep with the chart by the release train)
imagePullSecrets: [] # homelab sets [{name: harbor-pull}]

service:
  port: 8080

# Plain PLOEG_* env rendered onto the deployment.
env:
  PLOEG_DEFAULT_TEAM: default
  PLOEG_TEAM_MAP: ""
  PLOEG_LEASE_TTL: 15m
  PLOEG_SWEEP_INTERVAL: 15s

database:
  # CNPG auto-creates <cluster>-app with a `uri` key; ploegd consumes it whole.
  existingSecret:
    name: ploeg-db-app
    key: uri

webhook:
  existingSecret:
    name: ploeg-webhook-secret
    key: PLOEG_VIKUNJA_SECRET

# Guaranteed QoS: ploegd runs the sweeper — the self-heal backbone (lease
# expiry, requeue, key revocation). It must survive the node pressure that
# kills everything else, and only requests==limits keeps it out of the
# burstable cgroup tree the Talos OOMController sweeps (ADR-0049).
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 100m
    memory: 256Mi

nodeSelector:
  node.webgrip.io/pool: worker

executor:
  # The KEDA ScaledJob executor (design §6). Disabled until the ingest path is
  # verified in-cluster; flipping it on requires the LiteLLM + agent-builder
  # secrets and the privileged-DinD PolicyException in the namespace.
  enabled: false
  # agent-runner >=1.0.1 only: 1.0.0 mints LiteLLM keys without key_alias (400).
  runnerImage: harbor.webgrip.dev/webgrip/agent-runner:1.0.1
  dindImage: harbor.webgrip.dev/dockerhub/library/docker:29.6.2-dind
  workerImage: "" # empty = image.repository:tag (carries /usr/local/bin/ploeg-worker)
  apiUrl: ""      # empty = http://<fullname>:<service.port>
  litellm:
    baseUrl: http://litellm.ai.svc.cluster.local:4000/v1
    adminUrl: http://litellm.ai.svc.cluster.local:4000
    masterKeySecret:
      name: agent-litellm-master
      key: LITELLM_MASTER_KEY
    keyDuration: 4h
  forgejo:
    url: http://forgejo-http.forgejo.svc.cluster.local:3000
    tokenSecret:
      name: agent-builder-token
      key: FORGEJO_TOKEN
  scaler:
    # Empty = ploeg-db-rw.<release namespace>.svc.cluster.local. Must be a
    # name the KEDA operator can resolve from its own namespace (FQDN).
    host: ""
    port: "5432"
    dbName: app
    sslmode: require
    userName: ploeg_scaler
    passwordSecret:
      name: ploeg-scaler
      key: password
  pollingInterval: 30
  # Backstop only: the DB lease always expires first, so Ploeg decides
  # requeue/stale; this just guarantees the pod dies (backlog #52).
  activeDeadlineSeconds: 7200
  # Guaranteed QoS (requests == limits on EVERY container): factory pods leave
  # the /kubepods/burstable/ cgroup tree, which Talos's OOMController SIGKILLs
  # wholesale under PSI memory pressure (killed runs 9+10 on 2026-07-25;
  # ADR-0049 P1, VIK-595 S1). Under scarcity the scheduler now queues runs
  # honestly (Pending holds no lease, burns no attempt, spends no money)
  # instead of starting them into a death zone. Sized from run 8's measured
  # peaks (worker 438Mi, dind 108Mi) with headroom for gate builds inside
  # dind; a build exceeding dind's limit fails THAT build visibly, never the
  # pod. Changing any of these away from requests==limits silently re-enters
  # the burstable tree — don't.
  workerBinResources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 50m, memory: 64Mi}
  workerResources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: 500m, memory: 1Gi}
  dindResources:
    requests: {cpu: "1", memory: 1536Mi}
    limits: {cpu: "1", memory: 1536Mi}
  teams: []
  # - name: bronze
  #   model: litellm_proxy/deepseek-chat
  #   budget: "2"
  #   repoOwner: webgrip
  #   repoName: some-repo
  #   # Branch the worker clones, branches from, and opens the PR against.
  #   # Unset = the repo's default branch (which may be a stale stub — pin
  #   # this to the repo's actual trunk; VIK-589).
  #   baseBranch: main
  #   maxReplicaCount: 1
