# CI-only values: the GitLab forge, rendered on every change.
#
# It exists as its own golden because selecting a forge changes the WORKER POD,
# and the worker pod is the security boundary the goldens are here to police: a
# different credential Secret, a different API the agent is told to call. A
# review that cannot see those two lines change cannot review them.
#
# `forgejo: null` is the point of the fixture, not an accident. Emptying the
# block you are not using is the documented way to keep a chart default from
# demanding a Secret the cluster has no reason to hold — and before
# ploeg.forge existed it was also a nil pointer, because the worker template
# dereferenced .Values.executor.forgejo.url whether or not forgejo was in play.
# Rendering with it null is what stops that from coming back.
executor:
  enabled: true
  forge: gitlab
  forgejo: null
  gitlab:
    url: https://gitlab.com
    tokenSecret:
      name: agent-builder-token
      key: GITLAB_TOKEN
    # Tier 1 configured, so the reader/writer credential split renders here as
    # it does in the forgejo fixture.
    readTokenSecret:
      name: agent-reader-token
      key: GITLAB_TOKEN
    webhookSecret:
      name: ploeg-gitlab-webhook
      key: PLOEG_GITLAB_SECRET
  teams:
    # A team with no repository: on GitLab the target is a SUBGROUP path
    # resolved from the work item (R11), which is the case that broke naive
    # owner/name splitting. Nothing here pins one, deliberately.
    - name: silver
      model: litellm_proxy/claude-sonnet-5
      budget: "6"
      maxReplicaCount: 1
      harness:
        name: claude-code
        dind: false
      plan:
        - roles:
            - {name: analyst, writes: false, cap: "0.50", harness: {dind: false}}
        - roles:
            - {name: builder, writes: true, cap: "3.00"}
        - roles:
            - {name: reviewer, writes: false, cap: "0.75", harness: {dind: false}}
