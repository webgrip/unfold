# Source: ploeg/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ploeg
  labels:
    app.kubernetes.io/name: ploeg
    app.kubernetes.io/instance: ploeg
    app.kubernetes.io/version: "0.2.0-rc.8"
    helm.sh/chart: ploeg-0.2.0-rc.8
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ploeg
      app.kubernetes.io/instance: ploeg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ploeg
        app.kubernetes.io/instance: ploeg
    spec:
      serviceAccountName: ploeg
      automountServiceAccountToken: false
      nodeSelector:
        node.webgrip.io/pool: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ploegd
          image: harbor.webgrip.dev/webgrip/ploegd:0.2.0-rc.8
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PLOEG_LISTEN
              value: ":8080"
            - name: PLOEG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ploeg-db-app
                  key: uri
            - name: PLOEG_VIKUNJA_SECRET
              valueFrom:
                secretKeyRef:
                  name: ploeg-webhook-secret
                  key: PLOEG_VIKUNJA_SECRET
            - name: PLOEG_DEFAULT_TEAM
              value: "default"
            - name: PLOEG_LEASE_TTL
              value: "15m"
            - name: PLOEG_SWEEP_INTERVAL
              value: "15s"
            - name: PLOEG_TEAM_MAP
              value: ""
            - name: LITELLM_ADMIN_URL
              value: "http://litellm.ai.svc.cluster.local:4000"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-litellm-master
                  key: LITELLM_MASTER_KEY
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 256Mi

---
# Source: ploeg/templates/cronjob.yaml
# The KEDA-free executor (docs/contracts/executor.md): a plain CronJob per
# (team, Role) polls by spawning a worker on a schedule. Empty-handed claim =
# exit 0 (backlog #49) makes idle ticks free; retries stay DB-side (lease
# expiry), so concurrencyPolicy/backoffLimit mirror the ScaledJob semantics.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ploeg-worker-bronze
  labels:
    app.kubernetes.io/name: ploeg
    app.kubernetes.io/instance: ploeg
    app.kubernetes.io/version: "0.2.0-rc.8"
    helm.sh/chart: ploeg-0.2.0-rc.8
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "*/2 * * * *"
  # One run at a time per workload; the Lease (writers) and the Run's own
  # deadline (readers) are the real locks.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      parallelism: 1
      completions: 1
      backoffLimit: 0 # ploeg owns retries; every pod is one auditable run (backlog #51)
      activeDeadlineSeconds: 7200
      template:
        
        
        metadata:
          labels:
            app.kubernetes.io/name: ploeg-worker
            ploeg.webgrip.dev/team: bronze
            # Names the HAZARD, not the workload: this pod carries a privileged
            # docker:dind sidecar, and the ploeg-worker PolicyException is keyed on
            # exactly this label. A pod without dind never carries it and is held to
            # the full baseline — so adding a Role costs no security-repo change, and
            # readers are not waived for a privilege they do not take.
            ploeg.webgrip.dev/privileged-dind: "true"
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            node.webgrip.io/pool: worker # never control-plane (ADR-0002: DinD beside etcd)
          securityContext:
            fsGroup: 1000
          initContainers:
            # Extracts ploeg-worker from the distroless ploegd image via
            # self-copy (no shell in distroless).
            - name: worker-bin
              image: harbor.webgrip.dev/webgrip/ploegd:0.2.0-rc.8
              command: ["/usr/local/bin/ploeg-worker", "install", "/mnt/bin/ploeg-worker"]
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: worker-bin
                  mountPath: /mnt/bin
              resources:
                limits:
                  cpu: 50m
                  memory: 64Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
            # DinD sidecar: the harness sandbox and the repo quality gates need a
            # Docker daemon. Requires the ploeg-worker PolicyException. Teams whose
            # harness needs no Docker set harness.dind: false.
            - name: dind
              image: harbor.webgrip.dev/dockerhub/library/docker:29.6.2-dind
              restartPolicy: Always
              securityContext:
                privileged: true
              env:
                - name: DOCKER_TLS_CERTDIR
                  value: /certs
              startupProbe:
                tcpSocket:
                  port: 2376
                periodSeconds: 2
                failureThreshold: 60
                timeoutSeconds: 5
              volumeMounts:
                - name: docker-certs
                  mountPath: /certs
                - name: docker-storage
                  mountPath: /var/lib/docker
                - name: ci-shared
                  mountPath: /mnt/ci-shared
              resources:
                limits:
                  cpu: "1"
                  memory: 1536Mi
                requests:
                  cpu: "1"
                  memory: 1536Mi
          containers:
            - name: worker
              image: harbor.webgrip.dev/webgrip/agent-runner:1.0.2@sha256:086b4bc0d3fda0e3c179f9501bb46a612f5f33e60d96405a5d94471a26279596
              command: ["/mnt/bin/ploeg-worker"]
              env:
                - name: PLOEG_API_URL
                  value: "http://ploeg:8080"
                - name: PLOEG_TEAM
                  value: "bronze"
                - name: PLOEG_HARNESS
                  value: "openhands"
                - name: LLM_MODEL
                  value: "litellm_proxy/deepseek-chat"
                - name: LITELLM_KEY_BUDGET
                  value: "2"
                - name: LITELLM_KEY_DURATION
                  value: "4h"
                - name: LLM_BASE_URL
                  value: "http://litellm.ai.svc.cluster.local:4000/v1"
                - name: LITELLM_ADMIN_URL
                  value: "http://litellm.ai.svc.cluster.local:4000"
                - name: LITELLM_MASTER_KEY
                  valueFrom:
                    secretKeyRef:
                      name: agent-litellm-master
                      key: LITELLM_MASTER_KEY
                - name: FORGEJO_URL
                  value: "http://forgejo-http.forgejo.svc.cluster.local:3000"
                - name: AGENT_BUILDER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: agent-builder-token
                      key: FORGEJO_TOKEN
                # FALLBACK target only. The repository belongs to the work item,
                # resolved at ingest from its tracker scope and delivered on the claim
                # (R11, ADR-0001); these render only while a team still pins a repo,
                # and a team that declares none renders no repo env at all.
                - name: REPO_OWNER
                  value: "webgrip"
                - name: REPO_NAME
                  value: "example"
                # Base branch for clone/branch/PR (VIK-589). Unset = the repo's
                # default branch on clone and the worker's historical "main".
                - name: PLOEG_BASE_BRANCH
                  value: "development"
                # Downward API: node+pod identity survives pod/job cleanup for
                # run forensics (VIK-597). Logged at worker start and embedded in
                # every checkpoint.
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: WORK_DIR
                  value: /mnt/ci-shared
                - name: DOCKER_HOST
                  value: tcp://localhost:2376
                - name: DOCKER_CERT_PATH
                  value: /certs/client
                - name: DOCKER_TLS_VERIFY
                  value: "1"
              volumeMounts:
                - name: worker-bin
                  mountPath: /mnt/bin
                  readOnly: true
                - name: docker-certs
                  mountPath: /certs
                  readOnly: true
                - name: ci-shared
                  mountPath: /mnt/ci-shared
              resources:
                limits:
                  cpu: "1"
                  memory: 1Gi
                requests:
                  cpu: "1"
                  memory: 1Gi
          volumes:
            - name: worker-bin
              emptyDir: {}
            - name: docker-certs
              emptyDir: {}
            - name: docker-storage
              emptyDir: {}
            # Disk-backed (not tmpfs): repo checkout + gate builds are large.
            # Same absolute path in worker AND dind so `docker run -v`
            # bind-mounts resolve on the daemon's filesystem.
            - name: ci-shared
              emptyDir:
                sizeLimit: 8Gi
