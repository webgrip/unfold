apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ploeg.fullname" . }}
  labels: {{- include "ploeg.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "ploeg.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ploeg.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ploeg.fullname" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ploegd
          image: {{ include "ploeg.image" . }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PLOEG_LISTEN
              value: ":8080"
            - name: PLOEG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ .Values.database.existingSecret.key }}
            - name: PLOEG_VIKUNJA_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.webhook.existingSecret.name }}
                  key: {{ .Values.webhook.existingSecret.key }}
            {{- /* Team plans (run-multi-agent-shifts): ploegd's shift engine
                 reads the same plan the workload templates partition on, so
                 there is exactly one source of truth — executor.teams[].plan.
                 The pool is the team's budget value. Only planned teams are
                 serialised; no plans, no env, and dispatch is unchanged. */}}
            {{- $plans := dict }}
            {{- range .Values.executor.teams }}
            {{- if .plan }}
            {{- $_ := set $plans .name (dict "pool" (.budget | default "0") "rounds" .plan) }}
            {{- end }}
            {{- end }}
            {{- if $plans }}
            - name: PLOEG_TEAM_PLANS
              value: {{ toJson $plans | quote }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- with .Values.executor.litellm }}
            - name: LITELLM_ADMIN_URL
              value: {{ .adminUrl | quote }}
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .masterKeySecret.name }}
                  key: {{ .masterKeySecret.key }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
