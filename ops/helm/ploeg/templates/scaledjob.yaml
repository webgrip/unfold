{{- if and .Values.executor.enabled (eq (.Values.executor.type | default "keda") "keda") }}
{{- $root := . }}
{{- range .Values.executor.teams }}
---
# One ScaledJob per team (design §6) — the flagship executor. The pod shape
# lives in the shared ploeg.workerPodTemplate helper (also used by the
# CronJob executor): privileged DinD sidecar when the harness needs Docker,
# a shared disk-backed workspace mounted at the SAME path in both
# containers, and zero Kubernetes API authority for the LLM-driven process.
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: {{ include "ploeg.fullname" $root }}-worker-{{ .name }}
  labels: {{- include "ploeg.labels" $root | nindent 4 }}
spec:
  pollingInterval: {{ $root.Values.executor.pollingInterval }}
  minReplicaCount: 0
  maxReplicaCount: {{ .maxReplicaCount | default 1 }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  rollout:
    strategy: gradual # spec updates never kill in-flight runs (backlog #50)
  scalingStrategy:
    strategy: accurate # never eager: open over-scaling bug kedacore/keda#6416 (backlog #47)
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 0 # ploeg owns retries; every pod is one auditable run (backlog #51)
    activeDeadlineSeconds: {{ $root.Values.executor.activeDeadlineSeconds }}
    template:
      {{- include "ploeg.workerPodTemplate" (dict "root" $root "team" .) | nindent 6 }}
  triggers:
    - type: postgresql
      metadata:
        # Resolved by the KEDA operator from ITS namespace, not this one —
        # a bare in-namespace service name never resolves there.
        host: {{ $root.Values.executor.scaler.host | default (printf "ploeg-db-rw.%s.svc.cluster.local" $root.Release.Namespace) | quote }}
        port: {{ $root.Values.executor.scaler.port | quote }}
        userName: {{ $root.Values.executor.scaler.userName | quote }}
        dbName: {{ $root.Values.executor.scaler.dbName | quote }}
        sslmode: {{ $root.Values.executor.scaler.sslmode | quote }}
        # The one poll-query shape: served index-only by work_items_claimable
        # (backlog #24/#47). Must stay in sync with store.Claim/QueueDepth.
        query: "SELECT COUNT(*) FROM work_items WHERE team = '{{ .name }}' AND state = 'queued' AND (next_eligible_at IS NULL OR next_eligible_at <= now())"
        targetQueryValue: "1"
        activationTargetQueryValue: "0"
      authenticationRef:
        name: {{ include "ploeg.fullname" $root }}-scaler
{{- end }}
{{- end }}
