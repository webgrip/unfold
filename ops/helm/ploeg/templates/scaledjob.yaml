{{- if .Values.executor.enabled }}
{{- $root := . }}
{{- range .Values.executor.teams }}
---
# One ScaledJob per team (design §6). Pod shape mirrors the production
# forgejo-agent-runner: privileged DinD sidecar for OpenHands + gates, a
# shared disk-backed workspace mounted at the SAME path in both containers,
# and zero Kubernetes API authority for the LLM-driven process.
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: {{ include "ploeg.fullname" $root }}-worker-{{ .name }}
  labels: {{- include "ploeg.labels" $root | nindent 4 }}
spec:
  pollingInterval: {{ $root.Values.executor.pollingInterval }}
  minReplicaCount: 0
  maxReplicaCount: {{ .maxReplicaCount | default 1 }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  rollout:
    strategy: gradual # spec updates never kill in-flight runs (backlog #50)
  scalingStrategy:
    strategy: accurate # never eager: open over-scaling bug kedacore/keda#6416 (backlog #47)
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 0 # ploeg owns retries; every pod is one auditable run (backlog #51)
    activeDeadlineSeconds: {{ $root.Values.executor.activeDeadlineSeconds }}
    template:
      metadata:
        labels:
          app.kubernetes.io/name: ploeg-worker
          ploeg.webgrip.dev/team: {{ .name }}
      spec:
        restartPolicy: Never
        automountServiceAccountToken: false
        {{- with $root.Values.imagePullSecrets }}
        imagePullSecrets: {{- toYaml . | nindent 10 }}
        {{- end }}
        nodeSelector:
          node.webgrip.io/pool: worker # never control-plane (ADR-0002: DinD beside etcd)
        securityContext:
          fsGroup: 1000
        initContainers:
          # Extracts ploeg-worker from the distroless ploegd image via
          # self-copy (no shell in distroless).
          - name: worker-bin
            image: {{ $root.Values.executor.workerImage | default (include "ploeg.image" $root) }}
            command: ["/usr/local/bin/ploeg-worker", "install", "/mnt/bin/ploeg-worker"]
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
              - name: worker-bin
                mountPath: /mnt/bin
          # DinD sidecar: OpenHands' sandbox and the repo quality gates need a
          # Docker daemon. Requires the ploeg-worker PolicyException.
          - name: dind
            image: {{ $root.Values.executor.dindImage }}
            restartPolicy: Always
            securityContext:
              privileged: true
            env:
              - name: DOCKER_TLS_CERTDIR
                value: /certs
            startupProbe:
              tcpSocket:
                port: 2376
              periodSeconds: 2
              failureThreshold: 60
              timeoutSeconds: 5
            volumeMounts:
              - name: docker-certs
                mountPath: /certs
              - name: docker-storage
                mountPath: /var/lib/docker
              - name: ci-shared
                mountPath: /mnt/ci-shared
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 3Gi
        containers:
          - name: worker
            image: {{ $root.Values.executor.runnerImage }}
            command: ["/mnt/bin/ploeg-worker"]
            env:
              - name: PLOEG_API_URL
                value: {{ include "ploeg.apiUrl" $root | quote }}
              - name: PLOEG_TEAM
                value: {{ .name | quote }}
              - name: LLM_MODEL
                value: {{ .model | quote }}
              - name: LITELLM_KEY_BUDGET
                value: {{ .budget | quote }}
              - name: LITELLM_KEY_DURATION
                value: {{ $root.Values.executor.litellm.keyDuration | quote }}
              - name: LLM_BASE_URL
                value: {{ $root.Values.executor.litellm.baseUrl | quote }}
              - name: LITELLM_ADMIN_URL
                value: {{ $root.Values.executor.litellm.adminUrl | quote }}
              - name: LITELLM_MASTER_KEY
                valueFrom:
                  secretKeyRef:
                    name: {{ $root.Values.executor.litellm.masterKeySecret.name }}
                    key: {{ $root.Values.executor.litellm.masterKeySecret.key }}
              - name: FORGEJO_URL
                value: {{ $root.Values.executor.forgejo.url | quote }}
              - name: AGENT_BUILDER_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: {{ $root.Values.executor.forgejo.tokenSecret.name }}
                    key: {{ $root.Values.executor.forgejo.tokenSecret.key }}
              - name: REPO_OWNER
                value: {{ .repoOwner | quote }}
              - name: REPO_NAME
                value: {{ .repoName | quote }}
              - name: WORK_DIR
                value: /mnt/ci-shared
              - name: DOCKER_HOST
                value: tcp://localhost:2376
              - name: DOCKER_CERT_PATH
                value: /certs/client
              - name: DOCKER_TLS_VERIFY
                value: "1"
            volumeMounts:
              - name: worker-bin
                mountPath: /mnt/bin
                readOnly: true
              - name: docker-certs
                mountPath: /certs
                readOnly: true
              - name: ci-shared
                mountPath: /mnt/ci-shared
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi
        volumes:
          - name: worker-bin
            emptyDir: {}
          - name: docker-certs
            emptyDir: {}
          - name: docker-storage
            emptyDir: {}
          # Disk-backed (not tmpfs): repo checkout + gate builds are large.
          # Same absolute path in worker AND dind so `docker run -v`
          # bind-mounts resolve on the daemon's filesystem.
          - name: ci-shared
            emptyDir:
              sizeLimit: 8Gi
  triggers:
    - type: postgresql
      metadata:
        host: {{ $root.Values.executor.scaler.host | quote }}
        port: {{ $root.Values.executor.scaler.port | quote }}
        userName: {{ $root.Values.executor.scaler.userName | quote }}
        dbName: {{ $root.Values.executor.scaler.dbName | quote }}
        sslmode: {{ $root.Values.executor.scaler.sslmode | quote }}
        # The one poll-query shape: served index-only by work_items_claimable
        # (backlog #24/#47).
        query: "SELECT COUNT(*) FROM work_items WHERE team = '{{ .name }}' AND state = 'queued'"
        targetQueryValue: "1"
        activationTargetQueryValue: "0"
      authenticationRef:
        name: {{ include "ploeg.fullname" $root }}-scaler
{{- end }}
{{- end }}
