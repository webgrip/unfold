name = "unfold-docs"
compatibility_date = "2026-09-26"
workers_dev = false
preview_urls = false
routes = [{ pattern = "docs.unfoldhq.dev/*", zone_name = "unfoldhq.dev" }]

[assets]
directory = "../../.build/site"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[env.staging]
name = "unfold-docs-staging"
workers_dev = false
preview_urls = false
routes = [{ pattern = "docs-staging.unfoldhq.dev/*", zone_name = "unfoldhq.dev" }]

[env.staging.assets]
directory = "../../.build/site"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
