[settings]
lockfile = true

[tools]
helm = "4.2.3"
uv = "0.12.12"
node = "24"  # runtime for the openspec CLI; matches CI's node:24-alpine
"npm:@fission-ai/openspec" = "1.6.0"  # `openspec` — the /opsx workflow (openspec/config.yaml)

[tasks.spec-check]
description = "Validate every OpenSpec change and spec"
run = "openspec validate --all"
