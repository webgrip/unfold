{{- if and .Values.executor.enabled (eq (.Values.executor.type | default "keda") "sandbox") }}
{{- $root := . }}
{{- $sb := .Values.executor.sandbox }}
{{- range $team := .Values.executor.teams }}
{{- range $role := (include "ploeg.teamRoles" $team | fromJsonArray) }}
{{- $name := include "ploeg.workloadName" (dict "root" $root "team" $team "role" $role) }}
{{- $pod := include "ploeg.workerPodTemplate" (dict "root" $root "team" $team "role" $role) | fromYaml }}
{{- $_ := set $pod.spec "activeDeadlineSeconds" $root.Values.executor.activeDeadlineSeconds }}
{{- $_ := set $pod.spec "dnsPolicy" "ClusterFirst" }}
{{- if $sb.runtimeClassName }}
{{- $_ := set $pod.spec "runtimeClassName" $sb.runtimeClassName }}
{{- end }}
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: {{ $name }}
  labels: {{- include "ploeg.labels" $root | nindent 4 }}
spec:
  podTemplate: {{- toYaml $pod | nindent 4 }}
  service: false
  networkPolicyManagement: Unmanaged
  envVarsInjectionPolicy: Disallowed
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: {{ $name }}
  labels: {{- include "ploeg.labels" $root | nindent 4 }}
spec:
  replicas: 0
  sandboxTemplateRef:
    name: {{ $name }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ploeg.sandboxLauncherName" $root }}
  labels: {{- include "ploeg.labels" $root | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ploeg.sandboxLauncherName" $root }}
  labels: {{- include "ploeg.labels" $root | nindent 4 }}
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ploeg.sandboxLauncherName" $root }}
  labels: {{- include "ploeg.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ploeg.sandboxLauncherName" $root }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ploeg.sandboxLauncherName" $root }}
    namespace: {{ $root.Release.Namespace }}
{{- end }}
