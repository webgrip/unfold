[tools]
uv = "0.12.23"
node = "24.21.0"
helm = "4.3.0"

[tasks.probe-opencode]
tools = { "npm:opencode-ai" = { version = "1.18.35", npm_args = "--ignore-scripts=false" } }
run = "node scripts/probe-opencode.mjs"
