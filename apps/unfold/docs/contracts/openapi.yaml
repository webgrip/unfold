      parameters:
        - { name: workItemId, in: query, required: false, schema: { type: string, maxLength: 40 } }
        - { name: sessionId, in: query, required: false, schema: { type: string, maxLength: 80 } }
        - { name: outcome, in: query, required: false, schema: { type: string, enum: [done, refused, failed] } }
        - { name: channel, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: userId, in: query, required: false, schema: { type: string } }
        - { name: before, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: '`{actions, nextBefore}`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions: { type: array, items: { type: object } }
                  nextBefore: { type: [integer, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/actions/filters:
    get:
      tags: [Workbench]
      operationId: getActionFilters
      summary: 'Who acted and through which channels'
      x-unfold-role: viewer
      parameters:
        - { name: userId, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: '`{people, channels}`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  people: { type: array, items: { type: object } }
                  channels: { type: array, items: { type: object } }
  /api/handoffs:
    get:
      tags: [Workbench]
      operationId: listHandOffs
      summary: 'The caller''s own hand-offs from any channel, with the Work Item each became'
      description: 'Read from the caller''s own Action Records, newest first, one entry per task or Work Item, left out once taken back. A task whose source the caller no longer reaches, and a Work Item outside their Teams or Tenant, is left out. `workItem` is null with a `note` until Ploeg lists one.'
      x-unfold-role: viewer
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: refresh, in: query, required: false, schema: { type: string, enum: ['1'] } }
      responses:
        '200':
          description: '`{handoffs, demo, fetchedAt}`'
          content:
            application/json:
              schema:
                type: object
                required: [handoffs, demo, fetchedAt]
                properties:
                  handoffs:
                    type: array
                    items:
                      type: object
                      required: [id, at, channel, team, origin, workItem, note]
                      properties:
                        id: { type: integer }
                        at: { type: string, format: date-time }
                        channel: { type: string }
                        team: { type: [string, 'null'] }
                        origin: { type: object, required: [kind], properties: { kind: { type: string, enum: [task, session] }, sourceId: { type: string }, sourceName: { type: string }, taskId: { type: string } } }
                        workItem: { type: [object, 'null'] }
                        note: { type: string }
                  demo: { type: boolean }
                  fetchedAt: { type: string, format: date-time }

  /api/linked-sessions:
    get:
      tags: [Linked Sessions]
      operationId: listLinkedSessions
      summary: 'Linked Sessions, the person''s own or one Work Item''s'
      description: 'With `workItemId`, the sessions linked to that Work Item after Ploeg confirms the person may read it (404 otherwise). `all=1` lists everyone''s for an administrator.'
