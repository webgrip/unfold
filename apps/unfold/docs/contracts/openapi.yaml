              schema: { type: object, properties: { sourceId: { type: string } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/task-imports:
    post:
      tags: [Tasks]
      operationId: importTask
      summary: 'Import a task as a queued session'
      description: '201 for a new session, 200 for the existing one. 409 `task_changed` when the task changed after the preview; 403 `ploeg_owned` when Ploeg owns execution for the connection.'
      x-unfold-role: operator
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceId, taskId, revision, runtime, budgetUsd]
              properties:
                sourceId: { type: string, maxLength: 64 }
                taskId: { type: string, maxLength: 128 }
                revision: { type: string, maxLength: 128 }
                teamId: { type: string, maxLength: 64 }
                crewId: { type: string, maxLength: 64, deprecated: true }
