      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      parameters:
        - { name: key, in: query, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Snoozes' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/agent-host:
    get:
      tags: [Agent host]
      operationId: getAgentHost
      summary: 'The agent host''s protocol, address and the caller''s connections'
      x-unfold-role: viewer
      responses:
        '200':
          description: 'The host description and the VS Code setting shape.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  protocolVersion: { type: string }
                  protocolVersions: { type: array, items: { type: string } }
                  address: { type: string }
                  connectionAuthority: { type: string }
                  provider: { const: unfold }
                  clients: { type: integer }
                  attached: { type: array, items: { type: object } }
                  folders: { type: array, items: { type: object } }
                  vscodeSetting: { type: object }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/agent-host/tokens:
    post:
      tags: [Agent host]
      operationId: issueAgentHostToken
      summary: 'Issue an Agent Host connection token'
      description: 'Shown once and bound to the caller and the sign-in that issued it. Viewers get 403.'
      x-unfold-role: operator
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 80 }
      responses:
        '201':
          description: 'The token.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  id: { type: string, pattern: '^[0-9a-f]{64}$' }
                  address: { type: string }
                  vscodeSetting: { type: object }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/agent-host/tokens/{tokenId}:
    parameters:
      - name: tokenId
        in: path
        required: true
        description: 'The token''s SHA-256 digest in lowercase hex.'
        schema: { type: string, pattern: '^[0-9a-f]{64}$' }
        example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
    delete:
      tags: [Agent host]
      operationId: revokeAgentHostToken
      summary: 'Revoke one of the caller''s connection tokens'
      description: 'Closes its open connections with WebSocket code 1008. Unknown, revoked or another person''s token answers 404 `not_found`.'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      responses:
        '200':
          description: '`{revoked: true}`'
          content:
            application/json:
              schema: { type: object, properties: { revoked: { const: true } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/agent-host/editor-window:
    put:
      tags: [Agent host]
      operationId: rememberEditorWindow
      summary: 'Remember the caller''s VS Code window'
      description: 'Anything but a `vscode` or `vscode-insiders` protocol with a numeric `windowId` answers 400 `invalid_editor_window`. Viewers get 403.'
      x-unfold-role: operator
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditorWindow' }
      responses:
        '200':
          description: 'The remembered window.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EditorWindow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Agent host]
      operationId: forgetEditorWindow
      summary: 'Forget the caller''s VS Code window'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      responses:
        '200':
          description: '`{forgotten}`'
          content:
            application/json:
              schema: { type: object, properties: { forgotten: { type: boolean } } }
  /api/agent-host/sessions/{sessionId}/link:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Agent host]
      operationId: getAgentsWindowSessionLink
      summary: 'The link that opens a session in the caller''s Agents window'
      description: 'Its owner and administrators; anyone else gets 404 `not_found`. Viewers get 403.'
      x-unfold-role: operator
      responses:
        '200': { $ref: '#/components/responses/AgentsWindowLink' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/agent-host/work-items/{workItemId}/link:
    parameters:
