    parameters:
      - name: teamsWebhookId
        in: path
        required: true
        schema: { type: string }
        example: 7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f
    delete:
      tags: [Notifications]
      operationId: removeTeamsWebhook
      summary: 'Remove one of the person''s Teams workflow webhooks'
      description: '404 `not_found` for a webhook that is not the person''s, or while a flag is off for the person.'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      responses:
        '200': { $ref: '#/components/responses/NotificationsView' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/notifications/channels/slack/interactions:
    post:
      tags: [Notifications]
      operationId: receiveSlackInteraction
      summary: 'Slack delivers a button press'
      description: |
        Slack's interactivity Request URL. Needs no sign-in, no `X-Unfold-Request` header and no same-origin check: the
        Slack request signature proves the request instead (`X-Slack-Signature`, `v0` HMAC-SHA256 of
        `v0:<X-Slack-Request-Timestamp>:<body>` with the signing secret, timestamp within 5 minutes). The body is
        Slack's `application/x-www-form-urlencoded` `payload`, at most 256 KiB. Only `block_actions` with the action ids
        `unfold.open`, `unfold.link.confirm`, `unfold.permission.review`, `unfold.permission.allow` and
        `unfold.permission.deny` act; every other action is refused through the payload's `response_url`. Answers 200
        to every verified interaction, as Slack expects. 404 while Slack is not configured, and in the demo.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [payload]
              properties:
                payload: { type: string, description: 'The interaction payload as JSON.' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: '`slack_signature`: the signature is missing, does not verify, or its timestamp is more than 5 minutes from now.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /api/billing:
    get:
      tags: [Billing]
      operationId: getBilling
      summary: 'Billing per accepted Work Item: exporter, owners, mappings and the newest lines'
      description: 'Administrators only; while `tenancy.enforce` is on, only the Tenants they reach. `owners` carries each Tenant''s `billing.export` flag value. The demo answers `{demo: true}`.'
      x-unfold-role: admin
      responses:
        '200':
          description: '`{demo, configured, exporter, currency, sizes, reversalDays, owners, lines, counts}`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  demo: { type: boolean }
                  configured: { type: boolean }
                  exporter: { type: object, properties: { name: { type: string }, title: { type: string }, targetFields: { type: array, items: { type: object } } } }
                  currency: { type: string }
                  owners: { type: array, items: { type: object } }
                  lines: { type: array, items: { $ref: '#/components/schemas/BillingLine' } }
                  counts: { type: object }
