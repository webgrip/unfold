    delete:
      tags: [Linked accounts]
      operationId: unlink
      summary: 'Forget the link'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /api/links/{provider}/callback:
    parameters:
      - $ref: '#/components/parameters/LinkProvider'
    get:
      tags: [Linked accounts]
      operationId: completeLink
      summary: 'The provider''s OAuth redirect target'
      description: 'Needs no cookie; the `state` names the person who started it, once, within ten minutes. Redirects to `/?linked=<provider>` or `/?link_error=<code>`.'
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        '303': { description: Redirect back into the workbench. }

