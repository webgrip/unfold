      summary: 'Ask a Slack account to link to the person'
      description: 'Finds the Slack account with `users.lookupByEmail`, opens a direct message with `conversations.open` and posts a Link to Unfold button there; the link exists only once that Slack account presses it, within 15 minutes. 400 `slack_email`; 404 `slack_user_not_found`, or `not_found` while `notifications.push` or `notifications.slack` is off for the person; 403 `slack_workspace`; 409 `notify_unavailable`, `slack_user_linked` (linked to someone else) or `slack_failed`; 429 `slack_link_wait` within a minute of the last request.'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { $ref: '#/components/responses/NotificationsView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [Notifications]
      operationId: unlinkSlackAccount
      summary: 'Unlink the person''s Slack account'
