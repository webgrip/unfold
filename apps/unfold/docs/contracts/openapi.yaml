            application/json:
              schema: { type: object, properties: { links: { type: array, items: { type: object } } } }
  /api/links/{provider}:
    parameters:
      - $ref: '#/components/parameters/LinkProvider'
    post:
      tags: [Linked accounts]
      operationId: beginLink
      summary: 'Start an OAuth link with PKCE'
      description: 'Returns the provider URL to visit; 409 `link_unconfigured` without an application ID.'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '200':
          description: '`{url}`'
          content:
            application/json:
              schema: { type: object, properties: { url: { type: string, format: uri } } }
        '409': { $ref: '#/components/responses/Conflict' }
    put:
      tags: [Linked accounts]
      operationId: pasteLinkToken
      summary: 'Link by a pasted personal token'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: '`{link}` with `method: "token"`.'
          content:
            application/json:
              schema: { type: object, properties: { link: { type: object } } }
