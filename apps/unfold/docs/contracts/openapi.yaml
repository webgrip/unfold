  /api/linked-sessions/{linkedSessionId}/messages:
    parameters:
      - $ref: '#/components/parameters/LinkedSessionId'
    get:
      tags: [Linked Sessions]
      operationId: listLinkedSessionMessages
      summary: 'The session''s 20 most recent messages'
      description: 'Owner or administrator only.'
      x-unfold-role: viewer
      responses:
        '200':
          description: '`{messages}`'
          content:
            application/json:
              schema: { type: object, properties: { messages: { type: array, items: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Linked Sessions]
      operationId: sendLinkedSessionMessage
      summary: 'Queue one message for the session'
      description: 'Owner or administrator only. 409 `linked_inbox_full` when 50 messages wait uncollected.'
