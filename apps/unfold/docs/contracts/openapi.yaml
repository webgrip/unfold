      description: '409 `pause_required`, `invalid_state` or `authority_budget`; 400 `budget` beyond `maxBudgetUsd`.'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountUsd]
              properties:
                amountUsd: { type: number, exclusiveMinimum: 0 }
      responses: { '200': { $ref: '#/components/responses/Session' }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/actions:
    get:
      tags: [Workbench]
      operationId: listActionRecords
      summary: 'Action Records, newest first'
      description: 'A person sees only their own; an administrator sees everyone''s and may filter by `userId`. 400 `outcome` for another outcome.'
      x-unfold-role: viewer
      parameters:
        - { name: workItemId, in: query, required: false, schema: { type: string, maxLength: 40 } }
        - { name: sessionId, in: query, required: false, schema: { type: string, maxLength: 80 } }
        - { name: outcome, in: query, required: false, schema: { type: string, enum: [done, refused, failed] } }
        - { name: channel, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: userId, in: query, required: false, schema: { type: string } }
        - { name: before, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: '`{actions, nextBefore}`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions: { type: array, items: { type: object } }
                  nextBefore: { type: [integer, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/actions/filters:
    get:
      tags: [Workbench]
      operationId: getActionFilters
      summary: 'Who acted and through which channels'
      x-unfold-role: viewer
      parameters:
        - { name: userId, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: '`{people, channels}`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  people: { type: array, items: { type: object } }
                  channels: { type: array, items: { type: object } }

  /api/linked-sessions:
    get:
      tags: [Linked Sessions]
      operationId: listLinkedSessions
      summary: 'Linked Sessions, the person''s own or one Work Item''s'
      description: 'With `workItemId`, the sessions linked to that Work Item after Ploeg confirms the person may read it (404 otherwise). `all=1` lists everyone''s for an administrator.'
      x-unfold-role: viewer
      security:
        - sessionCookie: []
        - editorBearer: []
        - mcpDelegated: []
      parameters:
        - { name: workItemId, in: query, required: false, schema: { type: string } }
        - { name: telemetry, in: query, required: false, schema: { type: string, enum: ['1'] } }
        - { name: all, in: query, required: false, schema: { type: string, enum: ['1'] } }
      responses:
        '200':
          description: '`{sessions}`'
          content:
            application/json:
              schema: { type: object, properties: { sessions: { type: array, items: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/linked-sessions/events:
    post:
      tags: [Linked Sessions]
      operationId: reportLinkedSessionEvent
      summary: 'One hook report from a plugin'
      description: 'The first report claims `sessionId` for the sender; a report for another person''s session answers 404. Not an Action Record.'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [harness, sessionId, event]
              properties:
                harness: { type: string, enum: [claude-code, opencode, codex, acp] }
                sessionId: { type: string }
                event: { type: string, enum: [start, prompt, waiting, idle, end, commit] }
                harnessVersion: { type: string }
                title: { type: string }
                repository: { type: string }
                branch: { type: string }
                model: { type: string }
                remoteUrl: { type: string }
                waitingFor: { type: string }
                workItem: { type: [string, integer] }
                pullRequests: { type: array, items: { type: string } }
                commit: { type: object, properties: { sha: { type: string }, subject: { type: string }, trailer: { type: string } } }
                mentions: { type: object, properties: { refs: { type: array, maxItems: 10, items: { type: string } }, workItems: { type: array, maxItems: 10, items: { type: string } } } }
                remoteApproval: { type: boolean }
      responses:
        '200':
          description: '`{session, context, suggestedTitle, trackerPrefixes, credential}`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { type: object }
                  context: { type: string }
                  suggestedTitle: { type: [string, 'null'] }
                  trackerPrefixes: { type: array, items: { type: string } }
                  credential: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/linked-sessions/digest:
    get:
      tags: [Linked Sessions]
      operationId: getLinkedSessionDigest
      summary: 'The person''s own session digest'
      x-unfold-role: viewer
      security:
        - sessionCookie: []
        - editorBearer: []
        - mcpDelegated: []
      parameters:
        - { name: window, in: query, required: false, schema: { type: string, enum: [7d, 30d], default: 7d } }
      responses:
        '200':
          description: '`{digest}`'
          content:
            application/json:
              schema: { type: object, properties: { digest: { type: object } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/linked-sessions/{linkedSessionId}:
    parameters:
      - $ref: '#/components/parameters/LinkedSessionId'
    get:
      tags: [Linked Sessions]
      operationId: getLinkedSession
      summary: 'One Linked Session'
      description: 'For its owner, an administrator, or a person who may read a Work Item it is linked to; 404 for anyone else. `telemetry` is added for the owner and administrators only.'
      x-unfold-role: viewer
      security:
        - sessionCookie: []
        - editorBearer: []
        - mcpDelegated: []
      parameters:
        - { name: telemetry, in: query, required: false, schema: { type: string, enum: ['1'] } }
      responses:
        '200':
          description: '`{session}`'
          content:
            application/json:
              schema: { type: object, properties: { session: { type: object } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/linked-sessions/{linkedSessionId}/work-items/{workItemId}:
    parameters:
      - $ref: '#/components/parameters/LinkedSessionId'
      - $ref: '#/components/parameters/WorkItemId'
    put:
      tags: [Linked Sessions]
      operationId: linkWorkItem
      summary: 'Link a Work Item to the session'
      description: 'Owner or administrator; linking needs a Work Item the person may read.'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
        - { mcpDelegated: [], unfoldRequest: [] }
      responses:
        '200': { $ref: '#/components/responses/LinkedSession' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [Linked Sessions]
      operationId: unlinkWorkItem
      summary: 'Unlink a Work Item from the session'
      description: 'An unlinked Work Item is not linked again by the branch.'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
        - { mcpDelegated: [], unfoldRequest: [] }
      responses:
        '200': { $ref: '#/components/responses/LinkedSession' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/linked-sessions/{linkedSessionId}/traces:
    parameters:
      - $ref: '#/components/parameters/LinkedSessionId'
    post:
      tags: [Linked Sessions]
      operationId: addAgentTrace
      summary: 'Store an Agent Trace 0.1 record for one of the session''s commits'
      description: 'Owner only. 400 `agent_trace_invalid` names the first problem. 201 when stored, 200 when it was already stored.'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'An [Agent Trace](https://agent-trace.dev/) 0.1 record.'
              required: [version, id, timestamp, files]
              properties:
                version: { type: string, enum: ['0.1', 0.1.0] }
                id: { type: string, format: uuid }
                timestamp: { type: string, format: date-time }
                files: { type: array, items: { type: object } }
                tool: { type: object, required: [name, version], properties: { name: { type: string }, version: { type: string } } }
                metadata: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '201': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/linked-sessions/{linkedSessionId}/agent-trace:
    parameters:
      - $ref: '#/components/parameters/LinkedSessionId'
    get:
      tags: [Linked Sessions]
      operationId: downloadAgentTrace
      summary: 'The session''s Agent Trace records as JSON Lines'
      x-unfold-role: viewer
      responses:
        '200':
          description: 'One record per line; `X-Agent-Trace-Media-Type` names the record format.'
          headers:
            X-Agent-Trace-Media-Type: { schema: { type: string } }
          content:
            application/x-ndjson:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/agent-trace/{revision}:
    parameters:
      - name: revision
        in: path
        required: true
        description: 'A 40- or 64-character commit id.'
        schema: { type: string, pattern: '^[0-9a-f]{40}(?:[0-9a-f]{24})?$' }
        example: 4b825dc642cb6eb9a060e54bf8d69288fbee4904
    get:
      tags: [Linked Sessions]
      operationId: getAgentTraceForRevision
      summary: 'Agent Trace records for one commit from the Linked Sessions the person may read'
      x-unfold-role: viewer
      responses:
        '200':
          description: '`{records: [{sessionId, record}]}`'
          content:
            application/json:
              schema: { type: object, properties: { records: { type: array, items: { type: object } } } }
  /api/linked-sessions/{linkedSessionId}/suggestions:
    parameters:
      - $ref: '#/components/parameters/LinkedSessionId'
    get:
      tags: [Linked Sessions]
      operationId: getLinkedSessionSuggestions
      summary: 'Open Work Items the session is not linked to yet'
      description: 'At most five. Owner or administrator; 404 otherwise.'
      x-unfold-role: viewer
      responses:
        '200':
          description: '`{suggestions}`'
          content:
            application/json:
              schema: { type: object, properties: { suggestions: { type: array, items: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/linked-sessions/{linkedSessionId}/messages:
    parameters:
      - $ref: '#/components/parameters/LinkedSessionId'
    get:
      tags: [Linked Sessions]
      operationId: listLinkedSessionMessages
      summary: 'The session''s 20 most recent messages'
      description: 'Owner or administrator only.'
      x-unfold-role: viewer
      responses:
        '200':
          description: '`{messages}`'
          content:
            application/json:
              schema: { type: object, properties: { messages: { type: array, items: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Linked Sessions]
      operationId: sendLinkedSessionMessage
      summary: 'Queue one message for the session'
      description: 'Owner or administrator only. 409 `linked_inbox_full` when 50 messages wait uncollected.'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201':
          description: '`{message}`'
          content:
            application/json:
              schema: { type: object, properties: { message: { type: object } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/linked-sessions/{linkedSessionId}/inbox:
    parameters:
      - $ref: '#/components/parameters/LinkedSessionId'
    post:
      tags: [Linked Sessions]
      operationId: collectLinkedSessionInbox
      summary: 'Collect the session''s undelivered messages for its plugin'
      description: 'At most five, oldest first, each delivered once. The owner only. Not an Action Record.'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kinds: { type: array, items: { type: string, enum: [person, work_item, pull_request, ci] } }
      responses:
        '200':
          description: '`{messages}`'
          content:
            application/json:
              schema: { type: object, properties: { messages: { type: array, items: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/linked-sessions/{linkedSessionId}/start-options:
    parameters:
      - $ref: '#/components/parameters/LinkedSessionId'
    get:
      tags: [Linked Sessions]
      operationId: getLinkedSessionStartOptions
      summary: 'Teams and Work Targets a Work Item could start on'
      description: 'For the session''s owner; 404 for anyone else.'
      x-unfold-role: viewer
      responses:
        '200':
          description: '`{teams, targets, suggested, message}`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams: { type: array, items: { type: string } }
                  targets: { type: array, items: { type: object } }
                  suggested: { type: [string, 'null'] }
                  message: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/linked-sessions/{linkedSessionId}/work-items:
    parameters:
      - $ref: '#/components/parameters/LinkedSessionId'
    post:
      tags: [Linked Sessions]
      operationId: startWorkItemFromLinkedSession
      summary: 'Admit a Work Item through Ploeg and link the session to it'
      description: 'Owner only. Admission only queues; the Work Item runs when Ploeg picks it.'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [team, target, title, brief]
              properties:
                team: { type: string }
                target: { type: string }
                title: { type: string }
                brief: { type: string, minLength: 1, maxLength: 20000 }
                requestId: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/linked-sessions/{linkedSessionId}/handoff:
    parameters:
      - $ref: '#/components/parameters/LinkedSessionId'
    get:
      tags: [Linked Sessions]
      operationId: getLinkedSessionHandoffReadiness
      summary: 'Whether each of the session''s Work Items can be handed to Ploeg now'
      description: 'For the owner or an administrator.'
      x-unfold-role: viewer
      responses:
        '200':
          description: '`{workItems: [{id, title, state, available, reason}]}`'
          content:
            application/json:
              schema: { type: object, properties: { workItems: { type: array, items: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/linked-sessions/{linkedSessionId}/work-items/{workItemId}/handoff:
    parameters:
      - $ref: '#/components/parameters/LinkedSessionId'
      - $ref: '#/components/parameters/WorkItemId'
    post:
      tags: [Linked Sessions]
      operationId: handLinkedSessionToPloeg
      summary: 'Let Ploeg finish this'
      description: 'Requeues the Work Item from Round 1 with a note naming the session''s branch, last commit and pull request. Owner or administrator, on a Work Item the session is linked to (else 409 `handoff_not_linked`).'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { commandId: { type: string } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/linked-sessions/{linkedSessionId}/conversation:
    parameters:
      - $ref: '#/components/parameters/LinkedSessionId'
    get:
      tags: [Linked Sessions]
      operationId: readLinkedConversation
      summary: 'The session''s conversation, relayed from the owner''s machine'
      description: 'Never stored; Unfold asks the plugin and waits at most 8 seconds.'
      x-unfold-role: viewer
      parameters:
        - { name: after, in: query, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: '`{reachable, entries, cursor, truncated, restarted}`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  reachable: { type: boolean }
                  entries: { type: array, items: { type: object } }
                  cursor: { type: integer }
                  truncated: { type: boolean }
                  restarted: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/linked-sessions/{linkedSessionId}/conversation/wants:
    parameters:
      - $ref: '#/components/parameters/LinkedSessionId'
    post:
      tags: [Linked Sessions]
      operationId: pollConversationWants
      summary: 'The plugin''s poll for conversation reads'
      description: 'Held at most 25 seconds; a newer poll for the same session releases the older one empty. The owner only. Not an Action Record.'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '200':
          description: '`{wants: [{id, after}]}`'
          content:
            application/json:
              schema: { type: object, properties: { wants: { type: array, items: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/linked-sessions/{linkedSessionId}/conversation/answers/{wantId}:
    parameters:
      - $ref: '#/components/parameters/LinkedSessionId'
      - name: wantId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9a-f-]{36}$' }
        example: 3f2b9c1e-8a7d-4e6f-9b0a-1c2d3e4f5a6b
    post:
      tags: [Linked Sessions]
      operationId: answerConversationWant
      summary: 'Hand back one conversation read'
      description: 'Entries are re-validated and clipped. The owner only. Not an Action Record.'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entries: { type: array, items: { type: object } }
                cursor: { type: integer }
                truncated: { type: boolean }
                restarted: { type: boolean }
                missing: { type: boolean }
      responses:
        '200':
          description: '`{delivered}`, false for a read that timed out.'
          content:
            application/json:
              schema: { type: object, properties: { delivered: { type: boolean } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/linked-permissions:
    get:
      tags: [Linked Sessions]
      operationId: listLinkedPermissions
      summary: 'Waiting tool prompts in all of the person''s own opted-in sessions'
      x-unfold-role: viewer
      responses:
        '200':
          description: '`{requests}`'
          content:
            application/json:
              schema: { type: object, properties: { requests: { type: array, items: { type: object } } } }
  /api/linked-sessions/{linkedSessionId}/permissions:
    parameters:
      - $ref: '#/components/parameters/LinkedSessionId'
    get:
      tags: [Linked Sessions]
      operationId: listLinkedSessionPermissions
      summary: 'The session''s waiting tool prompts and whether it opted in'
      description: 'The owner only; an administrator and anyone else get 404.'
      x-unfold-role: viewer
      responses:
        '200':
          description: '`{requests, remoteApproval}`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests: { type: array, items: { type: object } }
                  remoteApproval: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Linked Sessions]
      operationId: reportLinkedSessionPermission
      summary: 'The plugin reports one tool prompt it waits on'
      description: 'Owner only, and only with an editor credential; a browser session or a delegated credential answers 403 `remote_approval_editor`.'
      x-unfold-role: viewer
      security:
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool]
              properties:
                tool: { type: string }
                summary: '{ type: string }'
                detail: { type: string }
                waitSeconds: { type: integer }
      responses:
        '201':
          description: '`{request}`'
          content:
            application/json:
              schema: { type: object, properties: { request: { type: object } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/linked-sessions/{linkedSessionId}/permissions/{permissionId}/answer:
    parameters:
      - $ref: '#/components/parameters/LinkedSessionId'
      - $ref: '#/components/parameters/PermissionId'
    post:
      tags: [Linked Sessions]
      operationId: answerLinkedSessionPermission
      summary: 'Answer one waiting tool prompt, once'
      description: 'The owner only. 400 `permission_decision`; 409 `remote_approval_off` or `permission_closed`.'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [allow, deny] }
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: '`{request}`'
          content:
            application/json:
              schema: { type: object, properties: { request: { type: object } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/linked-sessions/{linkedSessionId}/permissions/{permissionId}/collect:
    parameters:
      - $ref: '#/components/parameters/LinkedSessionId'
      - $ref: '#/components/parameters/PermissionId'
    post:
      tags: [Linked Sessions]
      operationId: collectLinkedSessionPermission
      summary: 'The plugin''s look at its own prompt'
      description: 'Needs the editor credential that reported it (404 for any other). Not an Action Record.'
      x-unfold-role: viewer
      security:
        - { editorBearer: [], unfoldRequest: [] }
      requestBody: { $ref: '#/components/requestBodies/Empty' }
