      description: '404 `task_source_unknown` when no configured source holds it.'
      x-unfold-role: viewer
      parameters:
        - { name: provider, in: query, required: true, schema: { type: string, enum: [vikunja, clickup] } }
        - { name: id, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: '`{sourceId}`'
          content:
            application/json:
              schema: { type: object, properties: { sourceId: { type: string } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/task-imports:
    post:
      tags: [Tasks]
