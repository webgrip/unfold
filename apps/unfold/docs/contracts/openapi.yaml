openapi: 3.1.0
info:
  title: Unfold HTTP API
  version: 1.0.0
  summary: 'The HTTP API of the Unfold workbench, where people define, follow and review the work Ploeg runs.'
  description: |
    This document describes every route under `/api/` that [`src/http.ts`](../../src/http.ts) serves, and the
    routes it hands to `linked-handoff.ts`, `take-over.ts`, `linked-permissions.ts`, `linked-conversation.ts`,
    `intake/routes.ts`, `billing.ts`, `tenant-export-jobs.ts`, the notification, audit and outbound webhook
    services and the workspace relay. The prose contract, [HTTP contract](api.md), carries the full behaviour of each route;
    this document carries its shape. `test/openapi.test.ts` fails when a route exists in one and not the other.
    SCIM 2.0 under `/scim/v2` and the Shared Signals receiver at `/ssf/events` sit outside `/api/` and are not
    described here: the identity provider calls them with their own bearer token or signed SET, SCIM describes
    itself through `/scim/v2/ServiceProviderConfig`, `/ResourceTypes` and `/Schemas` (RFC 7644), and the
    [HTTP contract](api.md#provisioning-and-shared-signals) lists both.

    Conventions:

    * Every error is `{"error":{"code":"...","message":"..."}}` (schema `Error`). A route lists the error codes it
      answers with in its description.
    * JSON request bodies need `Content-Type: application/json`; an action without input sends `{}`.
    * Every `POST`, `PUT`, `PATCH` and `DELETE` needs `X-Unfold-Request: 1` (security scheme `unfoldRequest`) and
      passes same-origin checks, except the editor sign-in under `/api/auth/editor`, OFREP evaluation and the
      workspace relay. A refused header or origin answers 403 `csrf` or `origin`.
    * `x-unfold-role` is the lowest role that may call an operation: `viewer`, `operator` or `admin`. A route that
      also needs a Tenant membership or object access says so in its description.
    * `x-unfold-requires` names configuration a route needs: `oidc` (single sign-on configured) or
      `connected-ploeg` (a live, non-demo Ploeg). Without it the route is not served or answers 503.
    * Any route that calls Ploeg answers 503 `ploeg_contract_incompatible` while the connected Ploeg does not serve
      a contract major this Unfold requires.
    * A response schema lists the fields clients rely on; responses may carry more fields. Additive fields are not
      a breaking change.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
externalDocs:
  description: 'HTTP contract (prose)'
  url: https://forgejo.webgrip.dev/webgrip/unfold/src/branch/development/apps/unfold/docs/contracts/api.md
servers:
  - url: /
    description: 'The workbench that serves this document.'
tags:
  - name: Identity
    description: 'Sign-in, sign-out, single sign-on and editor credentials.'
  - name: Workbench
    description: 'Bootstrap, status, health, reports, product events and the API description.'
  - name: Flags
    description: 'Feature flags, Labs choices and OpenFeature Remote Evaluation (OFREP).'
  - name: Sessions
    description: 'Sessions Unfold executes, their events, candidates and delivery.'
  - name: Tasks
    description: 'Tracker connections, task previews, imports and hand-offs to Ploeg.'
  - name: Linked Sessions
    description: 'Agent sessions a person runs outside Unfold that report through a plugin.'
  - name: Ploeg
    description: 'Ploeg''s operator view and Work Item commands, passed through Unfold''s connector.'
  - name: Agent host
    description: 'The Agent Host Protocol host for VS Code''s Agents window.'
  - name: Cards
    description: 'Run cards, the binder, packs, seasons and card themes.'
  - name: Linked accounts
    description: 'A person''s own GitLab and ClickUp links.'
  - name: Notifications
    description: 'A person''s own notifications over ntfy, Web Push, Slack and Microsoft Teams.'
  - name: Billing
    description: 'One billing line per accepted Work Item, written into the Agency''s own billing tool.'
  - name: Request intake
    description: 'Signed Request deliveries from feedback tools, forms and email, and the sources they come from.'
  - name: Administration
    description: 'The security audit, outbound webhooks and Tenant exports.'
  - name: Workspace relay
    description: 'Sandbox worker routes, authenticated by workspace and pod tokens; not part of the operator contract.'
    x-internal: true
security:
  - sessionCookie: []
  - editorBearer: []
paths:
  /api/openapi.yaml:
    get:
      tags: [Workbench]
      operationId: getOpenApiDocument
      summary: 'This OpenAPI description'
      description: 'Serves this document read-only. It needs no sign-in, because it describes the API and holds no workbench data.'
      security: []
      responses:
        '200':
          description: 'The OpenAPI 3.1 document.'
          content:
            application/yaml:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/login:
    post:
      tags: [Identity]
      operationId: login
      summary: 'Sign in with a local name and password'
      description: 'Sets the login cookie. With local sign-in off it answers 404 `local_login_off` without reading the credentials.'
      security:
        - unfoldRequest: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                password: { type: string }
      responses:
        '200':
          description: 'Signed in; `Set-Cookie` carries the login cookie.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/logout:
    post:
      tags: [Identity]
      operationId: logout
      summary: 'Sign out'
      description: 'Expires the login cookie. With an editor bearer token it revokes that credential only.'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/auth/methods:
    get:
      tags: [Identity]
      operationId: getAuthMethods
      summary: 'The sign-in methods this workbench offers'
      security: []
      responses:
        '200':
          description: 'Whether local sign-in is on, and the single sign-on provider when configured.'
          content:
            application/json:
              schema:
                type: object
                required: [local, oidc]
                properties:
                  local: { type: boolean }
                  oidc:
                    oneOf:
                      - type: 'null'
                      - type: object
                        properties:
                          name: { type: string }
                          issuer: { type: string }
  /api/auth/editor:
    post:
      tags: [Identity]
      operationId: startEditorSignIn
      summary: 'Start an editor sign-in'
      description: |
        Returns a one-time code, a secret only the editor holds, a `userCode` to display and the `url` to open. Exempt
        from the mutation header and origin checks. 20 starts per client address per ten minutes and 1000 waiting
        tickets, then 429 `rate_limited`.
      x-unfold-requires: [oidc]
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                client: { type: string, enum: [vscode, mcp] }
                host: { type: string, maxLength: 63 }
      responses:
        '200':
          description: 'The editor sign-in ticket.'
          content:
            application/json:
              schema:
                type: object
                required: [code, secret, userCode, expiresIn, interval, url]
                properties:
                  code: { type: string }
                  secret: { type: string }
                  userCode: { type: string, examples: [BCDF-GHJK] }
                  expiresIn: { type: integer, examples: [600] }
                  interval: { type: integer, examples: [2] }
                  url: { type: string, format: uri }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/auth/editor/{code}:
    parameters:
      - $ref: '#/components/parameters/EditorCode'
    post:
      tags: [Identity]
      operationId: collectEditorCredential
      summary: 'Poll for the editor credential'
      description: |
        202 `{status:"pending"}` until the person approves; 200 `{status:"ready", token, expiresAt, user}` once after
        approval; 403 `editor_login_denied` once after a denial; 404 for an unknown, expired, consumed or wrong-secret
        poll (five wrong secrets end the ticket); 429 `slow_down` for a poll within one second of the last. Exempt from
        the mutation header and origin checks.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret: { type: string }
      responses:
        '200':
          description: 'The editor credential, `vle_` followed by 43 base64url characters.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: ready }
                  token: { type: string, pattern: '^vle_[A-Za-z0-9_-]{43}$' }
                  expiresAt: { type: string, format: date-time }
                  user: { $ref: '#/components/schemas/User' }
        '202':
          description: 'The person has not approved yet.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: pending }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/auth/oidc:
    get:
      tags: [Identity]
      operationId: beginOidcSignIn
      summary: 'Redirect to the single sign-on provider'
      description: 'Starts an authorization-code request with PKCE, `state` and `nonce`. With `editor`, the sign-in completes that editor ticket; an unknown, expired or claimed one answers 404 `editor_login_unknown`.'
      x-unfold-requires: [oidc]
      security: []
      parameters:
        - { name: editor, in: query, required: false, schema: { type: string } }
      responses:
        '303': { description: Redirect to the provider. }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/auth/oidc/callback:
    get:
      tags: [Identity]
      operationId: completeOidcSignIn
      summary: 'Complete single sign-on'
      description: 'The provider''s redirect target. Redirects to `/` with the login cookie, to `/#editor-sign-in/<code>` for an editor sign-in, or to `/?login_error=<code>` (for example `oidc_not_entitled`).'
      x-unfold-requires: [oidc]
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
        - { name: iss, in: query, required: false, description: 'The issuer of the authorization response (RFC 9207). When present it must equal the discovered issuer exactly; when discovery advertises `authorization_response_iss_parameter_supported` it is required. Otherwise the redirect carries `login_error=oidc_issuer`.', schema: { type: string } }
      responses:
        '303': { description: Redirect back into the workbench. }
  /api/editor-requests/{code}:
    parameters:
      - $ref: '#/components/parameters/EditorCode'
    get:
      tags: [Identity]
      operationId: getEditorRequest
      summary: 'An editor sign-in waiting for its person'
      description: 'For the person who signed in for the ticket; 404 `editor_login_unknown` for anyone else or an expired ticket. A browser session only; an editor credential answers 403 `browser_only`.'
      x-unfold-role: viewer
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 'The ticket.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EditorRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/editor-requests/{code}/{decision}:
    parameters:
      - $ref: '#/components/parameters/EditorCode'
      - name: decision
        in: path
        required: true
        schema: { type: string, enum: [approve, deny] }
    post:
      tags: [Identity]
      operationId: decideEditorRequest
      summary: 'Approve or deny an editor sign-in'
      description: 'One decision per ticket, then 409 `editor_login_decided`. A browser session only (403 `browser_only`).'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '200':
          description: 'The decided ticket.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EditorRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/editor-credentials:
    get:
      tags: [Identity]
      operationId: listEditorCredentials
      summary: 'The person''s live editor credentials'
      description: 'A browser session only (403 `browser_only`).'
      x-unfold-role: viewer
      security:
        - sessionCookie: []
      responses:
        '200': { $ref: '#/components/responses/EditorCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/editor-credentials/{credentialId}:
    parameters:
      - name: credentialId
        in: path
        required: true
        schema: { type: string, pattern: '^[a-f0-9]{24}$' }
        example: 0123456789abcdef01234567
    delete:
      tags: [Identity]
      operationId: revokeEditorCredential
      summary: 'Revoke an editor credential'
      description: 'Revokes one, with the Agent Host connection tokens it issued, and returns the remaining list. A browser session only (403 `browser_only`).'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
      responses:
        '200': { $ref: '#/components/responses/EditorCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/bootstrap:
    get:
      tags: [Workbench]
      operationId: getBootstrap
      summary: 'What the browser needs to start'
      description: 'The current user, mode, repositories, Teams (also as the deprecated `crews`), models, runtimes, placements, limits, report target, product-event switch and the browser-visible flag values.'
      x-unfold-role: viewer
      responses:
        '200':
          description: 'The bootstrap document.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  mode: { type: string, enum: [demo, live] }
                  sharedExecution: { type: boolean }
                  agentHost: { type: boolean }
                  deliveryRepositories: { type: array, items: { type: string } }
                  deliveryPublisher: { type: boolean }
                  gateway: { type: string }
                  gatewayPolicy: { type: [object, 'null'] }
                  observability: { type: [object, 'null'] }
                  insight: { type: object, properties: { events: { type: boolean } } }
                  reports: { type: object }
                  repositories: { type: array, items: { type: object } }
                  taskSources: { type: array, items: { type: object } }
                  teams: { type: array, items: { type: object } }
                  crews: { type: array, items: { type: object }, deprecated: true }
                  models: { type: array, items: { type: object } }
                  runtimes: { type: array, items: { type: object } }
                  placements: { type: array, items: { type: object } }
                  maxBudgetUsd: { type: number }
                  maxConcurrentSessions: { type: integer }
                  flags: { type: object, additionalProperties: true }
  /api/status:
    get:
      tags: [Workbench]
      operationId: getStatus
      summary: 'The Status page'
      description: '`{generatedAt, overall, checks, waiting, failures, notes}`, with `ploegContract`, `personProof` and `residency` when they apply. `detail` and other administrator-only fields are left out for other roles.'
      x-unfold-role: viewer
      responses:
        '200':
          description: 'The status report.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  generatedAt: { type: string, format: date-time }
                  overall: { type: string, enum: [operational, degraded, down] }
                  checks: { type: array, items: { type: object } }
                  waiting: { type: array, items: { type: object } }
                  failures: { type: object }
                  notes: { type: array, items: { $ref: '#/components/schemas/StatusNote' } }
                  ploegContract: { type: object }
                  personProof: { type: object }
                  residency: { type: object }
  /api/status/notes:
    post:
      tags: [Workbench]
      operationId: addStatusNote
      summary: 'Post a status note'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [severity, text]
              properties:
                severity: { type: string, enum: [info, degraded, outage] }
                text: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '201':
          description: 'The note.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusNote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/status/notes/{noteId}/resolve:
    parameters:
      - name: noteId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9a-f-]{36}$' }
        example: 3f2b9c1e-8a7d-4e6f-9b0a-1c2d3e4f5a6b
    post:
      tags: [Workbench]
      operationId: resolveStatusNote
      summary: 'Resolve a status note'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '200':
          description: 'The note with `resolvedAt` and `resolvedBy`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusNote' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/health:
    get:
      tags: [Workbench]
      operationId: getHealth
      summary: 'Configuration and readiness summary'
      description: 'Does not prove that upstream providers are reachable. The unauthenticated probes are `/healthz` and `/readyz`, outside `/api/`.'
      x-unfold-role: viewer
      responses:
        '200':
          description: 'The summary.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: ok }
                  mode: { type: string }
                  version: { type: string }
                  runtimes: { type: array, items: { type: string } }
                  litellm: { type: boolean }
                  gateway: { type: string }
                  workspaceBackend: { type: string }
                  workspaceBackends: { type: array, items: { type: string } }
  /api/mcp-servers:
    get:
      tags: [Workbench]
      operationId: listMcpServers
      summary: 'Remote MCP servers people may add to their editor'
      description: 'Never carries headers, a token or a secret.'
      x-unfold-role: viewer
      responses:
        '200':
          description: 'The servers; empty when none is configured.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  servers:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        label: { type: string }
                        type: { const: http }
                        url: { type: string, format: uri }
                        oauth: { type: object, properties: { clientId: { type: string } } }
  /api/models:
    get:
      tags: [Workbench]
      operationId: listModels
      summary: 'The configured models through the gateway''s catalogue'
      x-unfold-role: viewer
      responses:
        '200':
          description: 'Each model''s provider, and an auto-router''s tiers.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  models: { type: array, items: { type: object } }
  /api/attestations/public-key:
    get:
      tags: [Sessions]
      operationId: getAttestationPublicKey
      summary: 'The workbench''s attestation public key'
      x-unfold-role: viewer
      responses:
        '200':
          description: 'PEM Ed25519 public key; `X-Key-Id` carries its identifier.'
          headers:
            X-Key-Id: { schema: { type: string } }
          content:
            application/x-pem-file:
              schema: { type: string }
  /api/reports:
    get:
      tags: [Workbench]
      operationId: listMyReports
      summary: 'The person''s own five latest problem reports'
      description: 'Reads the tracker again for reports last read over two minutes ago, waiting at most 2.5 seconds.'
      x-unfold-role: viewer
      responses:
        '200':
          description: 'The reports and how many have unread activity.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports: { type: array, items: { type: object } }
                  updates: { type: integer }
    post:
      tags: [Workbench]
      operationId: fileReport
      summary: 'Report a problem'
      description: '10 reports an hour per person, then 429. 8 MB in all.'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [happened]
              properties:
                kind: { type: string, enum: [broken, confusing, idea], default: broken }
                impact: { type: string, enum: [blocks, slows, minor] }
                happened: { type: string }
                expected: { type: string }
                title: { type: string }
                context: { type: string, description: JSON text. }
                duplicateOf: { type: string }
                screenshot: { type: string, contentMediaType: image/png }
                console: { type: string, contentMediaType: application/json }
                requests: { type: string, contentMediaType: application/json }
      responses:
        '201':
          description: 'The outcome.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [filed, retrying, failed, kept] }
                  url: { type: string }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/reports/seen:
    post:
      tags: [Workbench]
      operationId: markReportsSeen
      summary: 'Mark the person''s filed reports as seen'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '200':
          description: '`{updates: 0}`'
          content:
            application/json:
              schema: { type: object, properties: { updates: { const: 0 } } }
  /api/reports/similar:
    get:
      tags: [Workbench]
      operationId: findSimilarReports
      summary: 'Open filed reports that share words with a draft'
      x-unfold-role: viewer
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 4000 } }
        - { name: route, in: query, required: false, schema: { type: string, maxLength: 200 } }
      responses:
        '200':
          description: 'Up to three reports; only titles travel.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports: { type: array, items: { type: object } }
  /api/reports/{reportId}/replies:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: { type: string }
        example: r-42
    post:
      tags: [Workbench]
      operationId: replyToReport
      summary: 'Reply on the person''s own filed report'
      description: '404 for someone else''s or an unknown report, 409 before it is filed, 429 after 20 replies an hour.'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 4000 }
      responses:
        '201':
          description: 'The report.'
          content:
            application/json:
              schema: { type: object, properties: { report: { type: object } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/insight/events:
    post:
      tags: [Workbench]
      operationId: postProductEvents
      summary: 'Post product events'
      description: 'At most 50 events and 32 KB per call (413 `insight_batch_too_large`). Viewers get 403; more than 600 events a minute gets 429. With product events off it stores nothing and answers 204.'
      x-unfold-role: operator
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                events:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [name, at]
                    properties:
                      name: { type: string }
                      at: { type: string, format: date-time }
                      screen: { type: string }
                      workItemId: { type: [integer, string] }
                      shiftId: { type: [integer, string] }
                      props: { type: object }
      responses:
        '202':
          description: 'How many were kept and dropped.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer }
                  dropped: { type: integer }
        '204': { description: Product events are off. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/flags:
    get:
      tags: [Flags]
      operationId: getLabs
      summary: 'Browser-visible flag values and the Labs the caller may choose'
      x-unfold-role: viewer
      responses:
        '200': { $ref: '#/components/responses/LabsView' }
  /api/flags/{flagKey}/choice:
    parameters:
      - $ref: '#/components/parameters/FlagKey'
    put:
      tags: [Flags]
      operationId: setLabsChoice
      summary: 'Opt in or out of a Labs flag'
      description: '404 `flag_not_found` for a flag not offered in Labs, 400 `flag_choice` otherwise.'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                choice: { type: string, enum: ['on', 'off', default] }
      responses:
        '200': { $ref: '#/components/responses/LabsView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/flags:
    get:
      tags: [Flags]
      operationId: getAdminFlags
      summary: 'Every flag with its rule, source, override, rollout and experiment readout'
      x-unfold-role: admin
      responses:
        '200': { $ref: '#/components/responses/AdminFlags' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/flags/export:
    get:
      tags: [Flags]
      operationId: exportFlags
      summary: 'The flagd rules the authored rollouts compile to'
      x-unfold-role: admin
      responses:
        '200':
          description: '`{flags}`, with segments inlined.'
          content:
            application/json:
              schema: { type: object, properties: { flags: { type: object } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/flags/{flagKey}/override:
    parameters:
      - $ref: '#/components/parameters/FlagKey'
    put:
      tags: [Flags]
      operationId: setFlagOverride
      summary: 'Force or clear a flag''s variant for everyone'
      description: '404 `flag_not_found`, 400 `flag_variant` for a variant the flag lacks. Appended to the audit trail.'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variant]
              properties:
                variant: { type: [string, 'null'], maxLength: 64 }
                reason: { type: string, maxLength: 300, description: Required unless `variant` is null. }
      responses:
        '200': { $ref: '#/components/responses/AdminFlags' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/flags/{flagKey}/rollout:
    parameters:
      - $ref: '#/components/parameters/FlagKey'
    put:
      tags: [Flags]
      operationId: setFlagRollout
      summary: 'Store or remove an authored rollout'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rollout]
              properties:
                rollout:
                  type: [object, 'null']
                  properties:
                    state: { type: string }
                    defaultVariant: { type: string }
                    respectLabs: { type: boolean }
                    rules: { type: array, items: { type: object } }
                reason: { type: string, maxLength: 300, description: Required unless `rollout` is null. }
      responses:
        '200': { $ref: '#/components/responses/AdminFlags' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/flag-segments/{segment}:
    parameters:
      - name: segment
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,63}$' }
        example: beta-testers
    put:
      tags: [Flags]
      operationId: setFlagSegment
      summary: 'Store a segment'
      description: 'Every rollout that uses it recompiles.'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: '{ type: string }'
                audience: { type: object, description: 'Any of `roles`, `teams`, `users`, `tenants`.' }
      responses:
        '200': { $ref: '#/components/responses/AdminFlags' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Flags]
      operationId: deleteFlagSegment
      summary: 'Delete a segment'
      description: '409 `flag_segment_in_use` while a rollout uses it.'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      responses:
        '200': { $ref: '#/components/responses/AdminFlags' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/ofrep/v1/evaluate/flags:
    post:
      tags: [Flags]
      operationId: ofrepEvaluateAll
      summary: 'OFREP bulk evaluation'
      description: 'OFREP 0.4.0 for the signed-in person or editor; only browser-visible flags. Identity attributes come from the session; a client may add up to 32 scalar attributes. Needs no `X-Unfold-Request` header and records no Action Record.'
      x-unfold-role: viewer
      security:
        - sessionCookie: []
        - editorBearer: []
      parameters:
        - { name: If-None-Match, in: header, required: false, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfrepRequest' }
      responses:
        '200':
          description: 'Every client flag; `ETag` names this answer.'
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  flags: { type: array, items: { $ref: '#/components/schemas/OfrepFlag' } }
        '304': { description: Unchanged since the `If-None-Match` tag. }
  /api/ofrep/v1/evaluate/flags/{ofrepKey}:
    parameters:
      - name: ofrepKey
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_.-]{1,200}$' }
        example: now.loop
    post:
      tags: [Flags]
      operationId: ofrepEvaluateOne
      summary: 'OFREP single evaluation'
      description: '404 `{key, errorCode: "FLAG_NOT_FOUND"}` for a flag clients cannot see, 400 with `errorCode` when evaluation failed. Needs no `X-Unfold-Request` header.'
      x-unfold-role: viewer
      security:
        - sessionCookie: []
        - editorBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfrepRequest' }
      responses:
        '200':
          description: 'The evaluation.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfrepFlag' }
        '400':
          description: 'Evaluation failed.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfrepError' }
        '404':
          description: 'No client-visible flag has this key.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfrepError' }
  /api/now/snoozes:
    get:
      tags: [Flags]
      operationId: listNowSnoozes
      summary: 'The person''s snoozed Now items'
      x-unfold-role: viewer
      responses:
        '200': { $ref: '#/components/responses/Snoozes' }
    put:
      tags: [Flags]
      operationId: setNowSnooze
      summary: 'Keep or replace a snooze'
      description: 'Drops the person''s oldest beyond `limit` (200).'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, fingerprint, until]
              properties:
                key: { type: string }
                fingerprint: { type: string }
                until: { type: string, format: date-time }
                kind: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Snoozes' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [Flags]
      operationId: clearNowSnooze
      summary: 'Remove the snooze for one key'
