  /api/billing/mappings:
    put:
      tags: [Billing]
      operationId: setBillingMapping
      summary: 'Map a Tenant or Client to the billing tool and set its price'
      description: 'Amounts are decimal text with a point, such as `450.00`, at most 1000000.00; at least one price is required. `target` holds exactly the exporter''s `targetFields`. `since` (`YYYY-MM-DD`, default today) is the first Acceptance date that is billed. 400 `billing_mapping` or `billing_owner`, 404 `billing_owner` outside the caller''s Tenants, 409 `billing_unconfigured` without a `billing` block, `billing_demo` in the demo.'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant, target, price]
              properties:
                tenant: { type: string }
                client: { type: [string, 'null'] }
                target: { type: object, additionalProperties: { type: string } }
                price:
                  type: object
                  properties:
                    perTicket: { type: string, pattern: '^\d+(\.\d{1,2})?$' }
                    perSize:
                      type: object
                      properties:
                        S: { type: string }
                        M: { type: string }
                        L: { type: string }
                since: { type: string, format: date }
      responses:
        '200':
          description: 'The stored mapping `{tenant, client, target, price: {perTicketCents, perSizeCents}, since, updatedAt, updatedBy}`.'
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Billing]
      operationId: deleteBillingMapping
      summary: 'Remove a mapping'
      description: 'Lines already saved stay; a pending line of that Owner fails until it is mapped again. 404 `billing_owner`.'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      parameters:
        - { name: tenant, in: query, required: false, schema: { type: string, default: default } }
        - { name: client, in: query, required: false, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/billing/sync:
    post:
      tags: [Billing]
      operationId: syncBilling
      summary: 'Add lines for newly accepted Work Items and send what is due'
      description: 'Reads 30 days of delivery facts and adds one line per Work Item accepted (`merged`, `approved` or `silent`) on or after its mapping''s `since` while its Tenant''s `billing.export` flag is on. Unfold also runs it every `billing.syncMinutes`. 409 `billing_unconfigured` or `billing_demo`.'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '200':
          description: '`{added, unmapped, sent, failed, waiting}`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: { type: integer }
                  unmapped: { type: integer }
                  sent: { type: integer }
                  failed: { type: integer }
                  waiting: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/billing/lines:
    get:
      tags: [Billing]
      operationId: downloadBillingLines
      summary: 'Every line the caller may see except cancelled ones, as a file'
      description: '`csv` is RFC 4180 CSV with columns `key` to `target_reference`; `ubl` is UBL 2.1 JSON invoice lines with no invoice header. 400 `billing_format`.'
      x-unfold-role: admin
      parameters:
        - { name: format, in: query, required: false, schema: { type: string, enum: [csv, ubl], default: csv } }
      responses:
        '200':
          description: 'The file, with `Content-Disposition: attachment`.'
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema: { type: array, items: { type: object } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/billing/lines/{billingLineId}/send:
    parameters:
      - $ref: '#/components/parameters/BillingLineId'
    post:
      tags: [Billing]
      operationId: sendBillingLineAgain
      summary: 'Send a failed line again'
      description: 'Only a `failed` line (409 `billing_not_failed`); one whose outcome is `uncertain` needs `checked: true`, the person''s word that the tool does not have it (409 `billing_check_first`).'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { checked: { type: boolean } } }
      responses:
        '200': { $ref: '#/components/responses/BillingLine' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/billing/lines/{billingLineId}/found:
    parameters:
      - $ref: '#/components/parameters/BillingLineId'
    post:
      tags: [Billing]
      operationId: markBillingLineFound
      summary: 'Mark an uncertain line as found in the tool'
      description: 'The line becomes `sent` and is never sent again. 409 `billing_not_uncertain`.'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '200': { $ref: '#/components/responses/BillingLine' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/billing/lines/{billingLineId}/price:
    parameters:
      - $ref: '#/components/parameters/BillingLineId'
    post:
      tags: [Billing]
      operationId: priceBillingLine
      summary: 'Price a line that waits for one, then send it'
      description: 'Only a `needs_price` line (409 `billing_priced`); 400 `billing_price`.'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price]
              properties:
                price: { type: string, pattern: '^\d+(\.\d{1,2})?$' }
                size: { type: string, enum: [S, M, L] }
      responses:
        '200': { $ref: '#/components/responses/BillingLine' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/billing/lines/{billingLineId}/reverse:
    parameters:
      - $ref: '#/components/parameters/BillingLineId'
    post:
      tags: [Billing]
      operationId: reverseBillingLine
      summary: 'Credit a sent line, or cancel one never sent'
      description: 'A sent line gets a credit line keyed `<key>:reversal` with quantity -1 at the same price; a line never sent becomes `cancelled`. Within 14 days of Acceptance (409 `billing_reversal_late`), once (409 `billing_reversed`); an uncertain or sending line answers 409 `billing_check_first`. `reason` says which defect inside the Acceptance Conditions the revert fixed (400 `billing_reason`).'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
                revertUrl: { type: string, format: uri }
      responses:
        '200': { $ref: '#/components/responses/BillingLine' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/intake/{intakeSourceId}:
    parameters:
      - $ref: '#/components/parameters/IntakeSourceId'
    post:
      tags: [Request intake]
      operationId: deliverIntakeRequest
      summary: 'A sender delivers a Request'
      description: |
        Needs no sign-in, no `X-Unfold-Request` header and no same-origin check: the source's verifier proves the
        delivery instead (`standard-webhooks`, `hub-signature-256`, `zendesk` or `token`). A webhook source takes
        `application/json`, read through its template; an email source takes `message/rfc822` or an inbound-mail JSON
        body. At most 5 MiB. Rate limited per sender address and per source before the signature is checked. The answer
        never echoes the payload, and a delivery is not an Action Record. 404 for an unknown source, or while the
        source's Tenant has the `intake.requests` flag off.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
          message/rfc822:
            schema: { type: string }
      responses:
        '200':
          description: '`{outcome: "threaded" | "duplicate", request}`, or `{replayed: true, outcome, request}` for a repeated `webhook-id`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntakeDelivery' }
        '201':
          description: '`{outcome: "created", request}`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntakeDelivery' }
        '202':
          description: '`{outcome: "ignored", reason, request: null}`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntakeDelivery' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: '`signature_missing`, `signature_invalid` or `timestamp_outside_window`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: '`intake_no_title`: the payload gives the Request no title.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/intake/templates:
    get:
      tags: [Request intake]
      operationId: listIntakeTemplates
      summary: 'The intake templates and verifiers'
      description: '404 `intake_off` while the `intake.requests` flag is off for the caller.'
      x-unfold-role: viewer
      responses:
        '200':
          description: '`{templates, verifiers}`: each template `{id, name, verifier, check, docs, notes, mapping, senderBody}`, each verifier `{name, signed, generatesSecret}`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates: { type: array, items: { type: object } }
                  verifiers: { type: array, items: { type: object } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/intake/sources:
    get:
      tags: [Request intake]
      operationId: listIntakeSources
      summary: 'The intake sources the caller administers'
      description: 'Never a secret. Empty for anyone but an administrator; while `tenancy.enforce` is on, only the sources of Tenants the caller is an Admin of. 404 `intake_off` while the flag is off for the caller.'
      x-unfold-role: viewer
      responses:
        '200':
          description: '`{sources}`'
          content:
            application/json:
              schema: { type: object, properties: { sources: { type: array, items: { $ref: '#/components/schemas/IntakeSource' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Request intake]
      operationId: createIntakeSource
      summary: 'Add an intake source'
      description: 'Without `secret`, Unfold makes one and answers it this once; with one, `secret` is null. A webhook names a registered `template` or `custom` with a `mapping` (400 `intake_mapping`). 400 `intake_source` or `intake_secret`, 403 for a Tenant the caller is not an Admin of while tenancy is enforced, 409 `intake_source_exists`, 404 `intake_off` while the flag is off for the caller.'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, tenant]
              properties:
                id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
                name: { type: string }
                kind: { type: string, enum: [webhook, email], default: webhook }
                tenant: { type: string }
                client: { type: [string, 'null'] }
                template: { type: string }
                mapping: { type: object }
                verifier: { type: string }
                secret: { type: string }
                address: { type: string }
                senders: { type: array, items: { type: string } }
                rateLimit: { type: object }
      responses:
        '201': { $ref: '#/components/responses/IntakeSourceWithSecret' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/intake/sources/{intakeSourceId}:
    parameters:
      - $ref: '#/components/parameters/IntakeSourceId'
    delete:
      tags: [Request intake]
      operationId: removeIntakeSource
      summary: 'Remove an intake source'
      description: 'Deliveries to it answer 404 from then on; its Requests stay. 404 `not_found` for a source the caller does not administer, `intake_off` while the flag is off for the caller.'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      responses:
        '200':
          description: '`{removed}`'
          content:
            application/json:
              schema: { type: object, properties: { removed: { type: string } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/intake/sources/{intakeSourceId}/secret:
    parameters:
      - $ref: '#/components/parameters/IntakeSourceId'
    post:
      tags: [Request intake]
      operationId: replaceIntakeSourceSecret
      summary: 'Replace a source''s secret'
      description: 'Without `secret`, Unfold makes one and answers it this once. The old secret stops working at once. 400 `intake_secret`, 404 `not_found` or `intake_off`.'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { secret: { type: string } } }
      responses:
        '200': { $ref: '#/components/responses/IntakeSourceWithSecret' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/intake/requests:
    get:
      tags: [Request intake]
      operationId: listIntakeRequests
      summary: 'The Requests the caller reaches, newest change first'
      description: 'While tenancy is enforced a person reaches the Requests of their Tenants, and a Client user those of their Client. 404 `intake_off` while the flag is off for the caller.'
      x-unfold-role: viewer
      parameters:
        - { name: source, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: before, in: query, required: false, description: 'The `updatedAt` of the last Request read.', schema: { type: string, format: date-time } }
      responses:
        '200':
          description: '`{requests}`'
          content:
            application/json:
              schema: { type: object, properties: { requests: { type: array, items: { $ref: '#/components/schemas/IntakeRequest' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/intake/requests/{intakeRequestId}:
    parameters:
      - name: intakeRequestId
        in: path
        required: true
        schema: { type: string }
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    get:
      tags: [Request intake]
      operationId: getIntakeRequest
      summary: 'One Request'
      description: '404 `not_found` for a Request the caller does not reach, `intake_off` while the flag is off for the caller.'
      x-unfold-role: viewer
      responses:
        '200':
          description: '`{request}`'
          content:
            application/json:
              schema: { type: object, properties: { request: { $ref: '#/components/schemas/IntakeRequest' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/audit:
    get:
      tags: [Administration]
      operationId: readAuditRecords
      summary: 'A Tenant''s OCSF security audit as NDJSON'
      description: |
        One OCSF 1.9.0 event per line, oldest first, after sequence `cursor` and from ISO time `since`. Needs an Admin
        membership of the Tenant asked for; `tenant` may be left out by someone who administers exactly one Tenant
        (400 `audit_tenant` otherwise, 403 `audit_tenant_forbidden`). 404 `audit_export_off` while the Tenant's
        `audit.export` flag is off; 400 `audit_since`, `audit_cursor` or `audit_limit`. Each read is itself recorded.
      x-unfold-role: admin
      parameters:
        - { name: tenant, in: query, required: false, schema: { type: string } }
        - { name: since, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, required: false, description: 'The sequence number of the last record read.', schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        '200':
          description: 'The records. `X-Unfold-Audit-Next-Cursor` and `Link: <…>; rel="next"` follow when more records wait.'
          headers:
            X-Unfold-Audit-Tenant: { schema: { type: string } }
            X-Unfold-Audit-Head: { description: '`<sequence>:<sha256>` of the chain''s newest record.', schema: { type: string } }
            X-Unfold-Audit-Next-Cursor: { schema: { type: integer } }
            Link: { schema: { type: string } }
          content:
            application/x-ndjson:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/audit/verify:
    get:
      tags: [Administration]
      operationId: verifyAuditChain
      summary: 'Check a Tenant''s audit hash chain'
      description: 'Checked from the chain''s newest retention anchor, whatever the `audit.export` flag says. The Tenant rules of `GET /api/admin/audit` apply.'
      x-unfold-role: admin
      parameters:
        - { name: tenant, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: '`{tenant, ok, checked, anchor, head, break}`; `break` is `{sequence, reason}` with reason `sequence_gap`, `previous_hash`, `hash` or `unreadable`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant: { type: string }
                  ok: { type: boolean }
                  checked: { type: integer }
                  anchor: {}
                  head: {}
                  break: { oneOf: [{ type: 'null' }, { type: object, properties: { sequence: { type: integer }, reason: { type: string, enum: [sequence_gap, previous_hash, hash, unreadable] } } }] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/webhooks:
    get:
      tags: [Administration]
      operationId: listWebhooks
      summary: 'The webhook subscriptions, the Tenants the caller administers and the published event types'
      description: '`tenants` carries each Tenant''s `events.webhooks` flag value.'
      x-unfold-role: admin
      responses:
        '200':
          description: '`{demo, sources, tenants, eventTypes, allowedPrivateTargets, subscriptions}`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  demo: { type: boolean }
                  tenants: { type: array, items: { type: object, properties: { tenant: { type: string }, enabled: { type: boolean } } } }
                  eventTypes: { type: array, items: { type: object, properties: { type: { type: string }, title: { type: string }, summary: { type: string } } } }
                  allowedPrivateTargets: { type: array, items: { type: string } }
                  subscriptions: { type: array, items: { $ref: '#/components/schemas/WebhookSubscription' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Administration]
      operationId: createWebhook
      summary: 'Subscribe a receiver to product events'
      description: |
        `secret` (`whsec_…`) is shown this once. `types` is 1 to 50 published types or prefixes ending in `.*` (400
        `webhook_types`). `tenant` defaults to `default`; a `client` limits the subscription to that Client's events
        (400 `webhook_scope`). `url` must be `https` and resolve only to public addresses unless
        `outboundEvents.allowedPrivateTargets` names it: 400 `webhook_url`, `webhook_url_scheme`,
        `webhook_target_private` or `webhook_target_unresolved`. 409 `webhooks_off` while the Tenant's flag is off,
        409 `webhook_limit` beyond 100 subscriptions.
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, types]
              properties:
                url: { type: string, format: uri }
                types: { type: array, minItems: 1, maxItems: 50, items: { type: string } }
                tenant: { type: string, default: default }
                client: { type: [string, 'null'] }
                description: { type: string, maxLength: 200 }
      responses:
        '201':
          description: '`{subscription, secret}`'
          content:
            application/json:
              schema: { type: object, properties: { subscription: { $ref: '#/components/schemas/WebhookSubscription' }, secret: { type: string } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/webhooks/{subscriptionId}:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      tags: [Administration]
      operationId: getWebhook
      summary: 'One subscription'
      x-unfold-role: admin
      responses:
        '200': { $ref: '#/components/responses/WebhookSubscription' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Administration]
      operationId: updateWebhook
      summary: 'Change a subscription'
      description: 'Checked as on creation. `active: true` clears a `disabledReason`, such as the one a 410 answer set. 400 `webhook_description` or `webhook_active`.'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
                types: { type: array, minItems: 1, maxItems: 50, items: { type: string } }
                description: { type: string, maxLength: 200 }
                active: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/WebhookSubscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Administration]
      operationId: deleteWebhook
      summary: 'Remove a subscription, its deliveries and its secret'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      responses:
        '200':
          description: '`{deleted}`'
          content:
            application/json:
              schema: { type: object, properties: { deleted: { type: string } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/webhooks/{subscriptionId}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      tags: [Administration]
      operationId: rotateWebhookSecret
      summary: 'Give a subscription a new secret'
      description: 'The old secret keeps signing next to it for 24 hours.'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '200':
          description: '`{subscription, secret, previousSignsUntil}`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription: { $ref: '#/components/schemas/WebhookSubscription' }
                  secret: { type: string }
                  previousSignsUntil: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/webhooks/{subscriptionId}/test:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      tags: [Administration]
      operationId: testWebhook
      summary: 'Queue a test event to this subscription only'
      description: 'The event is `dev.unfold.webhook.test` and reports nothing that happened.'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '202':
          description: '`{queued}`: the event id.'
          content:
            application/json:
              schema: { type: object, properties: { queued: { type: string } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/webhooks/{subscriptionId}/deliveries:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      tags: [Administration]
      operationId: listWebhookDeliveries
      summary: 'The newest 100 deliveries of a subscription'
      x-unfold-role: admin
      responses:
        '200':
          description: '`{deliveries}`'
          content:
            application/json:
              schema: { type: object, properties: { deliveries: { type: array, items: { $ref: '#/components/schemas/WebhookDelivery' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/webhooks/{subscriptionId}/deliveries/{deliveryId}/resend:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
      - name: deliveryId
        in: path
        required: true
        schema: { type: string, pattern: '^\d{1,15}$' }
        example: '1'
    post:
      tags: [Administration]
      operationId: resendWebhookDelivery
      summary: 'Put a dead delivery back in the queue'
      description: 'With a fresh attempt count. 404 `webhook_delivery_not_found`, 409 `webhook_delivery_not_dead`: a pending delivery retries by itself.'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '202':
          description: '`{delivery}`'
          content:
            application/json:
              schema: { type: object, properties: { delivery: { $ref: '#/components/schemas/WebhookDelivery' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/tenant-exports:
    get:
      tags: [Administration]
      operationId: listTenantExports
      summary: 'The exports the caller started, newest first'
      description: 'A browser session only (403 `browser_only`); 403 `tenant_export_off` while the `tenant.export` flag is off.'
      x-unfold-role: admin
      security:
        - sessionCookie: []
      responses:
        '200':
          description: '`{exports}`'
          content:
            application/json:
              schema: { type: object, properties: { exports: { type: array, items: { $ref: '#/components/schemas/TenantExport' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Administration]
      operationId: startTenantExport
      summary: 'Start exporting everything Unfold holds for a Tenant'
      description: |
        Answers at once with the running export. `tenant` defaults to `default`; `confirm` must repeat it (400
        `tenant_export_confirm`). While `tenancy.enforce` is off only `default` exists, and while it is on the caller
        needs an Admin membership of the Tenant (404 `tenant_not_found` otherwise). 409 `tenant_export_running` while
        another export runs. A browser session only (403 `browser_only`); 403 `tenant_export_off` while the flag is off.
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                tenant: { type: string, default: default }
                confirm: { type: string }
      responses:
        '202': { $ref: '#/components/responses/TenantExport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/tenant-exports/{tenantExportId}:
    parameters:
      - $ref: '#/components/parameters/TenantExportId'
    get:
      tags: [Administration]
      operationId: getTenantExport
      summary: 'One export'
      description: '404 `tenant_export_not_found` once it expired or was deleted, or when another person started it. A browser session only (403 `browser_only`).'
      x-unfold-role: admin
      security:
        - sessionCookie: []
      responses:
        '200': { $ref: '#/components/responses/TenantExport' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Administration]
      operationId: deleteTenantExport
      summary: 'Delete an export and its bundle before it expires'
      description: '409 `tenant_export_running` while it runs. A browser session only (403 `browser_only`).'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
      responses:
        '200':
          description: '`{deleted}`'
          content:
            application/json:
              schema: { type: object, properties: { deleted: { type: string } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/tenant-exports/{tenantExportId}/download:
    parameters:
      - $ref: '#/components/parameters/TenantExportId'
    get:
      tags: [Administration]
      operationId: downloadTenantExport
      summary: 'The export bundle'
      description: 'A gzip-compressed tar of JSON Lines, one file per entity, with a JSON Schema per entity and a manifest. 409 `tenant_export_not_ready` while running or after a failure. Recorded as an Action Record. A browser session only (403 `browser_only`).'
      x-unfold-role: admin
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 'The bundle, with `Content-Disposition`, `Content-Length` and `Repr-Digest: sha-256=:<base64>:`.'
          headers:
            Repr-Digest: { schema: { type: string } }
          content:
            application/gzip:
              schema: { type: string, contentEncoding: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/relay/pool/claim:
    get:
      tags: [Workspace relay]
      operationId: claimPoolAssignment
      summary: 'A pooled worker pod claims its assignment'
      description: 'Long-polls up to the relay limit. 401 `unauthorized` for a rejected pod token, 403 `pod` for another pod''s assignment, 503 `verifier_unavailable`.'
      x-internal: true
      security:
        - podToken: []
      parameters:
        - { name: pod, in: query, required: false, schema: { type: string } }
        - { name: wait, in: query, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: '`{assignment}`, null when none waits.'
          content:
            application/json:
              schema: { type: object, properties: { assignment: { type: [object, 'null'] } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/relay/{relaySessionId}/requests:
    parameters:
      - $ref: '#/components/parameters/RelaySessionId'
    get:
      tags: [Workspace relay]
      operationId: pollRelayRequests
      summary: 'The workspace worker polls for relayed requests'
      description: '401 `revoked` tells the worker to stop at once; 401 `unauthorized` otherwise.'
      x-internal: true
      security:
        - relayToken: []
      parameters:
        - { name: wait, in: query, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: '`{requests, cancelled}`, at most 32 requests.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests: { type: array, items: { type: object } }
                  cancelled: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/relay/{relaySessionId}/responses/{relayRequestId}:
    parameters:
      - $ref: '#/components/parameters/RelaySessionId'
      - name: relayRequestId
        in: path
        required: true
        schema: { type: string, pattern: '^[a-zA-Z0-9_-]{1,32}$' }
        example: req-1
    post:
      tags: [Workspace relay]
      operationId: postRelayResponse
      summary: 'The workspace worker uploads one relayed response'
      description: 'The body is the relayed response body; `X-Relay-Status` and `X-Relay-Headers` carry its status and headers. 400 `invalid_status`, 404 `unknown_request`.'
      x-internal: true
      security:
        - relayToken: []
      parameters:
        - { name: X-Relay-Status, in: header, required: true, schema: { type: integer, minimum: 200, maximum: 599 } }
        - { name: X-Relay-Headers, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, contentEncoding: binary }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: unfold
      description: 'The login cookie, HttpOnly and SameSite Strict. With secure cookies (an HTTPS base URL) its name is `__Host-unfold`.'
    unfoldRequest:
      type: apiKey
      in: header
      name: X-Unfold-Request
      description: 'Not a credential. Every mutation sends `X-Unfold-Request: 1` beside its credential, and passes the same-origin checks.'
    editorBearer:
      type: http
      scheme: bearer
      bearerFormat: vle_ followed by 43 base64url characters
      description: 'An editor credential, issued after its person approves the editor sign-in. It acts as its person with their current role, except on the browser-only routes.'
    mcpDelegated:
      type: http
      scheme: bearer
      bearerFormat: vlm_ followed by 43 base64url characters
      description: 'A credential `unfold-mcp` over HTTP mints for at most five minutes to call this API for the person behind its access token. It reaches only the operations that list it, never more than the person''s role.'
    relayToken:
      type: http
      scheme: bearer
      description: 'A per-workspace relay credential held by that workspace''s worker.'
    podToken:
      type: http
      scheme: bearer
      description: 'A Kubernetes service account token of a pooled worker pod.'
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9_-]+$' }
      example: 6b1f0c2e-5d4a-4c3b-9a8e-7f6d5c4b3a21
    WorkItemId:
      name: workItemId
      in: path
      required: true
      description: 'Ploeg''s Work Item id.'
      schema: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
      example: '184'
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string }
      example: run-901
    LinkedSessionId:
      name: linkedSessionId
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
      example: claude-7f3a9c21
    PermissionId:
      name: permissionId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 3f2b9c1e-8a7d-4e6f-9b0a-1c2d3e4f5a6b
    EditorCode:
      name: code
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,32}$' }
      example: Zk3vQ9pLx2Rt
    FlagKey:
      name: flagKey
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9.-]{2,100}$' }
      example: now.loop
    LinkProvider:
      name: provider
      in: path
      required: true
      description: 'A registered link provider: `gitlab` or `clickup`. Any other name answers 404.'
      schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,63}$' }
      example: gitlab
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9-]+$' }
      example: vikunja-glide
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9_-]+$' }
      example: '2051'
    CardId:
      name: cardId
      in: path
      required: true
      description: 'The card''s Work Item id.'
      schema: { type: string, maxLength: 40 }
      example: '184'
    PackId:
      name: packId
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_.:@~-]{1,120}$' }
      example: 2026-W40
    ThemeId:
      name: themeId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
      example: forge-night
    RelaySessionId:
      name: relaySessionId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9_-]{1,80}$' }
      example: 6b1f0c2e-5d4a-4c3b-9a8e-7f6d5c4b3a21
    TeamQuery:
      name: team
      in: query
      required: false
      schema: { type: string }
    Refresh:
      name: refresh
      in: query
      required: false
      description: '`1` bypasses the short cache.'
      schema: { type: string, enum: ['1'] }
    AfterCursor:
      name: after
      in: query
      required: false
      schema: { type: integer, minimum: 0 }
    BeforeCursor:
      name: before
      in: query
      required: false
      schema: { type: string }
    BillingLineId:
      name: billingLineId
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-f-]{36}$' }
      example: 2f1c7e0a-8b3d-4c5e-9f6a-1b2c3d4e5f60
    IntakeSourceId:
      name: intakeSourceId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
      example: support-desk
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: { type: string, pattern: '^sub_[a-f0-9]{24}$' }
      example: sub_0123456789abcdef01234567
    TenantExportId:
      name: tenantExportId
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-f]{32}$' }
      example: 0123456789abcdef0123456789abcdef
  requestBodies:
    Empty:
      description: 'An action without input sends `{}`.'
      required: true
      content:
        application/json:
          schema: { type: object }
    DeliveryBinding:
      description: 'The candidate, receipt and policy as displayed.'
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [candidateId, receiptId, policySha256]
            additionalProperties: false
            properties:
              candidateId: { type: string }
              receiptId: { type: string }
              policySha256: { type: string }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [not_found, forbidden, csrf] }
            message: { type: string }
    User:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [admin, operator, viewer] }
        memberships: { type: array, items: { type: object } }
    Session:
      type: object
      description: 'A public session view. Every session carries both `teamId` and the deprecated `crewId`.'
      required: [id, status]
      properties:
        id: { type: string }
        title: { type: string }
        objective: { type: string }
        status: { type: string }
        repositoryId: { type: string }
        teamId: { type: string }
        crewId: { type: string, deprecated: true }
        runtime: { type: string }
        placement: { type: string }
        budgetUsd: { type: number }
        spentUsd: { type: number }
        observedUsd: { type: number }
        runs: { type: array, items: { type: object } }
        failure: { type: object }
        review: { type: object }
        candidate: { type: object }
    SessionEvent:
      type: object
      required: [id, sessionId, type, at]
      properties:
        id: { type: integer }
        sessionId: { type: string }
        type: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string }
        runId: { type: string }
        data: { type: object }
    WorkItem:
      type: object
      properties:
        id: { type: string }
        team: { type: string }
        state: { type: string }
        title: { type: string }
        url: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Ask:
      type: object
      properties:
        id: { type: string }
        workItemId: { type: string }
        question: { type: string }
        answer: { type: [string, 'null'] }
        status: { type: string }
        source: { type: string }
        costUsd: { type: [number, 'null'] }
        createdAt: { type: string, format: date-time }
    StatusNote:
      type: object
      properties:
        id: { type: string }
        severity: { type: string, enum: [info, degraded, outage] }
        text: { type: string }
        author: { type: string }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        resolvedBy: { type: string }
    EditorRequest:
      type: object
      properties:
        userCode: { type: string }
        label: { type: string }
        status: { type: string, enum: [waiting, approved, denied] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        workbench: { type: string }
        user: { type: string }
        role: { type: string }
        credentialDays: { type: integer }
    EditorWindow:
      type: object
      required: [protocol, windowId]
      properties:
        protocol: { type: string, enum: [vscode, vscode-insiders] }
        windowId: { type: integer }
    Placement:
      type: string
      enum: [local, docker, kubernetes]
    Window:
      type: string
      enum: [24h, 7d, 30d]
    OfrepRequest:
      type: object
      properties:
        context: { type: object, additionalProperties: true }
    OfrepFlag:
      type: object
      properties:
        key: { type: string }
        value: {}
        reason: { type: string }
        variant: { type: string }
        metadata: { type: object }
    OfrepError:
      type: object
      properties:
        key: { type: string }
        errorCode: { type: string }
        errorDetails: { type: string }
    BillingLine:
      type: object
      properties:
        id: { type: string }
        line: { type: object }
        exporter: { type: string }
        state: { type: string, enum: [pending, needs_price, sending, sent, failed, cancelled] }
        attempts: { type: integer }
        nextAttemptAt: { type: [string, 'null'] }
        lastError: { type: [string, 'null'] }
        uncertain: { type: boolean }
        remoteId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        sentAt: { type: [string, 'null'] }
        revertDetected: {}
        reversedBy: { type: [string, 'null'] }
        cancelReason: { type: [string, 'null'] }
    IntakeSource:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [webhook, email] }
        tenant: { type: string }
        client: { type: [string, 'null'] }
        template: { type: [string, 'null'] }
        mapping: {}
        verifier: { type: string }
        address: { type: [string, 'null'] }
        senders: { type: array, items: { type: string } }
        rateLimit: { type: object }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        secretSetAt: { type: string, format: date-time }
        url: { type: string }
    IntakeRequest:
      type: object
      properties:
        id: { type: string }
        tenant: { type: string }
        client: { type: [string, 'null'] }
        sourceId: { type: string }
        channel: { type: string, enum: [webhook, email] }
        state: { type: string }
        title: { type: string }
        description: { type: string }
        reporter: {}
        links: { type: array, items: {} }
        attachments: { type: array, items: { type: object } }
        labels: { type: array, items: { type: string } }
        externalId: { type: [string, 'null'] }
        messages: { type: array, items: { type: object } }
        receivedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IntakeDelivery:
      type: object
      properties:
        outcome: { type: string, enum: [created, threaded, duplicate, ignored] }
        replayed: { type: boolean }
        reason: { type: string }
        request: {}
    WebhookSubscription:
      type: object
      properties:
        id: { type: string }
        tenant: { type: string }
        client: { type: [string, 'null'] }
        url: { type: string }
        types: { type: array, items: { type: string } }
        description: { type: string }
        active: { type: boolean }
        disabledReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        updatedAt: { type: string, format: date-time }
        deliveries: { type: object, properties: { pending: { type: integer }, delivered: { type: integer }, dead: { type: integer } } }
    WebhookDelivery:
      type: object
      properties:
        id: { type: integer }
        subscriptionId: { type: string }
        eventId: { type: string }
        eventType: { type: string }
        status: { type: string, enum: [pending, delivered, dead] }
        attempts: { type: integer }
        nextAttemptAt: { type: [string, 'null'] }
        lastStatus: { type: [integer, 'null'] }
        lastError: { type: [string, 'null'] }
        deliveredAt: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    TenantExport:
      type: object
      properties:
        id: { type: string }
        tenant: { type: string }
        state: { type: string, enum: [running, ready, failed] }
        requestedBy: { type: object }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'] }
        expiresAt: { type: [string, 'null'] }
        bytes: { type: [integer, 'null'] }
        sha256: { type: [string, 'null'] }
        rows: { type: [integer, 'null'] }
        error: { type: [string, 'null'] }
        downloadUrl: { type: [string, 'null'] }
  responses:
    Ok:
      description: 'The JSON answer; [HTTP contract](api.md) lists its fields.'
      content:
        application/json:
          schema: { type: object }
    Session:
      description: 'The session.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Session' }
    LinkedSession:
      description: '`{session}`'
      content:
        application/json:
          schema: { type: object, properties: { session: { type: object } } }
    LabsView:
      description: '`{values, labs}`'
      content:
        application/json:
          schema:
            type: object
            properties:
              values: { type: object, additionalProperties: true }
              labs: { type: array, items: { type: object } }
    AdminFlags:
      description: '`{flags, segments, audit, file, providers, strategy, console}`'
      content:
        application/json:
          schema:
            type: object
            properties:
              flags: { type: array, items: { type: object } }
              segments: { type: array, items: { type: object } }
              audit: { type: array, items: { type: object } }
    Snoozes:
      description: '`{snoozes, limit, demo}`'
      content:
        application/json:
          schema:
            type: object
            properties:
              snoozes: { type: array, items: { type: object } }
              limit: { type: integer }
              demo: { type: boolean }
    EditorCredentials:
      description: '`{editors}`'
      content:
        application/json:
          schema: { type: object, properties: { editors: { type: array, items: { type: object } } } }
    AgentsWindowLink:
      description: '`{session, attached, address, connectionAuthority, links: {stable, insiders}}`'
      content:
        application/json:
          schema: { type: object }
    TaskPloegStatus:
      description: '`TaskPloegStatus`: Ploeg''s Teams, the task''s hand-off and its Work Items, with optional `warnings`.'
      content:
        application/json:
          schema: { type: object }
    CardIdentity:
      description: '`{logins, mapped, declared, verified, source, updatedAt}`'
      content:
        application/json:
          schema: { type: object }
    Crack:
      description: '`{crack, demo, message}`'
      content:
        application/json:
          schema: { type: object, properties: { crack: { type: object }, demo: { type: boolean }, message: { type: string } } }
    NotificationsView:
      description: '`{enabled, demo, triggers, preferences, channels, recent}`, plus `result` from a channel route.'
      content:
        application/json:
          schema:
            type: object
            properties:
              enabled: { type: boolean }
              demo: { type: boolean }
              triggers: { type: array, items: { type: object, properties: { id: { type: string }, label: { type: string }, detectedFrom: { type: string } } } }
              preferences: { type: object, properties: { channels: { type: array, items: { type: string } }, triggers: { type: array, items: { type: string } }, quietHours: {} } }
              channels: { type: array, items: { type: object, properties: { id: { type: string }, label: { type: string }, available: { type: boolean } } } }
              recent: { type: array, items: { type: object } }
              result: {}
    BillingLine:
      description: 'The line after the action.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BillingLine' }
    IntakeSourceWithSecret:
      description: '`{source, secret}`; `secret` is shown this once, or null when the caller sent one.'
      content:
        application/json:
          schema:
            type: object
            properties:
              source: { $ref: '#/components/schemas/IntakeSource' }
              secret: { type: [string, 'null'] }
    WebhookSubscription:
      description: '`{subscription}`'
      content:
        application/json:
          schema: { type: object, properties: { subscription: { $ref: '#/components/schemas/WebhookSubscription' } } }
    TenantExport:
      description: '`{export}`'
      content:
        application/json:
          schema: { type: object, properties: { export: { $ref: '#/components/schemas/TenantExport' } } }
    BadRequest:
      description: 'Invalid input; `code` names the field rule, such as `invalid_input` or `invalid_json`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: '`unauthenticated`: no valid credential.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: '`forbidden`, `csrf`, `origin`, `browser_only` or a route-specific refusal.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 'Unknown, or not visible to the caller.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 'The object''s state refuses the request; `code` says why.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: '`body_too_large` or a route-specific size limit.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: '`content_type`: the body has the wrong media type.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: 'A rate or connection limit; `code` names it.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotImplemented:
      description: 'The connected Ploeg does not support this command.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: '`ploeg_unconfigured`, `ploeg_credential`, `ploeg_contract_incompatible` or another unavailable dependency.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
