    get:
      tags: [Agent host]
      operationId: getAgentsWindowWorkItemLink
      summary: 'The link that opens a Work Item''s session in the caller''s Agents window'
      description: 'A Work Item Ploeg hides, one an Operator Execution owns, an unknown id and a workbench without a live Ploeg answer 404 `not_found`. Viewers get 403.'
      x-unfold-role: operator
      responses:
        '200': { $ref: '#/components/responses/AgentsWindowLink' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/links:
    get:
      tags: [Linked accounts]
      operationId: listLinks
      summary: 'The signed-in person''s account links'
      description: 'Never a token.'
      x-unfold-role: viewer
      responses:
        '200':
          description: '`{links}`'
          content:
            application/json:
              schema: { type: object, properties: { links: { type: array, items: { type: object } } } }
  /api/links/{provider}:
    parameters:
      - $ref: '#/components/parameters/LinkProvider'
    post:
      tags: [Linked accounts]
      operationId: beginLink
      summary: 'Start an OAuth link with PKCE'
      description: 'Returns the provider URL to visit; 409 `link_unconfigured` without an application ID.'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '200':
          description: '`{url}`'
          content:
            application/json:
              schema: { type: object, properties: { url: { type: string, format: uri } } }
        '409': { $ref: '#/components/responses/Conflict' }
    put:
      tags: [Linked accounts]
      operationId: pasteLinkToken
      summary: 'Link by a pasted personal token'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: '`{link}` with `method: "token"`.'
          content:
            application/json:
              schema: { type: object, properties: { link: { type: object } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [Linked accounts]
      operationId: unlink
      summary: 'Forget the link'
      x-unfold-role: viewer
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /api/links/{provider}/callback:
    parameters:
      - $ref: '#/components/parameters/LinkProvider'
    get:
      tags: [Linked accounts]
      operationId: completeLink
      summary: 'The provider''s OAuth redirect target'
      description: 'Needs no cookie; the `state` names the person who started it, once, within ten minutes. Redirects to `/?linked=<provider>` or `/?link_error=<code>`.'
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        '303': { description: Redirect back into the workbench. }

  /api/task-sources:
    get:
