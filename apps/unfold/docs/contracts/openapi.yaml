        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/flags/{flagKey}/override:
    parameters:
      - $ref: '#/components/parameters/FlagKey'
    put:
      tags: [Flags]
      operationId: setFlagOverride
      summary: 'Force or clear a flag''s variant for everyone'
      description: '404 `flag_not_found`, 400 `flag_variant` for a variant the flag lacks. Appended to the audit trail.'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variant]
              properties:
                variant: { type: [string, 'null'], maxLength: 64 }
                reason: { type: string, maxLength: 300, description: Required unless `variant` is null. }
      responses:
        '200': { $ref: '#/components/responses/AdminFlags' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/flags/{flagKey}/rollout:
    parameters:
      - $ref: '#/components/parameters/FlagKey'
    put:
      tags: [Flags]
      operationId: setFlagRollout
      summary: 'Store or remove an authored rollout'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rollout]
              properties:
                rollout:
                  type: [object, 'null']
                  properties:
                    state: { type: string }
                    defaultVariant: { type: string }
                    respectLabs: { type: boolean }
                    rules: { type: array, items: { type: object } }
                reason: { type: string, maxLength: 300, description: Required unless `rollout` is null. }
      responses:
        '200': { $ref: '#/components/responses/AdminFlags' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/flag-segments/{segment}:
    parameters:
      - name: segment
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,63}$' }
        example: beta-testers
    put:
      tags: [Flags]
      operationId: setFlagSegment
      summary: 'Store a segment'
      description: 'Every rollout that uses it recompiles.'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: '{ type: string }'
                audience: { type: object, description: 'Any of `roles`, `teams`, `users`, `tenants`.' }
      responses:
        '200': { $ref: '#/components/responses/AdminFlags' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Flags]
      operationId: deleteFlagSegment
      summary: 'Delete a segment'
      description: '409 `flag_segment_in_use` while a rollout uses it.'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      responses:
        '200': { $ref: '#/components/responses/AdminFlags' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/ofrep/v1/evaluate/flags:
    post:
      tags: [Flags]
      operationId: ofrepEvaluateAll
      summary: 'OFREP bulk evaluation'
      description: 'OFREP 0.4.0 for the signed-in person or editor; only browser-visible flags. Identity attributes come from the session; a client may add up to 32 scalar attributes. Needs no `X-Unfold-Request` header and records no Action Record.'
      x-unfold-role: viewer
      security:
        - sessionCookie: []
        - editorBearer: []
      parameters:
        - { name: If-None-Match, in: header, required: false, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfrepRequest' }
      responses:
        '200':
          description: 'Every client flag; `ETag` names this answer.'
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  flags: { type: array, items: { $ref: '#/components/schemas/OfrepFlag' } }
        '304': { description: Unchanged since the `If-None-Match` tag. }
  /api/ofrep/v1/evaluate/flags/{ofrepKey}:
    parameters:
      - name: ofrepKey
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_.-]{1,200}$' }
        example: now.loop
    post:
      tags: [Flags]
      operationId: ofrepEvaluateOne
      summary: 'OFREP single evaluation'
      description: '404 `{key, errorCode: "FLAG_NOT_FOUND"}` for a flag clients cannot see, 400 with `errorCode` when evaluation failed. Needs no `X-Unfold-Request` header.'
      x-unfold-role: viewer
      security:
        - sessionCookie: []
        - editorBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfrepRequest' }
      responses:
        '200':
          description: 'The evaluation.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfrepFlag' }
        '400':
          description: 'Evaluation failed.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfrepError' }
        '404':
          description: 'No client-visible flag has this key.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfrepError' }
  /api/now/snoozes:
    get:
      tags: [Flags]
      operationId: listNowSnoozes
