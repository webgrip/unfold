      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/card-themes/{themeId}/versions:
    parameters:
      - $ref: '#/components/parameters/ThemeId'
    get:
      tags: [Cards]
      operationId: listCardThemeVersions
      summary: 'A theme''s saved versions'
      x-unfold-role: viewer
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /api/card-themes/{themeId}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/ThemeId'
      - name: version
        in: path
        required: true
        schema: { type: string, pattern: '^[1-9][0-9]{0,8}$' }
        example: '3'
    get:
      tags: [Cards]
      operationId: getCardThemeVersion
      summary: 'One saved version of a theme'
      x-unfold-role: viewer
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/card-assets:
    post:
      tags: [Cards]
      operationId: uploadCardAsset
      summary: 'Upload a theme asset'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      parameters:
        - { name: purpose, in: query, required: true, schema: { type: string, enum: [art, back, symbol, shader] } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, contentEncoding: binary }
      responses:
        '201':
          description: '`{id, purpose, mediaType, bytes}`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  purpose: { type: string }
                  mediaType: { type: string }
                  bytes: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /api/card-assets/{assetId}:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: string, pattern: '^[a-f0-9]{64}$' }
        example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
    get:
      tags: [Cards]
      operationId: getCardAsset
      summary: 'The asset, with its stored type, `nosniff` and a sandboxing CSP'
      description: 'Honours a single `Range`.'
      x-unfold-role: viewer
      parameters:
        - { name: Range, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: 'The asset.'
          content:
            application/octet-stream:
              schema: { type: string, contentEncoding: binary }
        '206': { description: The requested range. }
        '404': { $ref: '#/components/responses/NotFound' }
        '416': { description: The range lies outside the asset. }
  /api/card-art/generate:
    post:
      tags: [Cards]
      operationId: generateCardArt
      summary: 'Generate card art shader code'
      description: 'Live mode with `cardThemes.ai` only.'
      x-unfold-role: admin
      security:
        - { sessionCookie: [], unfoldRequest: [] }
        - { editorBearer: [], unfoldRequest: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string }
                attempt: { type: integer }
                compilerLog: { type: string }
      responses:
        '200':
          description: '`{code, problems, attempt, model}`'
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/relay/pool/claim:
    get:
      tags: [Workspace relay]
      operationId: claimPoolAssignment
      summary: 'A pooled worker pod claims its assignment'
      description: 'Long-polls up to the relay limit. 401 `unauthorized` for a rejected pod token, 403 `pod` for another pod''s assignment, 503 `verifier_unavailable`.'
      x-internal: true
      security:
        - podToken: []
      parameters:
        - { name: pod, in: query, required: false, schema: { type: string } }
        - { name: wait, in: query, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: '`{assignment}`, null when none waits.'
          content:
            application/json:
              schema: { type: object, properties: { assignment: { type: [object, 'null'] } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/relay/{relaySessionId}/requests:
    parameters:
      - $ref: '#/components/parameters/RelaySessionId'
    get:
      tags: [Workspace relay]
      operationId: pollRelayRequests
      summary: 'The workspace worker polls for relayed requests'
      description: '401 `revoked` tells the worker to stop at once; 401 `unauthorized` otherwise.'
      x-internal: true
      security:
        - relayToken: []
      parameters:
        - { name: wait, in: query, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: '`{requests, cancelled}`, at most 32 requests.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests: { type: array, items: { type: object } }
                  cancelled: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/relay/{relaySessionId}/responses/{relayRequestId}:
    parameters:
      - $ref: '#/components/parameters/RelaySessionId'
      - name: relayRequestId
        in: path
        required: true
        schema: { type: string, pattern: '^[a-zA-Z0-9_-]{1,32}$' }
        example: req-1
    post:
      tags: [Workspace relay]
      operationId: postRelayResponse
      summary: 'The workspace worker uploads one relayed response'
      description: 'The body is the relayed response body; `X-Relay-Status` and `X-Relay-Headers` carry its status and headers. 400 `invalid_status`, 404 `unknown_request`.'
      x-internal: true
      security:
        - relayToken: []
      parameters:
        - { name: X-Relay-Status, in: header, required: true, schema: { type: integer, minimum: 200, maximum: 599 } }
        - { name: X-Relay-Headers, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, contentEncoding: binary }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: unfold
      description: 'The login cookie, HttpOnly and SameSite Strict. With secure cookies (an HTTPS base URL) its name is `__Host-unfold`.'
    unfoldRequest:
      type: apiKey
      in: header
      name: X-Unfold-Request
      description: 'Not a credential. Every mutation sends `X-Unfold-Request: 1` beside its credential, and passes the same-origin checks.'
    editorBearer:
      type: http
      scheme: bearer
      bearerFormat: vle_ followed by 43 base64url characters
      description: 'An editor credential, issued after its person approves the editor sign-in. It acts as its person with their current role, except on the browser-only routes.'
    mcpDelegated:
      type: http
      scheme: bearer
      bearerFormat: vlm_ followed by 43 base64url characters
      description: 'A credential `unfold-mcp` over HTTP mints for at most five minutes to call this API for the person behind its access token. It reaches only the operations that list it, never more than the person''s role.'
    relayToken:
      type: http
      scheme: bearer
      description: 'A per-workspace relay credential held by that workspace''s worker.'
    podToken:
      type: http
      scheme: bearer
      description: 'A Kubernetes service account token of a pooled worker pod.'
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9_-]+$' }
      example: 6b1f0c2e-5d4a-4c3b-9a8e-7f6d5c4b3a21
    WorkItemId:
      name: workItemId
      in: path
      required: true
      description: 'Ploeg''s Work Item id.'
      schema: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
      example: '184'
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string }
      example: run-901
    LinkedSessionId:
      name: linkedSessionId
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
      example: claude-7f3a9c21
    PermissionId:
      name: permissionId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 3f2b9c1e-8a7d-4e6f-9b0a-1c2d3e4f5a6b
    EditorCode:
      name: code
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,32}$' }
      example: Zk3vQ9pLx2Rt
    FlagKey:
      name: flagKey
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9.-]{2,100}$' }
      example: now.loop
    LinkProvider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [gitlab, clickup] }
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9-]+$' }
      example: vikunja-glide
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9_-]+$' }
      example: '2051'
    CardId:
      name: cardId
      in: path
      required: true
      description: 'The card''s Work Item id.'
      schema: { type: string, maxLength: 40 }
      example: '184'
    PackId:
      name: packId
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_.:@~-]{1,120}$' }
      example: 2026-W40
    ThemeId:
      name: themeId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
      example: forge-night
    RelaySessionId:
      name: relaySessionId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9_-]{1,80}$' }
      example: 6b1f0c2e-5d4a-4c3b-9a8e-7f6d5c4b3a21
    TeamQuery:
      name: team
      in: query
      required: false
      schema: { type: string }
    Refresh:
      name: refresh
      in: query
      required: false
      description: '`1` bypasses the short cache.'
      schema: { type: string, enum: ['1'] }
    AfterCursor:
      name: after
      in: query
      required: false
      schema: { type: integer, minimum: 0 }
    BeforeCursor:
      name: before
      in: query
      required: false
      schema: { type: string }
  requestBodies:
    Empty:
      description: 'An action without input sends `{}`.'
      required: true
      content:
        application/json:
          schema: { type: object }
    DeliveryBinding:
      description: 'The candidate, receipt and policy as displayed.'
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [candidateId, receiptId, policySha256]
            additionalProperties: false
            properties:
              candidateId: { type: string }
              receiptId: { type: string }
              policySha256: { type: string }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [not_found, forbidden, csrf] }
            message: { type: string }
    User:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [admin, operator, viewer] }
        memberships: { type: array, items: { type: object } }
    Session:
      type: object
      description: 'A public session view. Every session carries both `teamId` and the deprecated `crewId`.'
      required: [id, status]
      properties:
        id: { type: string }
        title: { type: string }
        objective: { type: string }
        status: { type: string }
        repositoryId: { type: string }
        teamId: { type: string }
        crewId: { type: string, deprecated: true }
        runtime: { type: string }
        placement: { type: string }
        budgetUsd: { type: number }
        spentUsd: { type: number }
        observedUsd: { type: number }
        runs: { type: array, items: { type: object } }
        failure: { type: object }
        review: { type: object }
        candidate: { type: object }
    SessionEvent:
      type: object
      required: [id, sessionId, type, at]
      properties:
        id: { type: integer }
        sessionId: { type: string }
        type: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string }
        runId: { type: string }
        data: { type: object }
    WorkItem:
      type: object
      properties:
        id: { type: string }
        team: { type: string }
        state: { type: string }
        title: { type: string }
        url: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Ask:
      type: object
      properties:
        id: { type: string }
        workItemId: { type: string }
        question: { type: string }
        answer: { type: [string, 'null'] }
        status: { type: string }
        source: { type: string }
        costUsd: { type: [number, 'null'] }
        createdAt: { type: string, format: date-time }
    StatusNote:
      type: object
      properties:
        id: { type: string }
        severity: { type: string, enum: [info, degraded, outage] }
        text: { type: string }
        author: { type: string }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        resolvedBy: { type: string }
    EditorRequest:
      type: object
      properties:
        userCode: { type: string }
        label: { type: string }
        status: { type: string, enum: [waiting, approved, denied] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        workbench: { type: string }
        user: { type: string }
        role: { type: string }
        credentialDays: { type: integer }
    EditorWindow:
      type: object
      required: [protocol, windowId]
      properties:
        protocol: { type: string, enum: [vscode, vscode-insiders] }
        windowId: { type: integer }
    Placement:
      type: string
      enum: [local, docker, kubernetes]
    Window:
      type: string
      enum: [24h, 7d, 30d]
    OfrepRequest:
      type: object
      properties:
        context: { type: object, additionalProperties: true }
    OfrepFlag:
      type: object
      properties:
        key: { type: string }
        value: {}
        reason: { type: string }
        variant: { type: string }
        metadata: { type: object }
    OfrepError:
      type: object
      properties:
        key: { type: string }
        errorCode: { type: string }
        errorDetails: { type: string }
  responses:
    Ok:
      description: 'The JSON answer; [HTTP contract](api.md) lists its fields.'
      content:
        application/json:
          schema: { type: object }
    Session:
      description: 'The session.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Session' }
    LinkedSession:
      description: '`{session}`'
      content:
        application/json:
          schema: { type: object, properties: { session: { type: object } } }
    LabsView:
      description: '`{values, labs}`'
      content:
        application/json:
          schema:
            type: object
            properties:
              values: { type: object, additionalProperties: true }
              labs: { type: array, items: { type: object } }
    AdminFlags:
      description: '`{flags, segments, audit, file, providers, strategy, console}`'
      content:
        application/json:
          schema:
            type: object
            properties:
              flags: { type: array, items: { type: object } }
              segments: { type: array, items: { type: object } }
              audit: { type: array, items: { type: object } }
    Snoozes:
      description: '`{snoozes, limit, demo}`'
      content:
        application/json:
          schema:
            type: object
            properties:
              snoozes: { type: array, items: { type: object } }
              limit: { type: integer }
              demo: { type: boolean }
    EditorCredentials:
      description: '`{editors}`'
      content:
        application/json:
          schema: { type: object, properties: { editors: { type: array, items: { type: object } } } }
    AgentsWindowLink:
      description: '`{session, attached, address, connectionAuthority, links: {stable, insiders}}`'
      content:
        application/json:
          schema: { type: object }
    TaskPloegStatus:
      description: '`TaskPloegStatus`: Ploeg''s Teams, the task''s hand-off and its Work Items, with optional `warnings`.'
      content:
        application/json:
          schema: { type: object }
    CardIdentity:
      description: '`{logins, mapped, declared, verified, source, updatedAt}`'
      content:
        application/json:
          schema: { type: object }
    Crack:
      description: '`{crack, demo, message}`'
      content:
        application/json:
          schema: { type: object, properties: { crack: { type: object }, demo: { type: boolean }, message: { type: string } } }
    BadRequest:
      description: 'Invalid input; `code` names the field rule, such as `invalid_input` or `invalid_json`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: '`unauthenticated`: no valid credential.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: '`forbidden`, `csrf`, `origin`, `browser_only` or a route-specific refusal.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 'Unknown, or not visible to the caller.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 'The object''s state refuses the request; `code` says why.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: '`body_too_large` or a route-specific size limit.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: '`content_type`: the body has the wrong media type.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: 'A rate or connection limit; `code` names it.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotImplemented:
      description: 'The connected Ploeg does not support this command.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: '`ploeg_unconfigured`, `ploeg_credential`, `ploeg_contract_incompatible` or another unavailable dependency.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
