      parameters:
        - $ref: '#/components/parameters/Refresh'
      responses:
        '200': { $ref: '#/components/responses/TaskPloegStatus' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
