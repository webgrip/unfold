      summary: 'Add a Microsoft Teams workflow webhook'
      description: 'The URL must be HTTPS on a host ending in one of `notifications.teams.allowedHosts` (400 `teams_webhook`). The view shows only its host and label, never the URL. A person keeps at most 5, the oldest goes first. 409 `notify_unavailable` when Teams is not configured; 404 `not_found` while `notifications.push` or `notifications.teams` is off for the person.'
