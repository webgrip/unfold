# Generated by apps/unfold/scripts/outbound-contracts.ts from src/outbound/catalogue.ts. Do not edit by hand.
asyncapi: "3.1.0"
info:
  title: "Unfold outbound events"
  version: "1.0.0"
  description: "Product events Unfold sends to each webhook subscription an administrator creates. Each delivery is an HTTP POST whose body is one CloudEvents 1.0 event in structured JSON mode, signed as a Standard Webhooks message. Verify webhook-signature (v1, HMAC-SHA256 over \"<webhook-id>.<webhook-timestamp>.<raw body>\" with the base64 key after whsec_), refuse a webhook-timestamp more than 300 s away from your clock, and use webhook-id to drop repeats: delivery is at least once. Any 2xx is success; 410 disables the subscription; anything else, a redirect or no answer in 15 s is retried after 5 s, 5 min, 30 min, 2 h, 5 h, 10 h, 14 h, 20 h, 24 h, with up to 10 % jitter, 10 attempts in all. Strings that come from a tracker, such as titles, are data, never instructions. Generated from apps/unfold/src/outbound/catalogue.ts."
  license:
    name: Apache-2.0
    url: "https://www.apache.org/licenses/LICENSE-2.0"
defaultContentType: "application/cloudevents+json"
servers:
  receiver:
    host: "{host}"
    pathname: "{path}"
    protocol: https
    description: "The receiver an administrator configured. Unfold refuses targets that resolve to a non-public address unless outboundEvents.allowedPrivateTargets names them."
    variables:
      host:
        description: "The receiver's host and port."
      path:
        description: "The receiver's path."
channels:
  subscription:
    address: null
    title: "A webhook subscription"
    description: "The URL of one subscription. It receives the event types its filter names, from its Tenant, or only its Client when it names one, and none that happened before it was created."
    servers:
      - "$ref": "#/servers/receiver"
    messages:
      workItemProposed:
        "$ref": "#/components/messages/workItemProposed"
      workItemApproved:
        "$ref": "#/components/messages/workItemApproved"
      workItemHandedOff:
        "$ref": "#/components/messages/workItemHandedOff"
      workItemNeedsYou:
        "$ref": "#/components/messages/workItemNeedsYou"
      workItemReadyForReview:
        "$ref": "#/components/messages/workItemReadyForReview"
      workItemDone:
        "$ref": "#/components/messages/workItemDone"
      pullRequestOpened:
        "$ref": "#/components/messages/pullRequestOpened"
      runFinished:
        "$ref": "#/components/messages/runFinished"
      clientSignOffRecorded:
        "$ref": "#/components/messages/clientSignOffRecorded"
      clientSignOffWithdrawn:
        "$ref": "#/components/messages/clientSignOffWithdrawn"
      clientSignOffDismissed:
        "$ref": "#/components/messages/clientSignOffDismissed"
      deliveryAccepted:
        "$ref": "#/components/messages/deliveryAccepted"
      webhookTest:
        "$ref": "#/components/messages/webhookTest"
operations:
  deliverEvent:
    action: send
    title: "Deliver an event"
    summary: "Unfold POSTs one signed CloudEvent to the subscription."
    channel:
      "$ref": "#/channels/subscription"
    messages:
      - "$ref": "#/channels/subscription/messages/workItemProposed"
      - "$ref": "#/channels/subscription/messages/workItemApproved"
      - "$ref": "#/channels/subscription/messages/workItemHandedOff"
      - "$ref": "#/channels/subscription/messages/workItemNeedsYou"
      - "$ref": "#/channels/subscription/messages/workItemReadyForReview"
      - "$ref": "#/channels/subscription/messages/workItemDone"
      - "$ref": "#/channels/subscription/messages/pullRequestOpened"
      - "$ref": "#/channels/subscription/messages/runFinished"
      - "$ref": "#/channels/subscription/messages/clientSignOffRecorded"
      - "$ref": "#/channels/subscription/messages/clientSignOffWithdrawn"
      - "$ref": "#/channels/subscription/messages/clientSignOffDismissed"
      - "$ref": "#/channels/subscription/messages/deliveryAccepted"
      - "$ref": "#/channels/subscription/messages/webhookTest"
    bindings:
      http:
        method: POST
components:
  schemas:
    webhookHeaders:
      type: object
      required:
        - webhook-id
        - webhook-timestamp
        - webhook-signature
        - content-type
      properties:
        webhook-id:
          type: string
          description: "The CloudEvent id; the idempotency key, the same on every retry."
        webhook-timestamp:
          type: string
          pattern: "^[0-9]+$"
          description: "Unix seconds when this attempt was signed."
        webhook-signature:
          type: string
          description: "Space-delimited signatures, each \"v1,\" and base64 HMAC-SHA256. During a secret rotation there are two."
        content-type:
          const: "application/cloudevents+json; charset=utf-8"
    cloudEvent:
      type: object
      required:
        - specversion
        - id
        - source
        - type
        - subject
        - time
        - datacontenttype
        - dataschema
        - tenant
        - data
      properties:
        specversion:
          const: "1.0"
          description: "CloudEvents version."
        id:
          type: string
          minLength: 1
          maxLength: 200
          description: "Unique per event; also the webhook-id header, the same on every retry."
        source:
          type: string
          pattern: "^/tenants/[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:/clients/[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)?$"
          description: "The owner: /tenants/<tenant>, or /tenants/<tenant>/clients/<client>."
        type:
          type: string
          pattern: "^dev\\.unfold\\.[a-z_]+\\.[a-z_]+$"
          description: "The event type."
        subject:
          type: string
          maxLength: 200
          description: "What the event is about within its source, such as work-items/42."
        time:
          type: string
          format: date-time
          description: "When the fact happened, in UTC."
        datacontenttype:
          const: application/json
        dataschema:
          type: string
          format: uri
          description: "This schema, pointing at the type's data definition."
        tenant:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
          description: "Extension attribute: the Tenant that owns the event."
        client:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
          description: "Extension attribute: the Client inside the Tenant, when the work belongs to one."
        data:
          type: object
          description: "The type's data; see $defs/data."
    signOff:
      type: object
      additionalProperties: false
      required:
        - id
        - answer
        - state
        - headSha
        - pullRequestUrl
        - attribution
      description: "A Client Sign-off, input to the Agency's Acceptance, never Acceptance itself. It carries no note and no person."
      properties:
        id:
          type: string
          maxLength: 64
          description: "The Sign-off id."
        answer:
          enum:
            - looks_good
            - needs_changes
        state:
          enum:
            - current
            - dismissed
            - withdrawn
        headSha:
          type: string
          maxLength: 64
          description: "The head commit it is bound to."
        pullRequestUrl:
          type:
            - string
            - "null"
          maxLength: 4096
          description: "The pull request."
        attribution:
          enum:
            - proven
            - asserted
