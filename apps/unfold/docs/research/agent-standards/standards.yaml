  - IETF DAWN (discovery) BoF deferred at IETF 126. https://datatracker.ietf.org/meeting/126/materials/minutes-126-agentproto-202607230700-00
  key_voices:
  - Cisco AGNTCY
  - Microsoft Entra Agent ID
  - MIT NANDA
  - OpenID Foundation
  standardisation_outlook: SCIM extension (IETF SCIM WG) and the MCP Registry. Medium chance for SCIM agent schema in 24 months.
  related_standards:
  - mcp-registry
  tension_or_critique: The registry approaches are split (DHT, OCI, VC, enterprise directory), and none of the sources found
    describes an end-to-end retire flow (absence). https://arxiv.org/abs/2508.03095
  signal_to_watch: IETF SCIM WG adopts an agent resource draft, or MCP Registry GA with ownership and deprecation fields.
  use_cases:
  - title: The Team manifest registers an agent crew
    where: Team manifest
    how: 'Decided: a Team is Ploeg''s own manifest of charter, crew, permissions, intake and skills (Ploeg ADR-0110).'
    effort: M
    value: Each agent crew has an owner, a scope and a version.
  - title: Configuration recorded per Run
    where: Run records
    how: 'Decided: each Run records model, harness and plan (Ploeg ADR-0091, ADR-0097).'
    effort: S
    value: Versions of an agent are traceable in history.
  - title: Retirement with a deprecation window
    where: Releases
    how: 'Decided: Ploeg removes only after a deprecated minor (Ploeg ADR-0134), and retired the OpenHands CLI harness that
      way (Ploeg ADR-0118).'
    effort: S
    value: Agents retire predictably.
  - title: Team cap per period
    where: Budgets
    how: 'Decided: a Team spends at most its cap per period (Ploeg ADR-0162).'
    effort: S
    value: A forgotten agent cannot run up a bill.
  - title: Provision Teams from the Tenant directory
    where: Unfold tenancy
    how: 'Proposed: create and retire Teams per Tenant from Unfold with an owner and review date, under the Tenant bound of
      system ADR-0017.'
    effort: M
    value: Agencies manage agent crews like staff, with owners and end dates.
  radar: trial
  radar_reason: The Team manifest covers registration and versioning; ownership review and retirement from Unfold are not
    built.
  unfold_today: Teams are declared manifests with recorded configuration per Run (apps/ploeg/docs/adrs/0110-a-team-is-ploegs-own-manifest-of-charter-crew-permissions-intake-and-skills.md).
  decisions:
  - docs/adr/adr-0017-a-tenant-sits-above-teams-and-bounds-what-users-sources-and-budgets-reach.md
  - apps/ploeg/docs/adrs/0091-each-run-records-the-model-harness-plan-and-ploegd-version-it-was-configured-with.md
