    kind: page
    url: https://www.linuxfoundation.org/press
standards:
- id: mcp
  name: Model Context Protocol
  disambiguation: MCP is also Microsoft Certified Professional; do not confuse with the MCP Registry or MCP Server Cards (separate
    records)
  layer: tool
  steward: Agentic AI Foundation (AAIF, Linux Foundation)
  governance: foundation
  status: stable
  latest:
    version: '2026-07-28'
    date: '2026-07-28'
    url: https://github.com/modelcontextprotocol/modelcontextprotocol/releases/tag/2026-07-28
  watch:
  - {kind: github-releases, ref: modelcontextprotocol/modelcontextprotocol, current: "2026-07-28"}
  adoption:
  - 'LiteLLM MCP gateway: https://docs.litellm.ai/docs/mcp'
  - 'agentgateway MCP gateway (federation, Streamable HTTP, OAuth): https://github.com/agentgateway/agentgateway'
  - 'Agent Router MCP tool routing: https://aaif.io/blog/agent-router-joins-aaif'
  relations:
    complements:
    - a2a
    - webmcp
    - mcp-server-card
    - ai-catalog
  open_problems:
  - 'SEP-1913 Trust and Sensitivity Annotations, open: https://github.com/modelcontextprotocol/modelcontextprotocol/issues/1913'
  - 'SEP-3415 Events Extension, open: https://github.com/modelcontextprotocol/modelcontextprotocol/issues/3415'
  - '#540 should a server expose its resource list before auth: https://github.com/modelcontextprotocol/modelcontextprotocol/issues/540'
  use_cases:
  - title: Keep both MCP servers on the current revision
    where: unfold-mcp, ploeg-mcp
    how: 'Already built: unfold-mcp serves 2026-07-28 next to the 2025 revisions (apps/unfold/src/mcp.ts) and ploeg-mcp serves
      stateless Streamable HTTP through the Go SDK (apps/ploeg/cmd/ploeg-mcp/http.go). The remaining work is a conformance
      run per release, as the Confirmation of system ADR-0011 asks.'
    effort: S
    value: Every AI client a person already uses can reach Work Items without a client falling off the handshake.
  - title: Hand off a Work Item as an MCP task
    where: unfold-mcp
    how: Built behind a flag in apps/unfold/src/mcp-tasks.ts, as section 6 of the 2026-10-30 MCP extensions dossier designs
      it; the remaining step is a terminal Claude Code proof against the deterministic demo, so no paid model runs.
    effort: S
    value: A developer follows a handed-off Work Item from the agent session that handed it off, with no polling by hand.
  - title: Tell a chat client when a Client's pull request is ready
    where: unfold-mcp, outbound events
    how: 'Built: apps/unfold/src/mcp-events.ts maps SEP-3415 subscriptions onto the Standard Webhooks outbox, pinned to one
      SEP commit. Next is an owner-approved trial with ChatGPT and a re-pin when the SEP changes (T29).'
    effort: S
    value: An Agency's project manager hears about ready work in the chat tool they already sit in.
  - title: 'Proposed: a cost quote in the hand-off confirmation'
    where: unfold-mcp, Ploeg dispatch
    how: 'Proposed, not built: the MRTR confirmation reads ''Ploeg will spend at most X from Client Y''s allowance'' from
      the per-Round cap Ploeg already reports, idea 1 of the 2026-10-30 dossier. Whether the cap is known before dispatch
      is unverified.'
    effort: S
    value: No competitor shows spend over MCP, and a person confirms paid work knowing its ceiling.
  - title: Read-only gateway tools inside a Run
    where: Ploeg dispatch, LiteLLM gateway
    how: 'Built: a Run reaches MCP tools only through the gateway, bounded by a LiteLLM team (Ploeg ADR-0078). Extending it
      means adding vetted read-only servers to a Team''s access group, never unfold-mcp or ploeg-mcp.'
    effort: S
    value: Runs get the tools a Team needs while budgets, keys and audit stay in one place.
  radar: adopt
  radar_reason: 'Both maturity and fit decided it: MCP is a stable foundation-governed standard, both servers already speak
    it over stdio and HTTP with Apps, Tasks and Events, and it is the rule-2 wire for tools in system ADR-0050; consistent
    with the 2026-10-13 verdict.'
  flip_trigger: A core revision (planned for late March 2027) removes something unfold-mcp or ploeg-mcp depends on, or a client
    people use drops support for the revisions both servers serve.
  decisions:
  - docs/adr/adr-0011-unfold-is-reachable-over-mcp-through-a-read-first-server.md
  - docs/adr/adr-0032-unfold-also-serves-its-own-read-only-mcp-tools-next-to-ploeg-mcp.md
  - docs/adr/adr-0035-interactive-sessions-reach-tenant-knowledge-only-through-unfold-mcp.md
  - docs/adr/adr-0037-people-act-on-work-through-either-mcp-server-and-every-action-names-its-person-channel-and-confirmation.md
  - docs/adr/adr-0050-unfold-integrates-through-open-standards-and-registries-and-never-locks-a-customer-in.md
  - apps/ploeg/docs/adrs/0078-runs-reach-read-only-mcp-tools-only-through-the-gateway-bounded-by-a-litellm-team.md
  - apps/ploeg/docs/adrs/0081-ploeg-serves-its-operator-reads-as-mcp-tools-through-ploeg-mcp.md
  - apps/ploeg/docs/adrs/0174-ploeg-mcp-accepts-a-token-only-for-its-own-resource-from-an-https-issuer.md
  - apps/unfold/docs/research/2026-10-13-protocol-integration-gaps.md
  - apps/unfold/docs/research/2026-10-30-mcp-extensions-fit.md
  - docs/research/2026-09-29-mcp-access.md
  watchlist:
  - T5
  - T29
  - T30
  - T31
  - T32
  - T34
  - T35
  - T36
  reviewed: '2026-11-04'
- id: mcp-registry
  name: MCP Registry
  disambiguation: Not the GitHub MCP Registry or vendor marketplaces; server.json format
  layer: discovery
  steward: MCP project (AAIF)
  governance: foundation
  status: stabilising
  latest:
    version: v1.8.7 (service); API frozen at v0.1 since 2025-10-24, README still says preview
    date: '2026-10-30'
    url: https://github.com/modelcontextprotocol/registry/releases
  watch:
  - {kind: github-releases, ref: modelcontextprotocol/registry, current: "v1.8.7"}
  adoption:
  - 'Public registry announced in preview 2025-09-08: https://blog.modelcontextprotocol.io/posts/2025-09-08-mcp-registry-preview/'
  relations:
    competes_with:
    - agntcy-dir
    - nanda-index
    complements:
    - mcp-server-card
    - ai-catalog
    builds_on:
    - mcp
  open_problems:
  - 'GA not declared; README still warns of possible breaking changes or data resets: https://github.com/modelcontextprotocol/registry'
  use_cases:
  - title: 'Proposed: a server.json for self-hosted installs'
    where: unfold-mcp, ploeg-mcp
    how: 'Proposed: publish a server.json per server with a templated remote URL, so a self-hosting Agency installs from the
      registry and fills in its own host. docs/research/2026-09-29-mcp-access.md names the registry leaving preview as the
      trigger.'
    effort: S
    value: An Agency finds and installs the servers without copying configuration from documentation.
  - title: 'Proposed: list the hosted Unfold endpoint'
    where: Agency, hosted offering
    how: 'Proposed, after a hosted offering exists: register the public unfold-mcp URL under a verified domain namespace;
      the registry accepts only public URLs and public images.'
    effort: S
    value: Clients that browse the registry, and sub-registries built on it, find hosted Unfold.
  - title: 'Proposed: an Agency-private sub-registry'
    where: Agency
    how: 'Proposed: document how an Agency that runs its own registry fork lists unfold-mcp, ploeg-mcp and its tracker servers;
      the public registry does not support private servers.'
    effort: M
    value: An Agency can whitelist exactly the servers its people may connect to.
  - title: 'Proposed: vet gateway tools for Runs against registry metadata'
    where: Ploeg dispatch, LiteLLM gateway
    how: 'Proposed: when a Team adds an MCP server to its gateway access group (Ploeg ADR-0078), record the registry entry
      and its namespace verification as provenance.'
    effort: M
    value: A Team knows who published a tool a Run can call.
  - title: 'Proposed: plugin bundles reference registry entries'
    where: VS Code extension, Claude Code plugin
    how: 'Proposed: the plugins under apps/unfold/extensions point at registry names instead of embedding a URL, once clients
      resolve registry names.'
    effort: S
    value: One listing to update when an endpoint moves.
  radar: hold
  radar_reason: 'Maturity decided it: the API is still frozen at preview v0.1 with a warning of data resets, and self-hosted
    Unfold has no public endpoint to list; consistent with the 2026-10-13 ''when a hosted offering exists''.'
  flip_trigger: The registry declares GA with templated remote URLs, or a hosted Unfold endpoint goes live.
  decisions:
  - docs/adr/adr-0011-unfold-is-reachable-over-mcp-through-a-read-first-server.md
  - docs/adr/adr-0050-unfold-integrates-through-open-standards-and-registries-and-never-locks-a-customer-in.md
  - docs/research/2026-09-29-mcp-access.md
  - apps/unfold/docs/research/2026-10-13-protocol-integration-gaps.md
  - apps/unfold/docs/research/2026-10-30-mcp-extensions-fit.md
  watchlist:
  - T33
  reviewed: '2026-11-04'
- id: mcp-server-card
  name: MCP Server Cards (SEP-2127, ext-server-card)
  disambiguation: Distinct from A2A Agent Card and AI Catalog entries
  layer: discovery
  steward: MCP Server Card Working Group (AAIF)
  governance: foundation
  status: stabilising
  latest:
    version: ext-server-card main (no tagged release); SEP-2127 closed 2026-10-06
    date: '2026-10-26'
    url: https://github.com/modelcontextprotocol/ext-server-card
  watch:
  - {kind: rss, ref: "https://github.com/modelcontextprotocol/ext-server-card/commits/HEAD.atom"}
  - {kind: changelog-page, ref: "https://modelcontextprotocol.io/community/working-groups/server-card"}
  adoption:
  - 'Resend publishes an AI Catalog plus a Server Card [secondary vendor changelog]: https://resend.com/changelog/ai-catalog-mcp-server-card.md'
  relations:
    complements:
    - ai-catalog
    - mcp-registry
    builds_on:
    - mcp
    - ai-catalog
  open_problems:
  - 'The card is reachable only through an AI Catalog, not a generic well-known URI (maintainer comment 2026-09-24): https://github.com/modelcontextprotocol/modelcontextprotocol/issues/2127'
  - '#2963 stdio install manifests in server.json/Server Card: https://github.com/modelcontextprotocol/modelcontextprotocol/issues/2963'
  use_cases:
  - title: 'Proposed: a Server Card for unfold-mcp'
    where: unfold-mcp
    how: 'Proposed: serve an application/mcp-server-card+json document from the HTTP endpoint in apps/unfold/src/mcp-http.ts,
      linked from an AI Catalog, listing tools, extensions and the protected-resource metadata.'
    effort: S
    value: A client can learn what Unfold offers before it signs in.
  - title: 'Proposed: a Server Card for ploeg-mcp'
    where: ploeg-mcp
    how: 'Proposed, upstream in Ploeg: the same card from ploeg-mcp''s HTTP handler, as docs/research/2026-09-29-mcp-access.md
      planned once SEP-2127 was accepted; it names no consumer (Ploeg ADR-0069).'
    effort: S
    value: Every Ploeg install describes itself the same way.
  - title: 'Proposed: a card per Tenant on hosted Unfold'
    where: Agency, hosted offering
    how: 'Proposed: each Tenant''s endpoint publishes its own card with its authorization server, so an Agency''s IdP-driven
      client config can discover it.'
    effort: M
    value: An Agency onboards its people by pointing them at one URL.
  - title: 'Proposed: show cards in the PWA''s connection screen'
    where: PWA
    how: 'Proposed: the settings page that lists /api/mcp-servers renders the card fields, so a person sees what each server
      can do.'
    effort: S
    value: People connect the right server for the job without reading docs.
  - title: 'Proposed: card check in the release gate'
    where: Release, mise run verify
    how: 'Proposed: a test that the card''s tool list matches tools/list, so the card cannot drift from the server.'
    effort: S
    value: A published card never promises a tool that is gone.
  radar: assess
  radar_reason: 'Maturity and absent consumers decided it: SEP-2127 is merged but nothing consumes cards yet and they are
    reachable only through a draft AI Catalog; consistent with the 2026-10-30 ''wait''.'
  flip_trigger: A client people use (Claude, VS Code, ChatGPT, Cursor) reads Server Cards, or a hosted Unfold endpoint exists
    (T33).
  decisions:
  - docs/adr/adr-0011-unfold-is-reachable-over-mcp-through-a-read-first-server.md
  - docs/research/2026-09-29-mcp-access.md
  - apps/unfold/docs/research/2026-10-30-mcp-extensions-fit.md
  - apps/ploeg/docs/adrs/0069-ploeg-names-none-of-its-consumers.md
  watchlist:
  - T33
  reviewed: '2026-11-04'
- id: a2a
  name: Agent2Agent Protocol
  disambiguation: A2A is also 'application-to-application'; IETF draft names using a2a are unrelated
  layer: agent-agent
  steward: AAIF (Linux Foundation)
  governance: foundation
  status: stable
  latest:
    version: v1.0.1 (stable); v1.1.0-rc tag 2026-10-29
    date: '2026-05-28'
    url: https://github.com/a2aproject/A2A/releases/tag/v1.0.1
  watch:
  - {kind: github-releases, ref: a2aproject/A2A, current: "v1.0.1"}
  - {kind: github-tags, ref: a2aproject/A2A, current: "v1.1.0-rc"}
  adoption:
  - 'LiteLLM A2A agent gateway, /a2a/{agent}/message/send, per-key access control: https://docs.litellm.ai/docs/a2a'
  - 'agentgateway A2A gateway: https://github.com/agentgateway/agentgateway'
  - 'kagent A2A push notifications (v1.0.0-rc1): https://github.com/kagent-dev/kagent/releases/tag/v1.0.0-rc1'
  - 'IBM ACP folded into A2A: https://github.com/i-am-bee/acp'
  relations:
    competes_with:
    - anp
    - open-floor-protocol
    - langchain-agent-protocol
    - coral-protocol
    - eclipse-lmos-protocol
    complements:
    - mcp
    - ai-catalog
  open_problems:
  - 'v1.1.0 still RC: https://github.com/a2aproject/A2A/tags'
  use_cases:
  - title: 'Proposed: an A2A facade over proposals'
    where: Ploeg dispatch, separate facade service
    how: 'Proposed, watchlisted in Ploeg ADR-0007: an Agent Card plus SendMessage that creates a proposed Work Item a person
      approves (Ploeg ADR-0031, ADR-0175), GetTask that maps to the Work Item, INPUT_REQUIRED for needs-a-person.'
    effort: M
    value: A Client's Gemini Enterprise or Copilot Studio agent could delegate work without anyone retyping a ticket.
  - title: 'Proposed: a Team described as an AgentSkill'
    where: Ploeg dispatch
    how: 'Proposed: one AgentSkill per Team in the Agent Card, as the 2026-10-17 team-manifest sweep concluded; the Team manifest
      itself stays Ploeg''s own (Ploeg ADR-0110).'
    effort: S
    value: An outside agent can see what kinds of work an Agency's Teams take.
  - title: Trial through the gateway, away from Ploeg credentials
    where: LiteLLM gateway
    how: LiteLLM's A2A agent gateway is already deployable; a bounded spike would route one external agent through it with
      per-key access control, never through a Run's key.
    effort: S
    value: Cheap evidence of whether any Agency actually has an agent to delegate from.
  - title: 'Proposed: hand-off results back to a calling agent'
    where: unfold-mcp, facade
    how: 'Proposed: the pull request link and delivery brief (Unfold ADR 0057) returned as an A2A Artifact, using push notifications
      instead of polling.'
    effort: M
    value: A delegating agent gets the reviewable result, not just a status.
  - title: 'Proposed: Client agents talk to the Client Portal'
    where: Client portal
    how: 'Proposed, after tenancy (system ADR-0017): a Client''s own agent submits Requests to the Portal over A2A, scoped
      to that Client''s sources.'
    effort: L
    value: Clients with their own agents can file and follow requests machine to machine.
  radar: assess
  radar_reason: 'Fit decided it, not maturity: A2A 1.0 is stable under AAIF with a Go SDK, but no agent among Unfold''s people
    delegates work, consistent with Ploeg ADR-0007 and the 2026-10-13 verdict; that ADR''s 2026-10-31 review date has passed
    with no dated re-confirmation.'
  flip_trigger: An Agency or Client asks to delegate from Gemini Enterprise, Copilot Studio or ServiceNow, or A2A grows a
    queue or pub-sub transport (a2aproject/A2A#1029) (T6).
  decisions:
  - apps/ploeg/docs/adrs/0007-a2a-adopt-nothing-watchlist-a-facade.md
  - apps/ploeg/docs/adrs/0031-runs-create-work-items-held-for-approval-within-limits.md
  - apps/ploeg/docs/adrs/0110-a-team-is-ploegs-own-manifest-of-charter-crew-permissions-intake-and-skills.md
  - apps/ploeg/docs/research/2026-07-28-a2a-fit.md
  - apps/ploeg/docs/research/2026-10-17-team-manifest-standards.md
  - apps/unfold/docs/research/2026-10-13-protocol-integration-gaps.md
  - docs/adr/adr-0017-a-tenant-sits-above-teams-and-bounds-what-users-sources-and-budgets-reach.md
  watchlist:
  - T6
  reviewed: '2026-11-04'
- id: ai-catalog
  name: AI Catalog (formerly AI Card)
  disambiguation: Repo still named Agent-Card/ai-card; unrelated to A2A AgentCard or draft-aevum-agentcard
  layer: discovery
  steward: AI Catalog TSC (Google, Microsoft, Anthropic, PulseMCP); Resend credits an LF 'Agent Card Working Group' [secondary]
  governance: consortium
  status: draft
  latest:
    version: specVersion 1.0 (editor's draft, untagged)
    date: '2026-10-28'
    url: https://ai-catalog.io/
  watch:
  - {kind: rss, ref: "https://github.com/Agent-Card/ai-card/commits/HEAD.atom"}
  - {kind: changelog-page, ref: "https://ai-catalog.io/"}
  adoption:
  - 'MCP Server Card discovery via AI Catalog: https://github.com/modelcontextprotocol/ext-server-card'
  - 'NANDA Index stores AI Catalog records: https://github.com/projnanda/nanda-index-v2'
  relations:
    competes_with:
    - agntcy-oasf
    complements:
    - mcp-server-card
    - a2a
    - dns-aid
    - ans
  open_problems:
  - 'No tagged release; trust manifests are still changing (PR #117 2026-10-28): https://github.com/Agent-Card/ai-card'
  use_cases:
  - title: 'Proposed: /.well-known/ai-catalog.json on hosted Unfold'
    where: unfold-mcp, hosted offering
    how: 'Proposed: one catalog listing the unfold-mcp and ploeg-mcp Server Cards, the ACP agent package and, if ever built,
      an A2A Agent Card.'
    effort: S
    value: One discovery document for every way to reach Unfold.
  - title: 'Proposed: a catalog for a self-hosted install'
    where: Agency
    how: 'Proposed: the Helm chart serves the catalog at the Agency''s own domain, generated from the enabled servers.'
    effort: S
    value: A self-hosting Agency publishes its endpoints without writing the file by hand.
  - title: 'Proposed: catalog entries in the Tenant export'
    where: Tenant export
    how: 'Proposed: include the Tenant''s catalog in the export of system ADR-0050 rule 6, so an Agency that leaves keeps
      its integration map.'
    effort: S
    value: Leaving Unfold does not lose the description of what was connected.
  - title: 'Proposed: trust manifest for Client-facing listings'
    where: Client portal
    how: 'Proposed, once trust manifests settle: sign the catalog entries of Client-safe tools (system ADR-0031''s brief)
      so a Client''s client can check them.'
    effort: M
    value: Clients can verify that a listing is the Agency's own.
  - title: 'Proposed: read Agency catalogs to suggest tools'
    where: PWA, Ploeg dispatch
    how: 'Proposed: when an Agency adds a tracker or tool, read its vendor''s catalog to prefill the MCP endpoint for a Team''s
      gateway group.'
    effort: M
    value: Fewer hand-typed endpoints when wiring tools.
  radar: hold
  radar_reason: 'Maturity decided it: specVersion 1.0 is an untagged editor''s draft whose trust manifests are still changing,
    and no client reads it.'
  flip_trigger: AI Catalog tags a release and one client people use fetches /.well-known/ai-catalog.json.
  decisions:
  - docs/research/2026-09-29-mcp-access.md
  - apps/unfold/docs/research/2026-10-30-mcp-extensions-fit.md
  - docs/adr/adr-0050-unfold-integrates-through-open-standards-and-registries-and-never-locks-a-customer-in.md
  watchlist:
  - T33
  reviewed: '2026-11-04'
- id: anp
  name: Agent Network Protocol
  disambiguation: ANP is also used for unrelated network protocols
  layer: agent-agent
  steward: ANP open-source community (agent-network-protocol org)
  governance: community
  status: stabilising
  latest:
    version: v1.2
    date: '2026-09-24'
    url: https://github.com/agent-network-protocol/AgentNetworkProtocol/releases
  watch:
  - {kind: github-releases, ref: agent-network-protocol/AgentNetworkProtocol, current: "v1.2"}
  adoption:
  - No shipped product adoption found in this crawl.
  relations:
    competes_with:
    - a2a
    - eclipse-lmos-protocol
  open_problems:
  - Not crawled (verify-only scope).
  use_cases:
  - title: 'Proposed: DID-based identity for an Agency''s agents'
    where: Agency
    how: 'Proposed: study whether ANP''s DID identity layer could name an Agency''s Ploeg install to outside agents; nothing
      in Unfold needs it today.'
    effort: M
    value: Prior art for agent identity if a hosted offering needs cross-organisation trust.
  - title: 'Proposed: ANP meta-protocol as a facade'
    where: Ploeg dispatch
    how: 'Proposed: an ANP endpoint over proposals, the same shape as the A2A facade of Ploeg ADR-0007.'
    effort: L
    value: Would reach ANP agents, of which none was found in production.
  - title: 'Proposed: compare ANP discovery with Server Cards'
    where: unfold-mcp
    how: 'Proposed: a desk comparison of ANP''s agent description documents against Server Cards and AI Catalog.'
    effort: S
    value: Confirms which discovery format to bet on.
  - title: 'Proposed: ANP in the protocol ledger'
    where: Research
    how: 'Proposed: add one dated row to the appendix of apps/unfold/docs/research/2026-09-11-ecosystem-alternatives.md so
      it is not re-researched.'
    effort: S
    value: Saves a future survey.
  - title: 'Proposed: Client agent marketplaces'
    where: Client portal
    how: 'Proposed: only if a Client''s agent network speaks ANP, accept Requests through it.'
    effort: L
    value: Speculative reach into decentralised agent networks.
  radar: hold
  radar_reason: 'Fit and adoption decided it: a community-governed agent-agent protocol with no shipped product adoption,
    competing with A2A, which itself fails on fit for Unfold.'
  flip_trigger: A product an Agency or Client uses ships ANP, or A2A's facade is built and an ANP peer asks to connect.
  decisions:
