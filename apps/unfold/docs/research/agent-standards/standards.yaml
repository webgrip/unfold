- id: dpop
  name: OAuth 2.0 Demonstrating Proof of Possession (RFC 9449)
  disambiguation: Sender-constrained access tokens via a per-request signed JWT. Distinct from OIDC Key Binding (bound ID
    tokens), which also uses DPoP proofs.
  layer: identity
  steward: IETF OAuth WG
  governance: sdo
  status: stable
  latest:
    version: RFC 9449
    date: '2023-09-01'
    url: https://www.rfc-editor.org/rfc/rfc9449
  watch:
  - {kind: rss, ref: "https://www.rfc-editor.org/errata/rfc9449"}
  - {kind: changelog-page, ref: "https://github.com/modelcontextprotocol/modelcontextprotocol/issues/1932"}
  adoption:
  - 'Authentik 2026.8 binds ID tokens only via OIDC Key Binding (scope bound_key, dpop_jkt). Its docs say: ''Access tokens
    remain bearer tokens''. https://github.com/goauthentik/authentik/blob/main/website/docs/add-secure-apps/providers/oauth2/key-binding.mdx'
  - Authentik PR
  - 'MCP SEP-1932 ''DPoP Profile for MCP'' is still open with label draft/extension (opened 2025-12-05, updated 2026-11-02):
    https://github.com/modelcontextprotocol/modelcontextprotocol/issues/1932'
  - 'WorkOS says the MCP TypeScript SDK added DPoP in 2.1.0 [secondary; the release notes I checked (v2.4.0 etc.) do not mention
    DPoP]: https://workos.com/blog/mcp-sdk-dpop-and-scope-challenges'
  relations:
    complements:
    - oauth-token-exchange
    - oauth-2-1
    - web-bot-auth
  open_problems:
  - '{"DPoP is not part of the MCP core spec; SEP-1932 is open": "https://github.com/modelcontextprotocol/modelcontextprotocol/issues/1932"}'
  - Authentik does not issue DPoP-bound access tokens (see key-binding doc above)
  use_cases:
  - title: 'Proposed: sender-constrained access tokens on unfold-mcp'
    where: unfold-mcp OAuth
    how: Validate DPoP proofs in mcp-auth.ts and require a cnf.jkt match once Authentik binds access tokens; RFC-0011 property
      P10 is deferred until then.
    effort: M
    value: A leaked MCP access token is useless without the client's key.
  - title: 'Proposed: bind exchanged person tokens to Unfold''s key'
    where: Unfold to Ploeg operator API
    how: 'ADR-0055 lists Authentik DPoP as a re-evaluation trigger: request DPoP-bound exchanged tokens and have Ploeg check
      the proof.'
    effort: M
    value: A person token stolen from a log or proxy cannot be replayed at Ploeg.
  - title: 'Proposed: DPoP-bound editor credentials'
    where: VS Code extension, editor sign-in
    how: Give the 30-day editor credential of ADR-0037 a key held in SecretStorage and require a proof per request.
    effort: M
    value: A copied editor credential stops working on another machine.
  - title: 'Proposed: bind a Run''s capability to its worker'
    where: Ploeg Run credentials
    how: Ploeg's broker issues Run capabilities bound to a key the non-dumpable worker of Ploeg ADR-0034 holds. Ploeg work
      upstream.
    effort: L
    value: A Run capability exfiltrated by a prompt-injected harness cannot be used elsewhere.
  - title: 'Proposed: DPoP for Client Portal sessions on phones'
    where: Client Portal, PWA
    how: Bind the PWA's tokens to a non-extractable WebCrypto key in the hosted phase.
    effort: M
    value: Hardens Client access on shared or lost devices.
  radar: assess
  radar_reason: 'Maturity of the surrounding stack decided it: the RFC is stable, but Authentik binds only ID tokens and MCP''s
    DPoP profile is still an open SEP.'
  flip_trigger: An Authentik release issues DPoP-bound access tokens, or MCP SEP-1932 is accepted into the specification.
  decisions:
  - docs/design/rfc-0011-every-agent-action-names-its-person.md
  - apps/unfold/docs/adrs/0055-unfold-proves-the-person-to-ploeg-with-a-token-exchanged-from-their-sign-in.md
