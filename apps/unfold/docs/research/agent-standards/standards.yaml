- id: agent-identity-workload-vs-delegated
  name: Agent identity as workload identity vs as a delegated human
  one_liner: Should an agent authenticate as its own workload (SPIFFE/WIMSE), act as a user (impersonation), or carry both,
    with its own identity plus an on-behalf-of chain?
  maturity: pre-standard
  where_it_lives:
  - OpenID Foundation AIIM CG whitepaper "Identity Management for Agentic AI", 2025-10-07, arXiv 2510.25819 (Tobin South et
    al.). https://openid.net/new-whitepaper-tackles-ai-agent-identity-challenges/ ; https://arxiv.org/abs/2510.25819
  - draft-klrc-aiagent-auth (AIMS) treats agents as workloads, 2026-03 [secondary]. https://securew2.com/blog/ietf-aims
  - draft-ni-wimse-ai-agent-identity "dual-identity credentials", CSA note 2026-09-02 [secondary]. https://labs.cloudsecurityalliance.org/research/csa-research-note-ietf-agent-identity-standards-20260902-csa/
  - MCP authorization roadmap (DPoP, workload identity federation, ID-JAG), AGNTCon NA 2026-10-22 [secondary]. https://lucaberton.com/blog/agntcon-mcpcon-north-america-2026/
  key_voices:
  - OpenID Foundation
  - Tobin South
  - IETF WIMSE
  - Okta/Ping/AWS/Zscaler AIMS authors
  standardisation_outlook: IETF WIMSE/OAuth plus OpenID. High chance that "both" (workload identity plus a delegation chain)
    becomes the norm in 24 months. The specs themselves are a sibling's scope.
  related_standards:
  - oauth-token-exchange
  - id-jag
  tension_or_critique: The OpenID paper flags user impersonation as an anti-pattern because it erases accountability. That
    directly challenges "agents act as a named human". https://openid.net/new-whitepaper-tackles-ai-agent-identity-challenges/
  signal_to_watch: WIMSE adopts an agent-identity draft as a WG item, or MCP authorization mandates ID-JAG or token exchange.
  use_cases:
  - title: Every agent action names its person
    where: Identity across Ploeg and Unfold
    how: 'Proposed, stage 1 in review: credentials that prove both the person and the agent for every action (RFC-0011).'
    effort: L
    value: Answers who did this for every push, comment and merge.
  - title: Transaction token with person and Team
    where: Run identity
    how: 'Decided: each Run carries a transaction token naming its person, and an unsponsored Team runs nothing (Ploeg ADR-0156);
      calls without a live person are attributed to the Run or a proven workload (Ploeg ADR-0180).'
    effort: M
    value: Combines workload identity with an on-behalf-of chain.
  - title: Token exchange for operator consumers
    where: Unfold to Ploeg
    how: 'Decided: an operator consumer proves its person with a token exchanged for Ploeg''s audience (Ploeg ADR-0150), and
      Unfold asserts no attribution from chart 0.3.0 (Ploeg ADR-0171).'
    effort: M
    value: Unfold cannot impersonate a person to Ploeg.
  - title: Signed Run identity that authorizes nothing
    where: Plugins
    how: 'Decided: a declared plugin may receive a signed Run identity that names its Run and authorizes nothing (Ploeg ADR-0149).'
    effort: S
    value: Third-party tools can attribute without gaining power.
  - title: Push as the Run's own app installation
    where: Forge credentials
    how: 'Decided: on GitHub a Run pushes with its own app installation token (Ploeg ADR-0086), and a Claude environment Run
      uses the login of the person it acts for (Ploeg ADR-0112).'
    effort: S
    value: Forge history shows the agent and the person distinctly.
  radar: adopt
  radar_reason: Ploeg has decided to carry both a workload identity and a delegated person on every Run, and RFC-0011 is rolling
    it out.
  unfold_today: Runs carry a transaction token naming their person, with per-Run forge identities (apps/ploeg/docs/adrs/0156-each-run-carries-a-transaction-token-that-names-its-person-and-a-team-without-a-sponsor-runs-nothing.md).
  decisions:
