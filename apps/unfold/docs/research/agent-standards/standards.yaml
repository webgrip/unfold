- id: open-weight-model-packaging
  name: Open-weight model packaging as OCI artifacts
  one_liner: Distribute models (weights, tokenizer, config, licence) as OCI artifacts in standard registries with signing
    and SBOM-like metadata.
  maturity: standardising
  where_it_lives:
  - CNCF ModelPack (Sandbox), manifest media type application/vnd.cncf.model.manifest.v1+json. https://pkg.go.dev/github.com/modelpack/model-spec
  - CNCF blog "Advancing AI model interoperability with Docker and ModelPack", 2026-08-12 (docker model package --format=cncf).
    https://www.cncf.io/blog/2026/08/12/advancing-ai-model-interoperability-with-docker-and-modelpack/
  - '{"Red Hat KubeCon India 2026 deck \"ModelPack": "Bringing the OCI Standard to AI/ML\". https://hosted-files.sched.co/kccncind2026/6d/ModelPack_%20Bringing%20the%20OCI%20Standard%20to%20AI_ML.pptx.pdf"}'
  key_voices:
  - CNCF ModelPack maintainers (Ant
  - Red Hat
  - Jozu
  - Nutanix)
  - Docker
  standardisation_outlook: CNCF/OCI. High chance in 24 months, since Docker convergence makes it de facto.
  tension_or_critique: Hugging Face Hub remains the de facto distribution channel, and the spec version is still pre-1.0.
    https://pkg.go.dev/github.com/modelpack/model-spec
  signal_to_watch: ModelPack v1.0 release or CNCF incubation, and Hugging Face offering OCI/ModelPack export.
  use_cases:
  - title: Toolchains already ship as mounted images
    where: Worker toolchains
    how: 'Built: toolchains are container images the kubelet mounts read-only (Ploeg ADR-0035), the same mechanism ModelPack
      weights would use.'
    effort: S
    value: Proves the image-volume path Unfold would reuse.
  - title: Package the decider's weights as OCI
    where: Decider
    how: 'Proposed: ship the small decider model of system ADR-0042 as an OCI artifact mounted as an image volume.'
    effort: M
    value: Air-gapped and self-hosted Agencies install it like any image.
  - title: Same CVE and signing gate for models
    where: Release
    how: 'Proposed: apply the zero-CVE and signed OpenVEX gate (Ploeg ADR-0145, Unfold ADR-0010) to model artifacts.'
    effort: M
    value: Models get the supply-chain checks images already have.
  - title: Open-weight Teams through the gateway
    where: Gateway
    how: 'Already used: bronze runs open-weight models through the gateway (the cost-per-merged record); hosting stays with
      the provider.'
    effort: S
    value: Cheap Teams without running GPUs.
  - title: Do not self-host frontier-size models
    where: Infrastructure
    how: 'Resist: large models stay behind the gateway contract (Ploeg ADR-0177); only small helper models are worth packaging.'
    effort: S
    value: Keeps self-hosting within an Agency's hardware.
  radar: assess
  radar_reason: Only the small decider model would be self-hosted, and ModelPack is not yet v1.
  unfold_today: Nothing for models; toolchains already ship as read-only mounted images (apps/ploeg/docs/adrs/0035-runs-get-ploeg-owned-skills-mounted-toolchains-and-worker-verification.md).
  decisions:
