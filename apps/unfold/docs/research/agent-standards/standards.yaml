- id: durable-execution-agents
  name: Durable execution for agents (workflow-as-code)
  one_liner: Checkpoint every agent step (LLM call, tool call, wait for a human), so crashes resume rather than restart and
    long-running agents survive deploys.
  maturity: de-facto-convention
  where_it_lives:
  - '{"Temporal, OpenAI Agents SDK integration": "public preview 2025-07-30, GA (Python) noted 2026-03-23. https://temporal.io/blog/announcing-openai-agents-sdk-integration"}'
  - Restate $20M Series A (2026, after Temporal's Series E) [secondary]. https://www.remio.ai/post/restate-series-a-pits-a-20m-bet-against-database-backed-durable-execution
  - DBOS Postgres-only durable agents [secondary]. https://dev.to/mr_manushukla/durable-ai-agents-without-temporal-exactly-once-workflows-on-postgres-with-dbos-2026-5a6n
  - MCP Tasks (long-running handles) in the AGNTCon NA keynote, 2026-10-22 [secondary]. https://lucaberton.com/blog/agntcon-mcpcon-north-america-2026/
  key_voices:
  - Temporal
  - Restate
  - DBOS
  - OpenAI Agents SDK team
  standardisation_outlook: no standards body for the engines. The MCP Tasks primitive standardises the protocol-side handle.
    Low chance for the engine, high for task handles.
  tension_or_critique: Deterministic replay clashes with nondeterministic LLM calls, and the frameworks add operational weight.
    Restate and DBOS argue Temporal is too heavy, so the pattern has no agreed shape [secondary]. https://www.remio.ai/post/restate-series-a-pits-a-20m-bet-against-database-backed-durable-execution
  signal_to_watch: MCP Tasks GA in a dated spec, and a durable-execution engine shipping MCP Tasks natively.
  use_cases:
  - title: A stopped writer resumes from a checkpoint
    where: ploeg-worker, retries
    how: 'Already decided: a stopped writing Run leaves a checkpoint its retry starts from (Ploeg ADR-0075).'
    effort: S
    value: A crash costs one step, not the Run's whole spend.
  - title: Leases and the sweep recover dead Runs
    where: ploegd sweep
    how: 'Already built: Leases expire, the 15-second sweep blocks keys, settles spend and repairs Shifts (docs/concepts/how-work-flows.md).'
    effort: S
    value: No Run is left holding a branch or a budget after its pod dies.
  - title: Durable inbox and outbox
    where: Webhook intake and publications
    how: 'Already decided: authenticated webhooks go through a durable inbox claimed under a lease and marked seen only after
      effects commit (Ploeg ADR-0060, ADR-0173).'
    effort: S
    value: Tracker and forge events are processed exactly once across restarts.
  - title: Pause never becomes a retry
    where: Unfold sessions, attended Runs
    how: 'Already decided: a paused Run keeps its pod and session for a bounded time and is never retried automatically (Ploeg
      ADR-0101), and a restart never silently repeats paid work (apps/unfold/AGENTS.md).'
    effort: S
    value: Waiting for a human cannot quietly double the bill.
  - title: Do not add a workflow engine
    where: ploegd state
    how: 'Resist: state lives in PostgreSQL and Ploeg is not a Kubernetes operator (Ploeg ADR-0071); a Temporal-style engine
      would duplicate Leases, claims and settlement already proven there.'
    effort: S
    value: One fewer stateful system for every self-hosted Agency.
  radar: adopt
  radar_reason: Ploeg already checkpoints, leases and settles every step in PostgreSQL, which is durable execution without
    a separate engine.
  unfold_today: Postgres-backed claims, Leases, checkpoints and a durable inbox (apps/ploeg/docs/adrs/0075-a-stopped-writing-run-leaves-a-checkpoint-its-retry-starts-from.md).
  decisions:
  - apps/ploeg/docs/adrs/0060-authenticated-webhooks-go-through-a-durable-inbox-and-required-publications-through-an-outbox.md
  - apps/ploeg/docs/adrs/0071-ploeg-keeps-its-state-in-postgresql-and-is-not-a-kubernetes-operator.md
  - apps/ploeg/docs/adrs/0075-a-stopped-writing-run-leaves-a-checkpoint-its-retry-starts-from.md
