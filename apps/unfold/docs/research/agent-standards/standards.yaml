- id: liability-accountability-chains
  name: Liability and accountability chains for agents
  one_liner: 'Who is liable when an agent harms someone: model provider, agent developer, deployer, tool operator or the delegating
    human? How is that chain evidenced?'
  maturity: idea
  where_it_lives:
  - EU AI Liability Directive withdrawn (2025 work programme 2025-02-11, formal withdrawal reported 2025-10-06) [secondary].
    https://www.mondaq.com/new-technology/1590676/eu-commission-withdraws-ai-liability-directive
  - 'Revised Product Liability Directive (EU) 2024/2853: software is a product, transposition by 2026-12-09. https://www.osborneclarke.com/insights/physical-ai-and-strict-liability-what-impact-eu-product-liability-directive'
  - '"Trustworthy Agentic AI: Failure Modes... Lifecycle Framework", arXiv 2609.22712 (not opened). https://arxiv.org/pdf/2609.22712'
  key_voices:
  - European Commission
  - Osborne Clarke
  - OpenID AIIM CG (accountability via delegation)
  standardisation_outlook: Law, not standards. The PLD applies from Dec 2026. Technical evidence (receipts, audit trails)
    is the standardisable part. Low chance for an agent-specific regime in 24 months.
  related_standards:
  - eu-ai-act
  tension_or_critique: Professional AI uses often fall outside the PLD, leaving national tort law and pure economic losses
    uncovered. https://www.aiactblog.nl/en/posts/ai-liability-directive-withdrawal
  signal_to_watch: A first EU court case under PLD transposition involving an AI agent, or insurer requirements for agent
    audit trails.
  use_cases:
  - title: A person merges, never an agent
    where: Merge
    how: 'Decided: a person accepts in Unfold and Ploeg asks the forge to merge at that head with a merge identity no Run
      holds (system ADR-0053, Ploeg ADR-0188).'
    effort: S
    value: The accountable human act is explicit and recorded.
  - title: No sponsor, no Run
    where: Run identity
    how: 'Decided: a Team without a sponsor runs nothing (Ploeg ADR-0156).'
    effort: S
    value: Every Run has a named person responsible for it.
  - title: Delivery ends at a reviewed pull request
    where: Agency offering
    how: 'Accepted: delivery ends at a reviewed pull request with a preview, and production stays with the Agency (system
      ADR-0005, ADR-0008).'
    effort: S
    value: The liability boundary between Unfold, Agency and client is drawn in the offering.
  - title: Client sign-off as evidence
    where: Acceptance
    how: 'Accepted: a Client Sign-off is bound to the head commit and each client has an approver (system ADR-0049).'
    effort: S
    value: The chain includes the client's own decision.
  - title: Accountability pack for an Agency contract
    where: Agency reporting
    how: 'Proposed: export per Work Item who approved, who ran, which model and who merged, from Action Records and Run facts
      (system ADR-0037, Ploeg ADR-0091).'
    effort: M
    value: An Agency can answer a client or insurer with evidence.
  radar: adopt
  radar_reason: Unfold already names a person at every decision point; packaging that chain is cheap and valuable to Agencies.
  unfold_today: Every action names its person, a Run needs a sponsor and a person merges (docs/adr/adr-0037-people-act-on-work-through-either-mcp-server-and-every-action-names-its-person-channel-and-confirmation.md).
