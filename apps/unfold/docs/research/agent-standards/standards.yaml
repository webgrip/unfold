- id: agent-gateway-control-plane
  name: Agent mesh / the gateway as the control plane
  one_liner: All agent-to-model, agent-to-tool and agent-to-agent traffic flows through gateways that apply auth, policy,
    budget, observability and routing, with a registry and runtime forming an "agent mesh".
  maturity: de-facto-convention
  where_it_lives:
  - Linux Foundation accepts agentgateway (Solo.io), 2025-08-25. https://linuxfoundation.org/press/linux-foundation-welcomes-agentgateway-project-to-accelerate-ai-agent-adoption-while-maintaining-security-observability-and-governance
  - AAIF adds agentgateway as hosted project, ~2026-06-04 [secondary]. https://itbrief.com.au/story/agentic-ai-foundation-adds-agentgateway-as-hosted-project
  - '{"Workshop": "gateway + registry + runtime agent mesh with agentgateway and kagent (CNCF Sandbox). https://pretalx.com/workshop-tage-2026/talk/WN8QU7/"}'
  - AGNTCon NA 2026 interviews (Stephen Watt / Red Hat on agent gateways; Michael Levan / Solo.io) [secondary]. https://lucaberton.com/blog/agntcon-mcpcon-north-america-2026/
  key_voices:
  - Solo.io (Idit Levine
  - Christian Posta)
  - Linux Foundation / AAIF
  - Red Hat
  - Tetrate
  standardisation_outlook: Implementations at AAIF/CNCF. Gateway API extensions (Kubernetes SIG) could standardise config.
    Medium chance in 24 months.
  related_standards:
  - mcp
  - a2a
  tension_or_critique: Centralising all traffic creates a single point of failure and a high-value target, and "mesh" adds
    sidecar-era complexity most teams don't need. Critics prefer a thin gateway plus a PDP. https://davepatten.substack.com/p/ai-agent-gateways-the-new-security
  signal_to_watch: A Kubernetes Gateway API GEP for MCP/A2A routing, or AAIF publishing a gateway conformance profile.
  use_cases:
  - title: LiteLLM as the credential and metering seam
    where: Model gateway
    how: 'Already built: only ploegd holds the master key and mints capped per-Run keys at the gateway (Ploeg ADR-0008).'
    effort: S
    value: Every model call is authorized, capped and counted in one place.
  - title: A gateway contract with two implementations
    where: Gateway contract
    how: 'Decided: Ploeg reaches models through a gateway contract with LiteLLM and Envoy AI Gateway as implementations (Ploeg
      ADR-0177).'
    effort: M
    value: No lock-in to one gateway product.
  - title: MCP tools only through the gateway
    where: Gateway MCP
    how: 'Decided: Runs reach read-only MCP tools only through the gateway, bounded by a LiteLLM team (Ploeg ADR-0078).'
    effort: M
    value: Tool traffic gets the same auth, limits and logs as model traffic.
  - title: Live usage read from the gateway
    where: Run card
    how: 'Decided: a running Run''s card reads usage so far from the gateway (Ploeg ADR-0049).'
    effort: S
    value: People see spend while it happens, not after settlement.
  - title: Authority stays in the control plane
    where: ploegd
    how: 'Resist: management authority stays in Ploeg''s control plane (Ploeg ADR-0025); the gateway enforces keys and limits
      but does not decide who may run.'
    effort: S
    value: A gateway compromise, like the LiteLLM advisory of 2026-09-30, cannot grant new work.
  radar: adopt
  radar_reason: The gateway already authorizes, caps and meters every Run; Ploeg has made it a contract with two implementations.
  unfold_today: LiteLLM mints per-Run capped keys and fronts MCP tools (apps/ploeg/docs/adrs/0008-litellm-is-the-credential-and-metering-seam.md).
  decisions:
