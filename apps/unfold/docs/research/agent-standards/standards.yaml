- id: agent-economy
  name: Agent economy (micropayments, agent-to-agent markets)
  one_liner: Agents pay per request (HTTP 402 + stablecoins) and buy services from other agents, creating machine-to-machine
    markets.
  maturity: pre-standard
  where_it_lives:
  - Linux Foundation launches the x402 Foundation (protocol from Coinbase), 2026-04-02, MCP Dev Summit NYC. https://www.linuxfoundation.org/press/linux-foundation-is-launching-the-x402-foundation-and-welcoming-the-contribution-of-the-x402-protocol
  - Cloudflare Monetization Gateway waitlist, 2026-07-01, and AWS x402 at the edge [secondary]. https://infoq.com/news/2026/07/cloudflare-aws-x402-micropayment/
  - '{"Skeptical view": "~$17k/day on-chain volume, about half of it tests (CoinDesk 2026-03, via KuCoin) [secondary]. https://www.kucoin.com/news/flash/agent-payments-after-one-year-hype-vs-reality-in-ai-powered-commerce"}'
  key_voices:
  - Coinbase
  - Cloudflare
  - Stripe
  - Linux Foundation
  - PaymentsJournal skeptics (https://www.paymentsjournal.com/agentic-commerce-faces-many-hurdles-before-it-reaches-maturity/)
  standardisation_outlook: x402 Foundation (LF) and FIDO for mandates. Medium chance of a stable spec in 24 months, low chance
    of real volume.
  related_standards:
  - x402
  - ap2
  - verifiable-intent
  tension_or_critique: Developers already pay through subscriptions and credits, so volumes stay tiny despite the build-out.
    https://www.kucoin.com/news/flash/agent-payments-after-one-year-hype-vs-reality-in-ai-powered-commerce
  signal_to_watch: Sustained non-test x402 volume reported by an independent analytics source, or a major PSP making agent
    payments default in checkout.
  use_cases:
  - title: The ticket is the market unit
    where: Agency billing
    how: 'Accepted: Agencies sell a quoted, capped Shift budget charged on delivery (system ADR-0006), a human-facing price,
      not agent micropayments.'
    effort: S
    value: Clients buy outcomes they understand.
  - title: Internal metering is the ledger
    where: LiteLLM and ploegd
    how: 'Already built: LiteLLM meters each Run''s key and ploegd settles spend into the Shift (Ploeg ADR-0008, ADR-0012),
      and an operator settles from evidence when the gateway cannot answer (Ploeg ADR-0155).'
    effort: S
    value: Spend is exact without any payment rail.
  - title: Allowances for Asks and chat
    where: Asks
    how: 'Accepted: Asks are paid from a monthly allowance (system ADR-0031) and a Team spends at most its cap per period
      (Ploeg ADR-0162).'
    effort: S
    value: Read-only agent use is budgeted like any other.
  - title: No agent pays outside the Run
    where: Workers
    how: 'Resist: workers have no internet route and Runs call only their Role''s model (Ploeg ADR-0039), so x402-style payments
      have nowhere to happen.'
    effort: S
    value: No agent can spend money the budget did not authorize.
  - title: Revisit for paid tool servers
    where: Gateway MCP tools
    how: 'Watch: if paid MCP tools appear that a Team needs, meter them through the gateway contract (Ploeg ADR-0177) rather
      than giving Runs a wallet.'
    effort: M
    value: Keeps one budget authority even when tools cost money.
  radar: hold
  radar_reason: Unfold's money model is an authorized budget per ticket; agent-to-agent payments would bypass it and lack
    real volume.
  unfold_today: Nothing of agent payments; spend is metered per Run and billed per ticket (docs/adr/adr-0006-the-ticket-is-the-billing-unit.md).
  decisions:
  - docs/adr/adr-0006-the-ticket-is-the-billing-unit.md
  - docs/adr/adr-0031-people-ask-about-a-work-item-through-a-metered-read-only-ask-paid-from-a-monthly-allowance.md
