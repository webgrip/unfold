  name: EU Artificial Intelligence Act, Regulation (EU) 2024/1689, as amended by Regulation (EU) 2026/1744 (Digital Omnibus
    on AI)
  disambiguation: Law. The omnibus is dated 2026-07-08, was published in the OJ on 2026-07-24 and entered into force on 2026-07-27
    [OJ/entry dates secondary; act on EUR-Lex https://eur-lex.europa.eu/eli/reg/2026/1744/oj]. A corrigendum (2026/1744Ber)
    dated 2026-09-29 is listed [secondary] (https://www.dinmedia.de/en/regulation/euv-2026-1744ber/406956901).
  layer: governance
  steward: European Union (AI Office; national market surveillance authorities)
  governance: regulator
  status: law
  latest:
    version: 2024/1689 consolidated 2026-07-27
    date: '2026-07-27'
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/2026-07-27/fra
  watch:
  - {kind: changelog-page, ref: "https://eur-lex.europa.eu/eli/reg/2024/1689"}
  - {kind: changelog-page, ref: "https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai"}
  adoption:
  - Omnibus act (https://eur-lex.europa.eu/eli/reg/2026/1744/oj?locale=en)
  - Parliament position 2026-06-16 (https://data.europarl.europa.eu/distribution/doc/TA-10-2026-0198_en.pdf)
  relations:
    complements:
    - eu-ai-act-harmonised-standards
    - nl-ai-act-supervision
    - iso-iec-42001
    - c2pa
  open_problems:
  - 'Timeline after the omnibus: prohibitions and AI literacy (Art. 4) applied from 2025-02-02, and the omnibus softens Art.
    4 to ''support'' staff literacy [secondary]. GPAI obligations applied from 2025-08-02. Art. 50 transparency from 2026-08-02,
    with a 50(2) marking grace to 2026-12-02 for systems placed before 2026-08-02 [secondary]. New Art. 5 nudifier/CSAM ban
    from 2026-12-02 [secondary]. Annex III high-risk from 2027-12-02. Annex I high-risk from 2028-08-02. Sources: https://www.gibsondunn.com/eu-ai-act-omnibus-agreement-postponed-high-risk-deadlines-and-other-key-changes/
    and https://www.joneswalker.com/en/insights/blogs/ai-law-blog/yes-august-2-still-matters-the-eu-approved-a-high-risk-ai-delay-but-most-trans.html'
  - 'What applies to an agency deploying LLM agents: as a deployer, AI literacy (Art. 4) and Art. 50(4) disclosure for deepfakes
    and published AI-generated text on matters of public interest. As a provider when it places chatbots on the market under
    its own name for clients: Art. 50(1) interaction disclosure and 50(2) machine-readable marking. High-risk duties apply
    only if a use falls in Annex III (e.g. recruitment, credit, education) from 2027-12-02. GPAI provider duties apply only
    if the deployer substantially modifies or fine-tunes and places a GPAI model on the market. This is analysis built from
    the article mapping above, not legal advice.'
  use_cases:
  - title: Article 50(2) marking of agent text
    where: Run evidence
    how: 'Built: apps/unfold/docs/contracts/ai-marking.md and src/ai-marking.ts mark every agent-written pull request and
      commit with a sentence, a marker, a label and Assisted-by trailers; the grace period for systems placed before 2026-08-02
      ends on 2026-12-02. Whether this meets any party''s duty needs counsel.'
    effort: S
    value: The main transparency duty for generated text already has a working mechanism.
  - title: Role allocation in the Agency contract
    where: Agency contract
    how: 'Proposed: state in the hosted agreement who is provider and who is deployer, since an Agency that puts its own name
      on the system may be treated as provider; the 2026-09-29 legal research marks this for a lawyer.'
    effort: M
    value: Removes the biggest legal ambiguity before the first sale.
  - title: Article 50(1) disclosure on chat surfaces
    where: Unfold Chat
    how: 'Proposed: show an unremovable notice that people interact with an AI system in Unfold Chat (Unfold ADR-0049) and
      in any white-label Client Portal.'
    effort: S
    value: Covers the interaction-disclosure duty for the surfaces where people talk to a model.
  - title: High-risk use exclusion
    where: Agency contract
    how: 'Proposed: forbid Annex III uses such as recruitment or credit scoring in the acceptable-use policy, or make them
      the Client''s responsibility, before Annex III duties apply on 2027-12-02.'
    effort: S
    value: Keeps Unfold out of high-risk obligations it is not built for.
  - title: AI literacy and audit context for Agencies
    where: hosted Tenant
    how: 'Proposed: give Agencies material for their Article 4 staff literacy and record SEP-2817 audit context next to the
      AI marking (watchlist T30).'
    effort: M
    value: Helps each Agency meet its deployer duties with evidence Unfold already produces.
  radar: adopt
  radar_reason: 'Legal obligation decided it: Article 50 applies now and Unfold and each Agency hold provider or deployer
    roles; the role split needs counsel.'
  flip_trigger: Not applicable as a law; revisit when Unfold adds a use listed in Annex III, starts fine-tuning and placing
    a model on the market, or a further omnibus changes Article 50.
