    effort: S
    value: Every decision an agent made can be read back after the fact.
  - title: Configuration and limits recorded per Run
    where: Run records
    how: 'Decided: each Run records its model, harness, plan, ploegd version and the limits that stop its prompt (Ploeg ADR-0091,
