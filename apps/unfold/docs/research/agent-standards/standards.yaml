- id: skills-progressive-disclosure
  name: Skills / progressive disclosure as a packaging paradigm
  one_liner: Package expertise as a folder (SKILL.md plus scripts and references). Only name and description load up front,
    the body loads when triggered, and references load on demand.
  maturity: standardising
  where_it_lives:
  - Agent Skills donated by Anthropic to AAIF, LF press release 2026-10-22. https://www.linuxfoundation.org/press/agentic-ai-foundation-announces-four-new-projects-agent-skills-open-responses-openenv-and-opensandbox
  - Open standard released 2025-12-18, maintained at agentskills.io [secondary]. https://agentskills.io ; https://www.candede.com/articles/mastering-agent-skills-open-standard
  - '"Skills over MCP" in the MCP keynote by David Soria Parra, AGNTCon NA 2026-10-22 [secondary]. https://lucaberton.com/blog/agntcon-mcpcon-north-america-2026/'
  - Liu et al., "Malicious Agent Skills in the Wild", arXiv 2602.06547, 2026-02 (157 malicious of 98,380 skills). https://fugumt.com/fugumt/paper_check/2602.06547v1_enmode
  key_voices:
  - Anthropic / David Soria Parra
  - AAIF (https://aaif.io/news/agentic-ai-foundation-announces-four-new-projects)
  - Snyk ToxicSkills (https://snyk.io/blog/toxicskills-malicious-ai-agent-skills-clawhub)
  standardisation_outlook: AAIF now owns it. High chance (over 70%) of a governed v1 with conformance in 24 months.
  related_standards:
  - agent-skills
  - mcp
  - agents-md
  tension_or_critique: Supply-chain risk. Snyk found 13.4% of 3,984 skills had critical issues and 76 carried malicious payloads,
    with no signing or review in place (2026-02). https://snyk.io/blog/toxicskills-malicious-ai-agent-skills-clawhub
  signal_to_watch: AAIF publishes a Skills spec version with signing/provenance fields and a conformance suite.
  use_cases:
  - title: Ploeg-owned skills installed per Run
    where: Worker prepare step
    how: 'Already built: the worker installs Ploeg''s own skills under the Run''s home directory (Ploeg ADR-0035).'
    effort: S
    value: Every Run gets the same procedures without bloating the prompt.
  - title: Tell a Run which skills bear on its Work Item
    where: Run briefing
    how: 'Already decided: the briefing names the skills relevant to the Work Item rather than all of them (Ploeg ADR-0083).'
    effort: S
    value: Applies progressive disclosure at the Run level, not just the tool level.
  - title: A Team pins its skills by digest
    where: Team manifest, ploegd
    how: 'Already decided: a Team pins skills in a catalogue that ploegd fetches once and serves by digest (Ploeg ADR-0092),
      and plugins are pinned to a commit with guarded hooks (Ploeg ADR-0139).'
    effort: S
    value: A skill cannot change under a running Shift, which covers the provenance gap the spec still has.
  - title: Agency-authored skills per client
    where: Team manifest
    how: 'Proposed: let an Agency add client-specific skills to a Team''s catalogue, reviewed like code, instead of long prompts
      or AGENTS.md edits.'
    effort: M
    value: Client conventions become reusable and versioned across that client's repositories.
  - title: Adopt the signed Skills spec when it lands
    where: Skill catalogue
    how: 'Proposed: when the Skills spec gains signing and provenance fields, verify them in ploegd next to the digest pin.'
    effort: S
    value: Lets a Team take third-party skills with the same assurance as its own.
  radar: adopt
  radar_reason: Ploeg already ships, selects and pins skills per Run; it is the cheapest context lever it has.
  unfold_today: Runs get Ploeg-owned skills, are told which apply, and Teams pin them by digest (apps/ploeg/docs/adrs/0092-a-team-pins-its-skills-in-a-catalogue-that-ploegd-fetches-once-and-serves-by-digest.md).
  decisions:
  - apps/ploeg/docs/adrs/0035-runs-get-ploeg-owned-skills-mounted-toolchains-and-worker-verification.md
  - apps/ploeg/docs/adrs/0083-a-run-is-told-which-skills-bear-on-its-work-item.md
