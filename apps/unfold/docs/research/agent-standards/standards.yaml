  use_cases:
  - title: Score the shadow decider
    where: decider (system ADR-0042)
    how: 'Proposed: write the decider''s labelled tool-call cases as an Inspect task and keep the .eval logs, so its precision
      and recall are measured before it leaves shadow mode.'
    effort: M
    value: Gives the tripwire a repeatable, versioned score instead of anecdotes.
  - title: Attack drill results as eval logs
    where: Ploeg attack drill
    how: 'Proposed: record each run of the recurring hostile-repository drill (Ploeg ADR-0126) as an Inspect log per harness,
      so a regression in one harness shows up as a lower score.'
    effort: M
    value: Turns the drill into a trend per harness and model.
  - title: Bake-off judge calibration
    where: Ploeg bake-off
    how: 'Proposed: replay stored bake-off Work Items (Ploeg ADR-0135) through the shadow judge as an Inspect dataset to check
      that its recommendations agree with the person''s pick.'
    effort: M
    value: Shows whether the judge is worth trusting before it advises more people.
  - title: Evidence for an Agency's AI register
    where: Agency contract
    how: 'Proposed: export a summary of the eval logs for the models and harnesses a Tenant uses, so an Agency can show its
      Clients how the agents were tested.'
    effort: S
    value: Supports AI literacy and due-diligence answers without new tooling at the Agency.
