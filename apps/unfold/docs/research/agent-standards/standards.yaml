- id: rsl
  name: Really Simple Licensing (RSL) 1.0
  disambiguation: XML licensing vocabulary for web content, discovered via robots.txt, HTTP Link header, HTML link or RSS.
    It is not the RSL Collective (the rights organisation) and not RSS.
  layer: web-content
  steward: RSL Technical Steering Committee. The spec copyright reads "Internet Licensing Collective" (https://rslstandard.org/rsl/errata).
    The site header uses "RSL Collective" and the footer "RSL Internet Collective" (https://rslcollective.org/). No rename
    announcement found.
  governance: community
  status: stable
  latest:
    version: 1.0 (last erratum 2026-08-07)
    date: '2026-08-07'
    url: https://rslstandard.org/rsl/errata
  watch:
  - {kind: changelog-page, ref: "https://rslstandard.org/rsl/errata"}
  - {kind: changelog-page, ref: "https://github.com/rslstandard"}
  adoption:
  - '1.0 spec announced 2025-12-10 (https://rslstandard.org/press). Featured supporters: Akamai, Cloudflare, Creative Commons,
    Fastly, Reddit, Yahoo, Ziff Davis, O''Reilly, Vox Media and others (https://rslstandard.org/).'
  - 'Supertab: working Fastly integration that serves /license.xml and checks crawler requests (https://connect-docs.supertab.co/reference/fastly/connect-on-fastly).'
  - CEDRO (Spain) is the exclusive RSL Collective partner in Spain (https://ifrro.org/page/article-detail/cedro-partners-with-rsl-collective-to-develop-ai-content-licensing-framework/).
  - 'ABSENT: no AI company has publicly committed to honour RSL (https://digiday.com/media/arena-group-buzzfeed-usa-today-co-vox-media-join-rsls-ai-content-licensing-efforts/,
    2025-11-26). No 2026 contradiction found.'
  - 'ABSENT: the Collective''s licence agreement was promised for end-2025. Not found published.'
  relations:
    competes_with:
    - iab-comp
    - cloudflare-ai-crawl-control
    complements:
    - aipref
    - content-signals
    - tdmrep
    - web-bot-auth
  open_problems:
  - No enforcement in the standard itself. It relies on CDNs and lawsuits (https://digiday.com/media/arena-group-buzzfeed-usa-today-co-vox-media-join-rsls-ai-content-licensing-efforts/).
  - Errata on 2026-05-27 fixed an inconsistency between Sections 4.6 and 4.8 on canonical asset identifiers. HTML association
    scope was clarified on 2026-07-18 (https://rslstandard.org/rsl/errata).
  - Not named in the EU opt-out-protocol consultation coverage (https://cadeproject.org/updates/commission-opens-consultation-on-machine-readable-copyright-opt-out-protocols-under-the-ai-act/)
    [secondary].
