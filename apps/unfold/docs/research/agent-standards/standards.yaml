- id: capability-security-agents
  name: Capability-based / object-capability security for agents (and the lethal trifecta)
  one_liner: Agents get unforgeable, minimal, attenuable capabilities and data carries provenance. Untrusted data can never
    steer privileged actions, and private data, untrusted content and an outbound channel are never combined.
  maturity: pattern
  where_it_lives:
  - Debenedetti et al. (Google DeepMind/ETH), "Defeating Prompt Injections by Design" (CaMeL), arXiv 2503.18813, 2025-03 (rev.
    2025-06). https://arxiv.org/abs/2503.18813
  - '"Operationalizing CaMeL", arXiv 2505.22852, 2025-05. https://arxiv.org/html/2505.22852v1'
  - Simon Willison, "The lethal trifecta", 2025-06-16. https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/
  key_voices:
  - Simon Willison
  - Google DeepMind (Debenedetti
  - Tramèr)
  - ETH Zurich
  standardisation_outlook: none directly. The ideas leak into OAuth attenuation, MCP permission models and AAuth. Low chance
    as a standard, high as a design norm.
  related_standards:
  - mcp-authorization
  tension_or_critique: CaMeL drops task success (77% vs 84% on AgentDojo), assumes a trusted user prompt and leaves side channels
    open. https://arxiv.org/html/2505.22852v1
  signal_to_watch: MCP or OAuth specs adopting attenuable capability tokens, or a CaMeL-style interpreter in a mainstream
    agent SDK.
  use_cases:
  - title: Per-Run minted credentials
    where: ploegd, worker
    how: 'Already built: model key capped at the Run''s budget, push token for the Run''s repository only, control capability
      for that Run only (Ploeg ADR-0008, ADR-0013).'
    effort: S
    value: A stolen credential is worth one Run, one repository and one budget.
  - title: Placeholders in the harness
    where: Worker loopback proxies
    how: 'Already built: the harness gets placeholder credentials and runs in its own container that no credential enters
      (Ploeg ADR-0034, ADR-0138).'
    effort: S
    value: Prompt injection cannot exfiltrate a real key.
  - title: Untrusted text in a frame it cannot close
    where: Run prompt
    how: 'Decided: tracker and forge text enters the prompt in an untrusted frame (Ploeg ADR-0170), and notes carry provenance
      (Ploeg ADR-0122).'
    effort: S
    value: Data from the ticket cannot pose as instructions.
  - title: Breaking the lethal trifecta by network
    where: Worker network policy
    how: 'Already built: a worker has no route to the internet, so private code, untrusted content and an outbound channel
      are never combined (docs/concepts/inside-a-run.md, Network reach).'
    effort: S
    value: Exfiltration needs a channel that does not exist.
  - title: Capabilities granted by the person on a laptop
    where: Personal cell
    how: 'Proposed: on a person''s machine a Run gets a capability only when its person grants it (Ploeg ADR-0143, RFC-0010).'
    effort: M
    value: Extends the same model to local Runs with more rights.
  radar: adopt
  radar_reason: Minimal, per-Run, attenuated credentials and quoted untrusted input are already Ploeg's core design.
  unfold_today: Every credential is minted per Run and kept out of the harness (apps/ploeg/docs/adrs/0034-the-harness-gets-placeholders-the-worker-keeps-credentials.md).
  decisions:
  - apps/ploeg/docs/adrs/0008-litellm-is-the-credential-and-metering-seam.md
  - apps/ploeg/docs/adrs/0013-push-rights-are-minted-per-run.md
  - apps/ploeg/docs/adrs/0034-the-harness-gets-placeholders-the-worker-keeps-credentials.md
  - apps/ploeg/docs/adrs/0122-every-note-carries-its-provenance-untrusted-text-is-quoted-and-a-wider-level-needs-evidence-or-a-person.md
  - apps/ploeg/docs/adrs/0138-a-harness-runs-in-its-own-container-and-no-credential-enters-it.md
  - apps/ploeg/docs/adrs/0143-a-persons-machine-is-a-personal-cell-and-a-run-gets-a-capability-only-when-its-person-grants-it.md
  - apps/ploeg/docs/adrs/0170-tracker-and-forge-text-enters-the-prompt-in-an-untrusted-frame-it-cannot-close.md
  - docs/design/rfc-0010-agents-on-your-own-machine.md
  reviewed: '2026-11-04'
- id: agentic-web
  name: The agentic web (agent-readable sites, WebMCP, NLWeb, llms.txt)
  one_liner: Websites expose structured, callable surfaces for agents (in-page tools, a natural-language endpoint, LLM-oriented
    text) instead of agents scraping HTML.
  maturity: pre-standard
  where_it_lives:
  - WebMCP, Draft Community Group Report, W3C Web Machine Learning CG; editors Walderman (Microsoft), Sagar and Farolino (Google).
    https://webmachinelearning.github.io/webmcp
  - W3C AI KR CG technical notes on WebMCP. https://w3c-cg.github.io/aikr/webMCP/webmcp-technical-notes.html
  - Microsoft NLWeb (Build 2025, schema.org/RSS based, open source). https://github.com/microsoft/NLWeb ; https://yoast.com/scaling-the-agentic-web-with-nlweb/
  - llms.txt adoption around 6-10% of top sites, with crawlers largely ignoring it (2026) [secondary]. https://ppc.land/llms-txt-adoption-rises-8-8x-but-97-of-files-get-zero-ai-requests/
    ; https://commoncrawl.org/blog/a-content-analysis-of-llms-txt-files-from-the-july-2026-crawl-archive
  key_voices:
  - Google Chrome / Microsoft Edge WebMCP editors
  - Microsoft (R.V. Guha
  - NLWeb)
  - Yoast
  standardisation_outlook: W3C. WebMCP has a CG draft and a Chrome origin trial. Medium chance of a WG/incubation in 24 months;
    NLWeb low; llms.txt low.
  related_standards:
  - webmcp
  - mcp
  - web-bot-auth
  tension_or_critique: llms.txt has about 0.1% of crawler traffic and no citation benefit, and WebMCP's API shape is still
    moving (navigator vs document). https://ppc.land/llms-txt-adoption-rises-8-8x-but-97-of-files-get-zero-ai-requests/ ;
    https://chudi.dev/blog/what-is-webmcp
  signal_to_watch: WebMCP moving to a W3C WG or shipping unflagged in a stable Chrome release, plus a second engine signalling
    support.
  use_cases:
  - title: llms.txt on the docs and marketing site
    where: Marketing site, docs
    how: 'Proposed: publish an llms.txt index for the docs and the separately released marketing site (system ADR-0012).'
    effort: S
    value: Prospects' agents can read what Unfold does accurately.
  - title: MCP is Unfold's agent surface
    where: unfold-mcp, ploeg-mcp
    how: 'Already decided: agents reach Unfold through read-first MCP servers (system ADR-0011, ADR-0032), so WebMCP in the
      browser UI would be a second surface to secure.'
    effort: S
    value: One agent surface to authorise and audit.
  - title: Runs do not browse the web
    where: Worker network
    how: 'Resist: workers have no internet route (docs/concepts/inside-a-run.md), so agent-readable sites cannot help a Run
      without opening an exfiltration channel.'
    effort: S
    value: Keeps the lethal trifecta broken.
  - title: Preview environments readable by reviewers
    where: Preview environments
    how: 'Proposed: give each preview environment (system ADR-0008) a structured summary page that a reviewer Run or a client''s
      agent can read.'
    effort: M
    value: Reviewers can check a deployed change, not only its diff.
  - title: Watch WebMCP for the Agents window
    where: Unfold browser UI
    how: 'Watch: if WebMCP ships unflagged, assess exposing the Agents window''s actions to the person''s own browser agent.'
    effort: S
    value: Lets a person's assistant act in Unfold with their session when the standard is real.
  radar: hold
  radar_reason: Unfold's agent surface is MCP and its Runs have no web access, so agent-readable web standards add little
    today.
  unfold_today: Nothing yet; agents reach Unfold over read-first MCP servers (docs/adr/adr-0011-unfold-is-reachable-over-mcp-through-a-read-first-server.md).
  decisions:
  - docs/adr/adr-0008-every-pull-request-gets-a-preview-environment.md
