- id: guardian-agents
  name: Guardian / overseer agents and agent firewalls
  one_liner: Separate supervising software, often itself AI, that watches other agents' actions and blocks or flags those
    outside policy.
  maturity: pattern
  where_it_lives:
  - Gartner Market Guide for Guardian Agents, 2026-02 (G00836388; Litan, Plummer) [secondary]. https://www.gartner.com/en/documents/7856181
    ; https://astrix.security/learn/blog/market-guide-guardian-agents/
  - Gartner forecast that guardian agents take 10-15% of agentic AI markets by 2030 (2025) [secondary]. https://www.itpro.com/technology/artificial-intelligence/enterprises-are-worried-about-agentic-ai-security-risks-gartner-says-the-answer-is-just-adding-more-ai-agents
  - OWASP Top 10 for Agentic Applications, 2025-12-09. https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026
  key_voices:
  - Gartner (Avivah Litan)
  - OWASP GenAI Security Project
  standardisation_outlook: none. It is a market category. Low chance in 24 months. OWASP may publish control guidance.
  related_standards:
  - owasp-agentic-top10
  tension_or_critique: '"Just adding more AI agents" to secure agents (ITPro headline). Willison judges probabilistic guardrails
    that block 95% "a failing grade". https://www.itpro.com/technology/artificial-intelligence/enterprises-are-worried-about-agentic-ai-security-risks-gartner-says-the-answer-is-just-adding-more-ai-agents
    ; https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/'
  signal_to_watch: OWASP or CSA publishing a normative agent-control standard that names an independent oversight component.
  use_cases:
  - title: Decider as an early tripwire
    where: Self-hosted decider
    how: 'Proposed: a small self-hosted decision model scores each builder tool call for hijack or carelessness, as a shadow
      that never acts at first (system ADR-0042, RFC-0008).'
    effort: M
    value: Catches a hijacked Run early at near-zero cost.
  - title: Run health with an advising judge
    where: Run card
    how: 'Proposed, partly built: deterministic health signals plus an optional judge that only advises (RFC-0007).'
    effort: M
    value: A person sees a Run veering off track without reading its transcript.
  - title: Judge by kind of work
    where: Run health
    how: 'Proposed: classify the Work Kind and each tool call''s Activity and judge against the kind (RFC-0009).'
    effort: M
    value: Fewer false alarms than one threshold for all work.
  - title: A shadow reader never acts
    where: Ploeg policy
    how: 'Already decided: a shadow reader records its verdict and never acts (Ploeg ADR-0096); any later automatic stop acts
      as a named service actor.'
    effort: S
    value: Keeps guardian mistakes from stopping good work while it is calibrated.
  - title: Keep the guardian out of band
    where: LiteLLM gateway
    how: 'Resist: the owner chose an out-of-band reader over an inline gateway guardrail (RFC-0008), so no guardian sits in
      the model path.'
    effort: S
    value: A guardian outage cannot stop every Run.
  radar: trial
  radar_reason: The decider and judge are built on branches as shadows; they need calibration data before any of them may
    act.
  unfold_today: Reviewer Roles review every writer, and the decider tripwire is built as a shadow on a branch (docs/adr/adr-0042-a-self-hosted-decider-reads-what-agents-do-and-starts-as-a-shadow-tripwire.md).
