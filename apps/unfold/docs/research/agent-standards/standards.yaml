- id: trust-reputation
  name: Trust and reputation systems for agents
  one_liner: Public registries of agent identity, feedback and third-party validation, so unknown agents can be trusted (on-chain
    or VC-based).
  maturity: pre-standard
  where_it_lives:
  - ERC-8004 "Trustless Agents" (Identity, Reputation and Validation registries), mainnet ~2026-01-29, EIP still draft [secondary].
    https://eips.ethereum.org/EIPS/eip-8004
  - '"Can Trustless Agents Be Trusted? An Empirical Study", arXiv 2606.26028 (abstract only). https://www.alphaxiv.org/abs/2606.26028.md'
  - NANDA AgentFacts (VC-backed) in "Evolution of AI Agent Registry Solutions", arXiv 2508.03095. https://arxiv.org/abs/2508.03095
  key_voices:
  - Ethereum Foundation dAI team
  - MIT NANDA
  - Cisco AGNTCY
  standardisation_outlook: Ethereum EIP process for on-chain. W3C VC for off-chain. Low chance of enterprise-relevant adoption
    in 24 months.
  tension_or_critique: Registered mainnet agents often show no reputation feedback at all, and reputation is sybil-prone.
    https://erc-8004.quicknode.com/agents/ethereum-mainnet/23034
  signal_to_watch: A non-crypto enterprise registry (Entra Agent ID, AGNTCY) adopting a shared reputation/attestation format.
  use_cases:
  - title: Run card grade as internal reputation
    where: Run cards
    how: 'Accepted: Run cards grade each Run with a versioned formula over stored facts (system ADR-0030, Ploeg ADR-0050),
      which can roll up per Team configuration.'
    effort: M
    value: An Agency sees which Team setups earn trust.
  - title: Repository maturity sets autonomy
    where: Connect a repository
    how: 'Accepted: Unfold describes a repository with the AI Codebase Maturity Model and delivers at level 5 (system ADR-0047).'
    effort: S
    value: Trust is earned per repository, not assumed.
  - title: Harness allowlist as a trust list
    where: Team configuration
    how: 'Decided: an operator may choose a harness only from the Team''s allowlist (Ploeg ADR-0098).'
    effort: S
    value: Unknown agents never run on client code.
  - title: Signed artefacts as supply-chain trust
    where: Images and harness installs
    how: 'Decided: images carry signed OpenVEX and the Claude runner installs a signed release at start (Ploeg ADR-0145, ADR-0141).'
    effort: S
    value: Trust rests on verifiable signatures, not reputation scores.
  - title: No public agent registry
    where: Product
    how: 'Resist: Unfold runs known Teams for known Tenants; a public reputation registry or on-chain scheme adds attack surface
      without a use.'
    effort: S
    value: Keeps trust decisions inside the Agency.
  radar: hold
  radar_reason: Unfold never runs unknown agents, so public reputation systems solve a problem it does not have.
  unfold_today: Run card grades and repository maturity serve as internal trust signals (docs/adr/adr-0047-unfold-describes-a-repository-with-the-ai-codebase-maturity-model-and-delivers-at-level-5.md).
  decisions:
  - docs/adr/adr-0030-run-cards-are-an-unfold-domain-on-top-of-ploegs-delivery-facts.md
  - docs/adr/adr-0047-unfold-describes-a-repository-with-the-ai-codebase-maturity-model-and-delivers-at-level-5.md
  - apps/ploeg/docs/adrs/0050-a-run-cards-grade-is-a-versioned-formula-over-stored-facts.md
  - apps/ploeg/docs/adrs/0098-an-operator-admission-may-choose-each-runs-harness-from-its-teams-allowlist.md
  - apps/ploeg/docs/adrs/0141-the-claude-runner-image-carries-no-claude-code-and-installs-anthropics-signed-release-at-start.md
  - apps/ploeg/docs/adrs/0145-a-release-publishes-no-image-over-its-cve-budget-and-attaches-signed-openvex-to-every-digest.md
