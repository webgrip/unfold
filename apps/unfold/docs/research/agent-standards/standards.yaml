- id: agent-os
  name: Agent OS concepts
  one_liner: Model the agent runtime as an operating system (kernel, scheduler, LLM syscalls, memory and storage managers),
    with agents as apps.
  maturity: idea
  where_it_lives:
  - '{"Mei et al. (Rutgers, Yongfeng Zhang), \"AIOS": "LLM Agent Operating System\", arXiv 2403.16971 (v4 2025-05). https://arxiv.org/html/2403.16971v5"}'
  - Ge et al., "LLM as OS, Agents as Apps", arXiv 2312.03815, 2023-12. https://ar5iv.labs.arxiv.org/html/2312.03815
  key_voices:
  - Yongfeng Zhang / AIOS Foundation (https://github.com/agiresearch/AIOS)
  standardisation_outlook: none. Low chance in 24 months. In practice the "OS" role is being filled by harness, sandbox and
    gateway projects.
  tension_or_critique: No 2026 production adoption turned up in searches. Kubernetes plus gateways plus sandboxes already
    deliver scheduling and isolation, so the OS metaphor adds vocabulary rather than mechanism (absence finding).
  signal_to_watch: A major runtime adopting an LLM-syscall interface, or AIOS cited by a foundation project.
  use_cases:
  - title: Ploeg is already the scheduler
    where: ploegd, KEDA
    how: Ploeg schedules Runs, holds Leases and enforces budgets (docs/concepts/how-work-flows.md); calling it an OS adds
      a metaphor, not a capability.
    effort: S
    value: Avoids a rename that confuses the one vocabulary of system ADR-0036.
  - title: Cells pull from one hub
    where: Execution cells
    how: 'Decided: execution runs in cells that pull from one hub (Ploeg ADR-0107), the useful part of the OS idea: one kernel,
      many places to run.'
    effort: M
    value: Scales execution without a new runtime abstraction.
  - title: No LLM-syscall layer under harnesses
    where: Harness adapters
    how: 'Resist: harness session state stays opaque (apps/unfold/AGENTS.md); wrapping harnesses in an LLM-syscall interface
      would fight every vendor''s loop.'
    effort: S
    value: Keeps harnesses swappable.
  - title: Personal cells as user space
    where: Laptop daemon
    how: 'Proposed: a person''s machine is a personal cell (Ploeg ADR-0143, RFC-0010), giving local Runs the same scheduling
      without a new OS layer.'
    effort: M
    value: Local work joins the same accounting and identity.
  - title: Watch for an AIOS-style runtime standard
    where: Architecture
    how: 'Watch only: revisit if a foundation project standardises an agent kernel interface.'
    effort: S
    value: No effort spent until there is something to conform to.
  radar: hold
  radar_reason: The concept is an idea without an interface, and Ploeg already provides the scheduling and isolation it describes.
  unfold_today: Nothing called an agent OS; ploegd, KEDA and cells do the scheduling (apps/ploeg/docs/adrs/0107-execution-runs-in-cells-that-pull-from-one-hub.md).
  decisions:
  - docs/adr/adr-0036-ploeg-and-unfold-use-one-vocabulary-with-named-screen-words.md
  - apps/ploeg/docs/adrs/0107-execution-runs-in-cells-that-pull-from-one-hub.md
  - apps/ploeg/docs/adrs/0143-a-persons-machine-is-a-personal-cell-and-a-run-gets-a-capability-only-when-its-person-grants-it.md
  - docs/design/rfc-0010-agents-on-your-own-machine.md
  reviewed: '2026-11-04'
- id: computer-use-fallback
  name: Computer use / browser agents as the universal fallback interface
  one_liner: When no API or MCP exists, agents operate the GUI or browser like a human. APIs come first and computer use fills
    the gaps.
  maturity: pattern
  where_it_lives:
  - OSWorld progress, from about 15% (late 2024) to roughly 70%+ (2026), with the strict-vs-partial grading caveat [secondary].
    https://deck.co/blog/state-of-computer-use-agents-2026
  - OpenID AIIM whitepaper flags browser agents bypassing API controls, 2025-10-07. https://openid.net/new-whitepaper-tackles-ai-agent-identity-challenges/
  - Hybrid API-first guidance [secondary]. https://unicoconnect.com/blogs/computer-use-vs-api-integration
  key_voices:
  - Anthropic
  - OpenAI
  - Google (computer-use models)
  - OpenID Foundation (risk side)
  standardisation_outlook: WebMCP is the standards answer that makes it unnecessary. Web Bot Auth handles identification.
    Low chance of standardising computer use itself.
  related_standards:
  - webmcp
  - web-bot-auth
  tension_or_critique: Token-hungry (an image per step), brittle, hard to audit, and it bypasses API-level authorization.
    https://openid.net/new-whitepaper-tackles-ai-agent-identity-challenges/
  signal_to_watch: OSWorld strict-grading scores above 80%, or Web Bot Auth adopted by the major agent browsers.
  use_cases:
  - title: A walkthrough a person can repeat
    where: Writing Runs
    how: 'Decided: a writing Run shows its change in a walkthrough a person can repeat (Ploeg ADR-0125); a browser-driving
      step could record it for UI changes.'
    effort: M
    value: Reviewers see the change work, not only read it.
  - title: Reviewer checks the preview environment
    where: Preview environments
    how: 'Proposed: a reviewer Role drives the preview environment of system ADR-0008 with a browser to check the acceptance
      criteria.'
    effort: L
    value: Catches UI regressions CI does not test.
  - title: Integrations stay API-first
    where: Tracker and forge ports
    how: 'Resist: trackers and forges are reached only through ports with conformance suites (Ploeg ADR-0183); GUI automation
      would be brittle and unauditable.'
    effort: S
    value: Integrations keep working across UI changes.
  - title: Network blocks browsing from Runs
    where: Worker network
    how: 'Resist for now: workers have no internet route (docs/concepts/inside-a-run.md); a browser Run may reach only the
      preview environment through an allowlist.'
    effort: S
    value: Keeps the exfiltration channel closed.
  - title: Unfold's UI is usable by agents
    where: Unfold browser UI
    how: 'Already a rule: labels wrap rather than clip and accessibility is checked (apps/unfold/AGENTS.md), which also makes
      the UI legible to a computer-use agent.'
    effort: S
    value: A person's own browser agent can operate Unfold.
  radar: assess
  radar_reason: Browser checks of preview environments could raise review quality, but they need an egress design and reliability
    Unfold has not tested.
  unfold_today: Nothing yet; the nearest is the repeatable walkthrough of Ploeg ADR-0125 (apps/ploeg/docs/adrs/0125-a-writing-run-shows-its-change-in-a-walkthrough-a-person-can-repeat.md).
  decisions:
