- id: litellm-otel
  name: LiteLLM OpenTelemetry integration (legacy `otel` callback and LITELLM_OTEL_V2 engine)
  disambiguation: 'Not a standard; it is LiteLLM''s own emitter. There are two code paths. (1) The legacy callback (litellm/integrations/opentelemetry.py)
    emits ''litellm_request'' spans with gen_ai.system, llm.is_streaming and a raw_gen_ai_request child span. Setting OTEL_SEMCONV_STABILITY_OPT_IN=gen_ai_latest_experimental
    switches it to OTel GenAI, added 2026-05-16 (https://github.com/BerriAI/litellm/blob/main/litellm/integrations/opentelemetry_utils/gen_ai_semconv.py).
    (2) LITELLM_OTEL_V2=true, off by default, is a typed engine added 2026-05-30. Its mapper chain always starts with ''genai'',
    plus optional legacy/openinference/langfuse/weave/langtrace, and it adds auth, guardrail, cache, route, redis and postgres
    spans (https://github.com/BerriAI/litellm/blob/main/litellm/integrations/otel/README.md, https://github.com/BerriAI/litellm/blob/main/litellm/integrations/otel/model/config.py).
    absence: no LITELLM_OTEL_V2 mention found under docs/ by GitHub code search.'
  layer: observability
  steward: BerriAI
  governance: single-vendor
  status: stabilising
  latest:
    version: v1.108.0
    date: '2026-11-04'
    url: https://github.com/BerriAI/litellm/releases/tag/v1.108.0
