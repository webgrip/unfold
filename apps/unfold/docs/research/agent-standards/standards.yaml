- id: multi-agent-topologies
  name: Swarms and multi-agent orchestration topologies
  one_liner: Organise work as orchestrator-worker, pipelines, debates or swarms of specialised agents rather than one agent.
  maturity: pattern
  where_it_lives:
  - Anthropic, "How we built our multi-agent research system", 2025-06-13 (Hadfield et al.). +90.2% vs single-agent on an
    internal eval, about 15x the tokens of chat. https://www.anthropic.com/engineering/multi-agent-research-system
  - Walden Yan (Cognition), "Don't Build Multi-Agents", 2025-06-12. https://cognition.com/blog/dont-build-multi-agents
  - Survey arXiv 2505.02279 (MCP/ACP/A2A/ANP roadmap), 2025-05. https://arxiv.org/abs/2505.02279
  key_voices:
  - Anthropic
  - Cognition (Walden Yan)
  - LangChain
  standardisation_outlook: Topology is not standardisable. A2A covers inter-agent transport. Low chance in 24 months.
  related_standards:
  - a2a
  - mcp
  tension_or_critique: Cognition argues that context fragmentation and conflicting implicit decisions make multi-agent setups
    fragile for coupled work such as coding. https://cognition.com/blog/dont-build-multi-agents
  signal_to_watch: Benchmarks showing multi-agent beating single-agent on coupled tasks at equal token budget.
  use_cases:
  - title: One writer, reviewers from another family
    where: Shift plan
    how: 'Already built: a Round holds one writer or several read-only reviewers, never both, and a Team can require a reviewer
      unlike its writer (docs/concepts/how-work-flows.md, Ploeg ADR-0163).'
    effort: S
    value: Matches the topology the evidence converged on.
  - title: Capped, verdict-driven fix loop
    where: Shift engine
    how: 'Already decided: the review loop is verdict-driven and capped (Ploeg ADR-0017, ADR-0151).'
    effort: S
    value: Agents cannot loop on each other's opinions without limit.
  - title: The pull request is the blackboard
    where: Agent communication
    how: 'Decided: agents communicate through the pull request and a blackboard of four owned sources read at a version vector
      (Ploeg ADR-0011, ADR-0124).'
    effort: S
    value: No agent-to-agent protocol to secure or debug.
  - title: Planner Roles create held work
    where: Planner Role
    how: 'Built behind approval: a planner splits or clarifies a Work Item and created items wait as proposed within limits
      (Ploeg ADR-0031).'
    effort: M
    value: Orchestrator-worker where it pays, without autonomous fan-out.
  - title: No swarms or debates
    where: Team shape
    how: 'Resist: the models and topology record found no swarm, debate or agent-to-agent protocol worth adding; A2A stays
      a watchlist (Ploeg ADR-0007).'
    effort: S
    value: Spend goes to cost per accepted pull request, not coordination overhead.
  radar: adopt
  radar_reason: Ploeg's Round structure is the minimal topology the evidence supports, and it is already built.
