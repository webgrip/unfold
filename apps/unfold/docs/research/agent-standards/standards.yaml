  - title: Bake-off as an eval
    where: Operator admission
    how: 'Proposed: run one Work Item on several configurations and let a shadow judge recommend while a person picks (Ploeg
      ADR-0135).'
    effort: M
    value: Model and harness choices rest on measured outcomes.
  - title: Recurring attack drill
    where: Harness qualification
    how: 'Decided: a recurring drill runs every harness against a hostile repository (Ploeg ADR-0126).'
    effort: M
    value: A security eval gates every harness, not just a one-off test.
  - title: Pilot batches against the KPIs
    where: Loop measurement
    how: 'Built as a procedure: run a pilot batch and measure it against the KPIs (docs/how-to/run-a-pilot-batch.md, docs/reference/kpis.md),
      as the loop baseline and cost-per-merge records did.'
    effort: S
    value: Cost per merged Work Item becomes the contract a change must not worsen.
  - title: Golden Work Items gate the release train
    where: Release train
    how: 'Proposed: a small fixed set of Work Items with known-good outcomes runs before a Team''s model or harness changes,
      alongside the hourly train of system ADR-0046.'
    effort: L
    value: Regressions in agent behaviour are caught before an Agency sees them.
  - title: Conformance suites for ports and the gateway
    where: Ploeg ports
    how: 'Decided: every tracker and forge adapter passes its port''s conformance suite (Ploeg ADR-0183); the exec adapter
      is the harness conformance target.'
    effort: S
    value: Integration correctness is specified as tests, not docs.
  radar: trial
  radar_reason: Ploeg has the pieces (bake-off, drills, KPIs) but no eval suite yet gates a model or harness change.
  unfold_today: KPIs, pilot batches and the attack drill exist; the bake-off is proposed (apps/ploeg/docs/adrs/0135-a-bake-off-runs-one-work-item-on-several-configurations-and-a-shadow-judge-recommends-while-a-person-picks.md).
