    where: Unfold docs
    how: 'Proposed: publish an RSL file that states the docs are free to use for AI input and training, matching the open-source
      licence in LICENSES.'
    effort: S
    value: 'States openly, in a machine-readable form, what Unfold wants: to be read.'
  - title: Licence statement for the Unfold site
    where: Unfold site
    how: 'Proposed: link an RSL licence from robots.txt (apps/site/src/pages/robots.txt.ts) that allows use while keeping
      the name and mark under TRADEMARK.md.'
    effort: S
    value: Keeps the trademark position of ADR-0014 visible to crawlers.
  - title: Publisher Client licensing Work Item
    where: Agency Work Item type
    how: 'Proposed Work Item template for media or knowledge Clients: add /license.xml, robots.txt and Link headers with RSL
      terms chosen by the Client.'
    effort: S
    value: A small paid Work Item for Agencies with publishing Clients.
  - title: RSL with a CDN integration
    where: Agency's Client site
    how: 'Proposed: wire a CDN integration such as Supertab on Fastly that serves /license.xml and checks crawler requests,
      configured in the Client''s own infrastructure.'
    effort: M
    value: Gives the licence some enforcement, which the standard lacks.
  - title: Content-licensing check in Refinement
    where: Client Portal
    how: 'Proposed: the Client Profile records the Client''s chosen licensing stance, so Refinement adds the files to every
      relevant site Work Item.'
    effort: S
    value: Keeps a Client's choice consistent across its sites.
  radar: hold
  radar_reason: 'Fit decided it: Unfold wants its content read, and no AI company has committed to honour RSL, so it adds
    little now despite a stable 1.0.'
  flip_trigger: A major AI company publicly commits to honour RSL, or the EU opt-out list names it.
  decisions:
