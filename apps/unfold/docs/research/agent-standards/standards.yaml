concepts:
- id: context-engineering
  name: Context engineering
  one_liner: Treat the context window as a scarce, curated resource. Choose the smallest high-signal set of tokens (instructions,
    tools, retrieved data, history) at each step, using just-in-time retrieval, compaction, notes and sub-agents.
  maturity: de-facto-convention
  where_it_lives:
  - Anthropic Engineering, "Effective context engineering for AI agents", 2025-09-29, Rajasekaran/Dixon/Ryan/Hadfield. https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
  - Mei et al., "A Survey of Context Engineering for LLMs", arXiv 2507.13334, 2025-07. https://arxiv.org/html/2507.13334V1
  - HumanLayer "12-factor agents", factor 3 "Own your context window" (Dex Horthy), AI Engineer talk. https://github.com/humanlayer/12-factor-agents
    ; https://ai.engineer/talks/12-factor-agents
  - AI Engineer World's Fair 2026 (SF, Jun 29-Jul 2) listed context engineering as a track theme [secondary]. https://en.people.cn/n3/2026/0707/c98649-20475333.html
  key_voices:
  - Anthropic Applied AI (https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents)
  - Dex Horthy/HumanLayer (https://github.com/humanlayer/12-factor-agents)
  - Lingrui Mei et al. (https://arxiv.org/html/2507.13334V1)
  standardisation_outlook: none. It is a discipline, not an interface. Low chance (under 10%) in 24 months. Its standardisable
    parts move into Skills, MCP resources and memory specs.
  related_standards:
  - mcp
  - agent-skills
  - agents-md
  tension_or_critique: Fresh labelling of old ideas (RAG plus prompt design). The 2026 harness-engineering discourse already
    treats it as a subset of the harness. https://www.faros.ai/blog/harness-engineering
  signal_to_watch: A spec defines a portable compaction or summary format, for example in MCP or Open Responses state handling.
  use_cases:
  - title: Context bundles under fixed limits
    where: Ploeg worker, Run briefing
    how: 'Already built: files a person attaches to a Work Item are stored once and unpacked next to the clone under fixed
      size limits, with an index in the prompt instead of the full text (Ploeg ADR-0067, system ADR-0022).'
    effort: S
    value: The Run pulls in only the files it needs, so attached context does not crowd out the task.
  - title: Knowledge pack per Run
    where: ploegd knowledge graphs, Run briefing
    how: 'Proposed: brief each Run with only the OKF concepts that bear on its Work Item, written as files and indexed in
      the prompt (system ADR-0021, Ploeg ADR-0065, the agent-knowledge RFC).'
    effort: M
    value: Cuts the tokens and Rounds each Run spends rediscovering how a repository builds.
  - title: Clean-context reviewer
    where: Shift plan, reviewer Rounds
    how: 'Already built: a reviewer Round starts a fresh Run that reads the branch and base-branch instruction files, never
      the writer''s transcript (Ploeg ADR-0163, the models and topology record).'
    effort: S
    value: An uncontaminated context is what makes the second look worth paying for.
  - title: Compact hand-off between Rounds
    where: Shift engine, fix Rounds and retries
    how: 'Proposed: give a fix Round or a retry a short structured hand-off (findings with ids, the checkpoint, the last verify
      result) built from Ploeg ADR-0121, ADR-0075 and the bounded transcript of ADR-0090, rather than replaying history.'
    effort: M
    value: Fix Rounds start oriented without paying for the previous Run's whole conversation.
  - title: Measure context spend per briefing section
    where: Run telemetry
    how: 'Proposed: tag the prompt sections a worker assembles (task, skills, bundle index, knowledge pack) and export their
      token counts through the OpenTelemetry collector of Ploeg ADR-0113.'
    effort: M
    value: Shows which briefing section costs most and lets the owner cut it with evidence.
  radar: adopt
  radar_reason: Ploeg already curates each Run's context under fixed limits; the remaining work is measuring and compacting
    it.
  unfold_today: 'Ploeg briefs each Run from a bounded set: told skills, context bundles under limits and steering that reaches
    the next Run (apps/ploeg/docs/adrs/0067-context-bundles-are-stored-per-work-item-and-unpacked-by-the-worker-under-fixed-limits.md).'
  decisions:
  - docs/adr/adr-0021-agents-are-briefed-from-a-per-tenant-knowledge-base-exchanged-as-okf.md
  - docs/adr/adr-0022-people-give-a-work-item-context-files-at-the-start-and-while-steering.md
  - apps/ploeg/docs/adrs/0065-a-run-is-briefed-with-an-okf-knowledge-pack-written-outside-the-clone.md
  - apps/ploeg/docs/adrs/0067-context-bundles-are-stored-per-work-item-and-unpacked-by-the-worker-under-fixed-limits.md
  - apps/ploeg/docs/adrs/0068-context-added-while-a-shift-runs-reaches-the-next-run.md
  - apps/ploeg/docs/adrs/0083-a-run-is-told-which-skills-bear-on-its-work-item.md
  - apps/ploeg/docs/adrs/0121-findings-carry-ids-writers-answer-them-and-a-run-asks-instead-of-guessing.md
  - apps/ploeg/docs/adrs/0163-a-reviewer-reads-the-base-branchs-instruction-files-and-a-team-can-require-a-reviewer-unlike-its-writer.md
  - docs/research/2026-10-04-rfc-agent-knowledge.md
  - docs/research/2026-10-04-rfc-context-bundles-and-steering.md
  reviewed: '2026-11-04'
- id: context-as-portable-artifact
  name: Context files as portable artifacts (AGENTS.md, CLAUDE.md, rule files)
  one_liner: Repository-resident instruction files that any coding agent reads, so project context travels with the code rather
    than living in one vendor's settings.
  maturity: de-facto-convention
  where_it_lives:
  - AAIF founding projects incl. AGENTS.md (OpenAI), 2025-12-09 [secondary]. https://www.techzine.eu/news/infrastructure/137131/newly-launched-agentic-ai-foundation-to-take-charge-of-mcps-future
  - AGENTS.md in "60k+" repos per recaps [secondary]. https://lucaberton.com/blog/agntcon-mcpcon-europe-2026-recap-takeaways/
  - Gloaguen, Mündler, Müller, Raychev, Vechev, "Evaluating AGENTS.md", arXiv 2602.11988, 2026-02-12, ICLR 2026. https://arxiv.org/abs/2602.11988
  key_voices:
  - OpenAI (AGENTS.md donor)
  - AAIF (https://aaif.io)
  - ETH SRI Lab/Vechev (https://arxiv.org/abs/2602.11988)
  standardisation_outlook: AAIF already hosts AGENTS.md. Medium chance in 24 months of a formalised schema (sections, precedence,
    nesting). The format itself is free text.
  related_standards:
  - agents-md
  - agent-skills
  tension_or_critique: The ETH study found context files do not raise task success, LLM-generated ones may lower it, and they
    add 20%+ inference cost. Repo overviews in particular do not help. https://arxiv.org/abs/2602.11988
  signal_to_watch: An AAIF-published AGENTS.md schema or versioned spec. Major agents honouring nested-precedence rules identically.
  use_cases:
  - title: Delivery contract outranks the repository's files
    where: Worker prompt
    how: 'Already decided: a target repository''s AGENTS.md or CLAUDE.md is read but ranks below Ploeg''s delivery contract
      (Ploeg ADR-0030).'
    effort: S
    value: A repository cannot instruct a Run out of its budget, branch or review rules.
  - title: Reviewer reads the base branch's instruction files
    where: Reviewer Runs
    how: 'Already decided: a reviewer reads instruction files from the base branch, so a pull request cannot rewrite the rules
      it is judged by (Ploeg ADR-0163).'
    effort: S
    value: Closes the trick of a change that edits AGENTS.md to excuse itself.
  - title: Hidden-character scan before the agent starts
    where: ploeg-worker prepare step
    how: 'Already built: the worker stops a Run when the repository''s agent instruction files contain hidden characters (docs/concepts/inside-a-run.md,
      step 5).'
    effort: S
    value: Treats repository-resident context as untrusted input, as it should be.
  - title: Repository readiness check on connect
    where: Unfold, Connect a repository
    how: 'Proposed: when a repository is connected, report whether it has AGENTS.md with exact commands and a CLAUDE.md bridge,
      as the AGENTS.md record recommends, and fold it into the maturity level of system ADR-0047.'
    effort: S
    value: An Agency sees before the first Shift why Runs on a repository will waste tokens.
  - title: Keep Tenant knowledge out of the repository files
    where: Agent knowledge
    how: 'Resist: client and Tenant knowledge belongs in the scoped graphs and OKF packs (system ADR-0034), not pushed into
      a client''s AGENTS.md, which travels to every tool and every fork.'
    effort: S
    value: Keeps one client's knowledge from leaking through a file the client's other vendors read.
  radar: adopt
  radar_reason: AGENTS.md is the cross-tool file and Ploeg already reads it with a clear precedence and a safety scan.
  unfold_today: Ploeg reads target-repository instruction files below its delivery contract and scans them for hidden characters
    (apps/ploeg/docs/adrs/0030-target-repository-instructions-rank-below-the-delivery-contract.md).
  decisions:
  - apps/ploeg/docs/adrs/0030-target-repository-instructions-rank-below-the-delivery-contract.md
  - apps/ploeg/docs/adrs/0163-a-reviewer-reads-the-base-branchs-instruction-files-and-a-team-can-require-a-reviewer-unlike-its-writer.md
  - docs/adr/adr-0034-agent-knowledge-is-scoped-to-tenant-client-repository-and-work-item-in-two-graphs-per-tenant.md
  - docs/adr/adr-0047-unfold-describes-a-repository-with-the-ai-codebase-maturity-model-and-delivers-at-level-5.md
  - docs/research/2026-09-22-agents-md.md
  - docs/research/2026-10-27-ai-codebase-maturity-model-fit.md
  reviewed: '2026-11-04'
- id: agent-memory-portability
  name: Agent memory (episodic/semantic/procedural) and memory portability
  one_liner: Persistent agent memory outside the context window, plus the idea that a user's or agent's memory should move
    between vendors with signed, erasable records.
  maturity: pre-standard
  where_it_lives:
  - W3C AI Agent Memory Interoperability CG, charter v1.0 adopted 2026-06-19, chair Russell Jackson. Normatively references
    IETF independent submission draft-saihm-memory-protocol. https://www.w3.org/community/ai-agent-memory-interop/2026/07/16/charter-ai-agent-memory-interoperability-community-group-v1-0/
  - Chhikara et al., "Mem0", arXiv 2504.19413, 2025-04. https://arxiv.org/abs/2504.19413
  - Portable Agent Memory preprint (episodic/semantic/procedural/working/identity), arXiv 2605.11032, 2026-05 (not opened).
    https://arxiv.org/html/2605.11032
  - Anthropic's "structured note-taking" as agentic memory, 2025-09-29. https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
  key_voices:
  - Russell Jackson / W3C CG (https://www.w3.org/community/ai-agent-memory-interop/), Mem0 (https://arxiv.org/abs/2504.19413),
    Letta (filesystem baseline dispute, [secondary] https://www.36kr.com/p/3423823155252610)
  standardisation_outlook: W3C CG plus an IETF independent submission. Low chance of real cross-vendor adoption in 24 months,
    because the hyperscalers are absent and their memory is a lock-in asset.
  related_standards:
  - mcp
  tension_or_critique: Letta reported a plain filesystem agent scoring 74% on LoCoMo, beating specialised memory systems.
    In that reading memory is "files plus tools", not a protocol [secondary]. https://www.36kr.com/p/3423823155252610
  signal_to_watch: Any of OpenAI, Anthropic, Google or Microsoft joining the W3C memory CG, or an export/import memory API
    across two vendors.
  use_cases:
  - title: OKF as the portable memory format
    where: Tenant knowledge base
    how: 'Proposed: exchange each Tenant''s knowledge as OKF, a directory of markdown files with frontmatter, so it can leave
      Unfold intact (system ADR-0021, ADR-0050).'
    effort: M
    value: An Agency's accumulated knowledge is not locked into Unfold or a model vendor.
  - title: Learnings are proposals a person reviews
    where: Run outcome, knowledge base
    how: 'Proposed: a Run proposes learnings and a person accepts each before any Run sees it (Ploeg ADR-0066); work-item
      notes need no review but a wider scope is a promotion a person accepts (Ploeg ADR-0088).'
    effort: M
    value: Stops one hijacked Run from poisoning the memory every later Run reads.
  - title: Provenance on every note
    where: ploegd knowledge graphs
    how: 'Proposed: every note carries its provenance, untrusted text is quoted, and a wider level needs evidence or a person
      (Ploeg ADR-0122).'
    effort: S
    value: Memory records stay attributable and erasable, which the portability critique asks for.
  - title: Tenant export carries the memory
    where: Tenant archive
    how: 'Proposed: include the knowledge graphs in the consistent JSONL archive with a checksummed manifest (Ploeg ADR-0179).'
    effort: S
    value: An Agency that leaves takes its memory with it.
  - title: Do not depend on harness-native memory
    where: Harness adapters
    how: 'Resist: native harness session state stays opaque and portable hand-offs use repository changes and structured evidence
      (apps/unfold/AGENTS.md), so no Run relies on a vendor''s memory feature.'
    effort: S
    value: Switching harness or model never loses what the Tenant has learned.
  radar: trial
  radar_reason: Unfold's scoped, reviewed, exportable knowledge base is designed but still proposed, so it should be proven
    on one Tenant first.
  unfold_today: 'Designed, not shipped: per-Tenant knowledge graphs served by scope, with reviewed learnings (apps/ploeg/docs/adrs/0087-ploegd-holds-a-tenants-knowledge-graphs-and-serves-a-run-only-its-work-items-scopes.md).'
  decisions:
  - docs/adr/adr-0021-agents-are-briefed-from-a-per-tenant-knowledge-base-exchanged-as-okf.md
  - docs/adr/adr-0034-agent-knowledge-is-scoped-to-tenant-client-repository-and-work-item-in-two-graphs-per-tenant.md
  - docs/adr/adr-0050-unfold-integrates-through-open-standards-and-registries-and-never-locks-a-customer-in.md
  - apps/ploeg/docs/adrs/0066-a-runs-learnings-are-proposals-a-person-reviews-before-any-run-sees-them.md
  - apps/ploeg/docs/adrs/0087-ploegd-holds-a-tenants-knowledge-graphs-and-serves-a-run-only-its-work-items-scopes.md
  - apps/ploeg/docs/adrs/0088-a-run-writes-work-item-notes-without-review-and-a-wider-scope-is-a-promotion-a-person-accepts.md
  - apps/ploeg/docs/adrs/0122-every-note-carries-its-provenance-untrusted-text-is-quoted-and-a-wider-level-needs-evidence-or-a-person.md
  - apps/ploeg/docs/adrs/0179-a-consumer-exports-its-tenant-as-one-consistent-jsonl-archive-with-a-checksummed-manifest.md
  - docs/research/2026-10-04-rfc-agent-knowledge.md
  - docs/research/2026-10-14-hermes-agent-fit.md
  reviewed: '2026-11-04'
- id: harness-engineering
  name: The agent harness vs the model ("the loop" as architecture)
  one_liner: Agent = model + harness. The loop, tools, context policy, sandbox, feedback and guardrails around the model decide
    most real-world performance and cost.
  maturity: de-facto-convention
  where_it_lives:
  - Mitchell Hashimoto, "My AI Adoption Journey", 2026-02-05 ("engineering the harness") [secondary attribution]. https://mitchellh.com/writing/my-ai-adoption-journey
  - 'OpenAI, "Harness engineering: leveraging Codex in an agent-first world", ~2026-02-11 [secondary]. https://openai.com/index/harness-engineering/'
  - Anthropic definition of agents as "LLMs autonomously using tools in a loop", 2025-09-29. https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
  - Preprint on harness architecture, Preprints.org 202603.1756, 2026-03. https://www.preprints.org/manuscript/202603.1756
  key_voices:
  - Mitchell Hashimoto
  - OpenAI Codex team
  - Anthropic
  - Faros AI (https://www.faros.ai/blog/harness-engineering)
  standardisation_outlook: 'none for the harness as a whole. Its parts standardise separately (MCP, Skills, sandboxes such
    as OpenSandbox in AAIF, 2026-10-22). Chance in 24 months: low.'
  related_standards:
  - mcp
  - agent-skills
  tension_or_critique: The evidence is mostly vendor benchmark anecdotes (Terminal Bench rank jumps, "HarnessTax"), not peer-reviewed
    work [secondary]. https://www.faros.ai/blog/harness-engineering
  signal_to_watch: OpenSandbox/OpenEnv reaching v1 APIs under AAIF, or a shared harness-trace format adopted by two vendors.
  use_cases:
  - title: The worker wraps any harness
    where: ploeg-worker, harness adapters
    how: 'Already built: the worker starts openhands, an ACP agent, Claude Code or any executable as a child process, holds
      the credentials, verifies and reports (docs/concepts/inside-a-run.md; Ploeg ADR-0099).'
    effort: S
    value: Ploeg owns the guarantees, so the harness can be swapped without losing them.
  - title: Worker-run verification
    where: Worker wrap-up
    how: 'Already built: the worker runs the verify commands itself, without credentials, after the harness exits (Ploeg ADR-0035),
      and readiness waits for the forge''s CI on the head (Ploeg ADR-0119).'
    effort: S
    value: Delivery does not rest on the agent's claim that tests passed.
  - title: Record the harness version on each Run
    where: Run configuration facts
    how: 'Already decided: each Run records the model, harness, plan and ploegd version it was configured with (Ploeg ADR-0091,
      ADR-0097).'
    effort: S
    value: Cost and merge rate can be attributed to a harness change, not guessed.
  - title: Bake-off between harness configurations
    where: Operator admission
    how: 'Proposed: run one Work Item on several configurations and let a shadow judge recommend while a person picks (Ploeg
      ADR-0135).'
    effort: M
    value: Turns harness choices into measured decisions per kind of work.
  - title: Retire a harness on evidence
    where: Harness allowlist
    how: 'Already decided once: the unmaintained OpenHands CLI was retired (Ploeg ADR-0118); keep a per-Team allowlist (Ploeg
      ADR-0098) and a recurring attack drill (Ploeg ADR-0126) as the gate.'
    effort: S
    value: The harness estate stays small and each member is tested against hostile repositories.
  radar: adopt
  radar_reason: 'Ploeg is a harness around harnesses: the loop, credentials, verification and outcome are already owned outside
    the model.'
  unfold_today: ploeg-worker wraps four harness adapters and owns credentials, verification and the outcome (docs/concepts/inside-a-run.md).
  decisions:
  - apps/ploeg/docs/adrs/0018-the-outcome-drop-box-is-every-harnesss-return-path.md
  - apps/ploeg/docs/adrs/0035-runs-get-ploeg-owned-skills-mounted-toolchains-and-worker-verification.md
  - apps/ploeg/docs/adrs/0091-each-run-records-the-model-harness-plan-and-ploegd-version-it-was-configured-with.md
  - apps/ploeg/docs/adrs/0097-a-run-records-its-harness-version-and-the-teams-read-shows-each-roles-harness-and-model.md
