- id: semantic-interop-knowledge-graphs
  name: Semantic interoperability (ontologies, shared vocabularies, knowledge graphs as agent context)
  one_liner: Agents ground on governed knowledge graphs with shared ontologies, so facts carry identity, provenance and meaning
    across agents and tools.
  maturity: pattern
  where_it_lives:
  - EU SEMIC report on GraphRAG for semantic interoperability [secondary]. https://interoperable-europe.ec.europa.eu/node/733148
  - '{"Siemens \"AI context layer": "knowledge graph\" (context graphs for agents). https://blogs.sw.siemens.com/rapidminer/ai-context-layer-knowledge-graph/"}'
  - ANP uses JSON-LD graphs for agent discovery (survey arXiv 2505.02279). https://arxiv.org/abs/2505.02279
  - W3C AI KR Community Group (hosts WebMCP notes). https://w3c-cg.github.io/aikr/webMCP/webmcp-technical-notes.html
  key_voices:
  - EU SEMIC / Interoperable Europe
  - Neo4j
  - Atlan (https://atlan.com/know/context-graph/context-graph-tools-for-ai-agents.md)
  standardisation_outlook: W3C (RDF, SHACL, schema.org) exists. What is missing is a convention for exposing graphs to agents
    over MCP with provenance. Low-medium chance in 24 months.
  tension_or_critique: Translating natural language to structured queries remains a challenge (SEMIC), and ontology upkeep
    is costly, so vendors fall back to plain retrieval. https://interoperable-europe.ec.europa.eu/node/733148
  signal_to_watch: An MCP extension or W3C CG note standardising graph-fact responses with provenance.
  use_cases:
  - title: Two scoped graphs per Tenant
    where: Agent knowledge
    how: 'Proposed: knowledge is scoped to Tenant, Client, repository and Work Item in two graphs per Tenant (system ADR-0034,
      Ploeg ADR-0087).'
    effort: L
    value: Runs ground on facts with identity and scope, not loose text.
  - title: OKF as the exchange vocabulary
    where: Knowledge exchange
    how: 'Proposed: the knowledge base is exchanged as OKF (system ADR-0021).'
    effort: M
    value: Knowledge moves between tools without a custom format.
  - title: One vocabulary across Ploeg and Unfold
    where: Domain model
    how: 'Accepted: Ploeg and Unfold use one vocabulary with named screen words (system ADR-0036, docs/domain/model.yaml).'
    effort: S
    value: People and agents mean the same thing by Run, Shift and Round.
  - title: Interactive sessions read knowledge through unfold-mcp
    where: unfold-mcp
    how: 'Proposed: interactive sessions reach Tenant knowledge only through unfold-mcp (system ADR-0035).'
    effort: M
    value: One governed path to the graph with scope checks.
  - title: Resist a heavy ontology
    where: Knowledge base
    how: 'Resist: keep concepts as markdown with frontmatter rather than an OWL ontology; provenance per note (Ploeg ADR-0122)
      matters more than formal semantics.'
    effort: S
    value: Agencies can read and edit their own knowledge.
  radar: trial
  radar_reason: Unfold has a scoped graph design and a shared vocabulary, but the graph is not yet serving Runs.
  unfold_today: One shared vocabulary is in use and a two-graph knowledge design is proposed (docs/adr/adr-0034-agent-knowledge-is-scoped-to-tenant-client-repository-and-work-item-in-two-graphs-per-tenant.md).
  decisions:
  - docs/adr/adr-0021-agents-are-briefed-from-a-per-tenant-knowledge-base-exchanged-as-okf.md
  - docs/adr/adr-0034-agent-knowledge-is-scoped-to-tenant-client-repository-and-work-item-in-two-graphs-per-tenant.md
