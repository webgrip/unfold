    kind: page
    url: https://www.w3.org/community/groups/
  - name: NIST CAISI agent initiative
    kind: page
    url: https://www.nist.gov/caisi/ai-agent-standards-initiative
  - name: OpenTelemetry GenAI semconv
    kind: page
    url: https://github.com/open-telemetry/semantic-conventions-genai
