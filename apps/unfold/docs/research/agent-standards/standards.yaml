    effort: M
    value: An approval names its target and limit in a form any receiver can verify.
  - title: 'Proposed: Run credentials scoped by repository and budget'
    where: Ploeg Run credentials
    how: Encode a Run's repository, branch and Budget as authorization_details in the Run token Ploeg mints. Ploeg work upstream,
      alongside Ploeg ADR-0013 and ADR-0016.
    effort: L
    value: One credential format states exactly what a Run may touch.
  - title: 'Proposed: Client Sign-off scoped to a head commit'
    where: Client Portal, Client Sign-off
    how: Carry the Work Item and head commit of ADR-0049 as authorization_details when a Client signs off through an OAuth
