- id: local-first-agents
  name: Local-first / on-device agents
  one_liner: Run the model and the loop on device or on-prem first and escalate to cloud only when needed, for privacy, latency
    and cost.
  maturity: pattern
  where_it_lives:
  - Apple Foundation Models framework (~3B on-device model, tool calling, guided generation), WWDC 2025 [secondary]. https://adtmag.com/articles/2025/06/10/apple-launches-ondevice-ai-framework-and-tools.aspx
  - On-device tool protocol write-up. https://blakecrosley.com/blog/foundation-models-on-device-llm
  - Open Responses participants include Ollama, LM Studio and vLLM (local runtimes on a common API). https://www.openresponses.org/
  key_voices:
  - Apple
  - Ollama
  - LM Studio
  - Hugging Face
  standardisation_outlook: Via API convergence (Open Responses) and model packaging (ModelPack). Local-first itself is not
    standardisable. Medium chance for enabling specs.
  related_standards:
  - open-responses
  tension_or_critique: 'Small models fail at multi-step tool use, so "local first" often means "cloud anyway" with extra complexity
    (absence: no strong 2026 benchmark found).'
  signal_to_watch: Open-weight models under 30B passing agentic tool-use benchmarks within ~5 points of frontier.
  use_cases:
  - title: Start on my laptop
    where: unfold-daemon
    how: 'Proposed: a small daemon takes commands from Unfold and starts a session in a worktree on the person''s machine
      (RFC-0010).'
    effort: L
    value: People can use local rights and tools while Unfold keeps the record.
  - title: A person's machine is a personal cell
    where: Ploeg cells
    how: 'Proposed: a laptop becomes a personal cell and a Run gets a capability only when its person grants it (Ploeg ADR-0143).'
    effort: M
    value: Local Runs keep the same identity and budget rules.
  - title: Workspace placement is a session choice
    where: Unfold workspaces
    how: 'Decided: where a workspace runs is chosen per session (Unfold ADR-0009).'
    effort: S
    value: Local or remote is a setting, not a fork of the product.
  - title: Self-hosted small models for deciders
    where: Decider
    how: 'Proposed: the decider is a small self-hosted model scaled to zero (system ADR-0042).'
    effort: M
    value: Cheap oversight with no client code leaving the cluster.
  - title: Offline shell and phone triage
    where: Unfold UI
    how: 'Proposed: Unfold works as an offline shell with a phone triage view (system ADR-0052).'
    effort: M
    value: People triage without a connection.
  radar: trial
  radar_reason: Unfold is self-hosted first and has designs for local Runs and local models; they need one real trial.
  unfold_today: Self-hosted by design, with laptop Runs proposed in RFC-0010 (docs/design/rfc-0010-agents-on-your-own-machine.md).
