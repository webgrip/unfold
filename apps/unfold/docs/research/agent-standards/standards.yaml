- id: mcp-a2a-convergence
  name: '"Everything is a tool" vs "agents as tools", and MCP-vs-A2A convergence'
  one_liner: Should a remote agent be called as an MCP tool, or be a peer over A2A? With MCP Tasks adding async handles, do
    the protocols merge or stay layered?
  maturity: pattern
  where_it_lives:
  - MCP keynote (Tasks, Skills over MCP) and maintainer roundtable on "not picking one standard", AGNTCon NA 2026-10-22 [secondary].
    https://lucaberton.com/blog/agntcon-mcpcon-north-america-2026/
  - Arcade, "A2A vs MCP layering decision". https://www.arcade.dev/blog/a2a-vs-mcp-layering-decision
  - 'IETF 126 agentproto: Jonathan Rosenberg argued one protocol could serve user-agent, agent-agent and agent-tool. https://datatracker.ietf.org/meeting/126/materials/minutes-126-agentproto-202607230700-00'
  key_voices:
  - David Soria Parra (MCP)
  - Google A2A team
  - Jonathan Rosenberg
  - Arcade.dev (Nathan Slavik)
  standardisation_outlook: Both protocols are under LF. Real convergence would be decided in AAIF/LF governance or by IETF
    agentproto. Low chance of a formal merge in 24 months, high chance of de facto MCP dominance for tools.
  related_standards:
  - mcp
  - a2a
  tension_or_critique: Wrapping agents as MCP tools loses negotiation, streaming state and identity semantics, while A2A adds
    a second stack most teams never need. https://www.arcade.dev/blog/a2a-vs-mcp-layering-decision
  signal_to_watch: AAIF announces an MCP-A2A alignment WG, or the A2A spec references MCP Tasks.
  use_cases:
  - title: 'A2A: adopt nothing, keep a watchlist'
    where: Ploeg protocols
    how: 'Decided: Ploeg adopts nothing of A2A and keeps a watchlist and a possible facade (Ploeg ADR-0007).'
    effort: S
    value: No peer protocol to secure while it settles.
  - title: AHP is the wrong layer for Ploeg
    where: Ploeg protocols
    how: 'Decided: AHP is the wrong layer for Ploeg (Ploeg ADR-0006), while the Unfold workbench may host it for editors (Unfold
      ADR-0012).'
    effort: S
    value: Each protocol sits where it fits.
  - title: Operator reads as MCP tools
    where: ploeg-mcp, unfold-mcp
    how: 'Decided: Ploeg serves operator reads as MCP tools and Unfold serves its own beside them (Ploeg ADR-0081, system
      ADR-0032).'
    effort: S
    value: Any MCP client can follow work.
  - title: Long Runs as MCP Tasks
    where: ploeg-mcp
    how: 'Proposed: when MCP Tasks is in a dated spec, expose starting and following a Shift as a task handle instead of polling
      tools.'
    effort: M
    value: Clients can follow a Shift natively without custom polling.
  - title: Agents as tools only through the gateway
    where: Gateway MCP
    how: 'Decided: Runs reach tools only through the gateway (Ploeg ADR-0078); a remote agent would be called the same way,
      never as a peer.'
    effort: S
    value: One authorization and metering path for tools and agents.
  radar: hold
  radar_reason: Ploeg has decided MCP for tools and nothing of A2A; convergence changes nothing until MCP Tasks is dated.
  unfold_today: MCP for tools and operator reads, A2A on a watchlist (apps/ploeg/docs/adrs/0007-a2a-adopt-nothing-watchlist-a-facade.md).
  decisions:
  - docs/adr/adr-0011-unfold-is-reachable-over-mcp-through-a-read-first-server.md
  - docs/adr/adr-0032-unfold-also-serves-its-own-read-only-mcp-tools-next-to-ploeg-mcp.md
  - apps/ploeg/docs/adrs/0006-ahp-is-the-wrong-layer.md
