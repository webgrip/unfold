- id: flight-recorder-audit
  name: Agent observability as audit ("flight recorders")
  one_liner: A tamper-evident, append-only record of every agent decision, tool call, approval and policy decision, kept for
    forensics and regulation rather than just debugging.
  maturity: pre-standard
  where_it_lives:
  - IETF draft-sharif-agent-audit-trail-01 (Agent Audit Trail, JSON with hash chaining). https://datatracker.ietf.org/doc/html/draft-sharif-agent-audit-trail-01
  - EU AI Act automatic event recording for high-risk systems from Aug 2026 (cited by the draft).
  - Vorlon "AI Agent Flight Recorder" at RSAC 2026 [secondary]. https://son-website.pages.dev/insights/2026-03-26-vorlon-agent-flight-recorder-forensics
  - '{"IETF 126 agentproto": "Altanai Bisht argued for audit signals that the charter excludes. https://datatracker.ietf.org/meeting/126/materials/minutes-126-agentproto-202607230700-00"}'
