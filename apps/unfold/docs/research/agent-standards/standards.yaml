- id: intent-mandates
  name: Intent-based delegation, mandates and verifiable intent
  one_liner: The human signs a constrained statement of intent (what, limits, until when), and the agent carries it as a credential
    that downstream parties verify before acting.
  maturity: pre-standard
  where_it_lives:
  - Mastercard Verifiable Intent, announced 2026-03-05, co-developed with Google, Draft v0.1, SD-JWT delegation chain [secondary].
    https://verifiableintent.dev ; https://atxp.ai/blog/verifiable-intent-mastercard-ai-agents
  - FIDO Alliance Payments WG receiving AP2 + Verifiable Intent [secondary]. https://ppc.land/fido-alliance-forms-working-groups-to-lock-down-ai-agent-payments/
  - AAuth Mission draft (Hardt), 2026-04. https://dickhardt.github.io/AAuth/draft-hardt-aauth-mission.html
  - Karl McGuinness, "Mission-Bound OAuth" vs AAuth. https://mcguinness-blog.pages.dev/notes/mission-architecture-on-aauth/
  key_voices:
  - Mastercard
  - Google AP2
  - Dick Hardt
  - Karl McGuinness
  - FIDO Alliance
  standardisation_outlook: FIDO for payments and IETF OAuth for generic missions. Medium-high chance for payments in 24 months,
    medium for generic missions.
  related_standards:
  - ap2
  - verifiable-intent
  - aauth
  - oauth-token-exchange
  tension_or_critique: Natural-language intent rarely maps cleanly onto machine-checkable constraints, and the IETF 126 room
    rejected the agentproto scope 38-124, showing no agreement on where intent lives. https://datatracker.ietf.org/meeting/126/materials/minutes-126-agentproto-202607230700-00
  signal_to_watch: FIDO publishes a Payments WG draft, or the OAuth WG adopts a mission/intent draft.
  use_cases:
  - title: The ticket is the mandate
    where: Shift budget
    how: 'Accepted: the ticket carries a quoted, capped Shift budget charged on delivery (system ADR-0006), which is a signed
      scope of what, how much and for which Work Item.'
    effort: S
    value: Every Run already acts inside a bounded statement of intent.
  - title: Clients approve Ready work
    where: Client approval
    how: 'Accepted: clients approve Ready work under their own definitions of Ready and Done (system ADR-0007).'
    effort: S
    value: The human statement of intent comes before any spend.
  - title: A transaction token names the person
    where: Run identity
    how: 'Decided: each Run carries a transaction token that names its person, and a Team without a sponsor runs nothing (Ploeg
      ADR-0156).'
    effort: M
    value: Downstream checks can verify on whose behalf a Run acts.
  - title: Bind the mandate to the Work Item revision
    where: Work Item approvals
    how: 'Proposed: put the approved Work Item revision and budget into the transaction token so the forge proxy and gateway
      can reject work outside it (builds on Ploeg ADR-0175).'
    effort: M
    value: Turns approval from a database row into a credential the Run carries.
  - title: Resist payment mandates
    where: Runs
    how: 'Resist: no Run buys anything and workers have no internet route (docs/concepts/inside-a-run.md), so payment mandate
      schemes add no value.'
    effort: S
    value: Avoids importing a payments trust model for a problem Unfold does not have.
  radar: assess
  radar_reason: Unfold already bounds intent with ticket budgets and approvals; a portable mandate credential is pre-standard
    and only worth it when a downstream party verifies it.
  unfold_today: The ticket's capped Shift budget and the client's Ready approval act as the mandate (docs/adr/adr-0006-the-ticket-is-the-billing-unit.md).
  decisions:
  - docs/adr/adr-0006-the-ticket-is-the-billing-unit.md
  - docs/adr/adr-0007-clients-approve-ready-work.md
  - apps/ploeg/docs/adrs/0012-two-level-budgets-authorized-and-settled.md
  - apps/ploeg/docs/adrs/0156-each-run-carries-a-transaction-token-that-names-its-person-and-a-team-without-a-sponsor-runs-nothing.md
  - apps/ploeg/docs/adrs/0175-a-proposed-work-item-starts-a-shift-only-when-every-named-approval-was-given-at-its-revision.md
