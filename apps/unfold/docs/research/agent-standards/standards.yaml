- id: oauth-token-exchange
  name: OAuth 2.0 Token Exchange (RFC 8693)
  disambiguation: Generic STS grant (subject_token/actor_token, `act` claim). Not Microsoft's proprietary OBO (jwt-bearer
    + requested_token_use=on_behalf_of).
  layer: identity
  steward: IETF OAuth WG
  governance: sdo
  status: stable
  latest:
    version: RFC 8693
    date: '2020-01-01'
    url: https://www.rfc-editor.org/rfc/rfc8693
  watch:
  - {kind: rss, ref: "https://www.rfc-editor.org/errata/rfc8693"}
  - {kind: ietf-draft, ref: draft-gazitt-oauth-authzen-token-exchange, current: "01"}
  - {kind: ietf-draft, ref: draft-zhu-oauth-async-delegation, current: "05"}
  adoption:
  - '{"Authentik token exchange grant. Impersonation, plus delegation/OBO with an `act` claim since 2026.8; the actor must
    be an authentik Actor": "https://github.com/goauthentik/authentik/blob/main/website/docs/add-secure-apps/providers/oauth2/token_exchange.mdx"}'
  - Authentik chained `act` (PR
  - Authentik token-for-SAML exchange (PR
  - '{"LiteLLM MCPAuth enum has `oauth2_token_exchange`, `oauth2_id_jag`, `oauth_delegate` and `true_passthrough`": "https://github.com/BerriAI/litellm/blob/main/litellm/types/mcp.py"}'
  - Base protocol under ID-JAG, Identity Chaining and Transaction Tokens (see those records)
  relations:
    complements:
    - dpop
    - rar
    - authzen-authorization-api
    - transaction-tokens
  open_problems:
  - In Authentik, OBO actors can only be created through the enterprise Agents API. Expiring actors are reaped, and there
    is no Terraform resource (issue
  - '{"The RFC leaves exchange policy undefined. An AuthZEN binding is proposed": "https://datatracker.ietf.org/doc/draft-gazitt-oauth-authzen-token-exchange/"}'
  - '{"league/oauth2-server (Laravel Passport) has no RFC 8693 grant; the issue has been open since 2022": "https://github.com/thephpleague/oauth2-server/issues/1315"}'
  use_cases:
  - title: Prove the person to Ploeg on every change (built behind a flag)
    where: Unfold to Ploeg operator API
    how: 'Built in src/person-proof.ts under ADR-0055 (status proposed): Unfold exchanges the person''s kept Authentik access
      token for a five-minute token with Ploeg''s audience and sends it as X-Ploeg-Person-Token. Remaining work is turning
      ploeg.personTokens on in each deployment.'
    effort: S
    value: Ploeg records changes as proven rather than asserted and refuses a forged actor header.
  - title: unfold-mcp over HTTP exchanges the caller's token, never forwards it (built)
    where: unfold-mcp OAuth
    how: 'Built: mcp-http.ts exchanges the request''s access token once per request for the Ploeg audience, as ADR-0055 clause
      4 says; the exchange client must federate the unfold-mcp provider.'
    effort: S
    value: Meets MCP's no-pass-through rule while keeping actions attributable.
  - title: 'Proposed: a Run token that names the person and the acting Team and Role'
    where: Ploeg Run credentials
    how: 'RFC-0011 stage: Ploeg mints a Run token with sub set to the person and an act claim for Team and Role, using Authentik''s
      delegation grant once chained act ships in a release. Ploeg work upstream.'
    effort: L
    value: Every write below Ploeg names both the person and the agent acting for them.
  - title: 'Proposed: exchange for the MCP servers a Run reaches through the gateway'
    where: Ploeg Run tool access (LiteLLM gateway)
    how: Replace the gateway's static per-server credentials with tokens exchanged per Run with aud set to each server, as
      the RFC-0011 chain diagram proposes.
    effort: L
    value: Removes shared static credentials from tool calls and narrows each to one audience.
  - title: 'Proposed: an Agency IdP token exchanged into a Tenant-scoped Unfold token'
    where: Agency IdP, Tenant
    how: In the hosted phase, accept an Agency's IdP token at Unfold's token endpoint and exchange it for a token carrying
      the Tenant, building on ADR-0017's group mapping.
    effort: M
    value: An Agency brings its own IdP without Unfold storing its passwords.
  radar: adopt
  radar_reason: 'Maturity and fit both decided it: a stable RFC that Authentik implements, already built into Unfold''s person
    proof and unfold-mcp path.'
  flip_trigger: Authentik drops or changes its delegation grant, or Ploeg replaces person tokens with a different proof such
    as ID-JAG or DPoP-bound tokens.
  decisions:
  - apps/unfold/docs/adrs/0055-unfold-proves-the-person-to-ploeg-with-a-token-exchanged-from-their-sign-in.md
  - docs/design/rfc-0011-every-agent-action-names-its-person.md
