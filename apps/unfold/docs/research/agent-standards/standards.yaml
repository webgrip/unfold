- id: policy-as-code-agents
  name: Policy-as-code for agents (a PDP on every tool call)
  one_liner: Every tool call passes a policy decision point (OPA/Rego, Cedar, OpenFGA) that gets identity, tool, arguments
    and context, and the decision is logged.
  maturity: de-facto-convention
  where_it_lives:
  - '{"Tian Pan, \"Policy-as-Code for Agents": "OPA, Rego, and the Decision Point Your Tool Loop Doesn''t Have\", 2026-04-25.
    https://tianpan.co/blog/2026-04-25-policy-as-code-agent-permissions-opa-rego"}'
  - '{"Harness, \"Policy as code in 2026": "OPA, Kyverno, Cedar\". https://www.harness.io/blog/policy-as-code-in-2026-opa-kyverno-cedar-and-what-s-next"}'
  - Bedrock AgentCore Policy using Cedar at the gateway (2026-03) [secondary, via Tian Pan]
  - Matt DeBergalis (Apollo) on a deterministic policy layer between agents and APIs, AGNTCon NA 2026 [secondary]. https://lucaberton.com/blog/agntcon-mcpcon-north-america-2026/
  key_voices:
  - AWS Cedar team
  - OPA/CNCF
  - Apollo GraphQL
  - OpenFGA
  standardisation_outlook: Engines exist. What is missing is a standard decision input schema for tool calls (AuthZEN at OpenID
    could fit). Medium chance in 24 months.
  related_standards:
  - mcp
  - openfga
  tension_or_critique: A policy engine can only check what it can see. With code mode or free-form arguments, policies degrade
    to coarse allow-lists, and engine choice fragments the ecosystem. https://www.harness.io/blog/policy-as-code-in-2026-opa-kyverno-cedar-and-what-s-next
  signal_to_watch: OpenID AuthZEN or MCP defines a standard tool-call authorization request profile.
  use_cases:
  - title: ACP permission modes as a decision point
    where: ACP adapter
    how: 'Already built: the adapter answers each permission request from the Team''s mode and asks before a mutation outside
      allow-always (Ploeg ADR-0148).'
    effort: S
    value: Each harness request already passes a Team-level policy.
  - title: The forge proxy refuses other repositories
    where: Worker forge proxy
    how: 'Already built: the loopback forge proxy adds the token and refuses anything outside the Run''s own repository (docs/concepts/inside-a-run.md).'
    effort: S
    value: A policy on every forge call that the agent cannot bypass.
  - title: Egress through a logged allowlist
    where: Registry egress proxy
    how: 'Decided: Teams opt into registry egress through a logged allowlist proxy (Ploeg ADR-0037), with default-deny network
      policy (Ploeg ADR-0137).'
    effort: M
    value: Network reach is declared, enforced and logged.
  - title: Team manifest permissions as policy
    where: Team manifest, ploegd
    how: 'Proposed: express the permissions in a Team''s manifest (Ploeg ADR-0110) as Cedar or OPA policies evaluated in ploegd,
      and log each decision to the audit log.'
    effort: L
    value: One readable policy file per Team instead of settings scattered through config.
  - title: No PDP on every shell command
    where: Harness in the pod
    how: 'Resist: the pod is the boundary for Claude Code runs (docs/concepts/inside-a-run.md); a policy call on each shell
      command adds latency and false denials without stopping a sandboxed process.'
    effort: S
    value: Puts enforcement at the seams that hold credentials, where it pays.
  radar: assess
  radar_reason: Ploeg enforces policy at its credential seams in code; a general policy engine is only worth it once Team
    permissions outgrow configuration.
  unfold_today: Policy is enforced in code at the forge proxy, ACP permission modes and the egress allowlist (apps/ploeg/docs/adrs/0148-every-acp-profile-asks-before-a-mutation-outside-allow-always-and-openhands-refuses-a-repository-that-ships-hooks.md).
  decisions:
