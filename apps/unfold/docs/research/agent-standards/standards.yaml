- id: hitl-approval-receipts
  name: Human-in-the-loop approval semantics and signed approval/consent receipts
  one_liner: A risky agent action pauses for a human, and the approval becomes a signed, single-use, action-bound receipt
    that anyone can verify later.
  maturity: pre-standard
  where_it_lives:
  - IETF individual drafts draft-nelson-agent-delegation-receipts (-11, 2026-10), draft-schrock-ep-authorization-receipts
    (-06), draft-kumaresan-counter-sign-00 (2026-07). https://www.ietf.org/archive/id/draft-nelson-agent-delegation-receipts-11.txt
    ; https://datatracker.ietf.org/doc/draft-schrock-ep-authorization-receipts/
  - MCP elicitation guarding tools that delete, deploy or spend, AGNTCon NA keynote 2026-10-22 [secondary]. https://lucaberton.com/blog/agntcon-mcpcon-north-america-2026/
  - 12-factor agents "contact humans with tool calls" / break the loop for approval. https://github.com/humanlayer/12-factor-agents
  - Hardt's AAuth with a Person Server approving missions. https://dickhardt.github.io/AAuth/draft-hardt-aauth-mission.html
  key_voices:
  - Dick Hardt (https://dickhardt.github.io/AAuth/), HumanLayer, iProov/Cerbos HAPS (vendor, 2026-10-22, [secondary])
  standardisation_outlook: IETF OAuth WG is the likely home (the agentproto BoF pushed authorization to OAuth, IETF 126 minutes).
    Medium chance in 24 months.
  related_standards:
  - aauth
  tension_or_critique: Consent fatigue. The OpenID Foundation's whitepaper (2025-10-07) names consent fatigue and impersonation
    as core gaps, so receipts do not fix rubber-stamping. https://openid.net/new-whitepaper-tackles-ai-agent-identity-challenges/
  signal_to_watch: OAuth WG adopts a delegation or approval-receipt draft, or MCP standardises an approval record attached
    to elicitation.
  use_cases:
  - title: Signed, single-use MCP confirmations
    where: ploeg-mcp
    how: 'Already decided: ploeg-mcp signs each confirmation and acts on it once (Ploeg ADR-0152), after the person signs
      in afresh at a ploeg-mcp page (Ploeg ADR-0153).'
    effort: S
    value: An approval cannot be replayed or forged by the client that asked for it.
  - title: Approvals bound to a revision
    where: Proposed Work Items
    how: 'Already decided: a proposed Work Item starts a Shift only when every named approval was given at its current revision
      (Ploeg ADR-0175).'
    effort: S
    value: An approval does not carry over to a changed request.
  - title: Client sign-off bound to the head commit
    where: Acceptance in Unfold
    how: 'Accepted: a Client Sign-off is input to acceptance and binds to the head commit (system ADR-0049); a person''s acceptance
      asks the forge to merge at that head (system ADR-0053, Ploeg ADR-0188).'
    effort: S
    value: The client approved exactly the code that ships.
  - title: Signed candidates as receipts
    where: Unfold delivery
    how: 'Decided in Unfold ADR-0014: candidates are signed, so the approval of a candidate is verifiable later.'
    effort: M
    value: Gives an Agency proof of what was approved when a client disputes a change.
  - title: Exportable approval receipts for clients
    where: Agency reporting
    how: 'Proposed: export each Action Record (system ADR-0037) with its signed confirmation as a verifiable receipt an Agency
      can hand its client.'
    effort: M
    value: Makes Unfold's approvals auditable outside Unfold.
  radar: trial
  radar_reason: The receipts are designed and partly built in ploeg-mcp, but the exportable, verifiable form is not yet in
    use.
  unfold_today: ploeg-mcp signs and single-uses confirmations, and approvals bind to a revision or head commit (apps/ploeg/docs/adrs/0152-ploeg-mcp-signs-each-confirmation-and-acts-on-it-once.md).
  decisions:
  - docs/adr/adr-0037-people-act-on-work-through-either-mcp-server-and-every-action-names-its-person-channel-and-confirmation.md
  - docs/adr/adr-0049-a-client-sign-off-is-input-to-acceptance-bound-to-the-head-commit-and-each-client-has-an-approver.md
  - docs/adr/adr-0053-a-person-accepts-a-pull-request-in-unfold-and-ploeg-asks-the-forge-to-merge-it-at-that-head.md
