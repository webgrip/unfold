- id: evals-as-contracts
  name: Evals as contracts / eval-driven development
  one_liner: Define the evaluation before changing a prompt, model or harness. The eval suite is the spec and the definition
    of done, and it scores trajectories as well as final answers.
  maturity: pattern
  where_it_lives:
  - '{"Xia et al., \"Evaluation-Driven Development of LLM Agents": "A Process Model and Reference Architecture\", arXiv 2411.13768
    (rev. 2025-03-27). https://arxiv.org/abs/2411.13768v2"}'
  - OpenEnv (Hugging Face) donated to AAIF for RL environments, 2026-10-22. https://www.linuxfoundation.org/press/agentic-ai-foundation-announces-four-new-projects-agent-skills-open-responses-openenv-and-opensandbox
  - Stephen Watt (Red Hat) on "evals against skills" to choose models, AGNTCon NA 2026 [secondary]. https://lucaberton.com/blog/agntcon-mcpcon-north-america-2026/
  - '{"Absence": "no Hamel Husain primary source turned up, and no primary source uses the phrase \"evals as contracts\"."}'
  key_voices:
  - CSIRO Data61 authors of 2411.13768
  - Hugging Face (OpenEnv)
  - Red Hat
  standardisation_outlook: OpenEnv at AAIF could standardise the environment/task interface. Medium chance in 24 months. Eval
    metrics themselves stay domain-specific.
  tension_or_critique: Final-output evals pass agents that reached the answer through unsafe trajectories, and LLM-as-judge
    is noisy, so evals can give false contracts [secondary]. https://dev.to/sebastian_chedal/evaluation-led-agent-development-five-disciplines-that-separate-production-from-pilot-2cch
  signal_to_watch: OpenEnv v1 adopted by two or more labs for public evals, or eval-result attestations attached to model
    or skill releases.
