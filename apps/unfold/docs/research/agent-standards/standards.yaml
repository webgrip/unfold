# The agent-standards catalogue for Unfold. Edit by hand, then run mise run agent-standards.
# A watch entry stays one line: the Renovate regex in renovate.json reads exactly that shape.
version: 1
layers:
  tool: Agent to tool and context
  agent-agent: Agent to agent
  discovery: Discovery, description and registries
  client-ui: Client, editor and UI
  definition: Agent definition, packaging and LLM APIs
  identity: Identity, delegation and authorization
  observability: Observability and audit
  security-supply-chain: Security and supply chain
  inference-infra: Inference and agent runtime infrastructure
  commerce: Commerce and payments
  web-content: 'Agents and the web: access, preferences, licensing'
  governance: Governance, regulation and assurance
survey:
  sources:
  - name: AAIF projects
    kind: page
    url: https://aaif.io/projects/
  - name: AAIF news
    kind: page
    url: https://aaif.io/news/
  - name: MCP blog
    kind: page
    url: https://blog.modelcontextprotocol.io/
  - name: MCP roadmap
    kind: page
    url: https://modelcontextprotocol.io/development/roadmap
  - name: A2A roadmap
    kind: page
    url: https://a2a-protocol.org/latest/roadmap/
  - name: IETF drafts named agent
    kind: ietf-search
    term: agent
  - name: IETF drafts named mcp
    kind: ietf-search
    term: mcp
  - name: IETF drafts named llm
    kind: ietf-search
    term: llm
