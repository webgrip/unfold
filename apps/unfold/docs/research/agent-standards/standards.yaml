- id: llm-api-convergence
  name: LLM API convergence (Responses-style stateful/item-based APIs)
  one_liner: Providers converge on one request/response shape (items, tool calls, semantic streaming events, optional server
    state), so harnesses and gateways are provider-agnostic.
  maturity: standardising
  where_it_lives:
  - Open Responses spec, announced by OpenAI 2026-01-15. https://www.openresponses.org/specification
  - Donated to AAIF 2026-10-22. https://www.linuxfoundation.org/press/agentic-ai-foundation-announces-four-new-projects-agent-skills-open-responses-openenv-and-opensandbox
  - Gateway compliance claims (Portkey). https://portkey.ai/docs/aigw/product/ai-gateway/responses-api
  key_voices:
  - OpenAI (Steve Coffey)
  - Vercel
  - OpenRouter
  - Hugging Face
  - Ollama
  - vLLM
  standardisation_outlook: AAIF owns it. High chance of a governed v1 with compliance tests in 24 months. Stateful mode is
    still future work.
  related_standards:
  - open-responses
  - openai-chat-completions
  tension_or_critique: Defaults are stateless and stateful is deferred. Anthropic and Google keep native APIs, so the "standard"
    may stay an OpenAI-shaped superset. https://www.openresponses.org/
  signal_to_watch: Anthropic or Google ship native Open Responses endpoints, or the spec publishes a stateful-mode version.
  use_cases:
  - title: The gateway normalises providers
    where: Gateway contract
    how: 'Built: LiteLLM presents one API to harnesses, and the gateway contract admits Envoy AI Gateway as well (Ploeg ADR-0177).'
    effort: S
    value: Harnesses never care which provider serves them.
  - title: No server-side agent state inside a Run
    where: Runs
    how: 'Decided: the OpenAI Agents API stays outside the Run until it takes an authorized budget (Ploeg ADR-0041).'
    effort: S
    value: Stateful provider APIs cannot hold conversation or spend outside Ploeg's view.
  - title: A Run calls only its Role's model
    where: Model routing
    how: 'Decided: a Run calls only its Role''s model (Ploeg ADR-0039).'
    effort: S
    value: API convergence cannot widen which models a Run reaches.
  - title: Conformance test against Open Responses
    where: Gateway contract
    how: 'Proposed: add an Open Responses shaped test to the gateway contract''s conformance checks once a stateful mode is
      published.'
    effort: M
    value: Catches gateway drift before harnesses break.
  - title: Transcripts in an item-based shape
    where: Run transcripts
    how: 'Proposed: store the bounded transcript of Ploeg ADR-0090 as provider-neutral items, so replays and judges read one
      format.'
    effort: M
    value: Judges and deciders work across harnesses and providers.
  radar: assess
  radar_reason: The gateway already hides provider differences; stateful APIs conflict with Ploeg owning state and spend.
  unfold_today: LiteLLM normalises provider APIs behind a gateway contract (apps/ploeg/docs/adrs/0177-ploeg-reaches-models-through-a-gateway-contract-with-litellm-and-envoy-ai-gateway-as-implementations.md).
  decisions:
  - apps/ploeg/docs/adrs/0039-a-run-calls-only-its-roles-model-and-the-advisor-waits-for-metering.md
  - apps/ploeg/docs/adrs/0041-the-openai-agents-api-stays-outside-the-run-until-it-takes-an-authorized-budget.md
  - apps/ploeg/docs/adrs/0090-a-runs-agent-session-is-kept-as-a-bounded-redacted-transcript.md
  - apps/ploeg/docs/adrs/0177-ploeg-reaches-models-through-a-gateway-contract-with-litellm-and-envoy-ai-gateway-as-implementations.md
