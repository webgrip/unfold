- id: code-mode-tools-as-code
  name: Code mode / tools-as-code-API
  one_liner: Instead of exposing hundreds of tools, give the model a sandbox and a typed API and let it write code that calls
    the tools. Tool definitions shrink from millions of tokens to about a thousand.
  maturity: pattern
  where_it_lives:
  - Cloudflare, "Code Mode" MCP server (search() + execute() over 2,500+ endpoints in ~1,000 tokens). https://ghost.blog.cloudflare.com/code-mode-mcp/
  - Anthropic, "Code execution with MCP" (cited by Cloudflare; not fetched) [secondary]. https://www.anthropic.com/engineering/code-execution-with-mcp
  key_voices:
  - Cloudflare (https://blog.cloudflare.com/)
  - Anthropic Engineering
  standardisation_outlook: Could land in MCP as a server pattern or sandbox profile (AAIF). Medium chance in 24 months.
  related_standards:
  - mcp
  tension_or_critique: It requires a secure sandbox and correct model-written code, and it moves policy enforcement from per-tool
    grants into arbitrary code [secondary]. https://wikidocs.net/blog/@jaehong/8269/
  signal_to_watch: An MCP SEP or AAIF sandbox profile that defines code-execution tool servers.
  use_cases:
  - title: The Run already has code mode
    where: Harness in the worker pod
    how: A Run's harness has a shell and toolchains inside a sandboxed pod (Ploeg ADR-0035, system ADR-0045), so it already
      composes tools in code; nothing to add.
    effort: S
    value: Avoids building a second code sandbox inside the first.
  - title: Small MCP surfaces need no code mode
    where: ploeg-mcp and unfold-mcp
    how: 'Resist: both servers are read-first with a small tool set (system ADR-0011, ADR-0032), so tool definitions are cheap
      and code mode buys nothing.'
    effort: S
    value: Keeps the operator surfaces simple to audit.
  - title: Keep per-call visibility for the tripwire
    where: Decider tripwire
    how: 'Resist inside Runs: the proposed tripwire scores each tool call (system ADR-0042); a generated script that batches
      many calls hides them unless the script itself is scored.'
    effort: S
    value: Preserves the per-action signal oversight depends on.
  - title: Typed client for operator consumers
    where: Operator consumers of Ploeg
    how: 'Proposed: publish a typed client from the contract bundle (Ploeg ADR-0117) so an operator agent can script many
      reads in one step instead of many tool calls.'
    effort: M
    value: Cheaper bulk reads for agents that triage a whole board.
  - title: Re-evaluate on an MCP code-execution profile
    where: Gateway MCP tools
    how: 'Watch: if MCP defines code-execution tool servers, assess them for the read-only tools Runs reach through the gateway
      (Ploeg ADR-0078).'
    effort: S
    value: Picks the pattern up only when it is standard and fits the gateway bound.
  radar: assess
  radar_reason: Runs already write code against a shell, and the MCP surfaces are small, so the pattern solves a problem Unfold
    barely has.
  unfold_today: Nothing yet as a pattern; Runs use a shell and toolchains in the pod and reach a few read-only MCP tools through
    the gateway (apps/ploeg/docs/adrs/0078-runs-reach-read-only-mcp-tools-only-through-the-gateway-bounded-by-a-litellm-team.md).
  decisions:
  - docs/adr/adr-0011-unfold-is-reachable-over-mcp-through-a-read-first-server.md
  - docs/adr/adr-0032-unfold-also-serves-its-own-read-only-mcp-tools-next-to-ploeg-mcp.md
  - docs/adr/adr-0042-a-self-hosted-decider-reads-what-agents-do-and-starts-as-a-shadow-tripwire.md
