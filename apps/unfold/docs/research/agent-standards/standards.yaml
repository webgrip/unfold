  - '"gen_ai.operation.name goes missing when turn_off_message_logging is set (https://github.com/BerriAI/litellm/issues/45284)"'
  - '"opentelemetry-api >= 1.44.0 breaks the V2 integration through Events API removal (https://github.com/BerriAI/litellm/issues/41990)"'
  use_cases:
  - title: Turn on the GenAI opt-in on the gateway (proposed)
    where: LiteLLM gateway
    how: Staging LiteLLM uses the legacy otel callback; set OTEL_SEMCONV_STABILITY_OPT_IN=gen_ai_latest_experimental so its
      spans carry GenAI names that join ADR-0113's harness traces.
