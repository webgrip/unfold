mode: live
baseUrl: https://workbench.example
credentialsSecret: unfold-credentials
workspaceNamespace: unfold-workspaces
workspacePodRuntimeClassName: kata
workspaceGitSecretName: repository-readonly
workspaceGitRewrites:
  - url: http://forgejo-http.forge.svc.cluster.local:3000/
    insteadOf: https://forge.example/
workspaceEgress:
  - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ai
        podSelector:
          matchLabels:
            app.kubernetes.io/name: litellm
    ports:
      - protocol: TCP
        port: 4000
  - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: forge
        podSelector:
          matchLabels:
            app.kubernetes.io/name: forgejo
    ports:
      - protocol: TCP
        port: 3000
config:
  models:
    - id: coding
      name: Configured coding model
      providerId: gateway
      modelId: replace-with-your-litellm-model-alias
  repositories:
    - id: application
      name: Application
      description: Operator-approved repository
      url: https://forge.example/organization/application.git
      baseBranch: main
      verify: [node, --test]
      executionOwner: ploeg
  litellm:
    baseUrl: https://gateway.internal.example/v1
  ploeg:
    url: https://ploeg.internal.example
    tokenEnv: PLOEG_OPERATOR_UNFOLD_TOKEN
    teams: [delivery]
    userTeams:
      replace-with-user-id: [delivery]
  execution:
    team: delivery
ploeg:
  enabled: true
  database:
    existingSecret:
      name: ploeg-app
  executor:
    litellm:
      adminUrl: http://litellm.ai.svc.cluster.local:4000
