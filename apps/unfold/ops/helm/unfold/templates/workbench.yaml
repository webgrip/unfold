apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "unfold.name" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "unfold.name" . }}-data
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.storage.className }}
  storageClassName: {{ .Values.storage.className | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "unfold.name" . }}
  labels: {{- include "unfold.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "unfold.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "unfold.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "unfold.name" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: {{ eq .Values.mode "live" }}
      terminationGracePeriodSeconds: 20
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workbench
          image: {{ include "unfold.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 4080
          env:
            - name: UNFOLD_HOST
              value: 0.0.0.0
            - name: UNFOLD_MODE
              value: {{ .Values.mode | quote }}
            - name: UNFOLD_CONFIG
              value: /etc/unfold/config.json
            - name: UNFOLD_DATA_DIR
              value: /data/workbench
            - name: UNFOLD_INSIGHT_EVENTS
              value: {{ ternary "on" "off" .Values.insight.events | quote }}
            {{- if ne .Values.insight.export "off" }}
            - name: UNFOLD_INSIGHT_EXPORT
              value: {{ .Values.insight.export | quote }}
            - name: UNFOLD_INSIGHT_EXPORT_URL
              value: {{ required "insight.url is required when insight.export is faro or otlp" .Values.insight.url | quote }}
            - name: UNFOLD_INSIGHT_EXPORT_LEVEL
              value: {{ .Values.insight.level | quote }}
            {{- end }}
            {{- if .Values.errorReports.sentry.existingSecret }}
            - name: UNFOLD_SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.errorReports.sentry.existingSecret }}
                  key: {{ .Values.errorReports.sentry.secretKey }}
            {{- end }}
            {{- if .Values.errorReports.otlpUrl }}
            - name: UNFOLD_ERROR_OTLP_URL
              value: {{ .Values.errorReports.otlpUrl | quote }}
            {{- end }}
            {{- if or .Values.ploegMcp.url .Values.ploegMcp.clientId }}
            - name: UNFOLD_PLOEG_MCP_URL
              value: {{ required "ploegMcp.url is required when ploegMcp.clientId is set" .Values.ploegMcp.url | quote }}
            - name: UNFOLD_PLOEG_MCP_CLIENT_ID
              value: {{ required "ploegMcp.clientId is required when ploegMcp.url is set" .Values.ploegMcp.clientId | quote }}
            {{- end }}
            {{- if .Values.errorReports.environment }}
            - name: UNFOLD_ERROR_ENVIRONMENT
              value: {{ .Values.errorReports.environment | quote }}
            {{- end }}
            {{- if and .Values.delivery.enabled .Values.delivery.publisher.enabled .Values.delivery.publisher.existingSecret }}
            - name: {{ .Values.delivery.publisher.tokenEnv }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.delivery.publisher.existingSecret }}
                  key: {{ .Values.delivery.publisher.secretKey }}
            {{- end }}
            {{- if and .Values.decider.enabled .Values.decider.existingSecret }}
            - name: {{ .Values.decider.keyEnv }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.decider.existingSecret }}
                  key: {{ .Values.decider.secretKey }}
            {{- end }}
            {{- with fromJson (include "unfold.storeKeyRef" .) }}
            - name: UNFOLD_STORE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- range $env, $ref := fromJson (include "unfold.credentialRefs" .) }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.name }}
                  key: {{ $ref.key }}
            {{- end }}
            {{- if .Values.featureFlags }}
            - name: UNFOLD_FLAGS_FILE
              value: /etc/unfold-flags/flags.json
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if eq .Values.mode "live" }}
          envFrom:
            - secretRef:
                name: {{ .Values.credentialsSecret }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/unfold
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.featureFlags }}
            - name: flags
              mountPath: /etc/unfold-flags
              readOnly: true
            {{- end }}
            {{- if and .Values.delivery.enabled .Values.delivery.inputs.volume }}
            - name: delivery-inputs
              mountPath: {{ .Values.delivery.inputs.mountPath }}
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 1
            failureThreshold: 60
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "unfold.name" . }}-data
        - name: config
          configMap:
            name: {{ include "unfold.name" . }}-config
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- if .Values.featureFlags }}
        - name: flags
          configMap:
            name: {{ include "unfold.name" . }}-flags
        {{- end }}
        {{- if and .Values.delivery.enabled .Values.delivery.inputs.volume }}
        - name: delivery-inputs
          {{- toYaml .Values.delivery.inputs.volume | nindent 10 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "unfold.name" . }}
spec:
  type: ClusterIP
  selector: {{- include "unfold.labels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
