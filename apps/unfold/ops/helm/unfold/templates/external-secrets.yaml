{{- $es := .Values.externalSecrets -}}
{{- if $es.enabled }}
{{- $entries := list -}}
{{- if include "unfold.externalStoreKey" . -}}
{{- $entries = append $entries (dict "name" (include "unfold.externalSecretName" (list . "store-key")) "secretKey" "key" "remote" $es.storeKey "component" "store-key") -}}
{{- end -}}
{{- range $env, $remote := (default (dict) $es.credentials) -}}
{{- $entries = append $entries (dict "name" (include "unfold.externalSecretName" (list $ $env)) "secretKey" $env "remote" $remote "component" "credential") -}}
{{- end -}}
{{- range $entries }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  labels:
    {{- include "unfold.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .component }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remote.key | quote }}
        {{- with .remote.property }}
        property: {{ . | quote }}
        {{- end }}
        {{- with .remote.version }}
        version: {{ . | quote }}
        {{- end }}
{{- end }}
{{- end }}
