image:
  repository: ghcr.io/webgrip/unfold
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
service:
  port: 4080
storage:
  size: 4Gi
  className: ""
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
extraEnv: []
# Feature flag rules for this deployment, as a flagd document (apps/unfold/docs/operations/feature-flags.md).
# Mounted as its own ConfigMap and watched every 5 seconds, so a change applies without restarting Unfold.
# Example: featureFlags: {flags: {work.live-view: {defaultVariant: "on"}}}
featureFlags: {}
insight:
  events: true
  export: "off"
  url: ""
  level: aggregate
errorReports:
  environment: ""
  otlpUrl: ""
  sentry:
    existingSecret: ""
    secretKey: sentry-dsn
ploegMcp:
  url: ""
  clientId: ""
# The decider the tripwire asks (RFC-0008, apps/unfold/docs/operations/live.md#decider-tripwire).
# Off unless enabled, and only in live mode. Unfold's own zero-budget virtual key comes from
# existingSecret/secretKey into keyEnv, or, with existingSecret empty, from credentialsSecret under keyEnv.
# The runs.tripwire flag then turns screening on per Team.
decider:
  enabled: false
  baseUrl: ""
  model: hetzner-qwen3-8-27b
  name: Hetzner Qwen
  keyEnv: UNFOLD_DECIDER_KEY
  requestsPerMinute: 8
  existingSecret: ""
  secretKey: key
# Local name-and-password sign-in; false needs config.auth.oidc (apps/unfold/docs/operations/live.md#local-sign-in).
auth:
  localLogin: true
mode: demo
baseUrl: ""
# Live mode: every key of this Secret becomes the workbench's environment (envFrom).
# credentialRefs and externalSecrets give single credentials their own Secret instead.
credentialsSecret: unfold-credentials
# One Secret key per credential, as {ENV_NAME: {name: <Secret>, key: <key in it>}}, each set as that
# environment variable through secretKeyRef. Live mode only. A variable listed here wins over the same
# name in credentialsSecret. Example:
#   credentialRefs:
#     PLOEG_OPERATOR_UNFOLD_TOKEN: {name: unfold-operator, key: token}
#     UNFOLD_VERIFIER_TOKEN: {name: unfold-verifier, key: token}
#     UNFOLD_EXCHANGE_CLIENT_SECRET: {name: unfold-exchange-client, key: client-secret}
credentialRefs: {}
# The key that encrypts the workbench's stored secrets (links, relay credentials, sign-in grants):
# 32 bytes as base64 or hex in UNFOLD_STORE_KEY, from existingSecret/secretKey or externalSecrets.storeKey.
# Without one the key is a file on the data volume next to the database, which one copy of the volume
# opens together with the data. In live mode the chart refuses that unless allowFileOnDataVolume is true,
# and the install notes then warn. The default is true so an install without a store key Secret keeps
# rendering; set false once the key comes from a Secret. See apps/unfold/docs/operations/storage.md#the-store-key.
storeKey:
  existingSecret: ""
  secretKey: key
  allowFileOnDataVolume: true
# ExternalSecret resources (external-secrets.io/v1) for the store key and single credentials, read from
# secretStoreRef. Each entry renders its own ExternalSecret and Secret <release>-<name>, so each can have
# its own vault policy and rotation. Values name where a secret lives in the store, never the secret.
#   externalSecrets:
#     enabled: true
#     secretStoreRef: {kind: ClusterSecretStore, name: vault}
#     storeKey: {key: unfold/store-key, property: key}
#     credentials:
#       PLOEG_OPERATOR_UNFOLD_TOKEN: {key: unfold/operator, property: token}
externalSecrets:
  enabled: false
  secretStoreRef:
    kind: ClusterSecretStore
    name: ""
  refreshInterval: 1h
  storeKey:
    key: ""
    property: ""
  credentials: {}
workspaceNamespace: unfold-workspaces
createWorkspaceNamespace: true
workspaceImage: ""
workspaceAgentImage:
  repository: ghcr.io/webgrip/unfold-agent
  tag: ""
  digest: ""
workspaceStorageSize: 8Gi
workspaceStorageClass: ""
workspaceCpu: "1"
workspaceMemory: 2Gi
workspaceCpuRequest: ""
workspaceMemoryRequest: ""
workspaceImagePullSecrets: []
workspaceGitSecretName: ""
# Git URL prefixes the clone and agent containers fetch from another address,
# such as the forge's in-cluster Service in place of its public host, so
# workspaceEgress needs no route to an ingress gateway. Each entry is
# {url, insteadOf}, both HTTP(S) prefixes ending in /. Repository URLs keep
# their public form.
workspaceGitRewrites: []
workspaceAgentSecrets: []
workspaceUserNamespaces: false
# RuntimeClass for agent and export pods under the pod provisioner, such as kata
# to run each in its own lightweight VM. Empty runs them on the node's default
# runtime. The sandbox provisioner uses workspaceRuntimeClassName instead.
workspacePodRuntimeClassName: ""
# In live mode the chart refuses to render while the provisioner's RuntimeClass
# is empty. true runs agent workspaces on the node's default runtime anyway,
# and the install notes warn about it.
workspaceAllowUnsandboxed: false
# Days a finished session's workspace volume (pod provisioner) is kept after the
# session last changed, once its change was captured. 0 keeps every volume.
workspaceRetentionDays: 7
# Annotations set on a workspace volume just before the retention sweep deletes
# it, for clusters whose admission policy refuses unannotated PVC deletes.
workspaceVolumeDeleteAnnotations: {}
workspaceTransport: pull
workspaceRelayUrl: ""
workspaceProvisioner: pod
workspaceRuntimeClassName: kata
workspaceWarmPool: ""
workspaceEgress: []
delivery:
  enabled: false
  verifierTokenEnv: UNFOLD_VERIFIER_TOKEN
  policies: []
  inputs:
    mountPath: /var/lib/unfold-delivery
    volume: {}
  publisher:
    enabled: false
    apiUrl: ""
    username: ""
    tokenEnv: UNFOLD_PUBLISHER_TOKEN
    existingSecret: ""
    secretKey: token
  verifier:
    namespace: unfold-verifier
    createNamespace: true
    runtimeClassName: kata
    image: ""
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    timeoutSeconds: 300
    networkProbe: {}
    nodeSelector: {}
    affinity: {}
    tolerations: []
    imagePullSecrets: []
config:
  maxConcurrentSessions: 2
  maxBudgetUsd: 10
  models: []
  # teams: the Teams sessions run with, each {id, name, description, roles}; unset uses Unfold's defaults.
  # config.crews is its deprecated name (system ADR-0036): still read, but set teams instead.
  # Each repository may add `mcp: {litellmTeamId: agents-orders, accessGroups: [observability-read-orders]}`.
  # Session keys are then minted into that LiteLLM team with exactly those MCP access groups, and the
  # agent gets one remote MCP server `litellm` at <litellm root>/mcp. Absent means no MCP tools.
  # Each repository and task source may name its owner (system ADR-0017): `tenant` (default `default`) and an
  # optional `client`. One repository, or one tracker project on one instance, registered for two owners stops startup.
  repositories: []
  taskSources: []
  # trustedProxies (optional, none when absent): IP addresses and CIDR ranges of the reverse proxies in front of
  # Unfold, whose X-Forwarded-For names the client. The sign-in throttles, the Request intake rate limit and the
  # security audit's source address key on that address.
  # trustedProxies: ["10.42.0.0/16"]
  # hsts (optional): Strict-Transport-Security, sent only when baseUrl is https. The default is below; false turns it
  # off. preload stays off unless set, because the preload list binds every host under the domain.
  # hsts: {maxAge: 63072000, includeSubDomains: true, preload: false}
  # intake.rateLimit (optional): token buckets of the public Request intake; these are the defaults.
  # intake:
  #   rateLimit: {client: {perMinute: 60, burst: 30}, source: {perMinute: 300, burst: 60}, failureCost: 5}
  # tenancy.enforce (optional, off when absent): limit each person to what their Tenant and Client memberships reach.
  # tenancy:
  #   enforce: true
  # billing (optional, off when absent): one line per accepted Work Item into the Agency's billing tool, also behind
  # the billing.export flag per Tenant. tokenEnv names a variable from credentialsSecret that holds key:secret.
  # billing:
  #   exporter: simplicate
  #   simplicate:
  #     domain: agency
  #     tokenEnv: UNFOLD_SIMPLICATE_TOKEN
  # ploeg.personTokens (optional, off when absent; Unfold ADR 0055): exchange each person's sign-in token for a
  # Ploeg-audience token sent with every change Unfold makes for them. The secret comes from credentialsSecret.
  # ploeg:
  #   url: http://ploeg.ploeg.svc:8080
  #   tokenEnv: PLOEG_OPERATOR_UNFOLD_TOKEN
  #   personTokens:
  #     tokenUrl: https://authentik.example/application/o/token/
  #     clientId: unfold-exchange
  #     clientSecretEnv: UNFOLD_EXCHANGE_CLIENT_SECRET
  #     audience: ploeg-for-unfold
  litellm:
    ttl: 4h
    settlementDelayMs: 60000
ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecret: ""
ploeg:
  enabled: true
  # Ploeg's object names. Empty would be the release name, which Unfold's own
  # Deployment, Service and ServiceAccount already use.
  fullnameOverride: ploeg
  operator:
    attribution: asserted
