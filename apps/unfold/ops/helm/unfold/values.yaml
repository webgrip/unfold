image:
  repository: ghcr.io/webgrip/unfold
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
service:
  port: 4080
storage:
  size: 4Gi
  className: ""
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
extraEnv: []
insight:
  events: true
  export: "off"
  url: ""
  level: aggregate
errorReports:
  environment: ""
  otlpUrl: ""
  sentry:
    existingSecret: ""
    secretKey: sentry-dsn
mode: demo
baseUrl: ""
credentialsSecret: unfold-credentials
workspaceNamespace: unfold-workspaces
createWorkspaceNamespace: true
workspaceImage: ""
workspaceStorageSize: 8Gi
workspaceStorageClass: ""
workspaceCpu: "1"
workspaceMemory: 2Gi
workspaceCpuRequest: ""
workspaceMemoryRequest: ""
workspaceImagePullSecrets: []
workspaceGitSecretName: ""
workspaceAgentSecrets: []
workspaceUserNamespaces: false
workspaceTransport: pull
workspaceRelayUrl: ""
workspaceProvisioner: pod
workspaceRuntimeClassName: kata
workspaceWarmPool: ""
workspaceEgress: []
delivery:
  enabled: false
  verifierTokenEnv: UNFOLD_VERIFIER_TOKEN
  policies: []
  inputs:
    mountPath: /var/lib/unfold-delivery
    volume: {}
  publisher:
    enabled: false
    apiUrl: ""
    username: ""
    tokenEnv: UNFOLD_PUBLISHER_TOKEN
    existingSecret: ""
    secretKey: token
  verifier:
    namespace: unfold-verifier
    createNamespace: true
    runtimeClassName: kata
    image: ""
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    timeoutSeconds: 300
    networkProbe: {}
    nodeSelector: {}
    affinity: {}
    tolerations: []
    imagePullSecrets: []
config:
  maxConcurrentSessions: 2
  maxBudgetUsd: 10
  models: []
  # Each repository may add `mcp: {litellmTeamId: agents-orders, accessGroups: [observability-read-orders]}`.
  # Session keys are then minted into that LiteLLM team with exactly those MCP access groups, and the
  # agent gets one remote MCP server `litellm` at <litellm root>/mcp. Absent means no MCP tools.
  repositories: []
  taskSources: []
  litellm:
    ttl: 4h
    settlementDelayMs: 60000
ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecret: ""
