apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: unfold-refuse-kata-sandbox-overrides
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        !object.metadata.?annotations.orValue({}).exists(k, k.startsWith('io.katacontainers.'))
      message: >-
        Pod annotations under io.katacontainers. override the Kata sandbox's hypervisor and
        runtime settings; the node's configuration file must be their only source.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: unfold-refuse-kata-sandbox-overrides
spec:
  policyName: unfold-refuse-kata-sandbox-overrides
  validationActions: ["Deny"]
