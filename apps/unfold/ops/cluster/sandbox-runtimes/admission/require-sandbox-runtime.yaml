apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: unfold-agent-pods-require-a-sandbox-runtime
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: agent-pod
      expression: >-
        object.metadata.?labels.orValue({})[?'app.kubernetes.io/name'].orValue('') in
        ['unfold-agent', 'unfold-verifier', 'ploeg-worker']
  validations:
    - expression: >-
        object.spec.?runtimeClassName.orValue('') in ['kata', 'gvisor']
      messageExpression: >-
        'agent pod ' + object.metadata.?name.orValue(object.metadata.?generateName.orValue('')) +
        ' runs code an agent wrote or fetched and must set runtimeClassName to kata or gvisor, not "' +
        object.spec.?runtimeClassName.orValue('') + '"'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: unfold-agent-pods-require-a-sandbox-runtime
spec:
  policyName: unfold-agent-pods-require-a-sandbox-runtime
  validationActions: ["Deny"]
