name: On Source Change

on:
  push:
    branches: [main, development]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: docker
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
      - run: npm run design:check
      - run: npm run brand:check
      - run: npm run license:check
      - run: npm run backlog -- check
      - run: npm ci --no-audit --no-fund --prefix extensions/vscode
      - run: npm run extension:build
      - run: npm run extension:test
      - run: npm run extension:package
      - run: npm run extension:verify
      - uses: https://github.com/azure/setup-helm@v4
        with:
          version: v4.2.4
      - run: helm lint ops/helm/de-vloer
      - run: helm template de-vloer ops/helm/de-vloer > /dev/null
      - run: helm lint ops/helm/de-vloer -f ops/helm/de-vloer/values.live.example.yaml
      - run: helm template de-vloer ops/helm/de-vloer --namespace de-vloer -f ops/helm/de-vloer/values.live.example.yaml > /dev/null
      - name: Dockerfiles build
        run: |
          set -euo pipefail
          docker build --file Dockerfile --target app --build-arg REGISTRY_DHI=harbor.webgrip.dev/dhi --output=type=cacheonly .
          docker build --file ops/agent/Dockerfile --build-arg REGISTRY_DHI=harbor.webgrip.dev/dhi --output=type=cacheonly ops/agent

  release:
    needs: [checks]
    runs-on: docker
    container:
      image: harbor.webgrip.dev/webgrip/semantic-release:0.3.3
    permissions:
      contents: write
    steps:
      - uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/semantic-release@v1.2.0
        with:
          token: ${{ secrets.WEBGRIP_CI_TOKEN }}
          install-dependencies: 'true'
