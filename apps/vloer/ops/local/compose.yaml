services:
  workbench:
    build:
      context: ../..
      target: app
    environment:
      VLOER_MODE: demo
      VLOER_HOST: 0.0.0.0
      VLOER_DATA_DIR: /data
    ports:
      - "127.0.0.1:4080:4080"
    volumes:
      - workbench-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  workbench-data:
