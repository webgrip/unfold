[tools]
uv = "0.12.12"
node = "24.19.0"
helm = "4.2.4"

[tasks.probe-opencode]
tools = { "npm:opencode-ai" = { version = "1.18.30", npm_args = "--ignore-scripts=false" } }
run = "node scripts/probe-opencode.mjs"
description = "Probe the pinned OpenCode server without a model call"

[tasks.live]
tools = { "npm:opencode-ai" = { version = "1.18.30", npm_args = "--ignore-scripts=false" } }
run = "npm start --"
description = "Run Vloer with the pinned OpenCode binary on PATH"
