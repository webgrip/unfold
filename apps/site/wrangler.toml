name = "unfold-site"
main = "src/worker/index.ts"
compatibility_date = "2026-09-26"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "SIGNUPS"
database_name = "unfold-site-signups"
database_id = "PASTE-THE-EU-D1-DATABASE-ID-HERE"

[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true

[observability.logs]
invocation_logs = false
