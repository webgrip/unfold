name: Run unfold-mcp's end-to-end suite against Authentik
description: Sign people in through a real Authentik, connect the official MCP client over HTTP and check auth, tenancy and spend; the suite starts its own throwaway Authentik with Docker Compose from apps/unfold/test/e2e/authentik.compose.yaml, so the job runs on the runner itself with Node from mise
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        version: 2026.10.25
        install_args: node
        cache: false
    - name: Install Unfold's packages and the Chromium its playwright version expects
      shell: bash
      working-directory: apps/unfold
      run: |
        set -euo pipefail
        mise trust mise.toml
        mise exec -- npm ci --no-audit --no-fund
        mise exec -- npx --no-install playwright install --with-deps chromium
    - name: Run the end-to-end suite
      shell: bash
      working-directory: apps/unfold
      run: mise exec -- npm run test:mcp-e2e
