name: Build the container contexts
description: Build both Unfold images to the build cache only; the Docker Hardened Images base needs a Docker Hub sign-in, which a pull request from a fork does not get
inputs:
  dhi-username:
    description: Docker Hub account that may pull from dhi.io
    default: ''
  dhi-token:
    description: Read-only Docker Hub access token of that account
    default: ''
  skip-without-credentials:
    description: "'true' turns a missing sign-in into a notice instead of a failure; only a pull request from a fork passes it"
    default: 'false'
runs:
  using: composite
  steps:
    - name: Sign in to dhi.io
      id: login
      shell: bash
      env:
        DHI_USERNAME: ${{ inputs.dhi-username }}
        DHI_TOKEN: ${{ inputs.dhi-token }}
        SKIP: ${{ inputs.skip-without-credentials }}
      run: |
        set -euo pipefail
        if [ -n "$DHI_USERNAME" ] && [ -n "$DHI_TOKEN" ]; then
          printf '%s' "$DHI_TOKEN" | docker login dhi.io --username "$DHI_USERNAME" --password-stdin
          echo "ready=true" >> "$GITHUB_OUTPUT"
        elif [ "$SKIP" = true ]; then
          echo "::notice::A pull request from a fork gets no Docker Hub sign-in, so the image contexts are built on development after the merge and by the release train before a release."
          echo "ready=false" >> "$GITHUB_OUTPUT"
        else
          echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set; the Unfold images build from dhi.io, which needs a Docker Hub sign-in."
          exit 1
        fi
    - name: Container build contexts
      if: steps.login.outputs.ready == 'true'
      shell: bash
      run: |
        set -euo pipefail
        build() { docker build --progress=plain --output=type=cacheonly "$@"; }
        build --file apps/unfold/Dockerfile --target app apps/unfold &
        app=$!
        build --file apps/unfold/ops/agent/Dockerfile apps/unfold/ops/agent
        wait "$app"
